<!doctype html>
<html><head><meta charset="utf-8"><title>creature art sheet</title>
<style>body{margin:0;background:#222}canvas{display:block}</style></head>
<body><canvas id="c" width="1600" height="900"></canvas>
<script src="../src/core/util.js"></script>
<script src="../src/world/tiles.js"></script>
<script src="../src/gfx/textures.js"></script>
<script src="../src/gfx/rig.js"></script>
<script src="../src/game/entities.js"></script>
<script src="../src/game/enemies.js"></script>
<script src="../src/gfx/creatures.js"></script>
<script src="../src/gfx/creatures_bugs.js"></script>
<script src="../src/gfx/creatures_robots.js"></script>
<script src="../src/gfx/creatures_boss.js"></script>
<script>
// Renders each creature in several states at scale S. Query: names=radroach,bloatfly  s=3  bg=ground|sky
const CD = window.CD, U = CD.U, G = CD.G; const q = new URLSearchParams(location.search);
const names = (q.get('names') || Object.keys(CD.art).join(',')).split(',').filter(Boolean);
const S = parseFloat(q.get('s') || '3');
const c = document.getElementById('c'); const g = c.getContext('2d');
const states = [
  { label: 'idle', state: 'idle', vx: 0, phase: 0, atkK: 0, t: 0.3 },
  { label: 'walk A', state: 'patrol', vx: 60, phase: 0.6, atkK: 0, t: 1.1 },
  { label: 'walk B', state: 'chase', vx: 150, phase: 2.4, atkK: 0, t: 1.7 },
  { label: 'windup', state: 'windup', vx: 0, phase: 0, atkK: 0.25, t: 2.2 },
  { label: 'strike', state: 'attack', vx: 0, phase: 0, atkK: 0.5, t: 2.4 },
  { label: 'fire', state: 'fire', vx: 0, phase: 0, atkK: 0.3, t: 2.6 },
  { label: 'hurt', state: 'chase', vx: 0, phase: 1, atkK: 0, t: 3.0, flash: 0.08 },
  { label: 'dead', state: 'dead', vx: 0, phase: 0, atkK: 0, t: 3.4, dead: true },
];
const cellW = Math.floor(c.width / states.length);
g.fillStyle = '#2a2622'; g.fillRect(0, 0, c.width, c.height);
let row = 0; const rowH = 260;
for (const name of names) {
  const def = CD.ENEMIES[name] || CD.BOSSES && CD.BOSSES[name] || { w: 40, h: 40 };
  const art = CD.art[name];
  const gy = 60 + row * rowH + rowH - 60; // ground y for this row
  const gr = g.createLinearGradient(0, gy - rowH + 60, 0, gy + 40); gr.addColorStop(0, '#6a5a4c'); gr.addColorStop(1, '#3a322c'); g.fillStyle = gr; g.fillRect(0, gy - rowH + 60, c.width, rowH);
  g.fillStyle = '#1e1a16'; g.fillRect(0, gy, c.width, 40);
  g.fillStyle = '#fff'; g.font = '13px monospace'; g.fillText(name + '  (' + (def.w * (def.scale || 1)) + 'x' + (def.h * (def.scale || 1)) + ')' + (art ? '' : '   << NO ART'), 8, gy - rowH + 78);
  states.forEach((st, i) => {
    const cx = i * cellW + cellW / 2; const w = (def.w || 40) * (def.scale || 1), h = (def.h || 40) * (def.scale || 1);
    const e = { x: -w / 2, y: def.fly ? -h - 40 : -h, w, h, cx: 0, cy: def.fly ? -40 - h / 2 : -h / 2, face: 1, t: st.t, vx: st.vx, vy: 0, state: st.state, phase: st.phase, atkK: st.atkK, hp: st.dead ? 0 : 10, maxHp: 10, flash: st.flash || 0, onGround: !def.fly, scale: def.scale || 1, def, dead: !!st.dead, alert: 3, hasSeen: true, aimA: 0.3, mount: 'floor', recoil: 0, extra: {} };
    e.bottom = e.y + e.h;
    g.save(); g.translate(cx, gy); g.scale(S / 3, S / 3);
    // contact shadow
    if (!def.fly) { g.fillStyle = 'rgba(0,0,0,0.3)'; g.beginPath(); g.ellipse(0, -1, w * 0.55, 3, 0, 0, 7); g.fill(); }
    if (st.dead && !def.fly) { g.translate(0, -h / 2); g.rotate(Math.PI); g.translate(0, h / 2); }
    if (art) { try { art(g, e, G, false); } catch (err) { g.fillStyle = '#f00'; g.fillText('ERR ' + err.message, -60, -h); console.error(name, err); } } else { g.fillStyle = 'rgba(200,60,60,0.7)'; g.fillRect(e.x, e.y, e.w, e.h); }
    if (st.flash) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.6; if (art) art(g, e, G, true); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
    g.restore();
    g.fillStyle = '#cdb'; g.font = '11px monospace'; g.fillText(st.label, cx - 22, gy + 24);
  });
  row++;
}
window.__done = { names, missing: names.filter((n) => !CD.art[n]) };
</script></body></html>
