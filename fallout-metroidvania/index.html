<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050807">
<title>Fallout: Cinder Deep</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#020403; overflow:hidden; overscroll-behavior:none; }
  body { display:flex; align-items:center; justify-content:center; font-family: "Courier New", ui-monospace, monospace; color:#1aff80; }
  #stage { position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; background:#020403; }
  canvas#game { display:block; background:#000; image-rendering:auto; touch-action:none; outline:none; max-width:100%; max-height:100%; }
  #boot { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:#020403; z-index:5; letter-spacing:2px; text-shadow:0 0 8px rgba(26,255,128,.7); }
  #boot .t { font-size:22px; opacity:.95 }
  #boot .bar { width:min(420px,70vw); height:10px; border:1px solid #1aff80; box-shadow:0 0 10px rgba(26,255,128,.4) inset; }
  #boot .bar > i { display:block; height:100%; width:0%; background:#1aff80; box-shadow:0 0 10px #1aff80; }
  #boot .s { font-size:12px; opacity:.6 }
  #err { position:absolute; left:8px; right:8px; bottom:8px; z-index:9; color:#ff6a4a; font-size:12px; white-space:pre-wrap; display:none; text-shadow:none; background:rgba(0,0,0,.85); padding:8px; border:1px solid #ff6a4a; max-height:40vh; overflow:auto; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" tabindex="0"></canvas>
  <div id="boot"><div class="t">FALLOUT: CINDER DEEP</div><div class="bar"><i id="bootbar"></i></div><div class="s" id="bootmsg">ROBCO INDUSTRIES (TM) TERMLINK PROTOCOL</div></div>
  <div id="err"></div>
</div>
<noscript>This game needs JavaScript.</noscript>
<script src="src/manifest.js"></script>
<script>
(function () {
  var files = window.CD_MANIFEST || [];
  var bar = document.getElementById('bootbar'), msg = document.getElementById('bootmsg'), err = document.getElementById('err');
  window.addEventListener('error', function (e) {
    err.style.display = 'block';
    err.textContent += (e.message || 'error') + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno + '\n';
  });
  var i = 0;
  function next() {
    if (i >= files.length) { if (window.CD && CD.boot) CD.boot(); return; }
    var f = files[i++]; bar.style.width = Math.round(i / files.length * 45) + '%'; msg.textContent = 'LOADING ' + f.toUpperCase();
    var s = document.createElement('script'); s.src = 'src/' + f + '?v=' + (window.CD_BUILD || 0);
    s.onload = next; s.onerror = function () { err.style.display = 'block'; err.textContent += 'Failed to load ' + f + '\n'; next(); };
    document.body.appendChild(s);
  }
  next();
})();
</script>
</body>
</html>
