# Literature corpus for the deep-research run on the Maura Murray disappearance.
# One entry per citation_key used in the phase artifacts and the final report.
# retrieval: "snippet-only" means the source was located and quoted through
# search-index snippets because the session's network policy blocked full-text
# fetches. Quotes recorded under anchor_quotes are verbatim snippet strings.
# tier: 1 official/primary; 2 contemporaneous or established journalism;
#       3 later long-form journalism / documentary; 4 participant statements;
#       5 non-participant books/podcasts; 6 peer-reviewed or institutional
#       base-rate literature; 7 amateur/web-sleuth (context only, never sole support).
# grade: overall grade under deep-research/references/source_quality_hierarchy.md
#        (fitness-for-claim within the field of public-record case analysis).
