  color-scheme: dark;

  --vp-ink: #e9f2ff;
  --vp-ink-dim: #9fb2cc;
  --vp-ink-faint: #61718c;

  --vp-amber: #ffc560;
  --vp-amber-deep: #d9892a;
  --vp-cyan: #7fe3ff;
  --vp-break: #ff4fa3;                      /* BREAK / shield shatter */
  --vp-weak: #ffe066;                       /* weakness hit flash */
  --vp-hp: #6ff0a6;
  --vp-ep: #69b9ff;
  --vp-bp: #ffb347;
  --vp-danger: #ff5a6a;
  /* type */
  --vp-font-display: "Oxanium", "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --vp-font-ui: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --vp-font-pixel: "Silkscreen", "Courier New", ui-monospace, monospace;
  /* motion */
  --vp-ease-out: cubic-bezier(.2, .8, .2, 1);
  --vp-safe-top: env(safe-area-inset-top, 0px);
  --vp-safe-bottom: env(safe-area-inset-bottom, 0px);

  --vp-safe-right: env(safe-area-inset-right, 0px);

html, body { height: 100%; margin: 0; background: var(--vp-void); color: var(--vp-ink); overflow: hidden; overscroll-behavior: none; }

#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

#ui-root > * { pointer-events: auto; }
#ui-root .vp-passthrough { pointer-events: none; }
#touch-layer { position: absolute; inset: 0; pointer-events: none; }

</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<div id="app">
  <canvas id="view" tabindex="0" aria-label="Voidpath game view"></canvas>
  <div id="ui-root"></div>
  <div id="touch-layer"></div>
  <div id="vp-boot">Loading</div>
  <div id="vp-fatal" role="alert"></div>
</div>
<script>
  // Surface fatal script errors on screen instead of a silent black page.
  window.addEventListener('error', function (e) {
    var el = document.getElementById('vp-fatal');
    if (!el) return;
    el.style.display = 'block';
    el.textContent = 'Voidpath hit an error: ' + (e.message || e.error) + (e.filename ? '\n' + e.filename + ':' + e.lineno : '');
  });
</script>

function makeNormalMap(src, { bevel = 3, strength = 2.2, lumaRelief = 0.35, frameW = 0, frameH = 0 } = {}) {
  const p2 = src instanceof Painter ? src : Painter.fromCanvas(src);
  const { w, h } = p2;
  const fw = frameW || w, fh = frameH || h;
  const sameFrame = (x0, y0, x1, y1) => Math.floor(x0 / fw) === Math.floor(x1 / fw) && Math.floor(y0 / fh) === Math.floor(y1 / fh);
  const INF = 1e9;
  const dist = new Float32Array(w * h).fill(INF);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (!p2.opaque(x, y)) dist[y * w + x] = 0;
  const pass = (xs, ys, dx, dy) => {
    for (const y of ys) for (const x of xs) {
      const i = y * w + x;
      if (dist[i] === 0) continue;
      for (const [ox, oy, cost] of [[dx, 0, 1], [0, dy, 1], [dx, dy, 1.414], [-dx, dy, 1.414]]) {
        const nx = x + ox, ny = y + oy;
        const nd = nx < 0 || ny < 0 || nx >= w || ny >= h || !sameFrame(x, y, nx, ny) ? 0 : dist[ny * w + nx];
        if (nd + cost < dist[i]) dist[i] = nd + cost;
      }
    }
  };
  const fx = [...Array(w).keys()], fy = [...Array(h).keys()];
  pass(fx, fy, -1, -1);
  pass(fx.slice().reverse(), fy.slice().reverse(), 1, 1);
  const height = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    if (dist[i] === 0) continue;
    const d = Math.min(dist[i], bevel) / bevel;
    const edge = Math.sin(d * Math.PI / 2);
    const [r, g, b] = p2.get(x, y);
    const luma = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    height[i] = edge * (1 - lumaRelief) + luma * lumaRelief;

  const out = new Painter(w, h);
  const H = (x, y, cx, cy) => x < 0 || y < 0 || x >= w || y >= h || !sameFrame(cx, cy, x, y) ? 0 : height[y * w + x];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!p2.opaque(x, y)) {
      out.set(x, y, [128, 128, 255, 255]);
      continue;
    }
    const dx = (H(x + 1, y, x, y) - H(x - 1, y, x, y)) * strength;
    const dyDown = (H(x, y + 1, x, y) - H(x, y - 1, x, y)) * strength;
    let nx = -dx, ny = dyDown, nz = 1;
    const len = Math.hypot(nx, ny, nz);
    nx /= len;
    ny /= len;
    nz /= len;
    out.set(x, y, [Math.round((nx * 0.5 + 0.5) * 255), Math.round((ny * 0.5 + 0.5) * 255), Math.round((nz * 0.5 + 0.5) * 255), 255]);

}
function toTexture(src, { color = true, repeat = null } = {}) {
  const canvas2 = src instanceof Painter ? src.canvas : src;
  const t = new THREE.CanvasTexture(canvas2);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.colorSpace = color ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  if (repeat) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeat[0], repeat[1]);
  }
  t.needsUpdate = true;
  return t;
}
