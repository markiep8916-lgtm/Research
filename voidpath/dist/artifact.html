<title>Voidpath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Oxanium:wght@400;600;700;800&family=Silkscreen&display=swap">
<style>
/* VOIDPATH base layer. Single deliberate dark look (a game screen), so no light theme.
   Layout: one full-bleed WebGL canvas with stacked DOM UI layers above it.
   Every UI module injects its own CSS (core/util.js injectCSS) and must use these tokens. */
:root {
  color-scheme: dark;
  /* surfaces */
  --vp-void: #05070d;                       /* page / letterbox background */
  --vp-panel: rgba(8, 13, 26, 0.84);        /* translucent window fill */
  --vp-panel-solid: #0a1020;
  --vp-panel-hi: rgba(28, 44, 78, 0.72);    /* highlighted row */
  --vp-line: rgba(140, 214, 255, 0.55);     /* hairline window border */
  --vp-line-dim: rgba(140, 214, 255, 0.22);
  /* text */
  --vp-ink: #e9f2ff;
  --vp-ink-dim: #9fb2cc;
  --vp-ink-faint: #61718c;
  /* accents (amber is the "Octopath gold" of this world) */
  --vp-amber: #ffc560;
  --vp-amber-deep: #d9892a;
  --vp-cyan: #7fe3ff;
  --vp-break: #ff4fa3;                      /* BREAK / shield shatter */
  --vp-weak: #ffe066;                       /* weakness hit flash */
  --vp-hp: #6ff0a6;
  --vp-ep: #69b9ff;
  --vp-bp: #ffb347;
  --vp-danger: #ff5a6a;
  /* type */
  --vp-font-display: "Oxanium", "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --vp-font-ui: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --vp-font-pixel: "Silkscreen", "Courier New", ui-monospace, monospace;
  /* motion */
  --vp-ease-out: cubic-bezier(.2, .8, .2, 1);
  --vp-safe-top: env(safe-area-inset-top, 0px);
  --vp-safe-bottom: env(safe-area-inset-bottom, 0px);
  --vp-safe-left: env(safe-area-inset-left, 0px);
  --vp-safe-right: env(safe-area-inset-right, 0px);
}
html, body { height: 100%; margin: 0; background: var(--vp-void); color: var(--vp-ink); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--vp-font-ui); font-size: 16px; -webkit-font-smoothing: antialiased; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; overflow: hidden; background: var(--vp-void); }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#ui-root { position: absolute; inset: 0; pointer-events: none; font-family: var(--vp-font-ui); }
#ui-root > * { pointer-events: auto; }
#ui-root .vp-passthrough { pointer-events: none; }
#touch-layer { position: absolute; inset: 0; pointer-events: none; }
#vp-boot { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--vp-font-display); letter-spacing: .4em; color: var(--vp-ink-dim); font-size: 13px; text-transform: uppercase; background: var(--vp-void); z-index: 50; transition: opacity .6s; }
#vp-boot.vp-hide { opacity: 0; pointer-events: none; }
#vp-fatal { position: absolute; left: 16px; right: 16px; bottom: calc(16px + var(--vp-safe-bottom)); padding: 12px 14px; background: #2a0b14; border: 1px solid var(--vp-danger); color: #ffd9de; font: 13px/1.4 ui-monospace, monospace; white-space: pre-wrap; z-index: 99; display: none; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
</style>
<div id="app">
  <canvas id="view" tabindex="0" aria-label="Voidpath game view"></canvas>
  <div id="ui-root"></div>
  <div id="touch-layer"></div>
  <div id="vp-boot">Loading</div>
  <div id="vp-fatal" role="alert"></div>
</div>
<script>
  // Surface fatal script errors on screen instead of a silent black page.
  window.addEventListener('error', function (e) {
    var el = document.getElementById('vp-fatal');
    if (!el) return;
    el.style.display = 'block';
    el.textContent = 'Voidpath hit an error: ' + (e.message || e.error) + (e.filename ? '\n' + e.filename + ':' + e.lineno : '');
  });
</script>

.vp-touch { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s var(--vp-ease-out); font-family: var(--vp-font-display); }
.vp-touch.is-on { opacity: 1; }
.vp-touch.is-on .vp-tc { pointer-events: auto; }
.vp-tc { position: absolute; display: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
/* which controls exist per input context */
.vp-touch[data-ctx="explore"] .vp-tc-stick { display: block; }

.vp-touch[data-ctx="battle"] .vp-tc-boost, .vp-touch[data-ctx="battle"] .vp-tc-mute { display: grid; }

.vp-tc-stick.is-active .vp-stick-base { opacity: 1; transition: none; }
.vp-stick-knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, rgba(200,236,255,.55), rgba(60,110,170,.45) 55%, rgba(14,24,46,.75));
  border: 1px solid rgba(190,236,255,.7); box-shadow: 0 0 0 3px rgba(127,227,255,.14), 0 4px 10px rgba(0,0,0,.35); }

.vp-tc-btn { width: 64px; height: 64px; border-radius: 50%; place-items: center;
  background: radial-gradient(circle at 50% 35%, rgba(36,56,96,.62), rgba(8,13,26,.72));
  border: 1px solid rgba(140,214,255,.5); color: var(--vp-ink); font-weight: 700; font-size: 22px; letter-spacing: 0;
  box-shadow: 0 4px 10px rgba(0,0,0,.35), inset 0 0 0 3px rgba(127,227,255,.06); transition: transform .08s, box-shadow .08s, background .08s; }
.vp-tc-btn span { display: grid; place-items: center; width: 100%; height: 100%; line-height: 1; }
.vp-tc-btn.is-down { transform: scale(.9); background: radial-gradient(circle at 50% 40%, rgba(80,130,200,.75), rgba(14,24,46,.85)); box-shadow: 0 0 0 4px rgba(127,227,255,.22); }
.vp-tc-a { right: calc(22px + var(--vp-safe-right)); bottom: calc(92px + var(--vp-safe-bottom)); width: 74px; height: 74px; font-size: 26px;
  color: var(--vp-amber); border-color: rgba(255,197,96,.75); box-shadow: 0 4px 10px rgba(0,0,0,.35), 0 0 0 4px rgba(255,197,96,.08), inset 0 0 0 3px rgba(255,197,96,.1); }
.vp-tc-a.is-down { box-shadow: 0 0 0 5px rgba(255,197,96,.3); }
.vp-tc-b { right: calc(108px + var(--vp-safe-right)); bottom: calc(36px + var(--vp-safe-bottom)); width: 58px; height: 58px; font-size: 20px; }
.vp-tc-boost { right: calc(28px + var(--vp-safe-right)); width: 50px; height: 50px; font-size: 26px; color: var(--vp-bp); border-color: rgba(255,179,71,.6); }
.vp-tc-plus { bottom: calc(240px + var(--vp-safe-bottom)); }
.vp-tc-minus { bottom: calc(180px + var(--vp-safe-bottom)); }
.vp-tc-menu, .vp-tc-mute { top: calc(14px + var(--vp-safe-top)); width: 44px; height: 44px; border-radius: 10px; }
.vp-tc-menu { right: calc(14px + var(--vp-safe-right)); }
.vp-tc-mute { right: calc(66px + var(--vp-safe-right)); }
.vp-touch[data-ctx="battle"] .vp-tc-mute { right: calc(14px + var(--vp-safe-right)); }
/* line icons (inline SVG, currentColor) */
.vp-tc-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.vp-tc-mute .vp-snd-off, .vp-tc-mute.is-muted .vp-snd-on { display: none; }
.vp-tc-mute.is-muted .vp-snd-off { display: inline; }
.vp-tc-mute.is-muted { color: var(--vp-ink-faint); }
@media (max-width: 380px) { .vp-tc-a { width: 66px; height: 66px; } .vp-tc-b { right: calc(96px + var(--vp-safe-right)); } }

.vp-layer { position: absolute; inset: 0; pointer-events: none; }
#ui-root > .vp-layer { pointer-events: none; }          /* beats the template's #ui-root > * rule */
#ui-root > .vp-layer.is-live { pointer-events: auto; }
/* big screens: scale the whole UI like a console does, keeping a ~1280x720 effective layout */
@media (min-width: 1560px) and (min-height: 880px) { #ui-root > .vp-layer { zoom: 1.25; } }
@media (min-width: 1880px) and (min-height: 1060px) { #ui-root > .vp-layer { zoom: 1.5; } }
@media (min-width: 2520px) and (min-height: 1420px) { #ui-root > .vp-layer { zoom: 2; } }
/* closed layers keep no animation ticking (no wasted frames under the 3D view) */
.vp-menu:not(.is-open) *, .vp-title:not(.is-open) *, .vp-dlg:not(.is-open) *, .vp-hud.is-hidden * { animation-play-state: paused !important; }

/* --- window frame: translucent navy, hairline border, faint inner glow, corner brackets.
   Raster-cheap on purpose: no large blurs or filters (the 3D view below changes every frame and
   software / low-memory GPUs re-raster UI tiles often), glow is faked with gradients. */
.vp-panel { position: relative; color: var(--vp-ink);
  background:
    linear-gradient(180deg, rgba(127,227,255,.075), rgba(127,227,255,0) 42%),
    linear-gradient(90deg, rgba(110,190,255,.06), rgba(110,190,255,0) 7%, rgba(110,190,255,0) 93%, rgba(110,190,255,.06)),
    linear-gradient(0deg, rgba(110,190,255,.05), rgba(110,190,255,0) 18%),
    var(--vp-panel);
  border: 1px solid var(--vp-line-dim); border-radius: 2px;
  box-shadow: inset 0 0 0 1px rgba(5,7,13,.55), 0 6px 16px rgba(0,0,0,.34); }
.vp-panel::before { content: ''; position: absolute; inset: -4px; pointer-events: none;
  --c: rgba(200,240,255,.95); --g: rgba(127,227,255,.22); --l: 13px; --t: 1.5px; --L: 15px; --T: 4px;
  background:
    linear-gradient(var(--c), var(--c)) left top / var(--l) var(--t), linear-gradient(var(--c), var(--c)) left top / var(--t) var(--l),
    linear-gradient(var(--c), var(--c)) right top / var(--l) var(--t), linear-gradient(var(--c), var(--c)) right top / var(--t) var(--l),
    linear-gradient(var(--c), var(--c)) left bottom / var(--l) var(--t), linear-gradient(var(--c), var(--c)) left bottom / var(--t) var(--l),
    linear-gradient(var(--c), var(--c)) right bottom / var(--l) var(--t), linear-gradient(var(--c), var(--c)) right bottom / var(--t) var(--l),
    linear-gradient(var(--g), var(--g)) left top / var(--L) var(--T), linear-gradient(var(--g), var(--g)) left top / var(--T) var(--L),
    linear-gradient(var(--g), var(--g)) right top / var(--L) var(--T), linear-gradient(var(--g), var(--g)) right top / var(--T) var(--L),
    linear-gradient(var(--g), var(--g)) left bottom / var(--L) var(--T), linear-gradient(var(--g), var(--g)) left bottom / var(--T) var(--L),
    linear-gradient(var(--g), var(--g)) right bottom / var(--L) var(--T), linear-gradient(var(--g), var(--g)) right bottom / var(--T) var(--L);
  background-repeat: no-repeat; }
.vp-panel::after { content: ''; position: absolute; left: 14%; right: 14%; top: -1px; height: 1px; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(200,240,255,.85), transparent); }
.vp-panel.vp-rich { outline: 1px solid rgba(140,214,255,.075); outline-offset: -6px; }
.vp-panel.vp-solid { background: linear-gradient(180deg, rgba(127,227,255,.08), rgba(127,227,255,0) 42%), #090e1c; }

/* --- small-caps label */
.vp-cap { font-family: var(--vp-font-ui); font-weight: 600; font-size: 13px; letter-spacing: .24em; text-transform: uppercase; color: var(--vp-ink-dim); }
.vp-num { font-family: var(--vp-font-display); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.vp-em { color: var(--vp-amber); text-shadow: 0 0 10px rgba(255,197,96,.35); }

/* --- selectable row: amber selection, cursor triangle, animated sheen */
.vp-row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 16px 0 34px;
  color: var(--vp-ink); cursor: pointer; overflow: hidden; transition: color .12s, background-color .12s; }
.vp-row::before { content: ''; position: absolute; left: 13px; top: 50%; width: 0; height: 0; margin-top: -6px;
  border-left: 9px solid var(--vp-amber); border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  opacity: 0; transform: translateX(-6px); transition: opacity .12s, transform .16s var(--vp-ease-out); }
.vp-row.is-sel { color: var(--vp-amber); text-shadow: 0 0 8px rgba(255,197,96,.4);
  background: linear-gradient(90deg, rgba(255,197,96,.17), rgba(255,197,96,.05) 55%, rgba(255,197,96,0)); box-shadow: inset 2px 0 0 var(--vp-amber); }
.vp-row.is-sel::before { opacity: 1; transform: none; animation: vp-nudge 1.1s ease-in-out infinite; }
.vp-row.is-sel::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 38%; pointer-events: none;
  background: linear-gradient(100deg, rgba(255,230,180,0), rgba(255,230,180,.16), rgba(255,230,180,0));
  transform: translateX(-120%); animation: vp-sheen 2.8s var(--vp-ease-out) infinite; }
.vp-row.is-dim { color: var(--vp-ink-faint); }
.vp-row.is-dim.is-sel { color: #c99a4f; }
@keyframes vp-nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
@keyframes vp-sheen { 0% { transform: translateX(-120%); } 55%, 100% { transform: translateX(330%); } }

/* --- bars */
.vp-bar { position: relative; height: 6px; background: rgba(4,8,18,.75); box-shadow: inset 0 0 0 1px rgba(140,214,255,.16); overflow: hidden; }
.vp-bar > i { position: absolute; inset: 1px; transform-origin: 0 50%; transition: transform .45s var(--vp-ease-out); }
.vp-bar.hp > i { background: linear-gradient(180deg, #b6ffd4, var(--vp-hp) 40%, #2a9e66); }
.vp-bar.ep > i { background: linear-gradient(180deg, #c4e4ff, var(--vp-ep) 40%, #2d63b8); }
.vp-bar.xp > i { background: linear-gradient(90deg, rgba(255,197,96,.4), var(--vp-amber)); }
.vp-bar.hp.is-low > i { background: linear-gradient(180deg, #ffd0a0, #ff9a4a 40%, #c4502a); }

/* --- controller glyphs */
.vp-key { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 22px; padding: 0 7px; box-sizing: border-box;
  border: 1px solid rgba(233,242,255,.6); border-bottom-width: 2px; border-radius: 4px; background: rgba(233,242,255,.08);
  font: 600 12px/1 var(--vp-font-ui); letter-spacing: .06em; color: var(--vp-ink); white-space: nowrap; }
.vp-padbtn { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; box-sizing: border-box;
  background: radial-gradient(circle at 50% 35%, #2a3550, #10172a); border: 1px solid rgba(233,242,255,.35);
  font: 700 12px/1 var(--vp-font-display); color: var(--vp-ink); }
.vp-padbtn.a { color: #7cf0a8; } .vp-padbtn.b { color: #ff8090; } .vp-padbtn.x { color: #7cc2ff; } .vp-padbtn.y { color: #ffe27a; }
.vp-padbtn.wide { width: auto; min-width: 30px; padding: 0 6px; border-radius: 12px; font-size: 11px; }
.vp-tapbtn { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; box-sizing: border-box;
  border: 1.5px solid rgba(255,197,96,.85); color: var(--vp-amber); font: 700 12px/1 var(--vp-font-display);
  box-shadow: 0 0 10px rgba(255,197,96,.3), inset 0 0 6px rgba(255,197,96,.25); }
.vp-glyphs { display: inline-flex; gap: 4px; align-items: center; }

/* --- icons (provider data URLs are pixel art: keep them crisp) */
.vp-ico { display: inline-block; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; vertical-align: middle; }

/* --- portrait frame (pixel bust or initials badge) */
.vp-portrait { position: relative; flex: none; box-sizing: border-box; overflow: hidden; --acc: var(--vp-cyan);
  background: radial-gradient(120% 90% at 30% 20%, rgba(255,255,255,.10), rgba(255,255,255,0) 55%),
              linear-gradient(160deg, color-mix(in srgb, var(--acc) 30%, #0a1020), #070b16 75%);
  border: 1px solid color-mix(in srgb, var(--acc) 55%, transparent);
  box-shadow: inset 0 0 0 1px rgba(5,7,13,.6), 0 0 0 3px color-mix(in srgb, var(--acc) 10%, transparent); }
.vp-portrait img { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.vp-portrait::after { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.1) 0 1px, transparent 1px 3px), linear-gradient(0deg, rgba(0,0,0,.3), rgba(0,0,0,0) 30%); }
.vp-initial { position: absolute; inset: 0; display: grid; place-items: center; font: 800 calc(var(--ps, 80px) * .5)/1 var(--vp-font-display);
  color: var(--acc); text-shadow: 0 0 8px color-mix(in srgb, var(--acc) 55%, transparent);
  background: repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 2px, transparent 2px 7px); }
.vp-portrait.is-ko img { filter: grayscale(1) brightness(.55); }

/* --- generic text button (screens, title) */
.vp-scroll { overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: rgba(140,214,255,.35) transparent; }
.vp-scroll::-webkit-scrollbar { width: 6px; }
.vp-scroll::-webkit-scrollbar-thumb { background: rgba(140,214,255,.3); border-radius: 3px; }

/* --- keyboard / gamepad / touch reference table (menu + title) */
.vp-ctl { width: 100%; border-collapse: collapse; font-size: 14px; }
.vp-ctl th { text-align: left; padding: 8px 10px; font: 600 13px var(--vp-font-ui); letter-spacing: .24em; text-transform: uppercase; color: var(--vp-ink-faint); border-bottom: 1px solid var(--vp-line-dim); }
.vp-ctl td { padding: 9px 10px; border-bottom: 1px solid rgba(140,214,255,.08); color: var(--vp-ink); vertical-align: middle; }
.vp-ctl td:first-child { color: var(--vp-ink-dim); white-space: nowrap; }
.vp-ctl td.vp-ctl-cur, .vp-ctl th.vp-ctl-cur { background: rgba(255,197,96,.06); }
.vp-ctl th.vp-ctl-cur { color: var(--vp-amber); }
.vp-ctl .vp-glyphs { flex-wrap: wrap; }
.vp-ctl .vp-or { color: var(--vp-ink-faint); font-size: 13px; margin: 0 2px; }
@media (max-width: 640px) {
  .vp-ctl thead { display: none; }
  .vp-ctl, .vp-ctl tbody, .vp-ctl tr, .vp-ctl td { display: block; width: auto; }
  .vp-ctl tr { padding: 10px 0; border-bottom: 1px solid rgba(140,214,255,.1); }
  .vp-ctl td { border: 0; padding: 3px 4px; display: flex; gap: 10px; align-items: center; }
  .vp-ctl td:first-child { font: 600 13px var(--vp-font-ui); color: var(--vp-ink); letter-spacing: .08em; padding-bottom: 6px; }
  .vp-ctl td[data-dev]::before { content: attr(data-dev); flex: 0 0 74px; font: 600 13px var(--vp-font-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--vp-ink-faint); }

.vp-hud { z-index: 10; transition: opacity .35s var(--vp-ease-out); }
.vp-hud.is-hidden { opacity: 0; }

/* area banner */
.vp-area { position: absolute; left: 0; right: 0; top: 21%; display: flex; flex-direction: column; align-items: center; opacity: 0; pointer-events: none; }
.vp-area::before { content: ''; position: absolute; left: 50%; top: 50%; width: min(1100px, 120%); height: 220%; transform: translate(-50%, -50%); z-index: -1;
  background: radial-gradient(50% 50% at 50% 50%, rgba(5,7,13,.55), rgba(5,7,13,0)); }
.vp-area.is-on { animation: vp-area 3.4s linear forwards; }
.vp-area-row { display: flex; align-items: center; justify-content: center; width: 100%; gap: 0; }
.vp-area-line { position: relative; flex: 0 1 clamp(36px, 17vw, 300px); height: 1px; transform: scaleX(0); }
.vp-area-line.l { background: linear-gradient(90deg, rgba(140,214,255,0), rgba(190,236,255,.9)); transform-origin: 100% 50%; }
.vp-area-line.r { background: linear-gradient(270deg, rgba(140,214,255,0), rgba(190,236,255,.9)); transform-origin: 0 50%; }
.vp-area-line::after { content: ''; position: absolute; top: -3px; width: 7px; height: 7px; background: var(--vp-amber); transform: rotate(45deg); box-shadow: 0 0 10px var(--vp-amber); }
.vp-area-line.l::after { right: -3px; } .vp-area-line.r::after { left: -3px; }
.vp-area.is-on .vp-area-line { animation: vp-area-line 1s var(--vp-ease-out) .1s forwards; }
.vp-area-name { padding: 0 .7em 0 calc(.7em + .36em); font: 600 clamp(26px, 4.6vw, 52px)/1.1 var(--vp-font-display); letter-spacing: .36em; text-transform: uppercase;
  color: #f4f9ff; white-space: nowrap; text-shadow: 0 0 14px rgba(127,227,255,.5), 0 2px 0 rgba(0,0,0,.55); }
.vp-area.is-on .vp-area-name { animation: vp-area-name .9s var(--vp-ease-out) both; }
.vp-area-sub { margin-top: 14px; padding-left: .42em; font: 600 clamp(12px, 1.25vw, 15px)/1 var(--vp-font-ui); letter-spacing: .42em; text-transform: uppercase; color: var(--vp-ink-dim); opacity: 0; }
.vp-area.is-on .vp-area-sub { animation: vp-area-sub .8s var(--vp-ease-out) .45s forwards; }
@keyframes vp-area { 0% { opacity: 0; } 9% { opacity: 1; } 77% { opacity: 1; } 100% { opacity: 0; } }
@keyframes vp-area-line { to { transform: scaleX(1); } }
@keyframes vp-area-name { from { opacity: 0; transform: translateY(10px) scale(1.03); } }
@keyframes vp-area-sub { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* interaction prompt */
.vp-prompt { position: absolute; left: 50%; bottom: calc(30px + var(--vp-safe-bottom)); display: flex; align-items: center; gap: 10px;
  padding: 6px 20px 6px 7px; border-radius: 999px; background: linear-gradient(180deg, rgba(127,227,255,.08), rgba(127,227,255,0) 60%), rgba(8,13,26,.8);
  border: 1px solid var(--vp-line-dim); box-shadow: 0 4px 12px rgba(0,0,0,.35);
  font: 600 15px/1 var(--vp-font-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--vp-ink);
  opacity: 0; transform: translate(-50%, 10px); transition: opacity .18s var(--vp-ease-out), transform .26s var(--vp-ease-out); white-space: nowrap; }
.vp-prompt.is-on { opacity: 1; transform: translate(-50%, 0); }
.vp-prompt .vp-key, .vp-prompt .vp-padbtn, .vp-prompt .vp-tapbtn { height: 26px; min-width: 26px; }
.vp-prompt .vp-padbtn, .vp-prompt .vp-tapbtn { width: 26px; }
.vp-prompt-ico { width: 16px; height: 16px; margin-left: 2px; }
.vp-prompt-t { text-shadow: 0 0 10px rgba(127,227,255,.3); }

/* toasts (own layer so they also show above the pause menu) */
.vp-toasts { z-index: 45; transition: opacity .3s; }
.vp-toast-stack { position: absolute; top: calc(18px + var(--vp-safe-top)); right: calc(18px + var(--vp-safe-right)); display: flex; flex-direction: column; align-items: flex-end; gap: 10px; max-width: calc(100% - 36px); }
.vp-toasts.is-touch .vp-toast-stack { top: calc(72px + var(--vp-safe-top)); }
.vp-toast { display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 12px; max-width: 360px; font: 500 15px/1.35 var(--vp-font-ui); letter-spacing: .02em;
  animation: vp-toast 3.3s var(--vp-ease-out) forwards; }
.vp-toast .vp-ico { width: 32px; height: 32px; }
.vp-toast.no-ico { padding-left: 18px; }
.vp-toast::after { background: linear-gradient(90deg, transparent, rgba(255,214,140,.9), transparent); }
@keyframes vp-toast { 0% { opacity: 0; transform: translateX(28px); } 9% { opacity: 1; transform: none; } 84% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-8px); } }

/* danger gauge */
.vp-danger { position: absolute; right: calc(22px + var(--vp-safe-right)); bottom: calc(22px + var(--vp-safe-bottom)); width: 38px; height: 38px;
  --dc: #69b9ff; --lv: 0; --dp: 2.4s; opacity: 0; transition: opacity .5s var(--vp-ease-out), bottom .3s var(--vp-ease-out); }
.vp-danger.is-on { opacity: .92; }
.vp-hud.is-touch .vp-danger { bottom: calc(190px + var(--vp-safe-bottom)); right: calc(34px + var(--vp-safe-right)); }
.vp-danger-ring { position: absolute; inset: 0; border-radius: 50%; background: rgba(8,13,26,.6); box-shadow: inset 0 0 0 1px rgba(140,214,255,.22); }
.vp-danger-arc { position: absolute; inset: 0; border-radius: 50%; transition: background .4s;
  background: conic-gradient(var(--dc) calc(var(--lv) * 1turn), rgba(0,0,0,0) 0);
  -webkit-mask: radial-gradient(circle, transparent 13.5px, #000 14.5px, #000 17px, transparent 18px);
  mask: radial-gradient(circle, transparent 13.5px, #000 14.5px, #000 17px, transparent 18px); }
.vp-danger-dot { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%;
  background: var(--dc); box-shadow: 0 0 10px var(--dc), 0 0 2px #fff; transition: background .4s, box-shadow .4s; }
.vp-danger-pulse { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%;
  border: 1px solid var(--dc); opacity: 0; }
.vp-danger.is-on .vp-danger-pulse { animation: vp-danger var(--dp) ease-out infinite; will-change: transform, opacity; }
@keyframes vp-danger { from { transform: scale(1); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }

@media (max-width: 640px) {
  .vp-area { top: 27%; }
  .vp-area-name { font-size: clamp(22px, 6.6vw, 30px); letter-spacing: .24em; padding: 0 .45em 0 calc(.45em + .24em); white-space: normal; text-align: center; max-width: 84vw; }
  .vp-area-line { flex-basis: 28px; }
  .vp-area-sub { letter-spacing: .3em; font-size: 12px; }
  .vp-prompt { font-size: 14px; bottom: calc(24px + var(--vp-safe-bottom)); }
  .vp-hud.is-touch .vp-prompt { bottom: calc(196px + var(--vp-safe-bottom)); }
  .vp-toast { font-size: 14px; max-width: 280px; }
}

.vp-menu { z-index: 40; opacity: 0; visibility: hidden; transition: opacity .2s var(--vp-ease-out), visibility 0s linear .2s; }
.vp-menu.is-open { opacity: 1; visibility: visible; transition: opacity .2s var(--vp-ease-out); }
.vp-menu-scrim { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(5,7,13,.5), rgba(5,7,13,.84)); }
.vp-menu-win { position: absolute; left: 50%; top: 50%; box-sizing: border-box;
  width: min(1180px, calc(100% - 64px)); height: min(700px, calc(100% - 56px));
  transform: translate(-50%, -48%) scale(.985); transition: transform .32s var(--vp-ease-out);
  display: grid; grid-template-columns: 220px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "head head" "tabs body" "foot foot"; }
.vp-menu.is-open .vp-menu-win { transform: translate(-50%, -50%); }

.vp-menu-head { grid-area: head; display: flex; align-items: center; gap: 18px; padding: 14px 14px 12px 28px; border-bottom: 1px solid var(--vp-line-dim);
  background: linear-gradient(90deg, rgba(127,227,255,.06), rgba(127,227,255,0) 60%); }
.vp-menu-kicker { display: flex; align-items: center; gap: 10px; color: var(--vp-cyan); }
.vp-menu-kicker::before { content: ''; width: 6px; height: 6px; background: var(--vp-amber); transform: rotate(45deg); box-shadow: 0 0 8px var(--vp-amber); }
.vp-menu-title { margin-top: 6px; font: 700 28px/1 var(--vp-font-display); letter-spacing: .22em; text-transform: uppercase; color: #f4f9ff; text-shadow: 0 0 18px rgba(127,227,255,.35); }
.vp-menu-where { margin-left: auto; text-align: right; display: grid; gap: 6px; }
.vp-menu-where b { font: 600 15px/1 var(--vp-font-display); letter-spacing: .26em; text-transform: uppercase; color: var(--vp-ink); font-weight: 600; }
.vp-menu-close { flex: none; width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; color: var(--vp-ink-dim);
  border: 1px solid var(--vp-line-dim); background: rgba(127,227,255,.04); transition: color .15s, border-color .15s; }
.vp-menu-close:hover { color: var(--vp-amber); border-color: rgba(255,197,96,.6); }
.vp-menu-close i { position: relative; width: 18px; height: 18px; }
.vp-menu-close i::before, .vp-menu-close i::after { content: ''; position: absolute; left: 0; top: 8px; width: 18px; height: 1.5px; background: currentColor; transform: rotate(45deg); }
.vp-menu-close i::after { transform: rotate(-45deg); }

.vp-menu-tabs { grid-area: tabs; display: flex; flex-direction: column; gap: 4px; padding: 18px 0; border-right: 1px solid var(--vp-line-dim);
  background: linear-gradient(180deg, rgba(127,227,255,.035), rgba(127,227,255,0)); }
.vp-menu-tab { min-height: 50px; font: 600 15px var(--vp-font-ui); letter-spacing: .24em; text-transform: uppercase; color: var(--vp-ink-dim); }
.vp-menu-journey { margin-top: auto; padding: 14px 22px 4px 28px; display: grid; gap: 10px; border-top: 1px solid rgba(140,214,255,.1); }
.vp-menu-journey div { display: flex; justify-content: space-between; align-items: baseline; }
.vp-menu-journey .vp-num { font-size: 16px; font-weight: 600; color: var(--vp-ink); }
.vp-menu-tab .n { font: 600 12px var(--vp-font-display); letter-spacing: .08em; color: var(--vp-ink-faint); min-width: 18px; }
.vp-menu-tab.is-cur { color: var(--vp-ink); background: linear-gradient(90deg, rgba(127,227,255,.10), rgba(127,227,255,0)); box-shadow: inset 2px 0 0 var(--vp-cyan); }
.vp-menu-tab.is-sel .n, .vp-menu-tab.is-cur .n { color: inherit; }
.vp-menu-tab.is-sel { color: var(--vp-amber); }

.vp-menu-body { grid-area: body; position: relative; padding: 18px 22px; min-height: 0; }
.vp-menu-body.is-enter > * { animation: vp-page .28s var(--vp-ease-out); }
@keyframes vp-page { from { opacity: 0; transform: translateX(10px); } }

.vp-menu-foot { grid-area: foot; display: flex; align-items: center; gap: 24px; min-height: 44px; padding: 6px 22px; border-top: 1px solid var(--vp-line-dim); }
.vp-hints { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.vp-hint { display: inline-flex; align-items: center; gap: 9px; font: 600 13px var(--vp-font-ui); letter-spacing: .18em; text-transform: uppercase; color: var(--vp-ink-dim); }
.vp-menu-meta { margin-left: auto; display: flex; gap: 26px; }
.vp-meta { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.vp-meta .vp-num { font-size: 17px; font-weight: 600; color: var(--vp-ink); }
.vp-meta .vp-num.cr { color: var(--vp-amber); }

/* party */
.vp-party { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 410px), 1fr)); gap: 14px; }
.vp-card { --acc: var(--vp-cyan); padding: 14px 18px 12px; display: grid; gap: 9px; }
.vp-card::after { background: linear-gradient(90deg, transparent, var(--acc), transparent); opacity: .9; }
.vp-card-top { display: flex; gap: 16px; align-items: stretch; }
.vp-card-top .vp-portrait { width: 80px; height: 80px; --ps: 80px; }
.vp-card-main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
.vp-card-hd { display: flex; align-items: baseline; gap: 12px; }
.vp-card-name { font: 700 22px/1 var(--vp-font-display); letter-spacing: .18em; color: #fff; text-shadow: 0 0 14px color-mix(in srgb, var(--acc) 45%, transparent); }
.vp-card-cls { color: var(--acc); }
.vp-card-lv { margin-left: auto; display: flex; align-items: baseline; gap: 6px; }
.vp-card-lv .vp-num { font-size: 22px; font-weight: 700; color: #fff; }
.vp-ko { padding: 3px 7px; border: 1px solid var(--vp-danger); color: var(--vp-danger); font: 700 12px/1 var(--vp-font-display); letter-spacing: .2em; }
.vp-sbar { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.vp-sbar .vp-cap { letter-spacing: .12em; color: var(--vp-ink-dim); }
.vp-sbar .vp-num { min-width: 88px; text-align: right; font-size: 16px; font-weight: 600; color: var(--vp-ink); }
.vp-sbar .vp-num small { font-size: 13px; color: var(--vp-ink-faint); font-weight: 400; }
.vp-sbar .vp-num.is-low { color: #ffab6b; }
.vp-card-stats { display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 0; border-top: 1px solid rgba(140,214,255,.12); border-bottom: 1px solid rgba(140,214,255,.12); }
.vp-stat { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.vp-stat + .vp-stat { border-left: 1px solid rgba(140,214,255,.08); }
.vp-stat .vp-cap { letter-spacing: .16em; }
.vp-stat .vp-num { font-size: 18px; font-weight: 600; color: #f4f9ff; }
.vp-card-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.vp-weap { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px 0 5px; border: 1px solid rgba(140,214,255,.18); background: rgba(127,227,255,.04);
  font: 600 13px var(--vp-font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--vp-ink-dim); }
.vp-weap .vp-ico { width: 16px; height: 16px; }
.vp-next { margin-left: auto; display: flex; align-items: center; gap: 9px; }
.vp-next .vp-bar { width: 74px; height: 4px; }
.vp-next .vp-num { font-size: 13px; color: var(--vp-ink-dim); }
.vp-card.is-ko { --acc: #ff5a6a; }
.vp-card.is-ko .vp-card-name { color: #9fb2cc; }

/* items */
.vp-items { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 24px; align-items: start; }
.vp-item-list { display: flex; flex-direction: column; gap: 2px; }
.vp-item-sec { margin: 6px 0 6px 14px; color: var(--vp-ink-faint); }
.vp-item-sec:not(:first-child) { margin-top: 18px; }
.vp-item-row { min-height: 52px; font: 600 16px var(--vp-font-ui); letter-spacing: .06em; }
.vp-item-row .vp-ico { width: 32px; height: 32px; }
.vp-item-row .cnt { margin-left: auto; font: 600 17px var(--vp-font-display); color: var(--vp-ink-dim); }
.vp-item-row.is-sel .cnt { color: var(--vp-amber); }
.vp-item-row.is-hl { background: rgba(127,227,255,.06); }
.vp-item-detail { padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 12px; }
.vp-item-big { width: 64px; height: 64px; filter: drop-shadow(0 0 10px rgba(127,227,255,.25)); }
.vp-item-name { font: 700 21px/1.1 var(--vp-font-display); letter-spacing: .12em; color: #fff; }
.vp-item-desc { font: 400 15px/1.55 var(--vp-font-ui); color: var(--vp-ink-dim); }
.vp-item-tags { display: flex; gap: 8px; flex-wrap: wrap; }
.vp-tag { padding: 5px 9px; border: 1px solid var(--vp-line-dim); font: 600 13px/1 var(--vp-font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--vp-ink-dim); }
.vp-tag.amber { color: var(--vp-amber); border-color: rgba(255,197,96,.45); }
.vp-empty { padding: 30px 14px; color: var(--vp-ink-faint); font-size: 15px; letter-spacing: .1em; }

/* target picker */
.vp-menu-picker { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5,7,13,.6); opacity: 0; visibility: hidden; z-index: 2;
  transition: opacity .18s var(--vp-ease-out), visibility 0s linear .18s; }
.vp-menu.is-picking .vp-menu-picker { opacity: 1; visibility: visible; transition: opacity .18s var(--vp-ease-out); }
.vp-picker { width: min(580px, calc(100% - 24px)); padding: 18px 0 14px; max-height: calc(100% - 24px); box-sizing: border-box; display: flex; flex-direction: column; transform: translateY(8px); transition: transform .25s var(--vp-ease-out); }
.vp-menu.is-picking .vp-picker { transform: none; }
.vp-picker::before { --c: rgba(255,214,140,.95); --g: rgba(255,197,96,.25); }
.vp-picker-hd { display: flex; align-items: center; gap: 12px; padding: 0 22px 14px; border-bottom: 1px solid var(--vp-line-dim); margin-bottom: 8px; }
.vp-picker-hd .vp-ico { width: 32px; height: 32px; }
.vp-picker-hd b { font: 700 18px var(--vp-font-display); letter-spacing: .12em; }
.vp-picker-hd .vp-num { margin-left: auto; color: var(--vp-amber); font-size: 18px; }
.vp-picker-rows { min-height: 0; }
.vp-pick-row { min-height: 66px; gap: 14px; }
.vp-pick-row .vp-portrait { width: 40px; height: 40px; --ps: 40px; }
.vp-pick-name { width: 84px; font: 700 16px var(--vp-font-display); letter-spacing: .14em; }
.vp-pick-bars { flex: 1; display: grid; gap: 7px; min-width: 0; }
.vp-pick-bars .vp-sbar .vp-num { min-width: 78px; font-size: 14px; }
.vp-picker-msg { min-height: 20px; padding: 10px 22px 0; font: 500 15px var(--vp-font-ui); color: var(--vp-hp); }
.vp-picker-msg.is-err { color: #ff9aa6; }

/* settings */
.vp-set-list { display: flex; flex-direction: column; gap: 4px; max-width: 800px; }
.vp-set { min-height: 58px; justify-content: space-between; font: 600 15px var(--vp-font-ui); letter-spacing: .16em; text-transform: uppercase; }
.vp-set-ctl { display: flex; align-items: center; gap: 10px; color: var(--vp-ink); text-shadow: none; letter-spacing: .1em; }
.vp-seg { display: flex; border: 1px solid var(--vp-line-dim); }
.vp-seg > span { min-width: 66px; height: 36px; padding: 0 12px; box-sizing: border-box; display: grid; place-items: center; cursor: pointer;
  font: 600 13px var(--vp-font-ui); letter-spacing: .14em; color: var(--vp-ink-faint); transition: background .12s, color .12s; }
.vp-seg > span + span { border-left: 1px solid var(--vp-line-dim); }
.vp-seg > span.is-on { color: var(--vp-ink); background: rgba(127,227,255,.14); box-shadow: inset 0 -2px 0 var(--vp-cyan); }
.vp-set.is-sel .vp-seg > span.is-on { color: var(--vp-amber); background: rgba(255,197,96,.16); box-shadow: inset 0 -2px 0 var(--vp-amber); }
.vp-step { width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; border: 1px solid var(--vp-line-dim); color: var(--vp-ink-dim); font: 600 18px/1 var(--vp-font-display); }
.vp-step:hover { color: var(--vp-amber); }
.vp-pips { display: flex; gap: 4px; height: 36px; align-items: center; cursor: pointer; }
.vp-pips > span { width: 11px; height: 20px; transform: skewX(-14deg); background: rgba(140,214,255,.12); box-shadow: inset 0 0 0 1px rgba(140,214,255,.12); }
.vp-pips > span.is-on { background: linear-gradient(180deg, #c8f3ff, var(--vp-cyan)); box-shadow: 0 0 6px rgba(127,227,255,.4); }
.vp-set.is-sel .vp-pips > span.is-on { background: linear-gradient(180deg, #ffe7b8, var(--vp-amber)); box-shadow: 0 0 6px rgba(255,197,96,.5); }
.vp-set-val { min-width: 40px; text-align: right; font: 600 16px var(--vp-font-display); color: var(--vp-ink); }
.vp-set-desc { margin-top: 20px; max-width: 760px; padding: 12px 16px; border-left: 2px solid rgba(255,197,96,.6); background: rgba(127,227,255,.04);
  font: 400 15px/1.5 var(--vp-font-ui); color: var(--vp-ink-dim); }

/* controls */
.vp-ctl-note { margin-top: 16px; font: 400 14px/1.5 var(--vp-font-ui); color: var(--vp-ink-faint); }

.vp-title { z-index: 50; opacity: 0; visibility: hidden; transition: opacity .7s var(--vp-ease-out), visibility 0s linear .7s; overflow: hidden; }
.vp-title.is-open { opacity: 1; visibility: visible; transition: opacity .5s var(--vp-ease-out); }
.vp-title-shade { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(5,7,13,.78) 0%, rgba(5,7,13,.18) 30%, rgba(5,7,13,0) 48%, rgba(5,7,13,.12) 64%, rgba(5,7,13,.72) 100%); }
.vp-title-top { position: absolute; top: calc(26px + var(--vp-safe-top)); left: 0; right: 0; text-align: center; color: var(--vp-ink-faint); letter-spacing: .5em; padding-left: .5em; }
.vp-title-center { position: absolute; left: 0; right: 0; top: 19%; display: flex; flex-direction: column; align-items: center; }
.vp-logo { position: relative; margin: 0; font: 800 clamp(40px, 10.6vw, 136px)/1 var(--vp-font-display); letter-spacing: .3em; padding-left: .3em; white-space: nowrap; }
.vp-logo span { display: block; }
.vp-logo-main { position: relative; color: transparent; -webkit-background-clip: text; background-clip: text;
  background-image:
    repeating-linear-gradient(0deg, rgba(5,7,13,.2) 0 1px, rgba(5,7,13,0) 1px 4px),
    linear-gradient(100deg, rgba(255,255,255,0) 42%, rgba(255,255,255,.95) 50%, rgba(255,255,255,0) 58%),
    linear-gradient(180deg, #ffffff 0%, #e8f6ff 40%, #a8dcff 49%, #4f7fb8 51%, #9fcbf2 70%, #f2faff 100%);
  background-size: 100% 100%, 300% 100%, 100% 100%; background-repeat: no-repeat;
  background-position: 0 0, 150% 0, 0 0; animation: vp-logo-sheen 7s ease-in-out 1.6s infinite; }
.vp-logo-ghost { position: absolute; inset: 0; padding-left: inherit; pointer-events: none; will-change: transform; }
.vp-logo-ghost.c { color: rgba(127,227,255,.5); transform: translateX(-3px); text-shadow: 0 0 26px rgba(127,227,255,.8); animation: vp-glitch-c 5.2s steps(1) infinite; }
.vp-logo-ghost.m { color: rgba(255,79,163,.42); transform: translateX(3px); mix-blend-mode: screen; animation: vp-glitch-m 5.2s steps(1) infinite; }
@keyframes vp-logo-sheen { 0% { background-position: 0 0, 150% 0, 0 0; } 22%, 100% { background-position: 0 0, -50% 0, 0 0; } }
@keyframes vp-glitch-c { 0%, 91%, 100% { transform: translateX(-3px); clip-path: none; } 92% { transform: translateX(-9px); clip-path: inset(18% 0 52% 0); } 94% { transform: translateX(5px); clip-path: inset(60% 0 12% 0); } 96% { transform: translateX(-3px); clip-path: none; } }
@keyframes vp-glitch-m { 0%, 91%, 100% { transform: translateX(3px); clip-path: none; } 92% { transform: translateX(10px); clip-path: inset(40% 0 30% 0); } 95% { transform: translateX(-4px); clip-path: inset(8% 0 70% 0); } 97% { transform: translateX(3px); clip-path: none; } }
.vp-rule { display: flex; align-items: center; gap: 14px; width: min(640px, 82vw); margin-top: clamp(16px, 2.4vw, 28px); }
.vp-rule i { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255,197,96,0), rgba(255,197,96,.95)); box-shadow: 0 0 8px rgba(255,197,96,.5); }
.vp-rule i:last-child { background: linear-gradient(270deg, rgba(255,197,96,0), rgba(255,197,96,.95)); }
.vp-rule b { width: 9px; height: 9px; transform: rotate(45deg); border: 1.5px solid var(--vp-amber); box-shadow: 0 0 10px rgba(255,197,96,.8); }
.vp-rule b::after { content: ''; display: block; width: 3px; height: 3px; margin: 3px; background: var(--vp-amber); }
.vp-tagline { margin-top: clamp(14px, 2vw, 22px); padding-left: .5em; font: 600 clamp(13px, 1.3vw, 16px)/1 var(--vp-font-ui); letter-spacing: .5em; text-transform: uppercase; color: #c6d6ea; text-shadow: 0 0 12px rgba(127,227,255,.3), 0 1px 0 rgba(0,0,0,.6); }
.vp-title-lower { position: absolute; left: 0; right: 0; bottom: calc(16% + var(--vp-safe-bottom)); display: flex; flex-direction: column; align-items: center; }
.vp-press { display: flex; align-items: center; gap: 18px; cursor: pointer; padding: 12px 20px; font: 600 clamp(14px, 1.3vw, 17px)/1 var(--vp-font-display); letter-spacing: .5em; text-transform: uppercase;
  color: var(--vp-amber); text-shadow: 0 0 14px rgba(255,197,96,.6); animation: vp-blink 1.9s ease-in-out infinite; }
.vp-press::before, .vp-press::after { content: ''; width: 34px; height: 1px; background: linear-gradient(90deg, rgba(255,197,96,0), rgba(255,197,96,.8)); }
.vp-press::after { transform: scaleX(-1); }
.vp-press span { padding-left: .5em; }
@keyframes vp-blink { 0%, 100% { opacity: 1; } 50% { opacity: .28; } }
.vp-title-menu { display: none; min-width: 300px; padding: 10px 0; }
.vp-title-menu .vp-row { justify-content: center; padding: 0 40px; min-height: 48px; font: 600 16px var(--vp-font-ui); letter-spacing: .3em; text-transform: uppercase; color: var(--vp-ink-dim); }
.vp-title-menu .vp-row.is-sel { color: var(--vp-amber); background: linear-gradient(90deg, rgba(255,197,96,0), rgba(255,197,96,.16), rgba(255,197,96,0)); box-shadow: none; }
.vp-title-menu .vp-row::before { left: 22px; }
.vp-title.is-menu .vp-press { display: none; }
.vp-title.is-menu .vp-title-menu { display: block; animation: vp-tmenu .35s var(--vp-ease-out); }
@keyframes vp-tmenu { from { opacity: 0; transform: translateY(8px); } }
.vp-title-foot { position: absolute; left: 16px; right: 16px; bottom: calc(18px + var(--vp-safe-bottom)); text-align: center; color: var(--vp-ink-faint); letter-spacing: .3em; }
.vp-title-ctl { position: absolute; left: 50%; top: 50%; width: min(760px, calc(100% - 24px)); max-height: calc(100% - 40px); box-sizing: border-box; padding: 20px 22px 16px;
  transform: translate(-50%, -48%); opacity: 0; visibility: hidden; transition: opacity .2s, transform .28s var(--vp-ease-out), visibility 0s linear .2s; display: flex; flex-direction: column; }
.vp-title.is-ctl .vp-title-ctl { opacity: 1; visibility: visible; transform: translate(-50%, -50%); transition: opacity .2s, transform .28s var(--vp-ease-out); }
.vp-title.is-ctl .vp-title-center, .vp-title.is-ctl .vp-title-lower { opacity: .15; }
.vp-title-center, .vp-title-lower { transition: opacity .25s; }
.vp-title-ctl h2 { margin: 0 0 12px; font: 700 20px var(--vp-font-display); letter-spacing: .3em; text-transform: uppercase; }
.vp-title-ctl .vp-scroll { min-height: 0; }
.vp-title-ctl-foot { display: flex; justify-content: flex-end; gap: 10px; align-items: center; margin-top: 12px; color: var(--vp-ink-dim); font: 600 13px var(--vp-font-ui); letter-spacing: .2em; text-transform: uppercase; cursor: pointer; }

/* intro: elements arrive in sequence */
.vp-title.is-intro .vp-title-top { animation: vp-tin .9s var(--vp-ease-out) .1s both; }
.vp-title.is-intro .vp-logo { animation: vp-tlogo 1.4s var(--vp-ease-out) .2s both; }
.vp-title.is-intro .vp-rule { animation: vp-trule 1.1s var(--vp-ease-out) .75s both; }
.vp-title.is-intro .vp-tagline { animation: vp-tin .9s var(--vp-ease-out) 1.05s both; }
.vp-title.is-intro .vp-title-lower { animation: vp-tin .8s var(--vp-ease-out) 1.4s both; }
.vp-title.is-intro .vp-title-foot { animation: vp-tin .8s var(--vp-ease-out) 1.6s both; }
@keyframes vp-tin { from { opacity: 0; transform: translateY(8px); } }
@keyframes vp-tlogo { from { opacity: 0; transform: scale(1.06); } }
@keyframes vp-trule { from { opacity: 0; transform: scaleX(.2); } }

@media (max-width: 640px) {
  .vp-title-center { top: 24%; }
  .vp-logo { letter-spacing: .2em; padding-left: .2em; font-size: clamp(34px, 11.8vw, 60px); }
  .vp-title-top-x { display: none; }
  .vp-tagline { letter-spacing: .32em; padding-left: .32em; font-size: 13px; }
  .vp-title-top { letter-spacing: .26em; padding: 0 12px; }
  .vp-title-lower { bottom: calc(14% + var(--vp-safe-bottom)); }
  .vp-title-menu { min-width: 0; width: calc(100% - 48px); }

.vp-fade { z-index: 55; background: #000; opacity: 0; transition: opacity .5s ease; }
.vp-screens { z-index: 60; }
.vp-scr { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px calc(24px + var(--vp-safe-bottom));
  box-sizing: border-box; text-align: center; opacity: 0; visibility: hidden; transition: opacity .6s var(--vp-ease-out), visibility 0s linear .6s; overflow: hidden; }
.vp-scr.is-on { opacity: 1; visibility: visible; transition: opacity .8s var(--vp-ease-out); }
.vp-scr-btns { display: flex; flex-direction: column; align-items: stretch; gap: 4px; min-width: min(380px, 100%); margin-top: 34px; }
.vp-scr-btns .vp-row { justify-content: center; padding: 0 42px; min-height: 50px; font: 600 15px var(--vp-font-ui); letter-spacing: .26em; text-transform: uppercase; color: var(--vp-ink-dim); }
.vp-scr-btns .vp-row.is-sel { color: var(--vp-amber); background: linear-gradient(90deg, rgba(255,197,96,0), rgba(255,197,96,.16), rgba(255,197,96,0)); box-shadow: none; }
.vp-scr-btns .vp-row::before { left: 20px; }
.vp-scr.is-on .vp-scr-in { animation: vp-scr-in .9s var(--vp-ease-out) both; }
.vp-scr.is-on .vp-scr-in.d1 { animation-delay: .25s; } .vp-scr.is-on .vp-scr-in.d2 { animation-delay: .5s; } .vp-scr.is-on .vp-scr-in.d3 { animation-delay: .8s; } .vp-scr.is-on .vp-scr-in.d4 { animation-delay: 1.1s; }
@keyframes vp-scr-in { from { opacity: 0; transform: translateY(10px); } }

/* game over */
.vp-over { background: radial-gradient(circle farthest-side at 50% 45%, rgba(70,8,22,.76), rgba(24,4,10,.9) 55%, rgba(8,2,5,.96)); }
.vp-over::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, rgba(0,0,0,0) 1px 3px); }
.vp-over::after { content: ''; position: absolute; left: 0; right: 0; height: 18%; top: -20%; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,90,106,0), rgba(255,90,106,.07), rgba(255,90,106,0)); animation: vp-sweep 4.5s linear infinite; }
@keyframes vp-sweep { to { transform: translateY(700%); } }
.vp-over-kick { color: #ff8a96; letter-spacing: .5em; padding-left: .5em; }
.vp-over-title { position: relative; margin: 18px 0 0; font: 800 clamp(42px, 9.5vw, 120px)/1 var(--vp-font-display); letter-spacing: .18em; padding-left: .18em; white-space: nowrap; }
.vp-over-title span { display: block; }
.vp-over-main { position: relative; color: #ffe3e6; text-shadow: 0 0 30px rgba(255,90,106,.55), 0 0 2px #fff; }
.vp-over-ghost { position: absolute; inset: 0; padding-left: inherit; pointer-events: none; }
.vp-over-ghost.r { color: rgba(255,60,90,.7); animation: vp-og-r 2.6s steps(1) infinite; }
.vp-over-ghost.c { color: rgba(90,230,255,.45); mix-blend-mode: screen; animation: vp-og-c 2.6s steps(1) infinite; }
@keyframes vp-og-r { 0%, 100% { transform: translateX(-4px); clip-path: none; } 30% { transform: translateX(-12px); clip-path: inset(10% 0 62% 0); } 33% { transform: translateX(-4px); clip-path: none; } 71% { transform: translateX(6px); clip-path: inset(55% 0 20% 0); } 74% { transform: translateX(-4px); clip-path: none; } }
@keyframes vp-og-c { 0%, 100% { transform: translateX(4px); clip-path: none; } 30% { transform: translateX(14px); clip-path: inset(40% 0 35% 0); } 34% { transform: translateX(4px); clip-path: none; } 72% { transform: translateX(-8px); clip-path: inset(5% 0 75% 0); } 75% { transform: translateX(4px); clip-path: none; } }
.vp-over-sub { margin-top: 22px; font: 500 clamp(15px, 1.5vw, 18px)/1.5 var(--vp-font-ui); color: #d9b9c0; letter-spacing: .06em; }
.vp-over-flat { width: min(520px, 80vw); height: 1px; margin-top: 26px; background: linear-gradient(90deg, rgba(255,90,106,0), rgba(255,90,106,.8), rgba(255,90,106,0)); box-shadow: 0 0 10px rgba(255,90,106,.6); }
.vp-over .vp-row.is-sel { color: #ffd0a0; }

/* complete */
.vp-done { background: radial-gradient(circle farthest-side at 50% 40%, rgba(16,30,62,.8), rgba(8,12,24,.9) 60%, rgba(5,7,13,.96)); }
.vp-done-kick { color: var(--vp-cyan); letter-spacing: .46em; padding-left: .46em; }
.vp-done-title { margin: 20px 0 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.vp-done-title small { display: flex; align-items: center; gap: 16px; font: 600 clamp(14px, 1.6vw, 18px)/1 var(--vp-font-display); letter-spacing: .5em; padding-left: .5em; text-transform: uppercase; color: var(--vp-amber); text-shadow: 0 0 14px rgba(255,197,96,.5); }
.vp-done-title small::before, .vp-done-title small::after { content: ''; width: clamp(24px, 6vw, 80px); height: 1px; background: linear-gradient(90deg, rgba(255,197,96,0), var(--vp-amber)); }
.vp-done-title small::after { transform: scaleX(-1); }
.vp-done-title b { position: relative; display: block; font: 800 clamp(40px, 8vw, 104px)/1 var(--vp-font-display); letter-spacing: .2em; padding-left: .2em; }
.vp-done-title b span { display: block; }
.vp-done-glow { position: absolute; inset: 0; padding-left: inherit; color: rgba(127,227,255,.28); text-shadow: 0 0 20px rgba(127,227,255,.5); }
.vp-done-main { position: relative; color: transparent; -webkit-background-clip: text; background-clip: text;
  background-image: linear-gradient(180deg, #ffffff 0%, #e8f6ff 42%, #a8dcff 50%, #5684bb 52%, #a8d2f5 72%, #f6fbff 100%); }
.vp-done-msg { margin-top: 18px; max-width: 560px; font: 400 clamp(15px, 1.4vw, 17px)/1.55 var(--vp-font-ui); color: var(--vp-ink-dim); }
.vp-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; width: min(860px, 100%); margin-top: 34px; }
.vp-stat-tile { padding: 18px 12px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.vp-stat-tile .vp-num { font-size: clamp(26px, 3vw, 38px); font-weight: 700; color: #fff; text-shadow: 0 0 16px rgba(127,227,255,.35); }
.vp-stat-tile.hl .vp-num { color: var(--vp-break); text-shadow: 0 0 16px rgba(255,79,163,.45); }
.vp-done .vp-scr-btns { flex-direction: row; justify-content: center; min-width: 0; gap: 10px; }
.vp-done .vp-scr-btns .vp-row { min-width: 250px; }
@media (max-width: 640px) {
  .vp-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 26px; }
  .vp-done .vp-scr-btns { flex-direction: column; width: 100%; margin-top: 24px; }
  .vp-done .vp-scr-btns .vp-row { min-width: 0; }
  .vp-done-title b, .vp-over-title { letter-spacing: .12em; padding-left: .12em; }
  .vp-over-kick, .vp-done-kick { letter-spacing: .16em; padding-left: .16em; }
  .vp-stat-tile .vp-cap { letter-spacing: .1em; }
  .vp-done-title small { letter-spacing: .3em; padding-left: .3em; }
  .vp-scr-btns .vp-row { padding: 0 34px; font-size: 14px; letter-spacing: .14em; }
}

.vb-root { position: absolute; inset: 0; z-index: 12; pointer-events: none; font-family: var(--vp-font-ui); color: var(--vp-ink); }
#ui-root > .vb-root { pointer-events: none; }
.vb-root * { box-sizing: border-box; }
.vb-root img { image-rendering: pixelated; image-rendering: crisp-edges; -webkit-user-drag: none; }
.vb-live { pointer-events: auto; }
.vb-world { position: absolute; inset: 0; overflow: hidden; }
.vb-abs { position: absolute; left: 0; top: 0; will-change: transform; }
.vb-root.is-intro .vb-top, .vb-root.is-intro .vb-party, .vb-root.is-intro .vb-foe { opacity: 0; }
.vb-top, .vb-party, .vb-foe { transition: opacity .45s var(--vp-ease-out); }

/* ---------------------------------------------------------------- turn order */
.vb-top { position: absolute; left: calc(14px + var(--vp-safe-left)); right: calc(14px + var(--vp-safe-right)); top: calc(12px + var(--vp-safe-top));
  display: flex; align-items: flex-start; gap: 14px; }
.vb-turns { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 8px; flex: none; max-width: 100%; }
.vb-round { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 50px; padding-right: 10px; border-right: 1px solid var(--vp-line-dim); align-self: stretch; }
.vb-round .vp-cap { font-size: 10px; letter-spacing: .3em; padding-left: .3em; color: var(--vp-cyan); }
.vb-round b { font: 700 25px/1 var(--vp-font-display); color: #fff; text-shadow: 0 0 12px rgba(127,227,255,.4); }
.vb-round.is-pop b { animation: vb-pop .5s var(--vp-ease-out); }
.vb-order { display: flex; align-items: center; gap: 5px; }
.vb-slot { --acc: var(--vp-cyan); position: relative; width: 40px; height: 40px; flex: none; overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--acc) 55%, transparent);
  background: linear-gradient(160deg, color-mix(in srgb, var(--acc) 26%, #0a1020), #070b16 80%);
  transition: transform .22s var(--vp-ease-out), box-shadow .22s, border-color .22s; animation: vb-slot-in .28s var(--vp-ease-out) both; }
.vb-slot img { position: absolute; }
.vb-slot.party img { width: 80px; height: 80px; left: -22px; top: -10px; }
.vb-slot.enemy { --acc: #ff5a6a; }
.vb-slot.enemy img { width: 48px; height: 48px; left: -4px; top: -4px; }
.vb-slot.is-active { border-color: var(--vp-amber); transform: translateY(2px) scale(1.14); z-index: 1;
  box-shadow: 0 0 0 1px var(--vp-amber), 0 0 14px rgba(255,197,96,.55); }
.vb-slot.is-active::after { content: ''; position: absolute; left: 50%; bottom: 1px; width: 0; height: 0; margin-left: -4px;
  border: 4px solid transparent; border-bottom-color: var(--vp-amber); }
.vb-next { display: flex; align-items: center; gap: 6px; padding-left: 10px; border-left: 1px solid var(--vp-line-dim); align-self: stretch; }
.vb-next .vp-cap { font-size: 10px; letter-spacing: .26em; writing-mode: vertical-rl; transform: rotate(180deg); color: var(--vp-ink-faint); }
.vb-next .vb-order { gap: 4px; }
.vb-next .vb-slot { width: 28px; height: 28px; opacity: .62; }
.vb-next .vb-slot.party img { width: 56px; height: 56px; left: -15px; top: -7px; }
.vb-next .vb-slot.enemy img { width: 34px; height: 34px; left: -3px; top: -3px; }
@keyframes vb-slot-in { from { opacity: 0; transform: translateX(10px); } }
@keyframes vb-pop { 0% { transform: scale(1.6); color: var(--vp-amber); } 100% { transform: none; } }

/* ---------------------------------------------------------------- help line */
.vb-help { margin-left: auto; width: min(540px, 44vw); min-height: 52px; padding: 9px 18px; display: flex; align-items: center; gap: 12px;
  font: 500 15px/1.35 var(--vp-font-ui); color: var(--vp-ink); opacity: 0; transform: translateY(-6px); transition: opacity .16s, transform .2s var(--vp-ease-out); }
.vb-help.is-on { opacity: 1; transform: none; }
.vb-help .vb-help-t { flex: 1; min-width: 0; }
.vb-help .vb-help-t b { font: 700 16px/1.1 var(--vp-font-display); letter-spacing: .12em; color: #fff; display: block; margin-bottom: 3px; text-transform: uppercase; }
.vb-help .vb-help-t b.weak { color: var(--vp-weak); }
.vb-help .vb-help-t small { color: var(--vp-ink-dim); font-size: 14px; }
.vb-help .vb-tag { flex: none; padding: 4px 8px; border: 1px solid rgba(255,224,102,.6); color: var(--vp-weak); font: 700 12px/1 var(--vp-font-display); letter-spacing: .2em; }
.vb-help .vb-plate { flex: none; }

/* ---------------------------------------------------------------- action name */
.vb-act { position: absolute; left: 50%; top: calc(84px + var(--vp-safe-top)); transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
  padding: 9px 46px; white-space: nowrap; font: 700 19px/1 var(--vp-font-display); letter-spacing: .22em; text-transform: uppercase; color: #fff;
  background: linear-gradient(90deg, rgba(8,13,26,0), rgba(8,13,26,.86) 18%, rgba(8,13,26,.86) 82%, rgba(8,13,26,0)); opacity: 0; }
.vb-act::before, .vb-act::after { content: ''; position: absolute; left: 12%; right: 12%; height: 1px; background: linear-gradient(90deg, transparent, var(--c, var(--vp-cyan)), transparent); }
.vb-act::before { top: 0; } .vb-act::after { bottom: 0; }
.vb-act img { width: 16px; height: 16px; }
.vb-act.enemy { --c: #ff5a6a; color: #ffd6da; }
.vb-act.is-on { animation: vb-act 1.5s var(--vp-ease-out) forwards; }
@keyframes vb-act { 0% { opacity: 0; transform: translate(-50%, -6px); letter-spacing: .4em; } 12% { opacity: 1; transform: translate(-50%, 0); letter-spacing: .22em; } 80% { opacity: 1; } 100% { opacity: 0; } }

/* ---------------------------------------------------------------- party panel */
.vb-party { position: absolute; right: calc(14px + var(--vp-safe-right)); bottom: calc(12px + var(--vp-safe-bottom)); width: 430px; padding: 6px 0; }
.vb-row { --acc: var(--vp-cyan); position: relative; display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 10px; align-items: center; padding: 5px 14px 5px 10px;
  transition: transform .2s var(--vp-ease-out), background-color .2s, opacity .3s; }
.vb-row + .vb-row { border-top: 1px solid rgba(140,214,255,.07); }
.vb-row.is-active { transform: translateX(-18px); background: linear-gradient(90deg, rgba(255,197,96,.2), rgba(255,197,96,.05) 70%, rgba(255,197,96,0));
  box-shadow: inset 2px 0 0 var(--vp-amber); }
.vb-row.is-active .vb-name { color: var(--vp-amber); text-shadow: 0 0 10px rgba(255,197,96,.45); }
.vb-row.is-pick { background: rgba(127,227,255,.08); }
.vb-row.is-ko { opacity: .62; }
.vb-row.is-ko .vb-pt img { filter: grayscale(1) brightness(.55); }
.vb-row.is-hurt { animation: vb-row-hurt .3s; }
@keyframes vb-row-hurt { 0%, 100% { transform: none; } 25% { transform: translateX(4px); } 60% { transform: translateX(-3px); } }
.vb-row.is-active.is-hurt { animation: none; }
.vb-pt { position: relative; width: 40px; height: 40px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--acc) 60%, transparent);
  background: linear-gradient(160deg, color-mix(in srgb, var(--acc) 30%, #0a1020), #070b16 75%); }
.vb-pt img { position: absolute; width: 80px; height: 80px; left: -22px; top: -10px; }
.vb-l1 { display: flex; align-items: center; gap: 8px; min-width: 0; margin-bottom: 3px; }
.vb-name { font: 700 15px/1 var(--vp-font-display); letter-spacing: .16em; color: #fff; }
.vb-ko { display: none; padding: 2px 5px; border: 1px solid var(--vp-danger); color: var(--vp-danger); font: 700 10px/1 var(--vp-font-display); letter-spacing: .18em; }
.vb-row.is-ko .vb-ko { display: inline-block; }
.vb-buffs { display: flex; gap: 4px; min-width: 0; overflow: hidden; }
.vb-buff { padding: 1px 4px; font: 700 10px/1.3 var(--vp-font-display); letter-spacing: .08em; border: 1px solid currentColor; }
.vb-buff.up { color: #8affc0; } .vb-buff.down { color: #ff8fa0; } .vb-buff.taunt { color: var(--vp-amber); }
.vb-bp { display: flex; gap: 1px; margin-left: auto; flex: none; }
.vb-bp img { width: 16px; height: 16px; transition: transform .2s; }
.vb-bp img.is-new { animation: vb-pip .45s var(--vp-ease-out); }
.vb-bp img.is-boost { filter: drop-shadow(0 0 4px rgba(255,179,71,.95)); transform: translateY(-2px); }
@keyframes vb-pip { 0% { transform: scale(2); filter: brightness(2.2); } 100% { transform: none; } }
.vb-bars { display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; }
.vb-st { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 6px; }
.vb-st > span { font: 600 11px/1 var(--vp-font-ui); letter-spacing: .14em; color: var(--vp-ink-faint); }
.vb-st .vp-bar { height: 5px; }
.vb-st b { min-width: 38px; text-align: right; font: 600 17px/1 var(--vp-font-display); font-variant-numeric: tabular-nums; color: #fff; }
.vb-st b.is-low { color: #ffab6b; }
.vb-st.ep b { font-size: 15px; color: #cfe6ff; min-width: 28px; }

/* ---------------------------------------------------------------- command menu */
.vb-menu { --acc: var(--vp-cyan); width: 250px; opacity: 0; visibility: hidden; transition: opacity .12s, visibility 0s linear .12s; }
.vb-menu.is-open { opacity: 1; visibility: visible; transition: opacity .1s; }
.vb-menu.is-open .vb-menu-in { animation: vb-menu-in .2s var(--vp-ease-out); }
@keyframes vb-menu-in { from { transform: translateX(14px); opacity: .2; } }
.vb-menu-hd { display: flex; align-items: center; gap: 8px; padding: 9px 12px 8px 14px; border-bottom: 1px solid var(--vp-line-dim);
  background: linear-gradient(90deg, color-mix(in srgb, var(--acc) 16%, transparent), transparent); }
.vb-menu-who { font: 700 13px/1 var(--vp-font-display); letter-spacing: .2em; color: var(--acc); text-transform: uppercase; }
.vb-menu-sub { font: 600 11px/1 var(--vp-font-ui); letter-spacing: .2em; color: var(--vp-ink-faint); text-transform: uppercase; }
.vb-boost { margin-left: auto; display: flex; align-items: center; gap: 4px; cursor: pointer; }
.vb-boost .vp-cap { font-size: 10px; letter-spacing: .22em; margin-right: 2px; }
.vb-boost .vp-cap.is-on { color: var(--vp-bp); text-shadow: 0 0 8px rgba(255,179,71,.6); }
.vb-pip { width: 9px; height: 9px; transform: rotate(45deg); border: 1px solid rgba(255,179,71,.45); background: rgba(255,179,71,.06); transition: background .12s, box-shadow .12s, border-color .12s; }
.vb-pip.is-avail { border-color: rgba(255,179,71,.85); }
.vb-pip.is-on { background: var(--vp-bp); border-color: #ffe3b0; box-shadow: 0 0 8px rgba(255,179,71,.9), 0 0 2px #fff; }
.vb-pip.is-pop { animation: vb-pip-pop .3s var(--vp-ease-out); }
@keyframes vb-pip-pop { 0% { transform: rotate(45deg) scale(1.9); } 100% { transform: rotate(45deg); } }
.vb-list { padding: 4px 0 5px; max-height: 300px; }
.vb-it { min-height: 38px; gap: 10px; padding-right: 12px; font: 600 15px/1.1 var(--vp-font-ui); letter-spacing: .06em; }
.vb-it img { width: 16px; height: 16px; flex: none; }
.vb-it .r { margin-left: auto; font: 600 14px/1 var(--vp-font-display); color: var(--vp-ink-dim); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.vb-it .r .ep { color: #9fd0ff; }
.vb-it.is-sel .r .ep { color: #cfe6ff; }
.vb-it .r .wk { color: var(--vp-weak); font: 700 10px/1 var(--vp-font-display); letter-spacing: .14em; }
.vb-it.is-dim .r .ep { color: #6c7f9c; }
.vb-menu-ft { display: flex; gap: 14px; padding: 6px 14px 8px; border-top: 1px solid rgba(140,214,255,.1); }
.vb-menu-ft > span { display: inline-flex; align-items: center; gap: 6px; font: 600 10px/1 var(--vp-font-ui); letter-spacing: .16em; color: var(--vp-ink-faint); text-transform: uppercase; cursor: pointer; }
.vb-menu-ft > span:hover { color: var(--vp-amber); }
.vb-menu-ft .vp-key, .vb-menu-ft .vp-padbtn { transform: scale(.82); }

/* ---------------------------------------------------------------- enemy plates */
.vb-foe { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.vb-plate { display: flex; align-items: center; gap: 4px; padding: 3px 6px 3px 3px; background: rgba(6,10,20,.72); border: 1px solid rgba(140,214,255,.18); }
.vb-foe.is-target .vb-plate { border-color: rgba(255,197,96,.75); box-shadow: 0 0 10px rgba(255,197,96,.3); }
.vb-shield { position: relative; width: 32px; height: 32px; flex: none; }
.vb-shield img { position: absolute; inset: 0; width: 32px; height: 32px; }
.vb-shield b { position: absolute; inset: 0; display: grid; place-items: center; padding-top: 1px; font: 800 15px/1 var(--vp-font-display); color: #fff;
  text-shadow: 0 1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 -1px 0 #000; }
.vb-shield.is-hit { animation: vb-shake .26s; }
.vb-shield.is-hit b { animation: vb-num-hit .3s var(--vp-ease-out); }
.vb-shield.is-broken b { color: #ff8fd0; font-size: 10px; }
.vb-shield.is-restore { animation: vb-restore .5s var(--vp-ease-out); }
@keyframes vb-shake { 0%, 100% { transform: none; } 20% { transform: translate(-2px, 1px); } 50% { transform: translate(2px, -1px); } 75% { transform: translate(-1px, 0); } }
@keyframes vb-num-hit { 0% { transform: scale(1.8); color: #ff8fd0; } 100% { transform: none; } }
@keyframes vb-restore { 0% { transform: scale(1.5); filter: brightness(2.4) drop-shadow(0 0 6px #7fe3ff); } 100% { transform: none; } }
.vb-shard { position: absolute; left: 0; top: 0; width: 32px; height: 32px; background-size: 32px 32px; pointer-events: none; animation: vb-shard .55s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes vb-shard { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
.vb-weak { display: flex; gap: 2px; }
.vb-wk { position: relative; width: 20px; height: 20px; display: grid; place-items: center; background: rgba(0,0,0,.45); border: 1px solid rgba(140,214,255,.16); }
.vb-wk img { width: 16px; height: 16px; }
.vb-wk.is-known { border-color: color-mix(in srgb, var(--c) 60%, transparent); background: color-mix(in srgb, var(--c) 14%, rgba(0,0,0,.5)); }
.vb-wk.is-flip { animation: vb-flip .5s var(--vp-ease-out); }
.vb-wk.is-match { box-shadow: 0 0 0 1px var(--vp-weak), 0 0 8px rgba(255,224,102,.7); }
@keyframes vb-flip { 0% { transform: rotateY(90deg) scale(1.6); filter: brightness(3); } 60% { transform: rotateY(0) scale(1.25); } 100% { transform: none; } }
.vb-brk { display: none; gap: 3px; padding: 0 2px; }
.vb-foe.is-broken .vb-brk { display: flex; }
.vb-brk i { width: 6px; height: 6px; transform: rotate(45deg); background: var(--vp-break); box-shadow: 0 0 6px var(--vp-break); }
.vb-brk i.is-off { background: transparent; border: 1px solid rgba(255,79,163,.5); box-shadow: none; }
.vb-foe .vb-buffs { gap: 3px; }
.vb-foe .vb-buff { font-size: 9px; background: rgba(6,10,20,.7); }
.vb-foe-hp { width: 86px; height: 4px; background: rgba(4,8,18,.8); box-shadow: inset 0 0 0 1px rgba(140,214,255,.16); position: relative; overflow: hidden; }
.vb-foe-hp i { position: absolute; inset: 1px; transform-origin: 0 50%; background: linear-gradient(90deg, #ff5a6a, #ff9a6a); transition: transform .35s var(--vp-ease-out); }
.vb-foe-name { font: 600 11px/1 var(--vp-font-ui); letter-spacing: .14em; color: var(--vp-ink-dim); text-transform: uppercase; text-shadow: 0 1px 2px #000; white-space: nowrap; opacity: 0; transition: opacity .15s; }
.vb-foe.is-target .vb-foe-name { opacity: 1; color: var(--vp-amber); }
.vb-foe.is-gone { opacity: 0 !important; }

/* ---------------------------------------------------------------- cursor, reticle, hit boxes */
.vb-cursor { width: 32px; height: 32px; margin: -36px 0 0 -16px; display: none; }
.vb-cursor.is-on { display: block; }
.vb-cursor img { width: 32px; height: 32px; transform: rotate(90deg); animation: vb-bob .7s ease-in-out infinite alternate; filter: drop-shadow(0 0 6px rgba(255,197,96,.8)); }
@keyframes vb-bob { from { translate: 0 -5px; } to { translate: 0 3px; } }
.vb-reticle { width: 88px; height: 88px; margin: -44px 0 0 -44px; display: none; }
.vb-reticle.is-on { display: block; }
.vb-reticle::before, .vb-reticle::after { content: ''; position: absolute; background: linear-gradient(var(--d), #ff3b4e 0 22%, transparent 22% 78%, #ff3b4e 78%); filter: drop-shadow(0 0 4px #ff3b4e); }
.vb-reticle::before { --d: 90deg; left: -14px; right: -14px; top: 50%; height: 2px; margin-top: -1px; }
.vb-reticle::after { --d: 180deg; top: -14px; bottom: -14px; left: 50%; width: 2px; margin-left: -1px; }
.vb-reticle i { position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(255,59,78,.95); box-shadow: 0 0 14px rgba(255,59,78,.8), inset 0 0 12px rgba(255,59,78,.45);
  animation: vb-ret 1.6s linear infinite; border-top-color: transparent; border-bottom-color: transparent; }
.vb-reticle b { position: absolute; inset: 14px; border-radius: 50%; border: 1px dashed rgba(255,120,130,.85); animation: vb-ret 3s linear infinite reverse; }
.vb-reticle span { position: absolute; left: 50%; top: -26px; transform: translateX(-50%); font: 700 10px/1 var(--vp-font-display); letter-spacing: .3em; color: #ff6b78; text-shadow: 0 0 6px #ff3b4e; white-space: nowrap; animation: vb-blink .5s steps(2) infinite; }
.vb-reticle s { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; background: #ff3b4e; box-shadow: 0 0 8px #ff3b4e; }
@keyframes vb-ret { to { transform: rotate(360deg); } }
@keyframes vb-blink { 50% { opacity: .35; } }
.vb-hit { position: absolute; left: 0; top: 0; pointer-events: none; cursor: pointer; }
.vb-root.is-targeting .vb-hit.is-valid { pointer-events: auto; }

/* ---------------------------------------------------------------- numbers, labels, callouts */
.vb-num { pointer-events: none; }
.vb-num > div { transform: translate(-50%, -50%); animation: vb-num 1.2s var(--vp-ease-out) forwards; text-align: center; white-space: nowrap; }
.vb-num span { display: block; font: 800 34px/1 var(--vp-font-display); color: #fff; letter-spacing: .02em;
  text-shadow: 0 2px 0 #0b0e17, 2px 0 0 #0b0e17, -2px 0 0 #0b0e17, 0 -2px 0 #0b0e17, 2px 2px 0 #0b0e17, -2px 2px 0 #0b0e17, 2px -2px 0 #0b0e17, -2px -2px 0 #0b0e17, 0 4px 10px rgba(0,0,0,.6); }
.vb-num em { display: block; font: 700 13px/1 var(--vp-font-display); font-style: normal; letter-spacing: .26em; padding-left: .26em; margin-bottom: 3px;
  text-shadow: 0 1px 0 #0b0e17, 1px 0 0 #0b0e17, -1px 0 0 #0b0e17, 0 -1px 0 #0b0e17, 0 0 8px rgba(0,0,0,.8); }
.vb-num.weak span { color: var(--vp-weak); font-size: 38px; }
.vb-num.weak em { color: var(--vp-weak); }
.vb-num.crit span { color: #ffb347; font-size: 46px; }
.vb-num.crit em { color: #ffb347; }
.vb-num.heal span { color: #7dffb0; }
.vb-num.ep span { color: #8cc8ff; font-size: 28px; }
.vb-num.word span { font-size: 22px; letter-spacing: .14em; }
@keyframes vb-num { 0% { opacity: 0; transform: translate(-50%, -50%) scale(2); } 9% { opacity: 1; transform: translate(-50%, -50%) scale(.9); }
  17% { transform: translate(-50%, -64%) scale(1.06); } 28% { transform: translate(-50%, -58%) scale(1); } 76% { opacity: 1; transform: translate(-50%, -66%); } 100% { opacity: 0; transform: translate(-50%, -96%); } }
.vb-combo { pointer-events: none; }
.vb-combo > div { transform: translate(0, -50%); font: 800 20px/1 var(--vp-font-display); font-style: italic; letter-spacing: .06em; color: #fff; white-space: nowrap;
  text-shadow: 0 2px 0 #0b0e17, 2px 0 0 #0b0e17, -2px 0 0 #0b0e17, 0 -2px 0 #0b0e17, 0 0 12px rgba(255,179,71,.7); }
.vb-combo > div small { font-size: 12px; letter-spacing: .24em; margin-left: 4px; color: var(--vp-bp); }
.vb-combo.is-pop > div { animation: vb-combo .25s var(--vp-ease-out); }
.vb-combo.is-out { animation: vb-fade .35s forwards; }
@keyframes vb-combo { 0% { transform: translate(0, -50%) scale(1.6); } 100% { transform: translate(0, -50%); } }
@keyframes vb-fade { to { opacity: 0; } }
.vb-label > div { transform: translate(-50%, -50%); animation: vb-label 1.3s var(--vp-ease-out) forwards; padding: 3px 9px; white-space: nowrap;
  font: 700 13px/1 var(--vp-font-display); letter-spacing: .2em; color: #fff; background: rgba(6,10,20,.72); border: 1px solid currentColor; }
.vb-label.buff > div { color: #8affc0; } .vb-label.debuff > div { color: #ff8fa0; } .vb-label.info > div { color: var(--vp-cyan); } .vb-label.boost > div { color: var(--vp-bp); }
@keyframes vb-label { 0% { opacity: 0; transform: translate(-50%, -20%); } 14% { opacity: 1; transform: translate(-50%, -50%); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -90%); } }

.vb-break { pointer-events: none; }
.vb-break { margin-top: 26px; }
.vb-break > div { position: relative; transform: translate(-50%, -50%); animation: vb-break 1.35s cubic-bezier(.2,.8,.2,1) forwards; }
.vb-break .bar { position: absolute; left: -40%; right: -40%; top: 50%; height: 34px; margin-top: -17px; transform: skewX(-24deg);
  background: linear-gradient(90deg, rgba(255,79,163,0), rgba(255,79,163,.85) 18%, rgba(255,140,205,.95) 50%, rgba(255,79,163,.85) 82%, rgba(255,79,163,0));
  box-shadow: 0 0 24px rgba(255,79,163,.7); animation: vb-bar 1.35s cubic-bezier(.2,.8,.2,1) forwards; }
.vb-break .bar::after { content: ''; position: absolute; left: 10%; right: 10%; top: 4px; height: 2px; background: rgba(255,255,255,.85); }
.vb-break .word { position: relative; display: block; font: 800 74px/1 var(--vp-font-display); font-style: italic; letter-spacing: .08em; padding: 0 .1em;
  color: #fff; transform: skewX(-8deg);
  text-shadow: 3px 3px 0 #5c1450, -2px -2px 0 #5c1450, 2px -2px 0 #5c1450, -2px 2px 0 #5c1450, 0 0 20px #ff4fa3, 6px 0 0 rgba(127,227,255,.55), -6px 0 0 rgba(255,79,163,.6); }
.vb-break .sub { position: relative; display: block; text-align: center; margin-top: 6px; font: 700 13px/1 var(--vp-font-display); letter-spacing: .5em; padding-left: .5em; color: #ffd2ec; text-shadow: 0 0 8px #ff4fa3, 0 1px 0 #000; }
@keyframes vb-break { 0% { opacity: 0; transform: translate(-50%, -50%) scale(2.6) rotate(-6deg); filter: brightness(3); }
  10% { opacity: 1; transform: translate(-50%, -50%) scale(.94) rotate(0); filter: brightness(1.6); }
  16% { transform: translate(-48%, -52%) scale(1.04); } 22% { transform: translate(-52%, -49%) scale(1); filter: none; }
  28% { transform: translate(-50%, -50%); } 80% { opacity: 1; transform: translate(-50%, -50%); }
  100% { opacity: 0; transform: translate(-30%, -50%) skewX(-20deg); } }
@keyframes vb-bar { 0% { transform: skewX(-24deg) scaleX(0); } 14% { transform: skewX(-24deg) scaleX(1.05); } 80% { opacity: 1; } 100% { opacity: 0; transform: skewX(-24deg) scaleX(1.2); } }

/* ---------------------------------------------------------------- banner, results, defeat */
.vb-banner { position: absolute; left: 0; right: 0; top: 30%; display: flex; justify-content: center; pointer-events: none; }
.vb-banner > div { padding: 12px 60px; font: 600 19px/1.3 var(--vp-font-ui); letter-spacing: .1em; color: #fff; text-align: center; max-width: 92vw;
  background: linear-gradient(90deg, rgba(8,13,26,0), rgba(8,13,26,.9) 15%, rgba(8,13,26,.9) 85%, rgba(8,13,26,0)); animation: vb-banner var(--d, 1.2s) var(--vp-ease-out) forwards; position: relative; }
.vb-banner > div::before, .vb-banner > div::after { content: ''; position: absolute; left: 10%; right: 10%; height: 1px; background: linear-gradient(90deg, transparent, var(--c, rgba(190,236,255,.8)), transparent); }
.vb-banner > div::before { top: 0; } .vb-banner > div::after { bottom: 0; }
.vb-banner .danger { --c: #ff3b4e; color: #ffd6da; text-shadow: 0 0 12px rgba(255,59,78,.7); }
@keyframes vb-banner { 0% { opacity: 0; transform: scaleY(.2); } 10% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; } }

.vb-root.is-ending .vb-top, .vb-root.is-ending .vb-party, .vb-root.is-ending .vb-act { opacity: 0; transition: opacity .5s; pointer-events: none; }
.vb-res { position: absolute; left: max(18px, 4vw); top: 50%; width: min(640px, 52vw); max-height: calc(100% - 28px); transform: translateY(-50%);
  display: flex; flex-direction: column; animation: vb-res-in .45s var(--vp-ease-out); }
@keyframes vb-res-in { from { opacity: 0; transform: translate(-24px, -50%); } }
.vb-res-hd { position: relative; padding: 18px 26px 14px; border-bottom: 1px solid var(--vp-line-dim); display: flex; align-items: flex-end; gap: 18px;
  background: linear-gradient(90deg, rgba(255,197,96,.12), rgba(255,197,96,0) 60%); }
.vb-res-hd h2 { margin: 6px 0 0; font: 800 38px/1 var(--vp-font-display); letter-spacing: .3em; color: #fff; text-shadow: 0 0 18px rgba(255,197,96,.55); }
.vb-res-hd .vp-cap { color: var(--vp-amber); }
.vb-gains { margin-left: auto; display: flex; gap: 22px; }
.vb-gain { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.vb-gain b { font: 700 24px/1 var(--vp-font-display); color: #fff; }
.vb-gain b.cr { color: var(--vp-amber); }
.vb-res-items { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 26px; border-bottom: 1px solid rgba(140,214,255,.1); }
.vb-res-items .it { display: inline-flex; align-items: center; gap: 8px; font: 600 15px var(--vp-font-ui); letter-spacing: .06em; }
.vb-res-items img { width: 32px; height: 32px; }
.vb-res-party { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 18px; padding: 12px 22px; overflow-y: auto; }
.vb-rm { --acc: var(--vp-cyan); display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px 6px; }
.vb-rm.is-ko { opacity: .5; }
.vb-rm .vb-l1 { margin: 0 0 6px; }
.vb-rm .lv { margin-left: auto; font: 600 13px/1 var(--vp-font-display); letter-spacing: .1em; color: var(--vp-ink-dim); }
.vb-rm .lv b { font-size: 18px; color: #fff; }
.vb-rm .vp-bar { height: 5px; }
.vb-up { display: none; margin-top: 7px; font: 600 12px/1.4 var(--vp-font-ui); letter-spacing: .08em; color: #9fe8c4; }
.vb-rm.is-up .vb-up { display: block; animation: vb-res-in .4s var(--vp-ease-out) both; }
.vb-lvup { display: none; padding: 2px 6px; font: 700 11px/1 var(--vp-font-display); letter-spacing: .18em; color: #05070d; background: var(--vp-amber); box-shadow: 0 0 10px rgba(255,197,96,.6); }
.vb-rm.is-up .vb-lvup { display: inline-block; animation: vb-lvpop .5s var(--vp-ease-out) both; }

.vb-res-ft { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 10px 22px 14px; border-top: 1px solid var(--vp-line-dim);

.vb-defeat { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(80% 70% at 50% 50%, rgba(40,4,12,.55), rgba(3,2,6,.92));

  animation: vb-fade-in 1.4s .3s ease-out both; }
.vb-defeat p { margin: 16px 0 0; font: 500 15px var(--vp-font-ui); letter-spacing: .3em; color: var(--vp-ink-dim); text-transform: uppercase; animation: vb-fade-in 1.2s .9s ease-out both; }
@keyframes vb-fade-in { from { opacity: 0; } }

.vb-root.is-frozen *, .vb-root.is-frozen *::before, .vb-root.is-frozen *::after { animation-play-state: paused !important; }

/* ---------------------------------------------------------------- compact (portrait phones) */
.vb-root.is-compact .vb-top { flex-direction: column; gap: 8px; left: 8px; right: 8px; top: calc(8px + var(--vp-safe-top)); }

.vb-root.is-compact .vb-res-party { grid-template-columns: 1fr; padding: 6px 14px; }

/* touch buttons sit to the right of the command menu, above the status grid */
@media (max-aspect-ratio: 9/10) {
  .vp-touch[data-ctx="battle"] .vp-tc-a { right: calc(14px + var(--vp-safe-right)); bottom: calc(var(--vb-panel, 150px) + 22px + var(--vp-safe-bottom)); width: 70px; height: 70px; }
