<title>Rustfist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Layout: one-screen arcade cabinet. Header strip, the game screen centred in a rusted bezel,
   then either a keyboard legend (desktop) or a thumb pad (touch). Single dark world by design. */
:root {
  --ground: #0e0a08;      /* scorched night */
  --bezel: #2a1d15;       /* rusted steel */
  --bezel-hi: #4a3424;
  --ink: #e9d9bf;         /* bleached bone */
  --dim: #9c8670;
  --hazard: #f2a31b;      /* sodium flare */
  --blood: #c23b22;
  --font-display: "Rubik Dirt", "Impact", "Haettenschweiler", "Arial Black", sans-serif;
  --font-mono: "Share Tech Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-mono);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  display: flex; flex-direction: column;
  padding-inline: 16px; padding-block: 8px;
  gap: 8px;
  box-sizing: border-box;
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(242, 163, 27, 0.07), transparent 60%),
    var(--ground);
}
header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  flex: none;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(18px, 3.4vw, 28px);
  letter-spacing: 0.04em;
  color: var(--hazard);
  line-height: 1;
  text-shadow: 0 2px 0 #000;
}
h1 span { color: var(--ink); }
.tools { display: flex; gap: 8px; }
.tools button {
  font: inherit; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink); background: var(--bezel);
  border: 1px solid var(--bezel-hi); border-radius: 3px;
  padding: 6px 10px; cursor: pointer;
}
.tools button:hover { border-color: var(--hazard); }
.tools button:focus-visible { outline: 2px solid var(--hazard); outline-offset: 2px; }
canvas#screen:focus { outline: none; }
canvas#screen:focus-visible { outline: 2px solid var(--hazard); outline-offset: 2px; }
.stage {
  flex: 1 1 auto; min-height: 0;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.screen-wrap {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
}
canvas#screen {
  display: block;
  image-rendering: pixelated; image-rendering: crisp-edges;
  background: #000;
  border: 3px solid var(--bezel);
  box-shadow: 0 0 0 1px var(--bezel-hi), 0 12px 40px rgba(0,0,0,0.7);
  touch-action: none;
}
.legend {
  flex: none;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px;
  font-size: 12px; color: var(--dim); letter-spacing: 0.04em;
}
.legend b { color: var(--ink); font-weight: 400; }
kbd {
  font: inherit; color: var(--ink);
  border: 1px solid var(--bezel-hi); border-bottom-width: 2px; border-radius: 3px;
  padding: 0 4px; background: var(--bezel);
}
/* ---- touch pad ---- */
.pad { display: none; }
body.touch .legend { display: none; }
body.touch .pad {
  flex: none;
  display: flex; justify-content: space-between; align-items: center;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  touch-action: none;
}
.dpad {
  position: relative;
  width: min(40vw, 168px); aspect-ratio: 1; max-width: 100%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--bezel-hi) 0 18%, var(--bezel) 19% 100%);
  border: 2px solid var(--bezel-hi);
  touch-action: none;
}
.dpad::before, .dpad::after {
  content: ""; position: absolute; left: 50%; top: 50%;
  background: rgba(0,0,0,0.35); border-radius: 4px;
  transform: translate(-50%, -50%);
}
.dpad::before { width: 30%; height: 82%; }
.dpad::after { width: 82%; height: 30%; }
.dpad.on { border-color: var(--hazard); }
.btns { display: grid; grid-template-columns: repeat(2, auto); gap: 10px 12px; align-items: center; }
.btn {
  width: min(17vw, 70px); aspect-ratio: 1;
  border-radius: 50%;
  border: 2px solid var(--bezel-hi);
  background: var(--bezel);
  color: var(--ink);
  font: inherit; font-size: 12px; letter-spacing: 0.06em;
  display: flex; align-items: center; justify-content: center;
  touch-action: none;
}
.btn.atk { background: #5b1f14; border-color: var(--blood); grid-row: span 2; width: min(21vw, 86px); }
.btn.jmp { background: #3a2b12; border-color: #8a6420; }
.btn.spc { background: #1c2b26; border-color: #3f6b5b; }
.btn.on { filter: brightness(1.6); transform: scale(0.95); }
.btn.start {
  width: auto; aspect-ratio: auto; border-radius: 3px; padding: 4px 10px; font-size: 11px;
  grid-column: span 2; justify-self: center;
}
@media (orientation: portrait) {
  /* phones held upright: screen pinned under the header, thumb pad fills the rest */
  body.touch .stage { flex: 0 0 auto; height: calc((100vw - 32px) * 0.5625 + 6px); }
  body.touch .pad { flex: 1 1 auto; align-items: center; }
}
.tools button { white-space: nowrap; }
@media (max-width: 480px) {
  .tools button { padding: 5px 8px; font-size: 11px; }
}
@media (orientation: landscape) {
  /* phones held sideways: the pad sits in the bottom corners and the screen is sized to fit
     between the two clusters, so no control ever covers the play band */
  body.touch {
    --dpad-w: min(28vh, 150px);
    --btn-w: min(13vh, 60px);
    --atk-w: min(16vh, 74px);
  }
  body.touch .pad {
    position: absolute; left: 16px; right: 16px; bottom: 8px;
    pointer-events: none; opacity: 0.85;
  }
  body.touch .pad > * { pointer-events: auto; }
  body.touch .dpad { width: var(--dpad-w); }
  body.touch .btn { width: var(--btn-w); }
  body.touch .btn.atk { width: var(--atk-w); }
  body.touch .btns { column-gap: 12px; }
  body.touch .screen-wrap {
    width: auto; flex: 1 1 auto; min-width: 0;
    margin-left: calc(var(--dpad-w) + 12px);
    margin-right: calc(var(--btn-w) + var(--atk-w) + 24px);
  }
  /* PAUSE moves to the top-right corner, clear of the floor */
  body.touch .btn.start {
    position: fixed; top: 8px; right: 16px;
    width: auto; min-width: 44px; height: 28px; padding: 0 10px;
  }
  body.touch header { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .btn.on { transform: none; }
}
</style>

<div class="app">
  <header>
    <h1>Rust<span>fist</span></h1>
    <div class="tools">
      <button id="btn-sound" type="button" aria-pressed="false">Sound on</button>
      <button id="btn-full" type="button">Fullscreen</button>
    </div>
  </header>
  <div class="stage" id="stage">
    <div class="screen-wrap"><canvas id="screen" width="384" height="216" tabindex="0" aria-label="Game screen"></canvas></div>
  </div>
  <div class="legend" aria-label="Controls">
    <span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> or <kbd>WASD</kbd> <b>move</b></span>
    <span><kbd>J</kbd> <b>attack</b></span>
    <span><kbd>K</kbd> <b>jump</b></span>
    <span><kbd>L</kbd> <b>special / throw</b></span>
    <span><kbd>→</kbd><kbd>→</kbd> <b>run</b></span>
    <span>walk into foes <b>grab</b></span>
    <span><kbd>Enter</kbd> <b>pause</b></span>
    <span><kbd>M</kbd> <b>mute</b></span>
  </div>
  <div class="pad" id="pad" aria-hidden="true">
    <div class="dpad" data-dpad></div>
    <div class="btns">
      <div class="btn spc" data-act="special">SPEC</div>
      <div class="btn atk" data-act="attack">HIT</div>
      <div class="btn jmp" data-act="jump">JUMP</div>
      <div class="btn start" data-act="start">PAUSE</div>
    </div>
  </div>
</div>

<script>
