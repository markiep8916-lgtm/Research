<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rustfist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Layout: one-screen arcade cabinet. Header strip, the game screen centred in a rusted bezel,
   then either a keyboard legend (desktop) or a thumb pad (touch). Single dark world by design. */
:root {
  --ground: #0e0a08;      /* scorched night */
  --bezel: #2a1d15;       /* rusted steel */
  --bezel-hi: #4a3424;
  --ink: #e9d9bf;         /* bleached bone */
  --dim: #9c8670;
  --hazard: #f2a31b;      /* sodium flare */
  --blood: #c23b22;
  --font-display: "Rubik Dirt", "Impact", "Haettenschweiler", "Arial Black", sans-serif;
  --font-mono: "Share Tech Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-mono);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  display: flex; flex-direction: column;
  padding-inline: 16px; padding-block: 8px;
  gap: 8px;
  box-sizing: border-box;
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(242, 163, 27, 0.07), transparent 60%),
    var(--ground);
}
header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  flex: none;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(18px, 3.4vw, 28px);
  letter-spacing: 0.04em;
  color: var(--hazard);
  line-height: 1;
  text-shadow: 0 2px 0 #000;
}
h1 span { color: var(--ink); }
.tools { display: flex; gap: 8px; }
.tools button {
  font: inherit; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink); background: var(--bezel);
  border: 1px solid var(--bezel-hi); border-radius: 3px;
  padding: 6px 10px; cursor: pointer;
}
.tools button:hover { border-color: var(--hazard); }
.tools button:focus-visible { outline: 2px solid var(--hazard); outline-offset: 2px; }
/* the game reads keys on the window, so the canvas shows a focus ring only while navigating by Tab */
canvas#screen:focus { outline: none; }
body.kbnav canvas#screen:focus { outline: 2px solid var(--hazard); outline-offset: -2px; }
.stage {
  flex: 1 1 auto; min-height: 0;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.screen-wrap {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
}
canvas#screen {
  display: block;
  image-rendering: pixelated; image-rendering: crisp-edges;
  background: #000;
  border: 3px solid var(--bezel);
  box-shadow: 0 0 0 1px var(--bezel-hi), 0 12px 40px rgba(0,0,0,0.7);
  touch-action: none;
}
.legend {
  flex: none;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px;
  font-size: 12px; color: var(--dim); letter-spacing: 0.04em;
}
.legend b { color: var(--ink); font-weight: 400; }
kbd {
  font: inherit; color: var(--ink);
  border: 1px solid var(--bezel-hi); border-bottom-width: 2px; border-radius: 3px;
  padding: 0 4px; background: var(--bezel);
}
/* ---- touch pad ---- */
.pad { display: none; }
body.touch .legend { display: none; }
body.touch .pad {
  flex: none;
  display: flex; justify-content: space-between; align-items: center;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  touch-action: none;
}
.dpad {
  position: relative;
  width: min(40vw, 168px); aspect-ratio: 1; max-width: 100%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--bezel-hi) 0 18%, var(--bezel) 19% 100%);
  border: 2px solid var(--bezel-hi);
  touch-action: none;
}
.dpad::before, .dpad::after {
  content: ""; position: absolute; left: 50%; top: 50%;
  background: rgba(0,0,0,0.35); border-radius: 4px;
  transform: translate(-50%, -50%);
}
.dpad::before { width: 30%; height: 82%; }
.dpad::after { width: 82%; height: 30%; }
.dpad.on { border-color: var(--hazard); }
.btns { display: grid; grid-template-columns: repeat(2, auto); gap: 10px 12px; align-items: center; }
.btn {
  width: min(17vw, 70px); aspect-ratio: 1;
  border-radius: 50%;
  border: 2px solid var(--bezel-hi);
  background: var(--bezel);
  color: var(--ink);
  font: inherit; font-size: 12px; letter-spacing: 0.06em;
  display: flex; align-items: center; justify-content: center;
  touch-action: none;
}
.btn.atk { background: #5b1f14; border-color: var(--blood); grid-row: span 2; width: min(21vw, 86px); }
.btn.jmp { background: #3a2b12; border-color: #8a6420; }
.btn.spc { background: #1c2b26; border-color: #3f6b5b; }
.btn.on { filter: brightness(1.6); transform: scale(0.95); }
.btn.start {
  width: auto; aspect-ratio: auto; border-radius: 3px; padding: 4px 10px; font-size: 11px;
  grid-column: span 2; justify-self: center;
}
@media (orientation: portrait) {
  /* phones held upright: screen pinned under the header, thumb pad fills the rest */
  body.touch .stage { flex: 0 0 auto; height: calc((100vw - 32px) * 0.5625 + 6px); }
  body.touch .pad { flex: 1 1 auto; align-items: center; }
}
.tools button { white-space: nowrap; }
@media (max-width: 480px) {
  .tools button { padding: 5px 8px; font-size: 11px; }
}
@media (orientation: landscape) {
  /* phones held sideways: the pad sits in the bottom corners and the screen is sized to fit
     between the two clusters, so no control ever covers the play band */
  body.touch {
    --dpad-w: min(28vh, 150px);
    --btn-w: min(13vh, 60px);
    --atk-w: min(16vh, 74px);
  }
  body.touch .pad {
    position: absolute; left: 16px; right: 16px; bottom: 8px;
    pointer-events: none; opacity: 0.85;
  }
  body.touch .pad > * { pointer-events: auto; }
  body.touch .dpad { width: var(--dpad-w); }
  body.touch .btn { width: var(--btn-w); }
  body.touch .btn.atk { width: var(--atk-w); }
  body.touch .btns { column-gap: 12px; }
  body.touch .screen-wrap {
    width: auto; flex: 1 1 auto; min-width: 0;
    margin-left: calc(var(--dpad-w) + 12px);
    margin-right: calc(var(--btn-w) + var(--atk-w) + 24px);
  }
  /* PAUSE moves to the top-right corner, clear of the floor */
  body.touch .btn.start {
    position: fixed; top: 8px; right: 16px;
    width: auto; min-width: 44px; height: 28px; padding: 0 10px;
  }
  /* the header shrinks to a column of small Sound / Fullscreen buttons in the top-left gutter */
  body.touch header { position: fixed; top: 8px; left: 16px; z-index: 3; }
  body.touch header h1 { display: none; }
  body.touch .tools { flex-direction: column; align-items: flex-start; gap: 6px; }
  body.touch .tools button { padding: 4px 6px; font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .btn.on { transform: none; }
}
</style>

<div class="app">
  <header>
    <h1>Rust<span>fist</span></h1>
    <div class="tools">
      <button id="btn-sound" type="button" aria-pressed="false">Sound on</button>
      <button id="btn-full" type="button">Fullscreen</button>
    </div>
  </header>
  <div class="stage" id="stage">
    <div class="screen-wrap"><canvas id="screen" width="384" height="216" tabindex="0" aria-label="Game screen"></canvas></div>
  </div>
  <div class="legend" aria-label="Controls">
    <span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> or <kbd>WASD</kbd> <b>move</b></span>
    <span><kbd>J</kbd> <b>attack</b></span>
    <span><kbd>K</kbd> <b>jump</b></span>
    <span><kbd>L</kbd> <b>special / throw</b></span>
    <span><kbd>→</kbd><kbd>→</kbd> <b>run</b></span>
    <span>walk into foes <b>grab</b></span>
    <span><kbd>Enter</kbd> <b>pause</b></span>
    <span><kbd>M</kbd> <b>mute</b></span>
  </div>
  <div class="pad" id="pad" aria-hidden="true">
    <div class="dpad" data-dpad></div>
    <div class="btns">
      <div class="btn spc" data-act="special">SPEC</div>
      <div class="btn atk" data-act="attack">HIT</div>
      <div class="btn jmp" data-act="jump">JUMP</div>
      <div class="btn start" data-act="start">PAUSE</div>
    </div>
  </div>
</div>

<script>

// ---- 00_core.js ----
'use strict';
// Core: constants, math, seeded RNG, input (keyboard, touch, gamepad), bitmap font, screen.

const W = 384, H = 216;           // internal resolution
// Content registries, declared first so every content module can fill them while the script loads.
const STAGES = [];                                   // stage modules assign STAGES[0..2]
const STORY = { intro: [], between: [], ending: [] }; // story cards
const STEP = 1 / 60;              // fixed simulation step

// ---------- math ----------
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => (v < 0 ? -1 : v > 0 ? 1 : 0);
const approach = (v, target, amt) => (v < target ? Math.min(v + amt, target) : Math.max(v - amt, target));
const easeOut = t => 1 - (1 - t) * (1 - t);
const TAU = Math.PI * 2;

// Seeded RNG (mulberry32) so runs are reproducible in tests.
let _seed = 0x9e3779b9;
function seedRng(s) { _seed = s >>> 0; }
function rand() {
  _seed = (_seed + 0x6d2b79f5) >>> 0;
  let t = _seed;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rr = (a, b) => a + rand() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = arr => arr[Math.floor(rand() * arr.length)];
const chance = p => rand() < p;

// ---------- storage (best effort, never required) ----------
const Store = {
  get(k, d) { try { const v = localStorage.getItem('wb_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('wb_' + k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },
};

// ---------- input ----------
const ACTIONS = ['left', 'right', 'up', 'down', 'attack', 'jump', 'special', 'start'];
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down',
  KeyJ: 'attack', KeyZ: 'attack',
  KeyK: 'jump', KeyX: 'jump', Space: 'jump',
  KeyL: 'special', KeyC: 'special',
  Enter: 'start', Escape: 'start', KeyP: 'start',
};

const Input = {
  key: {}, touch: {}, pad: {},
  latch: {},           // presses seen since the last step, so a tap shorter than a frame still counts
  cur: {}, prev: {},
  tapTime: { left: -99, right: -99 },
  tapPrev: { left: -99, right: -99 },
  frame: 0,
  anyPressed: false,
  tap: false,          // a tap on the game screen outside play: one frame of 'attack'
  lastDevice: 'keyboard',
  init(target) {
    window.addEventListener('keydown', e => {
      const a = KEYMAP[e.code];
      if (!a) return;
      // let Enter/Space activate a focused page button (Sound, Fullscreen) instead of the game
      if (e.target && e.target.closest && e.target.closest('button')) return;
      e.preventDefault();
      this.key[a] = true;
      if (!e.repeat) this.latch[a] = true;
      this.lastDevice = 'keyboard';
    });
    window.addEventListener('keyup', e => {
      const a = KEYMAP[e.code];
      if (!a) return;
      this.key[a] = false;
      if (e.target && e.target.closest && e.target.closest('button')) return;   // Space clicks on keyup
      e.preventDefault();
    });
    window.addEventListener('blur', () => { this.key = {}; this.touch = {}; this.latch = {}; });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { this.key = {}; this.touch = {}; } });
  },
  // Bind on-screen buttons. Each element carries data-act="left" etc. A d-pad element uses data-dpad.
  bindTouch(root) {
    const pointers = new Map(); // pointerId -> { el, acts }
    const actsAt = (el, x, y) => {
      if (!el) return [];
      if (el.dataset.dpad != null) {
        const r = el.getBoundingClientRect();
        const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
        const dead = r.width * 0.16, out = [];
        if (dx < -dead) out.push('left');
        if (dx > dead) out.push('right');
        if (dy < -dead) out.push('up');
        if (dy > dead) out.push('down');
        return out;
      }
      return el.dataset.act ? [el.dataset.act] : [];
    };
    const handle = e => {
      const el = e.target.closest('[data-act],[data-dpad]');
      if (e.type === 'pointerdown') {
        if (!el) return;
        e.preventDefault();
        try { e.target.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        pointers.set(e.pointerId, { el, acts: actsAt(el, e.clientX, e.clientY) });
        for (const a of pointers.get(e.pointerId).acts) this.latch[a] = true;
        this.lastDevice = 'touch';
      } else if (e.type === 'pointermove') {
        const p = pointers.get(e.pointerId);
        if (!p) return;
        e.preventDefault();
        // a thumb sliding between action buttons presses the new one; d-pad and PAUSE fingers stay put
        if (p.el.dataset.dpad == null && p.el.dataset.act !== 'start') {
          const hit = document.elementFromPoint(e.clientX, e.clientY);
          const nel = hit && hit.closest('[data-act]:not([data-act="start"])');
          if (nel && root.contains(nel)) p.el = nel;
        }
        p.acts = actsAt(p.el, e.clientX, e.clientY);
      } else {
        pointers.delete(e.pointerId);
      }
      const t = {};
      for (const p of pointers.values()) for (const a of p.acts) t[a] = true;
      this.touch = t;
      root.querySelectorAll('[data-act],[data-dpad]').forEach(b => {
        const on = b.dataset.dpad != null ? ['left', 'right', 'up', 'down'].some(a => t[a]) : !!t[b.dataset.act];
        b.classList.toggle('on', on);
      });
    };
    ['pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'lostpointercapture'].forEach(type =>
      root.addEventListener(type, handle, { passive: false }));
    root.addEventListener('contextmenu', e => e.preventDefault());
  },
  pollPad() {
    this.pad = {};
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of pads) {
      if (!gp || !gp.connected) continue;
      const b = i => gp.buttons[i] && gp.buttons[i].pressed;
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      const p = this.pad;
      p.left = p.left || ax < -0.4 || b(14);
      p.right = p.right || ax > 0.4 || b(15);
      p.up = p.up || ay < -0.4 || b(12);
      p.down = p.down || ay > 0.4 || b(13);
      p.attack = p.attack || b(2) || b(3);
      p.jump = p.jump || b(0);
      p.special = p.special || b(1) || b(5);
      p.start = p.start || b(9);
      if (ACTIONS.some(a => p[a])) this.lastDevice = 'gamepad';
    }
  },
  // Called once per simulation step.
  update() {
    this.frame++;
    this.pollPad();
    this.prev = this.cur;
    const c = {};
    let any = false;
    for (const a of ACTIONS) {
      c[a] = !!(this.key[a] || this.touch[a] || this.pad[a] || this.latch[a]);
      if (a === 'attack' && this.tap) { c[a] = c[a] || !this.prev[a]; this.tap = false; }
      if (c[a] && !this.prev[a]) any = true;
    }
    this.cur = c;
    this.latch = {};
    this.anyPressed = any;
    for (const d of ['left', 'right']) {
      if (this.pressed(d)) { this.tapPrev[d] = this.tapTime[d]; this.tapTime[d] = this.frame; }
    }
  },
  down(a) { return !!this.cur[a]; },
  pressed(a) { return !!this.cur[a] && !this.prev[a]; },
  released(a) { return !this.cur[a] && !!this.prev[a]; },
  // True on the frame a direction is tapped twice within `win` frames.
  doubleTap(d, win = 14) { return this.pressed(d) && this.tapTime[d] - this.tapPrev[d] <= win; },
  dirX() { return (this.down('right') ? 1 : 0) - (this.down('left') ? 1 : 0); },
  dirY() { return (this.down('down') ? 1 : 0) - (this.down('up') ? 1 : 0); },
  clear() { this.key = {}; this.touch = {}; this.cur = {}; this.prev = {}; this.tap = false; this.latch = {}; },
};

// ---------- 5x7 bitmap font ----------
const GLYPHS = {
  A: [14, 17, 17, 31, 17, 17, 17], B: [30, 17, 17, 30, 17, 17, 30], C: [14, 17, 16, 16, 16, 17, 14],
  D: [30, 17, 17, 17, 17, 17, 30], E: [31, 16, 16, 30, 16, 16, 31], F: [31, 16, 16, 30, 16, 16, 16],
  G: [14, 17, 16, 23, 17, 17, 15], H: [17, 17, 17, 31, 17, 17, 17], I: [14, 4, 4, 4, 4, 4, 14],
  J: [7, 2, 2, 2, 2, 18, 12], K: [17, 18, 20, 24, 20, 18, 17], L: [16, 16, 16, 16, 16, 16, 31],
  M: [17, 27, 21, 21, 17, 17, 17], N: [17, 17, 25, 21, 19, 17, 17], O: [14, 17, 17, 17, 17, 17, 14],
  P: [30, 17, 17, 30, 16, 16, 16], Q: [14, 17, 17, 17, 21, 18, 13], R: [30, 17, 17, 30, 20, 18, 17],
  S: [15, 16, 16, 14, 1, 1, 30], T: [31, 4, 4, 4, 4, 4, 4], U: [17, 17, 17, 17, 17, 17, 14],
  V: [17, 17, 17, 17, 17, 10, 4], W: [17, 17, 17, 21, 21, 21, 10], X: [17, 17, 10, 4, 10, 17, 17],
  Y: [17, 17, 17, 10, 4, 4, 4], Z: [31, 1, 2, 4, 8, 16, 31],
  0: [14, 17, 19, 21, 25, 17, 14], 1: [4, 12, 4, 4, 4, 4, 14], 2: [14, 17, 1, 2, 4, 8, 31],
  3: [31, 2, 4, 2, 1, 17, 14], 4: [2, 6, 10, 18, 31, 2, 2], 5: [31, 16, 30, 1, 1, 17, 14],
  6: [6, 8, 16, 30, 17, 17, 14], 7: [31, 1, 2, 4, 8, 8, 8], 8: [14, 17, 17, 14, 17, 17, 14],
  9: [14, 17, 17, 15, 1, 2, 12],
  ' ': [0, 0, 0, 0, 0, 0, 0], '!': [4, 4, 4, 4, 4, 0, 4], '?': [14, 17, 1, 2, 4, 0, 4],
  '.': [0, 0, 0, 0, 0, 0, 4], ',': [0, 0, 0, 0, 0, 4, 8], ':': [0, 4, 4, 0, 4, 4, 0],
  '-': [0, 0, 0, 14, 0, 0, 0], "'": [4, 4, 8, 0, 0, 0, 0], '/': [1, 1, 2, 4, 8, 16, 16],
  '+': [0, 4, 4, 31, 4, 4, 0], '>': [8, 4, 2, 1, 2, 4, 8], '<': [2, 4, 8, 16, 8, 4, 2],
  '(': [2, 4, 8, 8, 8, 4, 2], ')': [8, 4, 2, 2, 2, 4, 8], '%': [24, 25, 2, 4, 8, 19, 3],
  '#': [10, 10, 31, 10, 31, 10, 10], '=': [0, 0, 31, 0, 31, 0, 0], '*': [0, 4, 21, 14, 21, 4, 0],
  '"': [10, 10, 0, 0, 0, 0, 0], '&': [12, 18, 20, 8, 21, 18, 13], '_': [0, 0, 0, 0, 0, 0, 31],
  '~': [0, 0, 8, 21, 2, 0, 0], '^': [4, 10, 17, 0, 0, 0, 0],
};
// Render glyphs once into an atlas per colour for speed.
const _fontCache = new Map();
function glyphAtlas(color) {
  let c = _fontCache.get(color);
  if (c) return c;
  const keys = Object.keys(GLYPHS);
  const cv = document.createElement('canvas');
  cv.width = keys.length * 6; cv.height = 7;
  const g = cv.getContext('2d');
  g.fillStyle = color;
  const index = {};
  keys.forEach((k, i) => {
    index[k] = i;
    GLYPHS[k].forEach((row, y) => {
      for (let x = 0; x < 5; x++) if (row & (16 >> x)) g.fillRect(i * 6 + x, y, 1, 1);
    });
  });
  c = { cv, index };
  _fontCache.set(color, c);
  return c;
}
function textWidth(str, scale = 1) { return str.length ? (str.length * 6 - 1) * scale : 0; }
// align: 'left' | 'center' | 'right'. shadow: colour for a 1px drop shadow (or null).
function drawText(ctx, str, x, y, color = '#fff', scale = 1, align = 'left', shadow = '#000') {
  str = String(str).toUpperCase();
  const w = textWidth(str, scale);
  let px = Math.round(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x);
  const py = Math.round(y);
  if (shadow) drawTextRaw(ctx, str, px + scale, py + scale, shadow, scale);
  drawTextRaw(ctx, str, px, py, color, scale);
}
function drawTextRaw(ctx, str, px, py, color, scale) {
  const { cv, index } = glyphAtlas(color);
  for (let i = 0; i < str.length; i++) {
    const gi = index[str[i]];
    if (gi != null) ctx.drawImage(cv, gi * 6, 0, 5, 7, px + i * 6 * scale, py, 5 * scale, 7 * scale);
  }
}

// ---------- screen ----------
const Screen = {
  view: null, vctx: null,          // visible canvas
  buf: null, ctx: null,            // internal 384x216 buffer
  init(view) {
    this.view = view;
    this.vctx = view.getContext('2d');
    this.buf = document.createElement('canvas');
    this.buf.width = W; this.buf.height = H;
    this.ctx = this.buf.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
    const fit = () => this.fit();
    window.addEventListener('resize', fit);
    if (window.ResizeObserver) new ResizeObserver(fit).observe(view.parentElement);
    this.fit();
  },
  fit() {
    const box = this.view.parentElement.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const bw = 6;                    // the canvas carries a 3 px bezel border on each side
    let cw = box.width - bw, ch = cw * H / W;
    if (box.height > 0 && ch > box.height - bw) { ch = box.height - bw; cw = ch * W / H; }
    cw = Math.max(1, Math.floor(cw)); ch = Math.max(1, Math.floor(ch));
    this.view.style.width = cw + 'px';
    this.view.style.height = ch + 'px';
    const pw = Math.round(cw * dpr), ph = Math.round(ch * dpr);
    if (this.view.width !== pw || this.view.height !== ph) { this.view.width = pw; this.view.height = ph; }
  },
  present() {
    const v = this.vctx;
    v.imageSmoothingEnabled = false;
    v.drawImage(this.buf, 0, 0, this.view.width, this.view.height);
  },
};

// ---- 10_audio.js ----
// Audio: synthesized SFX and a small step sequencer for music. Everything is WebAudio; no samples.

const Sound = {
  ctx: null, master: null, sfxBus: null, musicBus: null, comp: null,
  noiseBuf: null, shaper: null,
  muted: Store.get('muted', false),
  song: null, songName: null, nextStepTime: 0, step: 0, timer: null,
  lastPlay: {},
  pm: 1,             // pitch multiplier applied to SFX voices

  // Must be called from a user gesture.
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    const c = this.ctx;
    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value = -14; this.comp.ratio.value = 4;
    this.master = c.createGain();
    this.master.gain.value = this.muted ? 0 : 0.8;
    this.sfxBus = c.createGain(); this.sfxBus.gain.value = 0.7;
    this.musicBus = c.createGain(); this.musicBus.gain.value = 0.32;
    this.musicLP = c.createBiquadFilter(); this.musicLP.type = 'lowpass'; this.musicLP.frequency.value = 20000;
    this.sfxBus.connect(this.comp); this.musicBus.connect(this.musicLP); this.musicLP.connect(this.comp);
    this.comp.connect(this.master); this.master.connect(c.destination);
    // 1s of white noise shared by every noise voice
    const len = c.sampleRate;
    this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    // soft clipper for crunchy hits
    this.shaper = c.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 3); }
    this.shaper.curve = curve;
    this.shaper.connect(this.sfxBus);
    if (this.songName) this.playSong(this.songName, true);
  },
  toggleMute() {
    this.muted = !this.muted;
    Store.set('muted', this.muted);
    if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : 0.8, this.ctx.currentTime, 0.02);
    return this.muted;
  },
  ok() { return this.ctx && this.ctx.state === 'running'; },

  // ---- voices ----
  out(pan, crunch) {
    const c = this.ctx;
    const dest = crunch ? this.shaper : this.sfxBus;
    if (pan && c.createStereoPanner) {
      const p = c.createStereoPanner();
      p.pan.value = clamp(pan, -1, 1);
      p.connect(dest);
      return p;
    }
    return dest;
  },
  tone(f0, f1, dur, type = 'square', vol = 0.3, t = 0, dest = null, attack = 0.003) {
    const c = this.ctx, now = c.currentTime + t;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    const pm = this.pm;
    o.frequency.setValueAtTime(Math.max(20, f0 * pm), now);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1 * pm), now + dur);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(vol, now + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g); g.connect(dest || this.sfxBus);
    o.start(now); o.stop(now + dur + 0.02);
    return o;
  },
  noise(dur, vol = 0.3, freq = 1000, q = 1, ftype = 'bandpass', t = 0, dest = null, f1 = 0) {
    const c = this.ctx, now = c.currentTime + t;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    s.loop = true;
    const f = c.createBiquadFilter();
    f.type = ftype; f.frequency.setValueAtTime(freq * this.pm, now); f.Q.value = q;
    if (f1) f.frequency.exponentialRampToValueAtTime(Math.max(30, f1 * this.pm), now + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.sfxBus);
    s.start(now, Math.random() * 0.5); s.stop(now + dur + 0.02);
  },

  // ---- sound effects ----
  // x: world-space x of the source, used for stereo pan relative to the camera.
  // pitch: extra multiplier (combo climb); every SFX also gets +/-6% random pitch.
  sfx(name, x, pitch = 1) {
    if (!this.ok()) return;
    const now = this.ctx.currentTime;
    if (this.lastPlay[name] && now - this.lastPlay[name] < 0.035) return;
    this.lastPlay[name] = now;
    const pan = x == null || !Game.cam ? 0 : clamp((x - Game.cam.x - W / 2) / (W / 2), -1, 1) * 0.6;
    const fn = SFX[name];
    if (!fn) return;
    this.pm = pitch * (0.94 + Math.random() * 0.12);
    try { fn(this, pan); } finally { this.pm = 1; }
  },
  // Sweep the music lowpass (sandstorm, pause). 20000 = open.
  // temp = a passing change (pause) that resume() undoes; otherwise freq becomes the stage's base cutoff.
  baseHz: 20000,
  musicFilter(freq, sec = 1, temp) {
    if (!temp) this.baseHz = freq;
    if (!this.ctx) return;
    const f = this.musicLP.frequency, t = this.ctx.currentTime;
    f.cancelScheduledValues(t); f.setValueAtTime(f.value, t); f.exponentialRampToValueAtTime(Math.max(60, freq), t + sec);
  },
  // Duck the music bus briefly (heavy hits).
  // Never during a fade-out: re-raising the gain would bring a dying song back.
  duck(level = 0.5, sec = 0.15) {
    if (!this.ok() || !this.song || this.fading) return;
    const g = this.musicBus.gain, t = this.ctx.currentTime, full = 0.32 * this.level;
    g.cancelScheduledValues(t);
    g.setValueAtTime(full * level, t);
    g.linearRampToValueAtTime(full, t + sec + 0.35);
  },
  // Overall music level (1 in play, 0.4 while paused).
  level: 1,
  setMusicLevel(k, sec = 0.15) {
    this.level = k;
    if (!this.ctx || this.fading) return;
    const g = this.musicBus.gain, t = this.ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0.32 * k, t + Math.max(0.01, sec));
  },

  // ---- music sequencer ----
  playSong(name, force) {
    if (this.songName === name && !force) return;
    this.songName = name;
    if (!this.ctx) return;
    this.stopSong(true);
    this.songName = name;
    this.song = SONGS[name];
    if (!this.song) return;
    this.step = 0;
    this.fading = false;
    this.nextStepTime = this.ctx.currentTime + 0.08;
    this.musicBus.gain.cancelScheduledValues(this.ctx.currentTime);
    this.musicBus.gain.setValueAtTime(0.32 * this.level, this.ctx.currentTime);
    this.timer = setInterval(() => this.schedule(), 25);
  },
  stopSong(keepName) {
    if (this.timer) clearInterval(this.timer);
    this.timer = null;
    this.song = null;
    if (!keepName) this.songName = null;
  },
  fadeOut(sec = 1) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.musicBus.gain.cancelScheduledValues(t);
    this.musicBus.gain.setValueAtTime(this.musicBus.gain.value, t);
    this.musicBus.gain.linearRampToValueAtTime(0, t + sec);
    this.fading = true;
    const tok = this.fadeTok = (this.fadeTok || 0) + 1;
    setTimeout(() => { if (this.fading && this.fadeTok === tok) { this.fading = false; this.stopSong(); } }, sec * 1000 + 50);
  },
  schedule() {
    const s = this.song;
    if (!s || !this.ctx) return;
    const stepDur = 60 / s.bpm / 4;
    while (this.nextStepTime < this.ctx.currentTime + 0.12) {
      const totalSteps = s.length * 16;
      if (s.once && this.step >= totalSteps) { this.stopSong(true); return; }
      const st = this.step % totalSteps;
      const bar = Math.floor(st / 16), pos = st % 16;
      for (const tr of s.tracks) {
        const bars = tr.bars;
        const pat = bars[bar % bars.length];
        const tok = pat[pos];
        if (tok && tok !== '.') Instruments[tr.inst](this, tok, this.nextStepTime, stepDur, tr);
      }
      this.nextStepTime += stepDur * (pos % 2 === 0 ? 1 + (s.swing || 0) : 1 - (s.swing || 0));
      this.step++;
    }
  },
};

// Note name -> frequency. Accepts C2, C#3, Db4 ...
const _noteCache = {};
function noteFreq(n) {
  if (_noteCache[n]) return _noteCache[n];
  const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
  if (!m) return 0;
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]];
  const acc = m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0;
  const midi = 12 * (parseInt(m[3], 10) + 1) + base + acc;
  return (_noteCache[n] = 440 * Math.pow(2, (midi - 69) / 12));
}
// Parse "A2 . . A2 C3 . ..." into a 16-slot array.
function bar(str) {
  const t = str.trim().split(/\s+/);
  while (t.length < 16) t.push('.');
  return t.slice(0, 16);
}

// Music instruments. Each receives (audio, token, time, stepDuration, track).
const Instruments = {
  bass(a, tok, t, sd, tr) {
    const c = a.ctx, f = noteFreq(tok);
    if (!f) return;
    const len = sd * (tr.len || 1.8);
    const o = c.createOscillator(), o2 = c.createOscillator();
    o.type = tr.wave || 'sawtooth'; o2.type = 'square';
    o.frequency.value = f; o2.frequency.value = f / 2;
    const fl = c.createBiquadFilter();
    fl.type = 'lowpass'; fl.Q.value = 6;
    fl.frequency.setValueAtTime(tr.cutoff || 900, t);
    fl.frequency.exponentialRampToValueAtTime(140, t + len);
    const g = c.createGain(), g2 = c.createGain();
    g2.gain.value = 0.5;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime((tr.vol || 0.5), t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(fl); o2.connect(g2); g2.connect(fl); fl.connect(g); g.connect(a.musicBus);
    o.start(t); o2.start(t); o.stop(t + len + 0.02); o2.stop(t + len + 0.02);
  },
  lead(a, tok, t, sd, tr) {
    const c = a.ctx, f = noteFreq(tok);
    if (!f) return;
    const len = sd * (tr.len || 3.5);
    const o = c.createOscillator();
    o.type = tr.wave || 'square';
    o.frequency.value = f;
    const lfo = c.createOscillator(), lg = c.createGain();
    lfo.frequency.value = 5.5; lg.gain.value = f * 0.012;
    lfo.connect(lg); lg.connect(o.frequency);
    const g = c.createGain();
    const v = tr.vol || 0.16;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.01);
    g.gain.setValueAtTime(v, t + len * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = tr.cutoff || 3200;
    o.connect(fl); fl.connect(g); g.connect(a.musicBus);
    if (tr.echo) {
      const dl = c.createDelay(); dl.delayTime.value = sd * 3;
      const fb = c.createGain(); fb.gain.value = 0.3;
      g.connect(dl); dl.connect(fb); fb.connect(a.musicBus);
    }
    o.start(t); lfo.start(t); o.stop(t + len + 0.05); lfo.stop(t + len + 0.05);
  },
  arp(a, tok, t, sd, tr) {
    const f = noteFreq(tok);
    if (!f) return;
    const c = a.ctx;
    const o = c.createOscillator(), g = c.createGain();
    o.type = tr.wave || 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(tr.vol || 0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + sd * (tr.len || 0.9));
    o.connect(g); g.connect(a.musicBus);
    o.start(t); o.stop(t + sd + 0.02);
  },
  pad(a, tok, t, sd, tr) {
    // token like "A3+C4+E4"
    const c = a.ctx, len = sd * (tr.len || 16);
    for (const n of tok.split('+')) {
      const f = noteFreq(n);
      if (!f) continue;
      for (const det of [-6, 6]) {
        const o = c.createOscillator(), g = c.createGain();
        o.type = tr.wave || 'sawtooth'; o.frequency.value = f; o.detune.value = det;
        const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = tr.cutoff || 1100;
        const v = (tr.vol || 0.05);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(v, t + len * 0.25);
        g.gain.linearRampToValueAtTime(0.0001, t + len);
        o.connect(fl); fl.connect(g); g.connect(a.musicBus);
        o.start(t); o.stop(t + len + 0.05);
      }
    }
  },
  drums(a, tok, t, sd, tr) {
    const c = a.ctx, v = tr.vol || 1;
    for (const ch of tok) {
      if (ch === 'k') { // kick
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
        g.gain.setValueAtTime(0.9 * v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        o.connect(g); g.connect(a.musicBus); o.start(t); o.stop(t + 0.25);
      } else if (ch === 's') { // snare
        a.noise(0.16, 0.45 * v, 1800, 0.8, 'bandpass', t - c.currentTime, a.musicBus);
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.08);
        g.gain.setValueAtTime(0.35 * v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
        o.connect(g); g.connect(a.musicBus); o.start(t); o.stop(t + 0.12);
      } else if (ch === 'h') { // closed hat
        a.noise(0.04, 0.14 * v, 9000, 1, 'highpass', t - c.currentTime, a.musicBus);
      } else if (ch === 'o') { // open hat
        a.noise(0.2, 0.12 * v, 8000, 1, 'highpass', t - c.currentTime, a.musicBus);
      } else if (ch === 'c') { // crash
        a.noise(1.0, 0.18 * v, 6000, 0.5, 'highpass', t - c.currentTime, a.musicBus);
      } else if (ch === 'm') { // metal clank (industrial)
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'square'; o.frequency.setValueAtTime(1260, t);
        g.gain.setValueAtTime(0.06 * v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
        o.connect(g); g.connect(a.musicBus); o.start(t); o.stop(t + 0.1);
        a.noise(0.06, 0.08 * v, 3000, 6, 'bandpass', t - c.currentTime, a.musicBus);
      } else if (ch === 't') { // low tom
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.2);
        g.gain.setValueAtTime(0.5 * v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
        o.connect(g); g.connect(a.musicBus); o.start(t); o.stop(t + 0.26);
      }
    }
  },
};

// Sound effects. Each receives (audio, pan).
const SFX = {
  whoosh(a, p) { a.noise(0.12, 0.18, 2600, 1.2, 'bandpass', 0, a.out(p), 700); },
  whooshBig(a, p) { a.noise(0.2, 0.25, 1800, 1.0, 'bandpass', 0, a.out(p), 300); },
  hitLight(a, p) {
    const d = a.out(p, true);
    a.noise(0.06, 0.5, 2200, 0.7, 'bandpass', 0, d);
    a.tone(240, 70, 0.08, 'square', 0.35, 0, d);
  },
  hitMid(a, p) {
    const d = a.out(p, true);
    a.noise(0.09, 0.6, 1500, 0.7, 'bandpass', 0, d);
    a.tone(190, 55, 0.11, 'square', 0.45, 0, d);
  },
  hitHeavy(a, p) {
    const d = a.out(p, true);
    a.noise(0.18, 0.7, 900, 0.6, 'lowpass', 0, d);
    a.tone(160, 38, 0.2, 'sawtooth', 0.55, 0, d);
    a.noise(0.05, 0.4, 4000, 1, 'highpass', 0, d);
  },
  hitFinisher(a, p) {
    const d = a.out(p, true);
    a.noise(0.11, 0.7, 3000, 0.6, 'lowpass', 0, d, 600);
    a.tone(110, 40, 0.14, 'triangle', 0.6, 0, d);
    a.tone(660, 0, 0.25, 'square', 0.12, 0, d);
    a.tone(989, 0, 0.25, 'square', 0.08, 0, d);
    a.tone(1320, 0, 0.25, 'sine', 0.1, 0, d);
    a.tone(55, 0, 0.18, 'sine', 0.5, 0, d);
    a.duck(0.5, 0.15);
  },
  hitCrit(a, p) {
    SFX.hitFinisher(a, p);
    const d = a.out(p, true);
    a.noise(0.4, 0.6, 4000, 0.6, 'lowpass', 0, d, 150);
    a.tone(70, 30, 0.4, 'sine', 0.6, 0, d);
    a.duck(0.2, 0.5);
  },
  matGang(a, p) { a.noise(0.02, 0.25, 2500, 0.8, 'highpass', 0, a.out(p)); },
  matMutant(a, p) { const d = a.out(p); a.noise(0.09, 0.3, 900, 1.2, 'lowpass', 0, d, 200); a.tone(90, 70, 0.09, 'sine', 0.2, 0, d); },
  matChitin(a, p) { const d = a.out(p); a.noise(0.025, 0.35, 3500, 1, 'highpass', 0, d); a.noise(0.025, 0.3, 3500, 1, 'highpass', 0.015, d); },
  matMetal(a, p) { const d = a.out(p); a.tone(1200, 0, 0.06, 'square', 0.06, 0, d); a.tone(1800, 0, 0.06, 'square', 0.05, 0, d); },
  clank(a, p) { const d = a.out(p); a.tone(620, 0, 0.12, 'square', 0.08, 0, d); a.tone(873, 0, 0.12, 'square', 0.06, 0, d); a.noise(0.02, 0.2, 3000, 1, 'highpass', 0, d); },
  tink(a, p) { a.tone(1800, 0, 0.03, 'square', 0.12, 0, a.out(p)); },
  hitMetal(a, p) {
    const d = a.out(p, true);
    a.tone(1480, 1100, 0.18, 'triangle', 0.25, 0, d);
    a.tone(2210, 1900, 0.12, 'square', 0.08, 0, d);
    a.noise(0.08, 0.5, 2500, 1.5, 'bandpass', 0, d);
  },
  hitShell(a, p) { // chitin crack
    const d = a.out(p, true);
    a.noise(0.05, 0.6, 3500, 2, 'bandpass', 0, d);
    a.tone(520, 180, 0.07, 'square', 0.3, 0, d);
    a.noise(0.04, 0.3, 6000, 3, 'bandpass', 0.03, d);
  },
  thud(a, p) {
    const d = a.out(p);
    a.tone(110, 38, 0.22, 'sine', 0.7, 0, d);
    a.noise(0.18, 0.35, 400, 0.7, 'lowpass', 0, d);
  },
  jump(a, p) { a.tone(180, 360, 0.09, 'square', 0.1, 0, a.out(p)); },
  land(a, p) { a.noise(0.07, 0.2, 500, 0.8, 'lowpass', 0, a.out(p)); },
  grab(a, p) { a.tone(140, 90, 0.08, 'square', 0.25, 0, a.out(p)); a.noise(0.05, 0.2, 800, 1, 'bandpass', 0, a.out(p)); },
  special(a, p) {
    const d = a.out(p, true);
    a.noise(0.5, 0.6, 3000, 0.6, 'bandpass', 0, d, 200);
    a.tone(880, 60, 0.45, 'sawtooth', 0.35, 0, d);
    a.tone(110, 40, 0.5, 'sine', 0.6, 0, d);
  },
  hurt(a, p) { a.tone(420, 150, 0.16, 'square', 0.25, 0, a.out(p)); },
  ko(a, p) {
    const d = a.out(p);
    a.tone(330, 60, 0.5, 'sawtooth', 0.3, 0, d);
    a.tone(165, 30, 0.6, 'square', 0.2, 0.05, d);
  },
  pickup(a) { [0, 0.06, 0.12].forEach((t, i) => a.tone([523, 659, 784][i], 0, 0.1, 'square', 0.15, t)); },
  food(a) { [0, 0.07, 0.14, 0.21].forEach((t, i) => a.tone([392, 523, 659, 1046][i], 0, 0.12, 'triangle', 0.25, t)); },
  weapon(a) { a.tone(330, 0, 0.08, 'square', 0.15); a.tone(660, 0, 0.12, 'square', 0.15, 0.07); },
  crate(a, p) {
    const d = a.out(p, true);
    a.noise(0.25, 0.6, 1200, 0.6, 'bandpass', 0, d, 300);
    for (let i = 0; i < 4; i++) a.tone(300 + i * 120, 120, 0.04, 'square', 0.12, i * 0.03, d);
  },
  glass(a, p) {
    const d = a.out(p);
    a.noise(0.3, 0.4, 7000, 2, 'highpass', 0, d);
    for (let i = 0; i < 5; i++) a.tone(2400 + Math.random() * 2400, 0, 0.05, 'triangle', 0.08, i * 0.025, d);
  },
  explode(a, p) {

// ---- 20_gfx.js ----
// Pixel drawing toolkit. Every primitive snaps to whole pixels so the 384x216 buffer stays crisp
// when upscaled. Characters are drawn into a scratch sprite canvas, then composited with an
// outline, hit-flash and drop shadow.

const Px = {
  g: null, // current target context
  use(g) { this.g = g; },
  rect(x, y, w, h, c) {
    if (w <= 0 || h <= 0) return;
    const g = this.g;
    g.fillStyle = c;
    g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  },
  // Thick line from (x0,y0) to (x1,y1) stamped with a square brush of size t.
  line(x0, y0, x1, y1, t, c) {
    const g = this.g;
    g.fillStyle = c;
    const dx = x1 - x0, dy = y1 - y0;
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))));
    const h = t / 2;
    for (let i = 0; i <= n; i++) {
      const x = x0 + dx * i / n, y = y0 + dy * i / n;
      g.fillRect(Math.round(x - h), Math.round(y - h), t, t);
    }
  },
  // Tapered limb: thickness goes from t0 to t1.
  limb(x0, y0, x1, y1, t0, t1, c) {
    const g = this.g;
    g.fillStyle = c;
    const dx = x1 - x0, dy = y1 - y0;
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))));
    for (let i = 0; i <= n; i++) {
      const k = i / n, t = Math.round(t0 + (t1 - t0) * k), h = t / 2;
      g.fillRect(Math.round(x0 + dx * k - h), Math.round(y0 + dy * k - h), t, t);
    }
  },
  disc(cx, cy, r, c) {
    const g = this.g;
    g.fillStyle = c;
    const R = Math.max(0.5, r);
    for (let y = -Math.ceil(R); y <= Math.ceil(R); y++) {
      const w = Math.sqrt(Math.max(0, R * R - y * y));
      if (w < 0.35) continue;
      g.fillRect(Math.round(cx - w), Math.round(cy + y), Math.max(1, Math.round(w * 2)), 1);
    }
  },
  oval(cx, cy, rx, ry, c) {
    const g = this.g;
    g.fillStyle = c;
    for (let y = -Math.ceil(ry); y <= Math.ceil(ry); y++) {
      const k = 1 - (y * y) / (ry * ry);
      if (k <= 0) continue;
      const w = rx * Math.sqrt(k);
      g.fillRect(Math.round(cx - w), Math.round(cy + y), Math.max(1, Math.round(w * 2)), 1);
    }
  },
  // Filled polygon via scanlines. pts = [x0,y0,x1,y1,...]
  poly(pts, c) {
    const g = this.g;
    g.fillStyle = c;
    let minY = Infinity, maxY = -Infinity;
    for (let i = 1; i < pts.length; i += 2) { minY = Math.min(minY, pts[i]); maxY = Math.max(maxY, pts[i]); }
    const n = pts.length / 2;
    for (let y = Math.floor(minY); y <= Math.ceil(maxY); y++) {
      const sy = y + 0.5, xs = [];
      for (let i = 0; i < n; i++) {
        const ax = pts[i * 2], ay = pts[i * 2 + 1];
        const bx = pts[((i + 1) % n) * 2], by = pts[((i + 1) % n) * 2 + 1];
        if ((ay <= sy && by > sy) || (by <= sy && ay > sy)) xs.push(ax + (sy - ay) / (by - ay) * (bx - ax));
      }
      xs.sort((a, b) => a - b);
      for (let k = 0; k + 1 < xs.length; k += 2) {
        const x0 = Math.round(xs[k]), x1 = Math.round(xs[k + 1]);
        if (x1 > x0) g.fillRect(x0, y, x1 - x0, 1);
      }
    }
  },
  // Quad between two points with widths (for torsos, tails, blades).
  quad(x0, y0, x1, y1, w0, w1, c) {
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L;
    this.poly([x0 + nx * w0 / 2, y0 + ny * w0 / 2, x1 + nx * w1 / 2, y1 + ny * w1 / 2,
      x1 - nx * w1 / 2, y1 - ny * w1 / 2, x0 - nx * w0 / 2, y0 - ny * w0 / 2], c);
  },
  dot(x, y, c) { this.rect(x, y, 1, 1, c); },
};

// Colour helpers
function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return h.length === 4
    ? [((n >> 8) & 15) * 17, ((n >> 4) & 15) * 17, (n & 15) * 17]
    : [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const _shadeCache = new Map();
// k < 0 darkens, k > 0 lightens.
function shade(hex, k) {
  const key = hex + k;
  let v = _shadeCache.get(key);
  if (v) return v;
  const [r, g, b] = hexToRgb(hex);
  const f = c => Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k);
  v = '#' + [f(r), f(g), f(b)].map(c => clamp(c, 0, 255).toString(16).padStart(2, '0')).join('');
  _shadeCache.set(key, v);
  return v;
}
function rgba(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }

// Sprite compositor. Draw a character in local coordinates (origin = feet, facing right) into a
// scratch canvas, then stamp it to the screen with outline/flash.
const Sprite = {
  pool: {},
  get(w, h) {
    const k = w + 'x' + h;
    let s = this.pool[k];
    if (!s) {
      const a = document.createElement('canvas'); a.width = w; a.height = h;
      const b = document.createElement('canvas'); b.width = w; b.height = h;
      s = this.pool[k] = { a, ga: a.getContext('2d'), b, gb: b.getContext('2d'), w, h };
    }
    return s;
  },
  cur: null,
  // Begin drawing a sprite. ox, oy = where local (0,0) sits inside the scratch canvas.
  begin(w = 112, h = 96, ox = 56, oy = 88) {
    const s = this.get(w, h);
    s.ga.setTransform(1, 0, 0, 1, 0, 0);
    s.ga.clearRect(0, 0, w, h);
    s.ga.translate(ox, oy);
    s.ox = ox; s.oy = oy;
    this.cur = s;
    Px.use(s.ga);
    return s.ga;
  },
  // Composite onto ctx at screen position (sx, sy) of the feet. facing: 1 right, -1 left.
  // opts: { outline: colour|null, flash: colour|null, alpha }
  end(ctx, sx, sy, facing, opts = {}) {
    const s = this.cur;
    const outline = opts.outline === undefined ? '#140c0a' : opts.outline;
    const dx = Math.round(sx), dy = Math.round(sy);
    ctx.save();
    if (opts.alpha != null) ctx.globalAlpha = opts.alpha;
    ctx.translate(dx, dy);
    if (facing < 0) ctx.scale(-1, 1);
    if (outline || opts.flash) {
      s.gb.globalCompositeOperation = 'copy';
      s.gb.drawImage(s.a, 0, 0);
      s.gb.globalCompositeOperation = 'source-in';
      s.gb.fillStyle = opts.flash || outline;
      s.gb.fillRect(0, 0, s.w, s.h);
      s.gb.globalCompositeOperation = 'source-over';
    }
    if (outline && !opts.flash) {
      ctx.drawImage(s.b, -s.ox - 1, -s.oy);
      ctx.drawImage(s.b, -s.ox + 1, -s.oy);
      ctx.drawImage(s.b, -s.ox, -s.oy - 1);
      ctx.drawImage(s.b, -s.ox, -s.oy + 1);
    }
    if (opts.flash) {
      ctx.drawImage(s.b, -s.ox, -s.oy);
    } else {
      ctx.drawImage(s.a, -s.ox, -s.oy);
      if (opts.tint && opts.tint[1] > 0) {
        // colour wash over the sprite (venom, family hit tint, telegraph pulse)
        s.gb.globalCompositeOperation = 'copy';
        s.gb.drawImage(s.a, 0, 0);
        s.gb.globalCompositeOperation = 'source-in';
        s.gb.fillStyle = opts.tint[0];
        s.gb.fillRect(0, 0, s.w, s.h);
        s.gb.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = (opts.alpha != null ? opts.alpha : 1) * clamp(opts.tint[1], 0, 1);
        ctx.drawImage(s.b, -s.ox, -s.oy);
      }
    }
    ctx.restore();
    Px.use(Screen.ctx);
  },
};

// Soft ellipse shadow on the ground (drawn directly on the screen buffer).
function groundShadow(ctx, x, y, rx, alpha = 0.35) {
  Px.use(ctx);
  ctx.globalAlpha = alpha;
  Px.oval(x, y, rx, Math.max(2, rx * 0.32), '#000');
  ctx.globalAlpha = 1;
}

// ---- 30_fx.js ----
// Effects: particles, decals, hit sparks, floating text, banners, screen shake, kick and flashes.

const FX = {
  parts: [],
  decals: [],
  texts: [],
  banner: null,
  shakeAmt: 0, shakeDur: 0, shakeX: 0, shakeY: 0,
  kickX: 0, kickT: 0,
  flashColor: null, flashT: 0, flashMax: 1, flashAlpha: 0.6,
  vignetteT: 0,
  reducedShake: Store.get('reducedShake', false),
  reset() { this.parts.length = 0; this.decals.length = 0; this.texts.length = 0; this.banner = null; this.shakeAmt = 0; this.flashT = 0; this.kickT = 0; },

  shake(px, dur) {
    if (!px) return;
    const k = this.reducedShake ? 0.3 : 1;
    this.shakeAmt = Math.min(7, Math.max(this.shakeAmt, px * k));
    this.shakeDur = Math.max(this.shakeDur, dur || 6 + px * 3);
    this.shakeLeft = this.shakeDur;
  },
  kick(dx) { if (dx) { this.kickX = clamp(Math.round(dx), -2, 2); this.kickT = 2; } },
  flash(color, frames, alpha = 0.6) {
    if (this.reducedShake && alpha > 0.15) alpha = 0.15;
    this.flashColor = color; this.flashT = frames; this.flashMax = frames; this.flashAlpha = alpha;
  },
  hurtVignette() { this.vignetteT = 10; },

  add(p) {
    if (this.parts.length > 320) this.parts.shift();
    p.t = 0;
    p.life = p.life || 20;
    p.vx = p.vx || 0; p.vy = p.vy || 0; p.vz = p.vz || 0;
    p.z = p.z || 0;
    p.g = p.g == null ? 0.25 : p.g;
    this.parts.push(p);
    return p;
  },
  decal(d) {
    if (this.decals.length > 40) this.decals.shift();
    d.t = 0;
    this.decals.push(d);
  },

  // Hit spark: a flash star, a cone of streaks along the hit direction, optional ring.
  hit(x, y, z, tier = 1, dir = 1, tint = '#fff6c8') {
    const T = TIERS[tier] || TIERS[1];
    this.add({ kind: 'star', x, y, z, life: 5 + tier, size: T.star / 2, color: tint, g: 0 });
    for (let i = 0; i < T.sparks; i++) {
      const a = (dir > 0 ? 0 : Math.PI) + rr(-0.6, 0.6), s = rr(2, 5);
      this.add({ kind: 'spark', x, y, z, vx: Math.cos(a) * s, vz: Math.sin(a) * s * 0.8 + rr(-0.5, 1), life: ri(8, 14), g: 0.08, drag: 0.85 });
    }
    if (T.ring) for (let r = 0; r < T.ring; r++) this.add({ kind: 'ring', x, y, z, life: 8 + r * 3, size: 18 + r * 8, color: '#ffffff', g: 0 });
    if (T.dust) this.dust(x, y, T.dust);
  },
  splat(x, y, z, color, n = 6, dir = 1, decal = true) {
    for (let i = 0; i < n; i++) {
      this.add({ kind: 'drop', x, y: y + rr(-2, 2), z, vx: dir * rr(0.5, 2.5) + rr(-0.6, 0.6), vz: rr(1, 3.4), life: 70, color, g: 0.25, ground: decal ? y : null });
    }
  },
  pool(x, y, color, w = 14) { this.decal({ kind: 'pool', x, y, w, h: 3, color, life: 400 }); },
  scorch(x, y, w = 30) { this.decal({ kind: 'pool', x, y, w, h: 5, color: '#1a1410', life: 600 }); },
  wallCrack(x, y) { this.decal({ kind: 'crack', x, y, life: 60, seed: ri(0, 999) }); },
  dust(x, y, n = 5, spread = 1.2, color = '#a08a6a') {
    for (let i = 0; i < n; i++) {
      this.add({ kind: 'dust', x: x + rr(-4, 4), y: y + rr(-1, 1), z: rr(0, 3), vx: rr(-spread, spread), vz: rr(0.1, 0.5), life: ri(16, 26), size: rr(2, 3), color, g: -0.01, grow: 0.15 });
    }
  },
  dustRing(x, y, n = 14) {
    for (let i = 0; i < n; i++) {

    }
  },
  steam(x, y, z, n = 3) {
    for (let i = 0; i < n; i++) this.add({ kind: 'dust', x: x + rr(-2, 2), y, z: z + rr(0, 3), vx: rr(-0.3, 0.3), vz: rr(0.4, 0.8), life: 24, size: 2, color: '#e8e8e8', g: -0.005, grow: 0.2, alpha: 0.5 });

  sweat(x, y, z, n = 2) {
