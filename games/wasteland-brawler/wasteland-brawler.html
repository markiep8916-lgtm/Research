  // Crown Wheel: a boomerang valve wheel that rolls along the floor (jump it), 4 px/f out to 160 px, then home.
  class Boomer extends Ent {
    constructor(owner, x, y, ty, dir) {
      super(x, y);
      Object.assign(this, { o: owner, dir, ty, x0: x, out: true, team: 'proj', kvOwned: true, shadowR: 4, w: 5, h: 10, ang: 0 });
      this.z = 5;
      this.hits = new Set();
    }
    update() {
      this.t++;
      const o = this.o;
      this.ang += 0.55 * (this.out ? this.dir : -this.dir);
      if (!o || o.remove || o.dying) { this.remove = true; FX.add({ kind: 'shard', x: this.x, y: this.y, z: 6, vx: rr(-1, 1), vz: 3, life: 50, color: C.crown, size: 5, rot: 0, spin: 0.3, g: 0.24, ground: this.y }); return; }
      if (this.out) {
        this.vx = 4 * this.dir;
        this.y = approach(this.y, this.ty, 1.2);
        const edge = this.x < Game.cam.x + 10 || this.x > Game.cam.x + W - 10;
        if (Math.abs(this.x - this.x0) >= 160 || edge) { this.out = false; Sound.sfx('kvSpin', this.x); FX.add({ kind: 'spark', x: this.x, y: this.y, z: 4, vx: -this.dir * 2, vz: 1.5, life: 10, g: 0.1, drag: 0.85 }); }
      } else {
        const tx = o.x + o.facing * 10, ty = o.y;
        const dx = tx - this.x, dy = ty - this.y, d = Math.hypot(dx, dy) || 1;
        this.vx = dx / d * 4;
        this.y += dy / d * Math.min(4, d) * 0.6;
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) { this.remove = true; o.kvWheelOut = false; Sound.sfx('kvClank', o.x); return; }
        if (this.t > 260) { this.remove = true; o.kvWheelOut = false; return; }
      }
      this.x += this.vx;
      this.z = 5 + Math.abs(Math.sin(this.t * 0.35)) * 1.5;
      if (this.t % 3 === 0) FX.add({ kind: 'spark', x: this.x - sign(this.vx) * 4, y: this.y, z: 1, vx: -sign(this.vx) * rr(0.5, 1.5), vz: rr(0.5, 1.5), life: 8, g: 0.1, drag: 0.85 });
      if (this.t % 16 === 0) Sound.sfx('kvSpin', this.x);
      const p = Game.player;
      const key = this.out ? 'o' : 'b';
      if (p && p.vulnerable && !this.hits.has(key) && Math.abs(p.y - this.y) <= 8 && Math.abs(p.x - this.x) < p.w + 5 && p.z < 10) {
        this.hits.add(key);
        p.takeHit(this, { dmg: 10, tier: 2, kb: 1.8, stun: 20, zr: [0, 12], sfx: 'hitMetal' }, sign(this.vx) || 1);
      }
    }
    draw(ctx, camX) {
      Px.use(ctx);
      const sx = this.x - camX, sy = this.y - this.z;
      const back = -sign(this.vx) || -1;
      ctx.globalAlpha = 0.35;
      Px.rect(sx + back * 6 - (back < 0 ? 8 : 0), sy - 1, 8, 1, '#fff2c0');
      Px.rect(sx + back * 7 - (back < 0 ? 6 : 0), sy + 2, 6, 1, '#fff2c0');
      ctx.globalAlpha = 1;
      Px.disc(sx, sy, 6, '#2a1e10');
      valve(sx, sy, 5, this.ang, 4, C.crown, false);
    }
  }

  // Steam Jet cone: a wedge of #E8ECEF circles (alpha 0.6) from +10 to +80, drawn in front of the hero's depth.
  class Cone extends Ent {
    constructor(o) { super(o.x, o.y); Object.assign(this, { o, team: 'fx', shadowR: 0, kvOwned: true, fade: 6, grow: 0 }); }
    live() { const o = this.o; return !o.dying && o.state === 'attack' && o.atk && o.atk.key === 'steam' && o.atkPhase() === 'active'; }
    sortY() { return this.o.y + 12; }
    update() {
      this.t++;
      this.x = this.o.x; this.y = this.o.y;
      if (this.live()) this.grow = Math.min(1, this.grow + 0.2);
      else if (--this.fade <= 0) this.remove = true;
    }
    draw(ctx, camX) {
      const o = this.o, f = o.facing;
      const a = this.live() ? 1 : this.fade / 6;
      Px.use(ctx);
      ctx.globalAlpha = 0.6 * a;
      const reach = 10 + 70 * this.grow;
      for (let i = 0; i < 10; i++) {
        const d = 10 + i * 7.8;
        if (d > reach) break;
        const k = (d - 10) / 70;
        const r = lerp(3, 12, k) + Math.sin(Game.frame * 0.7 + i * 1.3) * 1.2;
        const z = lerp(36, 24, k) + Math.sin(Game.frame * 0.5 + i) * 1.5;
        Px.oval(o.x - camX + f * d, o.y - z, r, r * 0.85, C.steam);
      }
      ctx.globalAlpha = 0.85 * a;
      for (let i = 0; i < 5; i++) {
        const d = 14 + ((Game.frame * 5 + i * 17) % 64);
        if (d > reach) continue;
        Px.rect(o.x - camX + f * d - 2, o.y - lerp(36, 24, (d - 10) / 70) - 2 + (i % 3) * 2, 4, 1, '#ffffff');
      }
      ctx.globalAlpha = 1;
    }
  }

  // Pressure Lane water jet: 40f of stripes, then a #2E7FD8 jet blasts across the screen in that lane for 40f.
  class Jet extends Ent {
    constructor(i) {
      const L = lanes()[i];
      super(Game.cam.x + W / 2, L.y0);
      Object.assign(this, { L, lane: i, team: 'hazard', shadowR: 0, kvOwned: true, kvJet: true, hit: false });

    }
    sortY() { return this.L.y0 + 0.5; }
    get blastT() { return this.t - JET_TELE; }
    head() { return W + 12 - this.blastT * 26; }                 // screen x of the jet's leading edge
    tail() { const k = this.blastT - (JET_BLAST - 10); return k <= 0 ? W + 20 : W + 20 - k * 30; }
    wet(sx) { const b = this.blastT; return b >= 0 && b < JET_BLAST + 12 && sx >= this.head() - 3 && sx <= this.tail(); }
    update() {
      this.t++;
      this.hs = 0;

        }

          if (!this.hit && p.vulnerable) {

    }
    drawMarker(ctx, camX) {
      if (this.t >= JET_TELE) return;
      const L = this.L, on = (this.t >> 2) % 3 !== 2;

      ctx.globalAlpha = 0.55;

      const ox = W + 8 - 18 * slide, oy = L.y0 + 2;
      Px.rect(ox, oy - 15, 22, 15, '#3a424e');
      Px.rect(ox, oy - 15, 22, 2, '#6a7480');

    }
  }
  class JetFront extends Ent {

        if (e.t === Math.max(0, a.start - 16)) Sound.sfx('kvCharge', e.x);     // the 16 f charge-up ends on the punch
        if (e.t === a.start - 6) Sound.sfx('tink', e.x);
        if (ph === 'start' && e.t % 4 === 0) FX.steam(e.x - e.facing * 6, e.y, 40, 1);
        if (ph === 'active') {
          if (e.t === a.start) { Sound.sfx('kvPiston', e.x); FX.steam(e.x + e.facing * 20, e.y, 40, 3); FX.shake(1, 4); }
          a.reach = [8, lerp(26, 50, clamp((e.t - a.start + 1) / 4, 0, 1))];
          if (p) e.resolveAttack([p]);
        }
      } else if (a.key === 'wheel') {
        if (e.t === 0) Sound.sfx('kvSpin', e.x);
        if (e.t === a.start && !e.kvWheelOut) {
          e.kvWheelOut = true;
          Game.add(new Boomer(e, e.x + e.facing * 18, e.y, p ? p.y : e.y, e.facing));
          Sound.sfx('whooshBig', e.x);
        }
      }
    },
    eyes() { return [[4, -55, C.visor], [5, -55, C.visor]]; },
    kvDebug: {
      plan: (e, key) => startPlan(e, key),
      crank: e => startCrank(e),
      phase3: e => { e.kvCrankDone = true; e.kvPhase = 2; startPhase3(e); },
      lane: (e, i) => Game.add(new Jet(i)),
      finale: e => Game.add(new Finale(e)),
    },
  };

  // Game.finaleRunning pauses TIME; derive it from a live finale so a quit-to-title can never leave it stuck.
  // (Game is declared after this module, so the accessor is installed on the first boss spawn.)
  let manualFinale = false, finaleHooked = false;
  function hookFinaleFlag() {
    if (finaleHooked) return;
    finaleHooked = true;
    manualFinale = !!Game.finaleRunning;
    Object.defineProperty(Game, 'finaleRunning', {
      configurable: true, enumerable: true,
      get() { return manualFinale || (Game.state === 'play' && Game.ents.some(e => (e.kvFin && !Game.finaleDone) || (e.type === 'valve' && e.dying))); },
      set(v) { manualFinale = !!v; },
    });
  }
})();

// Breakables: crate | drum (oil drum) | fuel (red, explodes) | fridge | trunk (car-wreck trunk) | trash
// drop: an item kind, 'none', or omitted for the random table (40% food, 35% score, 25% weapon).
const PROP_DEFS = {
  crate:  { hp: 2, w: 10, h: 18, cols: ['#8b5a2b', '#5a3a1a', '#c9a86a'], sfx: 'crate', solid: true },
  drum:   { hp: 3, w: 7, h: 20, cols: ['#5e6b73', '#3e474d', '#8c5a3c'], sfx: 'clank', solid: true },
  fuel:   { hp: 2, w: 7, h: 20, cols: ['#b8322a', '#6a1a16', '#f2eee0'], sfx: 'clank', solid: true },
  fridge: { hp: 3, w: 9, h: 30, cols: ['#d8d4c4', '#a06a40', '#8a8a8a'], sfx: 'clank', solid: true },
  trunk:  { hp: 2, w: 12, h: 14, cols: ['#8a5a3a', '#5a3a26', '#2a2020'], sfx: 'clank', solid: true },
  trash:  { hp: 1, w: 6, h: 16, cols: ['#6e7178', '#4a4d52', '#9aa0a8'], sfx: 'clank', solid: true },
};
function randomDrop() {
  const r = rand();
  if (r < 0.4) { const f = rand(); return f < 0.4 ? 'cactus' : f < 0.8 ? 'beans' : f < 0.95 ? 'rat' : 'water'; }
  if (r < 0.75) { const f = rand(); return f < 0.6 ? 'cap' : f < 0.9 ? 'pouch' : 'watch'; }
  const f = rand(); return f < 0.5 ? 'pipe' : f < 0.8 ? 'machete' : 'molotov';
}
class Breakable extends Ent {
  constructor(kind, x, y, drop) {
    super(x, y);
    const d = PROP_DEFS[kind];
    this.kind = kind; this.def = d;
    this.drop = drop === undefined || drop === null ? (kind === 'fuel' ? 'none' : kind === 'fridge' ? pick(['beans', 'rat', 'cactus']) : randomDrop()) : drop;
    this.team = 'prop';
    this.hp = d.hp;
    this.w = d.w; this.h = d.h;
    this.shadowR = d.w + 2;
    this.wob = 0; this.fuse = 0; this.rolling = 0; this.dent = 0;
    this.solidRect = { x0: x - d.w, x1: x + d.w, y0: y - 4, y1: y + 4, h: d.h, splat: false, prop: this };
    Game.solids.push(this.solidRect);
  }
  get vulnerable() { return !this.remove && this.fuse === 0; }
  takeHit(src, a, dir) {
    this.wob = 8; this.flash = 3;
    Sound.sfx(this.def.sfx, this.x);
    this.hs = 3; this.hitJitter = true;
    FX.hit(this.x - dir * 4, this.y, 10, 1, dir, '#ffffff');
    if (src && src.team === 'player' && src.addCombo) src.addCombo();
    this.igniter = src;
    this.hp -= (a.tier || 1) >= 3 ? 2 : 1;
    this.dent++;
    if (this.kind === 'fuel') {
      if (a.thrownBody) { this.fuse = 10; return; }
      if (this.hp <= 0) this.fuse = 1;
      return;
    }
    if (this.hp <= 0) this.smash(src);
  }
  smash(src) {
    if (this.remove) return;
    this.remove = true;
    this.solidRect.off = true;
    FX.debris(this.x, this.y, 8, this.def.cols, 12, [1, 3]);
    if (this.kind === 'crate' || this.kind === 'trunk') FX.shards(this.x, this.y, 10, 6, ['#8b5a2b', '#5a3a1a']);
    Sound.sfx('crate', this.x);
    Game.addScore(100);
    if (this.kind === 'drum') FX.pool(this.x, this.y + 1, '#15121a', 20);
    if (this.kind === 'fridge') FX.add({ kind: 'shard', x: this.x, y: this.y, z: 16, vx: 2.5, vz: 3, life: 60, color: '#d8d4c4', size: 8, rot: 0, spin: 0.25, g: 0.24, ground: this.y });
    if (this.drop && this.drop !== 'none') {
      const it = Game.add(new Item(this.drop, this.x, this.y + 1, 2.0));
      it.vx = rr(-0.4, 0.4);
    }
  }
  update(bounds) {
    if (this.wob > 0) this.wob--;
    if (this.flash > 0) this.flash--;
    if (this.hs > 0) { this.hs--; return; }
    if (this.fuse > 0) {
      this.fuse++;
      if (this.fuse > 10) {
        this.remove = true; this.solidRect.off = true;
        Game.explode(this.x, this.y, this.igniter || Game.player, { r: 36, depth: 14, dmg: 30, pdmg: 20 });
      }
    }
  }
  draw(ctx, camX) {

        break;

        Px.rect(4, -20, 3, 20, c[1]);
        Px.rect(-7, -15, 14, 2, c[1]); Px.rect(-7, -6, 14, 2, c[1]);
        Px.poly([-7, -21, 7, -21 - tilt, 7, -19 - tilt, -7, -19], shade(c[0], 0.3));

      case 'trunk':

// Burning oil barrel: a solid, unbreakable hazard. Touching the flame: 6 dmg + knockdown to anyone.
// A knocked-down enemy landing in it takes 10.
class BurningBarrel extends Ent {
  constructor(x, y) {
    super(x, y);
    this.team = 'hazard'; this.w = 7; this.h = 20; this.shadowR = 9;
    this.ticks = new Map();
    Game.solids.push({ x0: x - 7, x1: x + 7, y0: y - 4, y1: y + 4, h: 30, splat: true });
  }
  update() {
    this.t++;
    if (this.t % 3 === 0) FX.fire(this.x, this.y, 22, 1);
    if (this.t % 9 === 0) FX.embers(this.x, this.y, 24, 1);
    const victims = [Game.player, ...Game.foes()].filter(Boolean);
    for (const v of victims) {
      if (!v.vulnerable && !(v.state === 'fall' && v.team === 'enemy')) continue;
      if (Math.abs(v.y - this.y) > 6 || Math.abs(v.x - this.x) > 10 + v.w * 0.5) continue;
      const last = this.ticks.get(v.id) || -99;
      if (this.t - last < 30) continue;
      if (v.state === 'fall' && v.team === 'enemy' && v.z < 30) {
        this.ticks.set(v.id, this.t);
        v.hp = Math.max(0, v.hp - 10); v.burn = 40; v.flash = 2;
        FX.fire(v.x, v.y, 10, 4); Sound.sfx('fire', v.x);
        if (v.hp <= 0 && !v.dying) v.onDeath(Game.player, {}, 1);
        continue;
      }
      if (v.z > 28) continue;
      if (!v.vulnerable) continue;
      this.ticks.set(v.id, this.t);
      v.takeHit(v.team === 'player' ? this : Game.player, { dmg: 6, tier: 2, knock: true, kx: 2.0, kz: 2.8, burn: 40, zr: [0, 40], sfx: 'fire' }, v.x < this.x ? -1 : 1);
    }
  }
  draw(ctx, camX) {
    Sprite.begin(40, 56, 20, 50);
    Px.rect(-7, -20, 14, 20, '#4a3a30');
    Px.rect(-7, -20, 3, 20, '#5e4a3a');
    Px.rect(-7, -15, 14, 2, '#2a2020'); Px.rect(-7, -6, 14, 2, '#2a2020');
    Px.rect(-7, -21, 14, 2, '#2a2020');
    for (let i = -2; i <= 2; i++) {
      const h = 7 + Math.sin(Game.frame * 0.35 + i * 1.9) * 3 + (2 - Math.abs(i)) * 3;
      Px.poly([i * 3 - 3, -21, i * 3, -21 - h, i * 3 + 3, -21], (Game.frame >> 2) % 3 === Math.abs(i) % 3 ? '#ffd34a' : i % 2 ? '#ff8a2a' : '#e83b1e');
    }
    Sprite.end(ctx, this.x - camX, this.y, 1, {});
    // glow
    ctx.globalAlpha = 0.12 + 0.05 * Math.sin(Game.frame * 0.3);
    Px.use(ctx); Px.disc(this.x - camX, this.y - 30, 18, '#ff8a2a');
    ctx.globalAlpha = 1;
  }
}

  pipe:    { weapon: 'pipe', label: 'LEAD PIPE' },
  machete: { weapon: 'machete', label: 'MACHETE' },
  axe:     { weapon: 'axe', label: 'STOP-SIGN AXE' },
  molotov: { weapon: 'molotov', label: 'MOLOTOV' },
};
class Item extends Ent {
  constructor(kind, x, y, pop = 0) {
    super(x, y);
    this.kind = kind;
    this.team = 'item';
    this.vz = pop; this.z = pop ? 1 : 0;
    this.vx = pop ? rr(-0.6, 0.6) : 0;
    this.w = 8; this.h = 8;
    this.shadowR = 5;
    const d = ITEM_DEFS[kind];
    this.life = d.food || d.life ? Infinity : d.score ? 600 : 60 * 60;
  }
  update(bounds) {
    this.t++;
    if (this.z > 0 || this.vz) {
      this.z += this.vz; this.vz -= 0.3; this.x += this.vx;
      if (this.z <= 0) { this.z = 0; this.vz = Math.abs(this.vz) > 1.2 ? -this.vz * 0.4 : 0; this.vx *= 0.5; if (!this.vz) this.vx = 0; }
    }
    this.y = clamp(this.y, bounds.yMin, bounds.yMax);
    if (--this.life <= 0) this.remove = true;
  }
  collect(pl) {
    const d = ITEM_DEFS[this.kind];
    this.remove = true;
    if (d.heal) { pl.hp = Math.min(pl.maxHp, pl.hp + d.heal); pl.grey = Math.min(pl.grey, pl.maxHp - pl.hp); if (d.cleanse) { pl.grey = 0; pl.venom = 0; pl.burn = 0; } Sound.sfx('food'); }
    if (d.weapon) { pl.giveWeapon(d.weapon); if (this.uses) pl.weapon.uses = this.uses; Sound.sfx('weapon'); }
    if (d.score) { Game.addScore(d.score); Sound.sfx('pickup'); }
    if (d.life) { Game.lives++; Sound.sfx('oneUp'); }

  }
  draw(ctx, camX) {
    if (this.life < 120 && (this.life >> 2) % 2) return;
    const sx = this.x - camX, sy = this.y - this.z;
    const bob = this.z === 0 ? Math.round(Math.sin(Game.frame * 0.1 + this.id) * 1) : 0;
    Sprite.begin(48, 40, 24, 34);
    drawItemIcon(this.kind, 0, 0, this.t);

    if (ITEM_DEFS[this.kind].weapon && this.t % 40 < 3) { Px.use(ctx); Px.rect(sx + 4, sy - 6 + bob, 3, 1, '#fff'); Px.rect(sx + 5, sy - 7 + bob, 1, 3, '#fff'); }
  }
}

// Projectiles. friendly: hits enemies (thrown by the player); otherwise hits the player.
// opts: { kind, vx, vz, dmg, tier, owner, gravity, knock, life, friendly, pierce, burn, venom, target }
class Proj extends Ent {
  constructor(x, y, z, o) {
    super(x, y);
    Object.assign(this, { kind: 'rock', dmg: 8, tier: 1, gravity: 0.2, knock: false, life: 180, friendly: false, pierce: 0 }, o);
    this.z = z;
    this.team = 'proj';
    this.shadowR = 4;
    this.w = 5; this.h = 8;
    this.hitIds = new Set();
  }
  update(bounds) {
    this.t++;
    this.x += this.vx; this.y += this.vy || 0; this.z += this.vz; this.vz -= this.gravity;
    if (this.kind === 'molotov' && this.t % 3 === 0) FX.fire(this.x, this.y, this.z + 4, 1);
    if (this.kind === 'glob' && this.t % 2 === 0) FX.add({ kind: 'drop', x: this.x, y: this.y, z: this.z, life: 10, color: this.color || '#7cff4f', g: 0 });
    const a = { dmg: this.dmg, tier: this.tier, knock: this.knock, kx: 2.4, kz: 3, kb: 1.4, stun: 18, burn: this.burn, venom: this.venom, sfx: this.hitSfx, zr: [0, 60] };
    if (this.friendly) {
      for (const e of Game.ents) {
        if ((e.team !== 'enemy' && e.team !== 'prop') || !e.vulnerable || this.hitIds.has(e.id)) continue;
        if (Math.abs(e.y - this.y) < 9 && Math.abs(e.x - this.x) < e.w + this.w && this.z < e.z + e.h + 4 && this.z + this.h > e.z) {
          this.hitIds.add(e.id);
          e.takeHit(this.owner || Game.player, a, sign(this.vx) || 1);
          if (this.kind === 'molotov') { this.burst(); return; }
          if (this.pierce-- <= 0) { this.onImpact(); this.remove = true; return; }
        }
      }
    } else {
      const p = Game.player;
      if (p && p.vulnerable && Math.abs(p.y - this.y) < (this.depth || 8) && Math.abs(p.x - this.x) < p.w + this.w && this.z < p.z + p.h && this.z + this.h > p.z) {
        p.takeHit(this, a, sign(this.vx) || (p.x > this.x ? 1 : -1));
        if (this.kind === 'molotov') { this.burst(); return; }
        this.onImpact();
        this.remove = true;
        return;
      }
    }
    if (this.z <= 0) { this.z = 0; if (this.kind === 'molotov') { this.burst(); return; } this.onImpact(); this.remove = true; return; }
    if (--this.life <= 0 || this.x < Game.cam.x - 60 || this.x > Game.cam.x + W + 60) {
      if (this.kind.startsWith('thrown_')) this.onImpact();
      this.remove = true;
    }
  }
  burst() {
    this.remove = true;
    Sound.sfx('glass', this.x);
    Sound.sfx('fire', this.x);
    Game.add(new FirePatch(this.x, this.y, 90, 'both', 6, this.owner));
  }
  onImpact() {
    if (this.kind === 'glob') {
      FX.splat(this.x, this.y, Math.max(2, this.z), this.color || '#7cff4f', 6, sign(this.vx));
      if (this.puddle) Game.add(new AcidPool(this.x, this.y, this.puddle, this.color));
    } else if (this.kind.startsWith('thrown_')) {
      FX.shards(this.x, this.y, Math.max(4, this.z), 4, ['#8a8f96', '#5e6168']);
    } else if (this.kind === 'lid') {
      FX.dust(this.x, this.y, 2, 0.5);
    } else {
      FX.debris(this.x, this.y, Math.max(1, this.z), ['#6b5a48', '#8a7660'], 4);
    }
  }
  draw(ctx, camX) {
    Px.use(ctx);

    switch (this.kind) {
      case 'molotov':
        Px.line(sx - Math.cos(a) * 3, sy - 4 - Math.sin(a) * 3, sx + Math.cos(a) * 3, sy - 4 + Math.sin(a) * 3, 2, '#4a7a3a');

      case 'glob':
        Px.disc(sx, sy - 3, 3, this.color || '#7cff4f'); Px.dot(sx - 1, sy - 4, '#e2ffb0');
        break;
      case 'lid':
        Px.oval(sx, sy - 3, 6, 2 + Math.abs(Math.sin(a)) * 3, '#9aa0a8');
        break;
      case 'thrown_pipe':
        Px.line(sx - Math.cos(a) * 9, sy - 6 - Math.sin(a) * 9, sx + Math.cos(a) * 9, sy - 6 + Math.sin(a) * 9, 2, '#8a8f96');
        break;
      case 'thrown_axe':
        Px.line(sx - Math.cos(a) * 9, sy - 6 - Math.sin(a) * 9, sx + Math.cos(a) * 9, sy - 6 + Math.sin(a) * 9, 2, '#8a8f96');
        Px.disc(sx + Math.cos(a) * 10, sy - 6 + Math.sin(a) * 10, 5, '#c8282e');
        break;
      case 'thrown_machete':
        Px.line(sx - Math.cos(a) * 3, sy - 6 - Math.sin(a) * 3, sx + Math.cos(a) * 3, sy - 6 + Math.sin(a) * 3, 3, '#3a2a1a');
        Px.line(sx + Math.cos(a) * 3, sy - 6 + Math.sin(a) * 3, sx + Math.cos(a) * 11, sy - 6 + Math.sin(a) * 11, 3, '#d8dce0');
        break;
      case 'knife':
        Px.line(sx - Math.cos(a) * 4, sy - 4 - Math.sin(a) * 4, sx + Math.cos(a) * 4, sy - 4 + Math.sin(a) * 4, 1, '#e8ecef');
        break;
      default:
        Px.disc(sx, sy - 3, 3, '#6b5a48'); Px.dot(sx - 1, sy - 4, '#8a7660');
    }
  }
}

// Burning ground. hurts: 'player' | 'enemy' | 'both'. Damage ticks every 15f per victim.
class FirePatch extends Ent {
  constructor(x, y, life = 90, hurts = 'both', dmg = 6, owner = null, w = 20) {
    super(x, y);
    this.team = 'hazard';
    this.life = life; this.w = w; this.hurts = hurts; this.dmg = dmg; this.owner = owner;
    this.shadowR = 0;
    this.ticks = new Map();
  }
  update() {
    this.t++;
    if (this.t % 2 === 0) FX.fire(this.x + rr(-this.w, this.w), this.y + rr(-2, 2), 0, 1);
    if (this.t % 20 === 0) Sound.sfx('fire', this.x);
    const victims = [];
    if (this.hurts !== 'enemy' && Game.player) victims.push(Game.player);
    if (this.hurts !== 'player') victims.push(...Game.foes());
    for (const v of victims) {
      if (!v.vulnerable || v.z > 6 || Math.abs(v.y - this.y) > 6 || Math.abs(v.x - this.x) > this.w + v.w) continue;
      const last = this.ticks.get(v.id) || -99;
      if (this.t - last < 30) continue;
      this.ticks.set(v.id, this.t);
      v.takeHit(v.team === 'player' ? this : (this.owner || Game.player), { dmg: this.dmg, tier: 2, stun: 16, kb: 0.8, burn: 40, zr: [0, 20], sfx: 'fire' }, v.x < this.x ? -1 : 1);
      if (v.team === 'enemy' && v.family === 'gang' && v.setPanic) v.setPanic(60);
    }
    if (this.t > this.life) this.remove = true;
  }
  sortY() { return this.y - 12; }
  draw(ctx, camX) {
    Px.use(ctx);
    const sx = this.x - camX;
    const fade = Math.min(1, (this.life - this.t) / 20);
    ctx.globalAlpha = 0.45 * fade;
    Px.oval(sx, this.y, this.w + 2, 3, '#e2541b');
    ctx.globalAlpha = fade;
    const n = Math.max(2, Math.round(this.w / 6));
    for (let i = -n; i <= n; i++) {
      const fx = sx + i * (this.w / n);
      const h = 5 + Math.sin(Game.frame * 0.3 + i * 1.7) * 3;
      Px.poly([fx - 3, this.y, fx, this.y - h - 3, fx + 3, this.y], i % 2 ? '#ff8a1e' : '#e83b1e');
      Px.poly([fx - 1, this.y, fx, this.y - h * 0.5 - 1, fx + 1, this.y], '#ffe066');
    }
    ctx.globalAlpha = 1;
  }
}

// Acid puddle from spit globs.
class AcidPool extends Ent {
  constructor(x, y, life, color = '#7cff4f', hurts = 'player', dmg = 4) {
    super(x, y);
    this.team = 'hazard'; this.life = life; this.color = color; this.w = 12; this.hurts = hurts; this.dmg = dmg;
    this.shadowR = 0; this.ticks = new Map();
  }
  update() {
    this.t++;
    const victims = [];
    if (this.hurts !== 'enemy' && Game.player) victims.push(Game.player);
    if (this.hurts === 'both') victims.push(...Game.foes());
    for (const v of victims) {
      if (!v.vulnerable || v.z > 3 || Math.abs(v.y - this.y) > 4 || Math.abs(v.x - this.x) > this.w + v.w * 0.5) continue;
      const last = this.ticks.get(v.id) || -99;
      if (this.t - last < 20) continue;
      this.ticks.set(v.id, this.t);
      if (v.team === 'player' && v.chip) { v.chip(this.dmg); }
      else { v.hp = Math.max(0, v.hp - this.dmg); v.flash = 2; }
      FX.add({ kind: 'bubble', x: v.x, y: v.y, z: 4, vz: 0.6, g: 0, life: 20, color: this.color });
      Sound.sfx('hiss', v.x);
      if (v.hp <= 0) { if (v.team === 'player') { if (v.state !== 'fall' && v.state !== 'down') v.knockDown(1, 1, 2); } else if (!v.dying) { v.onDeath(Game.player, {}, 1); v.knockDown(1, 1, 2); } }
    }
    if (this.t % 12 === 0) FX.add({ kind: 'bubble', x: this.x + rr(-this.w, this.w), y: this.y, z: 0, vz: 0.3, g: 0, life: 16, color: this.color });
    if (this.t > this.life) this.remove = true;
  }
  sortY() { return this.y - 30; }
  draw(ctx, camX) {
    Px.use(ctx);
    const a = Math.min(1, (this.life - this.t) / 30) * 0.6;
    ctx.globalAlpha = a;
    Px.oval(this.x - camX, this.y, this.w, 4, this.color);
    ctx.globalAlpha = 1;
  }
}

// ---- 71_stage1.js ----
// Stage 1: RUST ROW. Dusk scrap town, world x 0..2688, depth band y 134..200.
// Parallax: sky 0, far skyline 0.1, mid container shanties 0.35, back wall + floor 1.0, foreground 1.3.
// Static layers are painted once into offscreen canvases; per frame only lights, flames and smoke animate.
// Set pieces: tutorial strip (W1), BIKER RUN (lock 960), SLAB (lock 1344), THE BURNING BUS (W3, lock 1824),
// SOMETHING UNDER THE ROAD (x 2150, no lock) and BIG DIESEL behind the skull garage door (lock 2304).

(function s1_module() {

  const SKY = [[0, '#1e1230'], [40, '#6a2a3e'], [80, '#d2553a'], [110, '#f2a04a']];
  const COL = {
    sun: '#ffc46a', skyline: '#3a1e36', skyRim: '#5a2a48', win: '#ffb04a', beacon: '#ff3b30',
    cont: ['#5a2e2a', '#7a4a34', '#4a3a44'], pole: '#24141c', wire: '#1a0c12',
    fence: ['#5a4636', '#6b5440'], ridge: '#4a3828', rim: '#b08460', paint: '#e8e0d0', door: '#1a1012',

    fire: '#ff8a2a', fireHi: '#ffe066', fireDk: '#e83b1e', bulb: '#ffd27a', fg: '#140c0e',
    bus: '#d9a12b', busDk: '#a8761c', busHi: '#ecc25a', stripe: '#1a1414', busWin: '#ff8a1c', smoke: '#4a4040', husk: '#1e1616',
  };
  // The spec puts the sun at screen (290, 96), which the back wall (y 70..134) would hide completely,
  // so it sits higher, low over the skyline, with its three cut bands at the same offsets (-4, +2, +8).
  const SUN = { x: 290, y: 56, r: 22 };
  const DOORS = [560, 1000, 1880, 2360];          // back-wall doorways (centre x), 20x40
  const SKULLS = [80, 480, 880, 1280, 1680, 2080]; // jackal graffiti every 400 px (2480 is the giant garage skull)
  const SIGN_X = 300;
  const GARAGE = { x: 2496, w: 112, top: 76, fx0: 2424, fx1: 2568 };
  const BUS = { x0: 1900, x1: 2020, cx: 1960, door: 1912, lock: 1824 };
  const BEAT_X = 2150;
  const FAR_H = 112, FAR_BASE = 106, MID_H = 100, WALL_Y0 = 48, WALL_H = 94, FLOOR_Y0 = 134, FLOOR_H = 90;

  // ---------- helpers ----------
  function mix(a, b, t) {

  }
  function skyAt(y) {
    if (y <= SKY[0][0]) return SKY[0][1];
    for (let i = 1; i < SKY.length; i++) {
      if (y <= SKY[i][0]) return mix(SKY[i - 1][1], SKY[i][1], (y - SKY[i - 1][0]) / (SKY[i][0] - SKY[i - 1][0]));
    }

  }
  // Local deterministic RNG for scenery (never touches the game's seeded rand()).
  function mkRng(seed) {

  // Stage-local runtime state (reset in setup).
  const S = { bus: null, beat: null, tutT: 0, garage: { k: 0, opening: false }, bw: null, lastFrame: -1, cleanT: 0 };
  const cache = { sky: null, far: null, mid: null, wall: null, floor: null, garageDoor: null };

  // ---------- L0 sky (parallax 0) ----------
  const SKY_Y0 = -8, SKY_H = 132;
  function buildSky() {
    const { cv, g } = mkCanvas(W + 16, SKY_H);
    g.translate(8, -SKY_Y0);
    Px.use(g);
    // gradient in 3 px bands with a checker-dithered seam row between bands
    const BAND = 3;
    for (let y = SKY_Y0; y < SKY_Y0 + SKY_H; y++) {
      const b = Math.floor((y - SKY_Y0) / BAND);
      const c = skyAt(SKY_Y0 + b * BAND + 1);
      if ((y - SKY_Y0) % BAND === 0 && b > 0) {

    for (let i = 0; i < 18; i++) {
      const x = Math.floor(hash(i * 3 + 1) * W), y = 2 + Math.floor(hash(i * 3 + 2) * 30);
      Px.dot(x, y, hash(i * 3 + 3) < 0.3 ? '#c8a0c0' : '#7a5a8a');
    }
    // sun halo, disc and cut bands
    withAlpha(g, 0.10, () => Px.disc(SUN.x, SUN.y, SUN.r + 14, '#ff9a4a'));
    withAlpha(g, 0.16, () => Px.disc(SUN.x, SUN.y, SUN.r + 7, '#ffb05a'));
    for (let dy = -SUN.r; dy <= SUN.r; dy++) {
      const w = Math.sqrt(SUN.r * SUN.r - dy * dy);
      if (w < 0.5) continue;
      const c = dy < -13 ? '#ffe4a0' : dy < -5 ? '#ffd383' : COL.sun;
      Px.rect(Math.round(SUN.x - w), SUN.y + dy, Math.round(w * 2), 1, c);
    }
    for (const d of [-4, 2, 8]) {
      for (let k = 0; k < 2; k++) {
        const dy = d + k, w = Math.sqrt(Math.max(0, SUN.r * SUN.r - dy * dy)) + 1;
        Px.rect(Math.round(SUN.x - w), SUN.y + dy, Math.round(w * 2), 1, skyAt(SUN.y + dy));
      }
    }
    // thin streak clouds, lit from below
    const clouds = [[18, 30, 96], [150, 41, 70], [236, 49, 128], [318, 36, 60], [40, 58, 110]];
    for (const [x, y, w] of clouds) {
      const c = mix(skyAt(y), '#2a1030', 0.5);
      Px.poly([x, y + 1, x + 7, y - 1, x + w - 12, y - 1, x + w, y + 1, x + w - 8, y + 2, x + 5, y + 2], c);
      withAlpha(g, 0.55, () => Px.rect(x + 6, y + 2, w - 16, 1, '#ff9a5a'));

  }

  // ---------- L1 far skyline (parallax 0.1) ----------
  function buildFar() {
    const wpx = Math.round((LEN - W) * 0.1) + W + PAD * 2;
    const { cv, g } = mkCanvas(wpx, FAR_H);
    g.translate(PAD, 0);
    Px.use(g);
    const r = mkRng(0x51a7);
    const n = 14, span = wpx - PAD * 2 + 24;
    const tops = [];
    for (let i = 0; i < n; i++) {
      const bw = 20 + Math.floor(r() * 31), bh = 30 + Math.floor(r() * 51);
      let x = Math.round(-12 + (i + 0.5) * span / n - bw / 2 + (r() - 0.5) * 18);
      if (x + bw > SUN.x - 16 && x < SUN.x + 12) x = x + bw / 2 < SUN.x ? SUN.x - 16 - bw : SUN.x + 12; // a gap for the sun
      const top = FAR_BASE - bh;
      const pts = [x, FAR_BASE + 4];
      const k = 2 + Math.floor(r() * 3);
      const edge = [];
      for (let j = 0; j <= k; j++) {
        const px = x + Math.round(bw * j / k), py = top + Math.round(j === 0 || j === k ? r() * 4 : r() * 10 - 3);
        pts.push(px, py); edge.push(px, py);
      }
      pts.push(x + bw, FAR_BASE + 4);
      Px.poly(pts, COL.skyline);
      for (let j = 0; j + 3 < edge.length; j += 2) Px.line(edge[j], edge[j + 1], edge[j + 2], edge[j + 3], 1, COL.skyRim);
      // exposed girders on broken towers
      if (r() < 0.3) for (let b = 0; b < 3; b++) { const gx = x + 3 + Math.floor(r() * (bw - 6)); Px.line(gx, top + 2, gx + Math.round(r() * 4 - 2), top - 3 - Math.floor(r() * 6), 1, COL.skyline); }

      }
      tops.push({ x, bw, top });
    }
    // leaning radio mast on a low roof
    const host = tops.slice(2, 7).sort((a, b) => b.top - a.top)[0];
    const bx = host.x + Math.round(host.bw / 2), by = host.top + 2;
    const hgt = Math.max(24, Math.min(46, by - 28)), ax = bx + Math.round(hgt * 0.2), ay = by - hgt;
    Px.line(bx - 4, by, ax - 1, ay, 1, COL.skyline);
    Px.line(bx + 4, by, ax + 1, ay, 1, COL.skyline);
    const steps = Math.floor(hgt / 5);
    for (let s = 0; s < steps; s++) {

    withAlpha(g, 0.6, () => { Px.line(ax, ay + 4, bx - 22, by + 4, 1, COL.skyline); Px.line(ax, ay + 4, bx + 24, by + 6, 1, COL.skyline); });
    mastTop = { x: ax, y: ay - 6 };
    return cv;
  }

  // ---------- L2 mid shanties (parallax 0.35) ----------
  function container(x, y, col, r) {

    Px.rect(x, y + 1, 40, 1, shade(col, 0.12));
    Px.rect(x, y + 17, 40, 1, shade(col, -0.45));
    Px.rect(x, y, 1, 18, shade(col, -0.35)); Px.rect(x + 39, y, 1, 18, shade(col, -0.35));

    if (f < 0.4) { // lit hut window
      const wx = x + 5 + Math.floor(r() * 26);
      Px.rect(wx - 1, y + 4, 8, 7, shade(col, -0.55));
      Px.rect(wx, y + 5, 6, 5, COL.bulb);
      Px.rect(wx + 3, y + 5, 1, 5, shade(col, -0.55)); Px.rect(wx, y + 7, 6, 1, shade(col, -0.55));
      withAlpha(Px.g, 0.18, () => Px.rect(wx - 3, y + 11, 12, 3, COL.bulb));
    } else if (f < 0.6) {
      const dx = x + 4 + Math.floor(r() * 28);
      Px.rect(dx, y + 4, 7, 14, '#1a0e12'); Px.rect(dx, y + 4, 7, 1, shade(col, 0.2));
    }
    if (r() < 0.6) withAlpha(Px.g, 0.4, () => Px.oval(x + 6 + r() * 28, y + 6 + r() * 8, 3 + r() * 4, 2 + r() * 2, '#8c5a3c'));
  }
  function stackAt(x, base, n, r) {
    let top = base, lx = x;
    for (let j = 0; j < n; j++) {
      lx = x + (j ? Math.round((r() - 0.5) * 12) : 0);

    }

    const yl = top + (lean ? -6 : 1), yr = top + (lean ? 1 : -6);
    Px.poly([lx - 4, yl, lx + 44, yr, lx + 44, yr + 3, lx - 4, yl + 3], roof);
    Px.line(lx - 4, yl, lx + 44, yr, 1, '#c8784a');
    // rooftop junk
    const j = r();

      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  // Random-walk crack polyline.
  function crackLine(R, x, y, segs, col, y0 = 136, y1 = 214) {

      a += (R() - 0.5) * 1.4;

  const duneTop = x => Math.round(113 + 5 * Math.sin(x * 0.011) + 3 * Math.sin(x * 0.027 + 1.3) + 1.5 * Math.sin(x * 0.067 + 0.4));
  const sandDepth = x => {

  // ---------- cached static layers ----------
  const cache = {};
  const MESA_W = 900, L2_W = 1240, L2_Y = 34, L2_H = 92, HW_Y = 84, CR_Y = 40, CR_W = 700;

  function buildSky() {

    const stops = [[0, C.sky0], [58, C.sky1], [118, C.sky2], [128, C.sky2]];
    const at = y => {
      for (let i = 0; i < stops.length - 1; i++) {
        const [y0, c0] = stops[i], [y1, c1] = stops[i + 1];
        if (y <= y1) return mix(c0, c1, clamp((y - y0) / (y1 - y0), 0, 1));
      }

    };
    const B = 8;
    for (let b = 0; b * B < 128; b++) {
      const y0 = b * B, c = at(y0 + B / 2), n = at(y0 + B * 1.5);
      Px.rect(0, y0, W, B, c);
      for (let x = 0; x < W; x++) {          // dithered seam into the next band

  // L1: mesas and buttes (drawn in screen coords, canvas row 0 = screen y 60).
  function buildMesas() {
    const { cv, g } = canvas(MESA_W, 64);
    g.translate(0, -60);
    Px.use(g);
    const R = rng(0x5A11);
    const haze = C.sky1;
    // pale far plain under the mesas
    Px.rect(0, 112, MESA_W, 12, mix(C.dune, C.sky2, 0.35));
    for (const row of [0, 1]) {
      let x = row ? -10 : 10;
      while (x < MESA_W) {
        const butte = R() < 0.28;
        const w = butte ? 10 + R() * 12 : 46 + R() * (row ? 100 : 80);
        const top = Math.round(butte ? 74 + R() * 10 : (row ? 82 + R() * 10 : 68 + R() * 12));
        const base = row ? 118 : 113, hz = row ? 0.05 : 0.5;
        // a lower shoulder on one side gives the stepped silhouette
        if (!butte && R() < 0.6) {
          const left = R() < 0.5, sw = w * (0.3 + R() * 0.25), st = top + 5 + Math.round(R() * 6);
          if (left) drawMesa(x - sw * 0.7, x + 6, st, base, hz, haze, R);
          else drawMesa(x + w - 6, x + w + sw * 0.7, st, base, hz, haze, R);
        }
        drawMesa(x, x + w, top, base, hz, haze, R);
        x += w + (row ? 30 + R() * 110 : 24 + R() * 60);
      }
    }
    // horizon haze
    g.globalAlpha = 0.35;
    Px.rect(0, 111, MESA_W, 3, C.sky1);
    g.globalAlpha = 0.2;
    Px.rect(0, 105, MESA_W, 6, C.sky1);
    g.globalAlpha = 1;

  }
  function drawMesa(x0, x1, top, base, hazeK, haze, R) {
    const lit = mix(C.mesa, haze, hazeK), dark = mix(C.mesaShade, haze, hazeK);
    const cap = shade(lit, 0.14), capD = shade(dark, 0.08);
    const talL = mix(lit, C.dune, 0.3), talD = mix(dark, C.dune, 0.18);
    const strL = shade(lit, -0.06), strD = shade(dark, -0.06), gully = shade(lit, -0.1);
    const capH = 2 + Math.floor(R() * 2);
    const cliffB = Math.round(top + (base - top) * (0.5 + R() * 0.2));
    const apL = 5 + R() * 12, apR = 5 + R() * 12, split = 0.5 + R() * 0.2, ph = R() * 6;
    for (let y = top; y <= base; y++) {
      let L, Rr, talus = false;
      if (y <= cliffB) {
        const k = (y - top) / Math.max(1, cliffB - top);
        L = x0 + (1 - k) * 1.5; Rr = x1 - (1 - k) * 1.5;
      } else {
        const k = Math.pow((y - cliffB) / Math.max(1, base - cliffB), 0.75);
        L = x0 - apL * k; Rr = x1 + apR * k; talus = true;
      }
      const Sx = Math.round(lerp(L, Rr, split) + Math.sin(y * 0.35 + ph) * 1.2);
      const strata = !talus && y > top + capH && (y - top) % 5 === 0 && hash(y * 7 + x0) > 0.3;
      let cl = talus ? talL : strata ? strL : lit, cd = talus ? talD : strata ? strD : dark;
      if (y < top + capH) { cl = cap; cd = capD; }
      Px.rect(L, y, Sx - L, 1, cl);
      Px.rect(Sx, y, Rr - Sx, 1, cd);
    }
    // gullies down the lit face, carrying on as streaks across the talus
    const n = Math.max(1, Math.floor((x1 - x0) / 14));
    for (let i = 0; i < n; i++) {
      const gx = Math.round(lerp(x0 + 3, lerp(x0, x1, split) - 3, (i + 0.3 + R() * 0.4) / n));
      const y0 = top + capH + 1 + Math.floor(R() * 3), y1 = cliffB - Math.floor(R() * 4);
      Px.rect(gx, y0, 1, y1 - y0, gully);
      Px.rect(gx, cliffB + 1, 1, Math.max(1, (base - cliffB) * 0.5), mix(talL, gully, 0.5));
    }
  }

  // L2: overpass, airliner tail, Joshua trees, dead poles (canvas row 0 = screen y 34).
  function buildL2() {
    const { cv, g } = canvas(L2_W, L2_H);
    g.translate(0, -L2_Y);
    Px.use(g);
    const R = rng(0x0B12);
    const GY = 118;
    const far = mix(C.dune, C.sky1, 0.3);
    // low far dunes
    for (let x = 0; x < L2_W; x++) {
      const t = Math.round(112 + 3 * Math.sin(x * 0.019 + 1) + 2 * Math.sin(x * 0.051));
      Px.rect(x, t, 1, 126 - t, far);
      if (Math.sin(x * 0.019 + 1) * 0.057 + Math.cos(x * 0.051) * 0.1 > 0.05) Px.dot(x, t + 1, shade(far, -0.06));

    for (const px of poles) {
      const lean = (hash(px) - 0.5) * 4;

    for (let i = 0; i < poles.length - 1; i++) {
      const a = poles[i], b = poles[i + 1];

      Px.rect(x + 2, top, 3, GY - top, shade(C.over, -0.22));
      Px.rect(x - 10, top - 4, 20, 4, C.over);

    };

      Px.rect(x0, deckY, x1 - x0, 8, C.over);
      Px.rect(x0, deckY, x1 - x0, 1, C.overLit);
      Px.rect(x0, deckY + 6, x1 - x0, 2, shade(C.over, -0.32));
      Px.rect(x0, deckY - 4, x1 - x0, 1, C.overLit);
      for (let x = x0 + 2; x < x1; x += 6) Px.rect(x, deckY - 4, 1, 4, shade(C.over, -0.08));
      for (let x = x0 + 30; x < x1; x += 40) Px.rect(x, deckY + 1, 1, 5, shade(C.over, -0.16));
    };
    const rebar = (x, y, dir) => {
      for (let i = 0; i < 4; i++) {
        const yy = y + 1 + i * 2, l = 5 + hash(x * 3 + i) * 9;
        Px.line(x, yy, x + dir * l, yy + 2 + i, 1, C.crack);
        Px.dot(x + dir * l, yy + 3 + i, shade(C.crack, -0.3));

    };
    pillar(150, deckY + 8); pillar(270, deckY + 8);
    deck(96, 330);
    // jagged snapped end (right) + rebar
    g.clearRect(326, deckY - 4, 4, 3); g.clearRect(328, deckY + 3, 2, 5); g.clearRect(324, deckY + 6, 6, 2);
    rebar(329, deckY, 1);

    Px.quad(339, deckY + 4, 391, GY - 5, 2, 2, C.overLit);
    Px.quad(342, deckY + 10, 393, GY + 1, 3, 3, shade(C.over, -0.3));
    rebar(338, deckY + 2, -1);
    for (let i = 0; i < 7; i++) Px.rect(380 + hash(i * 11) * 30, GY - 2 - hash(i * 5) * 3, 3 + hash(i) * 4, 3, i % 2 ? C.over : shade(C.over, -0.2));

    g.clearRect(412, deckY - 4, 3, 4); g.clearRect(412, deckY + 4, 2, 4);
    rebar(413, deckY, -1);
    Px.poly([560, deckY, 600, GY - 2, 560, GY - 2], shade(C.over, -0.1));
    Px.poly([560, deckY, 562, deckY, 604, GY - 2, 600, GY - 2], C.overLit);
    // airliner tail, half-buried

    // overpass B fragment: one pillar holding a tilted chunk

    Px.quad(1004, deckY + 14, 1076, deckY + 5, 8, 8, C.over);
    Px.quad(1004, deckY + 11, 1076, deckY + 2, 2, 2, C.overLit);
    Px.quad(1005, deckY + 18, 1077, deckY + 9, 2, 2, shade(C.over, -0.32));
    rebar(1076, deckY + 2, 1); rebar(1004, deckY + 11, -1);

  }
  function drawFin(x, gy) {
    const fin = C.fin, finD = shade(fin, -0.16), finL = shade(fin, 0.22);
    // fuselage tail cone sticking out of the sand
    Px.quad(x - 40, gy - 3, x + 24, gy - 13, 18, 8, fin);
    Px.quad(x - 40, gy + 3, x + 24, gy - 10, 6, 2, finD);
    Px.quad(x - 40, gy - 9, x + 24, gy - 16, 2, 1, finL);

    Px.poly([xr(s0 - 6) - 5, s0 - 6, xr(s0 - 6), s0 - 6, xr(s1 - 6), s1 - 6, xr(s1 - 6) - 4, s1 - 6], shade(C.stripe, -0.25));
    // panel lines

  function joshua(x, gy, h, R) {
    const c = C.joshua, d = shade(c, -0.3), l = shade(c, 0.18);
    const tx = x + (R() - 0.5) * 3, ty = gy - h * 0.55;
    Px.line(x, gy, tx, ty, 2, c);
    Px.line(x - 1, gy, tx - 1, ty, 1, l);
    const arms = 2 + Math.floor(R() * 2);
    for (let i = 0; i < arms; i++) {
      const dir = i % 2 ? 1 : -1;
      const mx = tx + dir * (3 + R() * 4), my = ty - 2 - R() * 4;
      const ex = mx + dir * (1 + R() * 3), ey = gy - h + R() * 5;

      for (let k = 0; k < 6; k++) {
        const a = -Math.PI / 2 + (k - 2.5) * 0.5;
        Px.line(ex, ey, ex + Math.cos(a) * 3, ey + Math.sin(a) * 3, 1, k % 2 ? d : c);

  // L3 + L4 for the whole road: dunes, guardrail, signs, highway (canvas x = world x, row 0 = screen y 96).
  function buildHighway() {
    const { cv, g } = canvas(LEN, H - HW_Y);
    g.translate(0, -HW_Y);
    Px.use(g);
    const R = rng(0xD00D);
    const duneFar = mix(C.dune, C.sky1, 0.3), duneLit = shade(C.dune, 0.2), duneShade = shade(C.dune, -0.1);
    // back dune row
    for (let x = 0; x < LEN; x++) {
      const t = Math.round(105 + 5 * Math.sin(x * 0.0083 + 2) + 3 * Math.sin(x * 0.023 + 0.5));
      Px.rect(x, t, 1, 134 - t, duneFar);
      Px.dot(x, t, shade(duneFar, 0.15));
    }
    // front dune line (L3): lit crests, shaded lee slopes, ripples

    for (let x = 0; x < LEN; x++) {
      const t = duneTop(x), sl = (113 + 5 * Math.sin((x + 2) * 0.011) + 3 * Math.sin((x + 2) * 0.027 + 1.3)) - (113 + 5 * Math.sin((x - 2) * 0.011) + 3 * Math.sin((x - 2) * 0.027 + 1.3));

      if (y < 129) { Px.rect(x, y, 2 + Math.round(R() * 3), 1, duneMid); Px.dot(x + 1, y - 1, duneLit); }

      Px.rect(xa, 125, xb - xa, 2, C.rail);
      Px.rect(xa, 127, xb - xa, 1, railDark);
      for (let b = 12; b < 96; b += 24) if (x + b > xa && x + b < xb) Px.dot(x + b, 125, railDark);
      if (bentL) { Px.line(xa, 125, xa - 9, 131, 2, C.rail); Px.dot(xa - 9, 132, railDark); }
      if (bentR) { Px.line(xb, 125, xb + 9, 131, 2, C.rail); Px.dot(xb + 9, 132, railDark); }

    // sand drifts burying the rail
    for (let i = 0; i < LEN / 90; i++) {
      const x = R() * LEN, w = 8 + R() * 18;
      Px.oval(x, 133, w, 3 + R() * 3, C.sand);
      Px.rect(x - w * 0.5, 131, w * 0.8, 1, shade(C.sand, 0.12));
    }

    roadSign(g, 600, 'SPEED', '55');
    roadSign(g, 2318, 'ROAD OUT', null);

    // ---- L4: the bleached highway ----
    const asphLit = shade(C.asphalt, 0.08), asphLit2 = shade(C.asphalt, 0.16), asphDark = shade(C.asphalt, -0.08);
    Px.rect(0, 134, LEN, 82, C.asphalt);
    const bleach = shade(C.asphalt, 0.05);
    for (let i = 0; i < LEN / 80; i++) Px.oval(R() * LEN, 144 + R() * 56, 18 + R() * 40, 3 + R() * 5, bleach);
    for (let i = 0; i < LEN * 1.4; i++) Px.dot(R() * LEN, 134 + R() * 82, R() < 0.55 ? asphDark : asphLit2);
    // worn edge lines
    const edge = shade(C.asphalt, 0.22);
    for (let x = 0; x < LEN; x += 4) {
      if (hash(x * 3 + 1) > 0.4) Px.rect(x, 141, 4, 1, edge);
      if (hash(x * 5 + 7) > 0.35) Px.rect(x, 203, 4, 1, edge);
    }
    // centre dashes
    const dashD = shade(C.dash, -0.18);
    for (let x = 20; x < LEN; x += 64) {
      const h = hash(x * 13 + 5);
      if (h < 0.1) continue;
      const len = h < 0.3 ? 8 + Math.round(h * 40) : 24;
      Px.rect(x, 166, len, 1, C.dash);
      Px.rect(x, 167, len, 1, dashD);

    for (let i = 0; i < 9; i++) {
      const x = 2260 + R() * 760, y = 146 + R() * 52;
      Px.oval(x, y, 6 + R() * 8, 2 + R() * 2, shade(C.asphalt, -0.2));

  // Brood crater floor and walls (canvas x = world x - 2400, row 0 = screen y 40).
  function buildCrater() {
    const { cv, g } = canvas(CR_W, H - CR_Y);
    g.translate(-CRATER_X, -CR_Y);
    Px.use(g);
    const R = rng(0xC2A7);
    const X0 = CRATER_X, X1 = CRATER_X + CR_W;
    const rimLit = shade(C.rim, 0.12), rimDeep = shade(C.rimDark, -0.18);
    const wallTop = x => Math.round(92 + 5 * Math.sin(x * 0.045) + 6 * (vnoise(x / 6) - 0.5) + 3 * Math.sin(x * 0.013 + 1));
    // back wall: slanted sediment strata, darker toward the floor
    const strata = [C.rim, shade(C.rim, -0.07), C.rimDark, shade(C.rim, 0.07), C.rim, shade(C.rimDark, 0.1)];
    for (let x = X0; x < X1; x++) {
      const top = wallTop(x);
      let y = top, cur = null, run = top;
      for (; y <= 134; y++) {
        let c = strata[Math.floor((y + (x - X0) * 0.14 + 3 * Math.sin(x * 0.02)) / 5) % strata.length];
        if (y > 124) c = y > 130 ? rimDeep : C.rimDark;
        if (c !== cur) { if (cur) Px.rect(x, run, 1, y - run, cur); cur = c; run = y; }
      }
      Px.rect(x, run, 1, 135 - run, cur);
    }
    // erosion grooves
    for (let i = 0; i < 16; i++) {
      const x = Math.round(X0 + R() * CR_W), top = wallTop(x), len = 10 + R() * 20;
      Px.rect(x, top + 5, 1, len, shade(C.rimDark, 0.06));
      Px.rect(x + 1, top + 5, 1, len * 0.6, rimLit);
    }
    // the snapped highway along the rim: asphalt slab edge, rebar, a few guardrail posts
    for (let x = X0; x < X1; x++) {
      if (hash(Math.floor(x / 40) * 17 + 3) < 0.18) continue;  // broken-away gaps
      const top = wallTop(x), th = 4 + Math.round(2 * vnoise(x / 5));
      Px.rect(x, top - th, 1, th, C.asphalt);
      Px.dot(x, top - th, shade(C.asphalt, 0.18));
      Px.dot(x, top - 1, C.crack);
      if (hash(x * 9) < 0.022) Px.line(x, top, x + (hash(x) - 0.5) * 4, top + 3 + hash(x * 3) * 5, 1, C.crack);
    }
    for (let x = X0 + 20; x < X1; x += 48) {
      if (hash(x * 5) < 0.35) continue;
      const top = wallTop(x) - 5;
      Px.line(x, top, x + (hash(x) - 0.5) * 6, top - 8, 2, C.rail);
    }
    // slabs that fell in against the wall
    const slab = (x0, y0, x1, y1, w) => {
      Px.quad(x0, y0, x1, y1, w, w, C.asphalt);
      Px.quad(x0 - 1, y0 - w * 0.45, x1 - 1, y1 - w * 0.45, 1, 1, shade(C.asphalt, 0.2));
      Px.quad(x0 + 1, y0 + w * 0.45, x1 + 1, y1 + w * 0.45, 2, 2, shade(C.crack, -0.25));
      Px.quad(lerp(x0, x1, 0.35), lerp(y0, y1, 0.35), lerp(x0, x1, 0.55), lerp(y0, y1, 0.55), 2, 2, C.dash);
      Px.line(x1, y1, x1 + 4, y1 - 5, 1, C.crack); Px.line(x1, y1 + 2, x1 + 6, y1 - 1, 1, C.crack);
    };
    slab(2420, 136, 2448, 104, 12);
    slab(2706, 134, 2740, 112, 10);
    slab(2996, 136, 3020, 100, 13);
    // floor
    Px.rect(X0, 134, CR_W, 82, C.crater);
    for (let y = 134; y < 142; y++) { const k = (y - 134) / 8; Px.rect(X0, y, CR_W, 1, mix(C.rimDark, C.crater, k)); }
    const flD = shade(C.crater, -0.08), flL = shade(C.crater, 0.1);
    for (let i = 0; i < 240; i++) {     // wind ripples
      const x = X0 + R() * CR_W, y = 144 + R() * 60, w = 4 + R() * 10;
      Px.rect(x, y, w, 1, flD);
      Px.rect(x + 1, y - 1, w - 2, 1, flL);
    }
    for (let i = 0; i < 900; i++) Px.dot(X0 + R() * CR_W, 136 + R() * 72, R() < 0.5 ? flD : R() < 0.5 ? flL : C.rimDark);
    // scorpion tracks wandering across the floor: paired leg prints and a dragged tail
    const trk = shade(C.crater, -0.16);
    for (const [x0, y0, a0] of [[2430, 196, -0.25], [2600, 160, 0.25], [2830, 190, -0.1], [2950, 168, 0.35]]) {
      let x = x0, y = y0, a = a0;
      for (let i = 0; i < 28; i++) {
        a += (R() - 0.5) * 0.45;
        x += Math.cos(a) * 4; y = clamp(y + Math.sin(a) * 1.6, 146, 204);
        const nx = -Math.sin(a) * 3, ny = Math.cos(a) * 1.4;
        Px.dot(x + nx, y + ny, trk); Px.dot(x - nx, y - ny, trk);
        Px.dot(x, y, shade(C.crater, -0.08));
      }
    }
    // asphalt chunks that came down with Juno (more on the left)
    for (let i = 0; i < 26; i++) {
      const x = X0 + Math.pow(R(), 1.8) * CR_W, y = 142 + R() * 62, w = 2 + R() * 5, h = 2 + R() * 3;
      Px.rect(x, y, w, h, C.asphalt);
      Px.rect(x, y + h, w, 1, shade(C.crack, -0.3));
      Px.rect(x, y, w, 1, shade(C.asphalt, 0.18));
    }
    // jutting broken highway slabs on the floor
    const jut = (x, y, w, h, lean) => {
      Px.poly([x, y, x + w, y + 1, x + w + lean, y - h, x + lean, y - h + 2], C.asphalt);
      Px.poly([x + w - 3, y + 1, x + w, y + 1, x + w + lean, y - h, x + w + lean - 3, y - h], shade(C.asphalt, -0.2));
      Px.line(x + lean, y - h + 2, x + w + lean, y - h, 1, shade(C.asphalt, 0.2));
      Px.line(x + lean * 0.5 + w * 0.4, y - h * 0.5, x + lean * 0.5 + w * 0.6, y - h * 0.5, 2, C.dash);
      Px.oval(x + w / 2, y + 1, w * 0.7, 2, shade(C.crater, -0.18));
    };
    jut(2412, 206, 16, 22, 5);
    jut(2604, 146, 12, 18, -4);
    jut(2860, 148, 10, 14, 3);
    jut(3040, 204, 14, 20, -5);
    // rib-bone arcs of something huge, half buried
    const ribs = (x0, n, baseY, h0) => {
      const boneD = shade(C.bone, -0.22), boneL = '#F8F4EC';
      for (let x = x0 - 8; x < x0 + n * 15 + 2; x += 6) {       // half-buried spine
        Px.oval(x, baseY + 1, 3, 2, boneD);
        Px.oval(x - 0.5, baseY, 2.5, 1.5, C.bone);
      }
      for (let i = 0; i < n; i++) {
        const cx = x0 + i * 15, h = h0 * (1 - Math.abs(i - (n - 1) / 2) / (n + 1)) + hash(cx) * 5;
        const tipK = hash(cx + 1) < 0.5 ? 0.82 : 1;
        const pts = [];
        for (let s2 = 0; s2 <= 16; s2++) {
          const t = (s2 / 16) * tipK;
          pts.push([(1 - t) * (1 - t) * (cx - 3) + 2 * (1 - t) * t * (cx + 3) + t * t * (cx + 14),
            (1 - t) * (1 - t) * baseY + 2 * (1 - t) * t * (baseY - h * 1.35) + t * t * (baseY - h * 0.3)]);
        }
        for (let k = 1; k < pts.length; k++) {
          const t = k / pts.length, w = Math.max(2, Math.round(4 - t * 2.4));
          Px.limb(pts[k - 1][0] + 1, pts[k - 1][1] + 1, pts[k][0] + 1, pts[k][1] + 1, w, w, boneD);
        }
        for (let k = 1; k < pts.length; k++) {
          const t = k / pts.length, w = Math.max(1, Math.round(3 - t * 2));
          Px.limb(pts[k - 1][0], pts[k - 1][1], pts[k][0], pts[k][1], w, w, C.bone);
        }
        for (let k = 2; k < 9; k++) Px.dot(pts[k][0] - 1, pts[k][1], boneL);
        const e = pts[pts.length - 1];
        Px.dot(e[0] + 1, e[1] + 1, boneD);
        Px.oval(cx - 3, baseY + 1, 4, 1.5, shade(C.crater, -0.22));
      }
    };
    ribs(2470, 6, 142, 26);
    ribs(2900, 5, 140, 22);
    // a horned skull half sunk in the sand
    {
      const sx = 2806, sy = 140, bd = shade(C.bone, -0.22);
      Px.line(sx - 6, sy - 9, sx - 15, sy - 16, 2, bd); Px.line(sx - 15, sy - 16, sx - 13, sy - 23, 2, bd);
      Px.line(sx + 5, sy - 9, sx + 15, sy - 15, 2, C.bone); Px.line(sx + 15, sy - 15, sx + 14, sy - 22, 2, C.bone);
      Px.oval(sx, sy - 6, 8, 6, C.bone);
      Px.poly([sx - 4, sy - 3, sx + 4, sy - 3, sx + 2, sy + 4, sx - 2, sy + 4], C.bone);
      Px.oval(sx + 2, sy - 5, 6, 4, shade(C.bone, -0.08));
      Px.oval(sx - 3, sy - 6, 1.5, 2, C.carWin); Px.oval(sx + 3, sy - 6, 1.5, 2, C.carWin);
      Px.rect(sx - 1, sy, 1, 2, bd); Px.rect(sx + 1, sy, 1, 2, bd);
      Px.dot(sx - 5, sy - 10, '#F8F4EC'); Px.dot(sx - 3, sy - 11, '#F8F4EC');
      Px.oval(sx, sy + 4, 12, 2.5, C.crater);
      Px.rect(sx - 11, sy + 2, 22, 1, shade(C.crater, -0.12));
    }
    // front crater lip
    for (let x = X0; x < X1; x++) {
      const t = 206 + Math.round(4 * vnoise(x / 11) + 2 * Math.sin(x * 0.05));
      Px.rect(x, t, 1, H - t, C.rimDark);
      Px.dot(x, t, C.rim);
      Px.dot(x, t + 1, shade(C.rim, -0.05));
      if (hash(x * 13) < 0.2) Px.dot(x, t + 3 + hash(x) * 6, rimDeep);
    }
    return cv;
  }

  // Glass glints (positions shared by the static shards and the 1 f flashes).
  const glints = [];

    const R = rng(0x6A55);
    for (let x = 30; x < LEN; x += 40 + Math.floor(R() * 50)) {

      const y = onRoad ? 140 + Math.floor(R() * 62) : duneTop(x) + 3 + Math.floor(R() * 12);

    }
    for (const [cx, n] of [[830, 6], [1640, 7]]) {         // shattered windscreens by the wrecks

    }
  })();

  // ---------- car wrecks (depth-sorted solids) ----------
  class Wreck extends Ent {
    constructor(x, y, kind, trunkProp) {
      super(x, y);
      this.kind = kind; this.team = 'deco'; this.shadowR = 0; this.noShadow = true;
      this.w = 24; this.h = 22; this.trunkProp = trunkProp || null;
    }
    update() { this.t++; }
    draw(ctx, camX) {
      Px.use(ctx);
      const ox = Math.round(this.x - camX), oy = Math.round(this.y);
      if (ox < -90 || ox > W + 90) return;
      ctx.globalAlpha = 0.3;
      Px.oval(ox - (this.kind === 'flipped' ? 0 : 12), oy + 1, 48, 3, '#000');
      ctx.globalAlpha = 1;
      const flipped = this.kind === 'flipped';
      Sprite.begin(176, 60, 88, 52);
      if (flipped) drawFlippedCar(0, 0); else drawSedan(0, 0, !this.trunkProp || this.trunkProp.remove);
      Sprite.end(ctx, ox, oy, 1, {});
      Px.use(ctx);
      if (flipped) flippedSand(ox, oy); else sedanSand(ox, oy);
    }
  }
  function carShades() { return { b: C.car, lit: shade(C.car, 0.22), dk: shade(C.car, -0.28), rust: shade(C.car, -0.45), w: C.carWin }; }
  // Sedan facing left, body from x-53 to x+23; its trunk is a Breakable sitting at x+35.

      19, -4, 18, -9, 15, -12, 7, -12, 4, -9, 3, -4, -28, -4, -29, -9, -32, -12, -40, -12, -43, -9, -44, -4]), k.b);

    Px.rect(x - 13, y - 15, 3, 1, k.dk); Px.rect(x + 3, y - 15, 3, 1, k.dk);

    // headlight socket, grille, hanging bumper

    // wheels in their arches, sunk in sand

  // ---------- audio: sandstorm wind layer + collapse SFX ----------
  SFX.s2Crack = (a, p) => {

  function startWind() {
    if (wind || !Sound.ok() || !Sound.noiseBuf || !Sound.sfxBus) return;
    try {
      const c = Sound.ctx, now = c.currentTime;
      const src = c.createBufferSource(); src.buffer = Sound.noiseBuf; src.loop = true;
      const howl = c.createBiquadFilter(); howl.type = 'bandpass'; howl.frequency.value = 420; howl.Q.value = 1.4;
      const howlG = c.createGain(); howlG.gain.value = 2.4;
      const lfo = c.createOscillator(); lfo.frequency.value = 0.13;
      const lfoAmt = c.createGain(); lfoAmt.gain.value = 220;
      lfo.connect(lfoAmt); lfoAmt.connect(howl.frequency);
      const hiss = c.createBiquadFilter(); hiss.type = 'highpass'; hiss.frequency.value = 3200;
      const hissG = c.createGain(); hissG.gain.value = 0.08;
      const gust = c.createGain(); gust.gain.value = 0.75;
      const lfo2 = c.createOscillator(); lfo2.frequency.value = 0.31;
      const lfo2Amt = c.createGain(); lfo2Amt.gain.value = 0.25;
      lfo2.connect(lfo2Amt); lfo2Amt.connect(gust.gain);
      const out = c.createGain();
      out.gain.setValueAtTime(0.0001, now);
      out.gain.exponentialRampToValueAtTime(0.5, now + 2.5);
      src.connect(howl); howl.connect(howlG); howlG.connect(gust);
      src.connect(hiss); hiss.connect(hissG); hissG.connect(gust);
      gust.connect(out); out.connect(Sound.sfxBus);
      src.start(now); lfo.start(now); lfo2.start(now);
      wind = { src, lfo, lfo2, out, level: 0.5 };
      if (!watch) watch = setInterval(windWatch, 250);
    } catch (e) { wind = null; }
  }
  function stopWind(sec = 0.05) {
    const w = wind;
    wind = null;
    if (watch) { clearInterval(watch); watch = null; }
    if (!w || !Sound.ctx) return;
    try {
      const now = Sound.ctx.currentTime, gn = w.out.gain;
      gn.cancelScheduledValues(now);
      gn.setValueAtTime(Math.max(0.0001, gn.value), now);
      gn.exponentialRampToValueAtTime(0.0001, now + sec);
      const end = now + sec + 0.05;
      w.src.stop(end); w.lfo.stop(end); w.lfo2.stop(end);
    } catch (e) { /* already stopped */ }
  }
  // The wind must never outlive the storm: quit to title, a stage restart or game over all stop it.
  function windWatch() {
    if (!wind) { if (watch) { clearInterval(watch); watch = null; } return; }
    const here = Game.stage && Game.stage.s2Stage && ['play', 'pause', 'continue', 'clear', 'stageintro'].includes(Game.state);
    if (!here || !S || S.storm === 0) { stopWind(0.3); return; }
    const level = Game.state === 'pause' || Game.state === 'continue' ? 0.08 : 0.5;
    if (level !== wind.level && Sound.ctx) {
      wind.level = level;
      try { wind.out.gain.setTargetAtTime(level, Sound.ctx.currentTime, 0.15); } catch (e) { /* ignore */ }
    }
  }

  // ---------- sandstorm (W4) ----------
  const HERO_WIND = new Set(['idle', 'walk', 'run', 'skid', 'land', 'pickup', 'throwing', 'attack', 'grab', 'hurt', 'down', 'getup', 'jumpsquat']);
  const FOE_WIND = new Set(['idle', 'walk', 'hurt', 'down', 'getup', 'dizzy', 'taunt', 'panic', 'attack']);
  function stormStart(g) {
    S.storm = 1; S.stormT = 0;

  }
  function stormEnd(g) {
    if (S.storm === 0 || S.storm === 3) return;

    stopWind(2);
  }
  function stormUpdate(g) {
    if (S.storm === 1) {
      if (++S.stormT >= 180) {
        S.storm = 2; S.stormT = 0;
        Sound.musicFilter(900, 3);
        Sound.sfx('whooshBig');
        startWind();
      }
    } else if (S.storm === 2) {
      S.stormT++;
      S.stormK = Math.min(1, S.stormT / 120);
      if (S.stormK >= 0.4) g.silhouetteDist = 130;
      if (!wind) startWind();
      windPush(g, 0.4);
      // sand skating along the ground
      if (S.stormT % 3 === 0) FX.add({ kind: 'dust', x: g.cam.x + W + rr(0, 20), y: rr(g.bounds.yMin, g.bounds.yMax), z: rr(0, 6), vx: rr(-5, -3), vz: rr(0, 0.3), life: ri(50, 80), size: rr(1.5, 3), color: C.streak, g: 0.005, alpha: 0.5 * S.stormK });
    } else if (S.storm === 3) {
      S.stormK = Math.max(0, S.stormK - 1 / 90);
      if (S.stormK <= 0) S.storm = 0;
    }
    if (S.stormK > 0) {
      for (const s of S.streaks) {
        s.x -= 6; s.y += s.vy;
        if (s.x + s.len < 0 || s.y < 22 || s.y > H) { s.x = W + S.R() * 40; s.y = 24 + S.R() * (H - 24); }
      }
      for (const b of S.blobs) { b.x -= b.v; if (b.x + b.rx < 0) { b.x = W + b.rx + S.R() * 80; b.y = 60 + S.R() * 140; } }
    }
  }
  // Wind drags every grounded non-boss actor (the hero too) to the left.
  function windPush(g, k) {
    const p = g.player;
    if (p && !g.playerGone && p.z <= 0 && !(p.hs > 0) && HERO_WIND.has(p.state)) p.x = Math.max(g.cam.x + 10, p.x - k);
    for (const e of g.ents) {
      if (e.team !== 'enemy' || e.boss || e.remove || e.z > 0 || e.hs > 0 || !FOE_WIND.has(e.state)) continue;
      e.x = Math.max(g.cam.x + 6, e.x - k);

  }

  // ---------- road collapse (lock 2400) ----------
  function makeCracks(p) {
    const R = rng(0xC0 + Math.round(p.x));
    S.cx = p.x; S.cy = p.y;
    S.cracks = [Math.PI + 0.3, -0.25, Math.PI * 0.5 + 0.45].map(a0 => {
      const pts = [S.cx, S.cy];
      let x = S.cx, y = S.cy, a = a0;
      for (let i = 0; i < 9; i++) {
        a += (R() - 0.5) * 0.8;
        const l = 9 + R() * 8;
        x += Math.cos(a) * l; y = clamp(y + Math.sin(a) * l * 0.42, 137, 212);
        pts.push(x, y);
      }
      const at = 2 + Math.floor(R() * 4), bp = [pts[at * 2], pts[at * 2 + 1]];
      let bx = bp[0], by = bp[1], ba = a0 + (R() < 0.5 ? 0.9 : -0.9);
      for (let i = 0; i < 4; i++) { ba += (R() - 0.5) * 0.6; bx += Math.cos(ba) * 8; by = clamp(by + Math.sin(ba) * 3.5, 137, 212); bp.push(bx, by); }
      return { pts, at, bp };
    });
  }
  function collapseStart() { S.col = 1; S.colT = 0; }
  function collapseUpdate(g) {
    const p = g.player;
    if (!p || S.col === 0 || S.col === 5) return;
    S.colT++;
    if (S.col === 1) {
      // never start the cave-in on a dying or respawning hero: let her death and respawn resolve first
      if (p.hp <= 0 || g.playerGone || g.respawnDrop) { S.colT = 0; return; }
      const ready = p.z <= 0 && ['idle', 'walk', 'run', 'skid', 'land'].includes(p.state);
      if (ready || S.colT > 90) {
        S.col = 2; S.colT = 0;
        makeCracks(p);
        if (p.z <= 0) { p.setState('idle'); p.vx = p.vy = 0; }
        Sound.sfx('rumble', p.x);
      }
      return;
    }
    if (S.col === 2 || S.col === 3) {
      p.hs = 2 + (S.colT % 2); p.hitJitter = true; p.blink = false;
      p.inv = Math.max(p.inv, 2);
    }
    if (S.col === 2) {
      if (S.colT % 4 === 1) FX.shake(2, 6);
      if (S.colT % 7 === 1) Sound.sfx('s2Crack', S.cx);
      if (S.colT % 3 === 0) {
        const k = S.colT / 30;
        for (const cr of S.cracks) {
          const n = cr.pts.length / 2 - 1, i = Math.min(n, Math.floor(k * n));
          FX.dust(cr.pts[i * 2], cr.pts[i * 2 + 1], 1, 0.6, '#B09878');
          if (S.colT % 9 === 0) FX.debris(cr.pts[i * 2], cr.pts[i * 2 + 1], 0, [C.asphalt, C.crack], 2, [1, 2]);
        }
      }
      if (S.colT >= 30) { S.col = 3; S.colT = 0; Sound.sfx('s2Collapse', S.cx); FX.shake(4, 24); }
    } else if (S.col === 3) {
      S.fadeA = Math.min(1, S.colT / 12);
      if (S.colT >= 12) { enterCrater(g, true); S.col = 4; S.colT = 0; }
    } else if (S.col === 4) {
      S.fadeA = Math.max(0, 1 - S.colT / 12);

  function drawCracks(ctx, camX) {

    else { Px.rect(x - 2, ay, 1, 2, c); Px.rect(x - 4, ay - 9, 2, 11, c); Px.dot(x - 3, ay - 10, c); }
    if (arm2) {

      if (arm > 0) { Px.rect(x - 2, by, 1, 1, c); Px.rect(x - 3, by - 6, 1, 7, c); }

    }
