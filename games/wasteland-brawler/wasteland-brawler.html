// World objects: breakable props, pickups, projectiles and ground hazards.

// Breakables: crate | drum (oil drum) | fuel (red, explodes) | fridge | trunk (car-wreck trunk) | trash
// drop: an item kind, 'none', or omitted for the random table (40% food, 35% score, 25% weapon).
const PROP_DEFS = {
  crate:  { hp: 2, w: 10, h: 18, cols: ['#8b5a2b', '#5a3a1a', '#c9a86a'], sfx: 'crate', solid: true },
  drum:   { hp: 3, w: 7, h: 20, cols: ['#5e6b73', '#3e474d', '#8c5a3c'], sfx: 'clank', solid: true },
  fuel:   { hp: 2, w: 7, h: 20, cols: ['#b8322a', '#6a1a16', '#f2eee0'], sfx: 'clank', solid: true },
  fridge: { hp: 3, w: 9, h: 30, cols: ['#d8d4c4', '#a06a40', '#8a8a8a'], sfx: 'clank', solid: true },
  trunk:  { hp: 2, w: 12, h: 14, cols: ['#8a5a3a', '#5a3a26', '#2a2020'], sfx: 'clank', solid: true },
  trash:  { hp: 1, w: 6, h: 16, cols: ['#6e7178', '#4a4d52', '#9aa0a8'], sfx: 'clank', solid: true },
};
function randomDrop() {
  const r = rand();
  if (r < 0.4) { const f = rand(); return f < 0.4 ? 'cactus' : f < 0.8 ? 'beans' : f < 0.95 ? 'rat' : 'water'; }
  if (r < 0.75) { const f = rand(); return f < 0.6 ? 'cap' : f < 0.9 ? 'pouch' : 'watch'; }
  const f = rand(); return f < 0.5 ? 'pipe' : f < 0.8 ? 'machete' : 'molotov';
}
class Breakable extends Ent {
  constructor(kind, x, y, drop) {
    super(x, y);
    const d = PROP_DEFS[kind];
    this.kind = kind; this.def = d;
    this.drop = drop === undefined || drop === null ? (kind === 'fuel' ? 'none' : kind === 'fridge' ? pick(['beans', 'rat', 'cactus']) : randomDrop()) : drop;
    this.team = 'prop';
    this.hp = d.hp;
    this.w = d.w; this.h = d.h;
    this.shadowR = d.w + 2;
    this.wob = 0; this.fuse = 0; this.rolling = 0; this.dent = 0;
    this.solidRect = { x0: x - d.w, x1: x + d.w, y0: y - 4, y1: y + 4, h: d.h, splat: false, prop: this };
    Game.solids.push(this.solidRect);
  }
  get vulnerable() { return !this.remove && this.fuse === 0; }
  takeHit(src, a, dir) {
    this.wob = 8; this.flash = 3;
    Sound.sfx(this.def.sfx, this.x);
    this.hs = 3; this.hitJitter = true;
    FX.hit(this.x - dir * 4, this.y, 10, 1, dir, '#ffffff');
    if (src && src.team === 'player' && src.addCombo) src.addCombo();
    this.igniter = src;
    this.hp -= (a.tier || 1) >= 3 ? 2 : 1;
    this.dent++;
    if (this.kind === 'fuel') {
      if (a.thrownBody) { this.fuse = 10; return; }
      if (this.hp <= 0) this.fuse = 1;
      return;
    }
    if (this.hp <= 0) this.smash(src);
  }
  smash(src) {
    if (this.remove) return;
    this.remove = true;
    this.solidRect.off = true;
    FX.debris(this.x, this.y, 8, this.def.cols, 12, [1, 3]);
    if (this.kind === 'crate' || this.kind === 'trunk') FX.shards(this.x, this.y, 10, 6, ['#8b5a2b', '#5a3a1a']);
    Sound.sfx('crate', this.x);
    Game.addScore(100);
    if (this.kind === 'drum') FX.pool(this.x, this.y + 1, '#15121a', 20);
    if (this.kind === 'fridge') FX.add({ kind: 'shard', x: this.x, y: this.y, z: 16, vx: 2.5, vz: 3, life: 60, color: '#d8d4c4', size: 8, rot: 0, spin: 0.25, g: 0.24, ground: this.y });
    if (this.drop && this.drop !== 'none') {
      const it = Game.add(new Item(this.drop, this.x, this.y + 1, 2.0));
      it.vx = rr(-0.4, 0.4);
    }
  }
  update(bounds) {
    if (this.wob > 0) this.wob--;
    if (this.flash > 0) this.flash--;
    if (this.hs > 0) { this.hs--; return; }
    if (this.fuse > 0) {
      this.fuse++;
      if (this.fuse > 10) {
        this.remove = true; this.solidRect.off = true;
        Game.explode(this.x, this.y, this.igniter || Game.player, { r: 36, depth: 14, dmg: 30, pdmg: 20 });
      }
    }
  }
  draw(ctx, camX) {
    const ox = this.wob ? (this.wob % 2 ? 1 : -1) : 0;
    const blink = this.fuse > 0 && (this.fuse >> 1) % 2;
    Sprite.begin(48, 48, 24, 44);
    const c = this.def.cols;
    switch (this.kind) {
      case 'crate':
        Px.rect(-10, -18, 20, 18, c[0]);
        Px.rect(-10, -18, 20, 2, shade(c[0], 0.25));
        Px.line(-8, -2, 8, -16, 2, c[1]); Px.line(-8, -16, 8, -2, 2, c[1]);
        Px.rect(-10, -18, 2, 18, c[1]); Px.rect(8, -18, 2, 18, c[1]);
        for (const [nx, ny] of [[-9, -17], [8, -17], [-9, -2], [8, -2]]) Px.dot(nx, ny, c[2]);
        break;
      case 'drum': {
        const tilt = Math.min(3, this.dent);
        Px.rect(-7, -20, 14, 20, c[0]);
        Px.rect(-7, -20, 3, 20, shade(c[0], 0.2));
        Px.rect(4, -20, 3, 20, c[1]);
        Px.rect(-7, -15, 14, 2, c[1]); Px.rect(-7, -6, 14, 2, c[1]);
        Px.poly([-7, -21, 7, -21 - tilt, 7, -19 - tilt, -7, -19], shade(c[0], 0.3));
        Px.rect(1, -13, 1, 8, c[2]);
        break;
      }
      case 'fuel':
        Px.rect(-7, -20, 14, 20, blink ? '#ffffff' : c[0]);
        Px.rect(-7, -20, 3, 20, blink ? '#ffffff' : '#d24a3a');
        Px.rect(-7, -15, 14, 2, c[1]); Px.rect(-7, -6, 14, 2, c[1]);
        Px.rect(-4, -12, 8, 5, c[2]);
        Px.poly([0, -12, 2, -9, 0, -7, -2, -9], '#e2591e');
        Px.rect(-7, -21, 14, 2, '#d24a3a');
        break;
      case 'fridge':
        Px.rect(-9, -30, 18, 30, c[0]);
        Px.rect(-9, -30, 18, 2, shade(c[0], 0.2));
        Px.rect(-9, -19, 18, 1, shade(c[0], -0.3));
        Px.rect(6, -27, 2, 6, c[2]); Px.rect(6, -16, 2, 8, c[2]);
        Px.rect(-6, -24, 3, 2, c[1]); Px.rect(-3, -8, 4, 3, c[1]); Px.rect(2, -28, 2, 2, c[1]);
        break;
      case 'trunk':
        Px.poly([-12, 0, -12, -10, -8, -14, 10, -14, 12, -8, 12, 0], c[0]);
        Px.rect(-10, -12, 20, 2, shade(c[0], 0.25));
        Px.rect(-2, -8, 4, 2, c[2]);
        Px.rect(-12, -3, 24, 3, c[1]);
        break;
      case 'trash':
        Px.rect(-6, -14, 12, 14, c[0]);
        for (let i = -4; i <= 4; i += 3) Px.rect(i, -13, 1, 12, c[1]);
        Px.rect(-7, -16, 14, 2, c[2]);
        Px.rect(-2, -18, 4, 2, c[1]);
        break;
    }
    Sprite.end(ctx, this.x - camX + ox + this.jitter, this.y, 1, { flash: this.flash > 1 ? '#ffffff' : null });
  }
}

// Burning oil barrel: a solid, unbreakable hazard. Touching the flame: 6 dmg + knockdown to anyone.
// A knocked-down enemy landing in it takes 10.
class BurningBarrel extends Ent {
  constructor(x, y) {
    super(x, y);
    this.team = 'hazard'; this.w = 7; this.h = 20; this.shadowR = 9;
    this.ticks = new Map();
    Game.solids.push({ x0: x - 7, x1: x + 7, y0: y - 4, y1: y + 4, h: 30, splat: true });
  }
  update() {
    this.t++;
    if (this.t % 3 === 0) FX.fire(this.x, this.y, 22, 1);
    if (this.t % 9 === 0) FX.embers(this.x, this.y, 24, 1);
    const victims = [Game.player, ...Game.foes()].filter(Boolean);
    for (const v of victims) {
      if (!v.vulnerable && !(v.state === 'fall' && v.team === 'enemy')) continue;
      if (Math.abs(v.y - this.y) > 6 || Math.abs(v.x - this.x) > 10 + v.w * 0.5) continue;
      const last = this.ticks.get(v.id) || -99;
      if (this.t - last < 30) continue;
      if (v.state === 'fall' && v.team === 'enemy' && v.z < 30) {
        this.ticks.set(v.id, this.t);
        v.hp = Math.max(0, v.hp - 10); v.burn = 40; v.flash = 2;
        FX.fire(v.x, v.y, 10, 4); Sound.sfx('fire', v.x);
        if (v.hp <= 0 && !v.dying) v.onDeath(Game.player, {}, 1);
        continue;
      }
      if (v.z > 28) continue;
      if (!v.vulnerable) continue;
      this.ticks.set(v.id, this.t);
      v.takeHit(v.team === 'player' ? this : Game.player, { dmg: 6, tier: 2, knock: true, kx: 2.0, kz: 2.8, burn: 40, zr: [0, 40], sfx: 'fire' }, v.x < this.x ? -1 : 1);
    }
  }
  draw(ctx, camX) {
    Sprite.begin(40, 56, 20, 50);
    Px.rect(-7, -20, 14, 20, '#4a3a30');
    Px.rect(-7, -20, 3, 20, '#5e4a3a');
    Px.rect(-7, -15, 14, 2, '#2a2020'); Px.rect(-7, -6, 14, 2, '#2a2020');
    Px.rect(-7, -21, 14, 2, '#2a2020');
    for (let i = -2; i <= 2; i++) {
      const h = 7 + Math.sin(Game.frame * 0.35 + i * 1.9) * 3 + (2 - Math.abs(i)) * 3;
      Px.poly([i * 3 - 3, -21, i * 3, -21 - h, i * 3 + 3, -21], (Game.frame >> 2) % 3 === Math.abs(i) % 3 ? '#ffd34a' : i % 2 ? '#ff8a2a' : '#e83b1e');
    }
    Sprite.end(ctx, this.x - camX, this.y, 1, {});
    // glow
    ctx.globalAlpha = 0.12 + 0.05 * Math.sin(Game.frame * 0.3);
    Px.use(ctx); Px.disc(this.x - camX, this.y - 30, 18, '#ff8a2a');
    ctx.globalAlpha = 1;
  }
}

// Pickups.
const ITEM_DEFS = {
  cactus:  { heal: 15, label: '+HP', food: true },
  beans:   { heal: 30, label: '+HP', food: true },
  rat:     { heal: 50, label: '+HP', food: true },
  water:   { heal: 999, label: 'FULL HP', food: true, cleanse: true },
  cap:     { score: 500, label: '500' },
  pouch:   { score: 1500, label: '1500' },
  watch:   { score: 3000, label: '3000' },
  dogtag:  { life: 1, label: '1UP' },
  pipe:    { weapon: 'pipe', label: 'LEAD PIPE' },
  machete: { weapon: 'machete', label: 'MACHETE' },
  axe:     { weapon: 'axe', label: 'STOP-SIGN AXE' },
  molotov: { weapon: 'molotov', label: 'MOLOTOV' },
};
class Item extends Ent {
  constructor(kind, x, y, pop = 0) {
    super(x, y);
    this.kind = kind;
    this.team = 'item';
    this.vz = pop; this.z = pop ? 1 : 0;
    this.vx = pop ? rr(-0.6, 0.6) : 0;
    this.w = 8; this.h = 8;
    this.shadowR = 5;
    const d = ITEM_DEFS[kind];
    this.life = d.food || d.life ? Infinity : d.score ? 600 : 60 * 60;
  }
  update(bounds) {
    this.t++;
    if (this.z > 0 || this.vz) {
      this.z += this.vz; this.vz -= 0.3; this.x += this.vx;
      if (this.z <= 0) { this.z = 0; this.vz = Math.abs(this.vz) > 1.2 ? -this.vz * 0.4 : 0; this.vx *= 0.5; if (!this.vz) this.vx = 0; }
    }
    this.y = clamp(this.y, bounds.yMin, bounds.yMax);
    if (--this.life <= 0) this.remove = true;
  }
  collect(pl) {
    const d = ITEM_DEFS[this.kind];
    this.remove = true;
    if (d.heal) { pl.hp = Math.min(pl.maxHp, pl.hp + d.heal); pl.grey = Math.min(pl.grey, pl.maxHp - pl.hp); if (d.cleanse) { pl.grey = 0; pl.venom = 0; pl.burn = 0; } Sound.sfx('food'); }
    if (d.weapon) { pl.giveWeapon(d.weapon); if (this.uses) pl.weapon.uses = this.uses; Sound.sfx('weapon'); }
    if (d.score) { Game.addScore(d.score); Sound.sfx('pickup'); }
    if (d.life) { Game.lives++; Sound.sfx('oneUp'); }
    FX.text(this.x, this.y, 20, d.label, d.heal ? '#7be04a' : d.life ? '#7be04a' : '#ffe066', 50);
  }
  draw(ctx, camX) {
    if (this.life < 120 && (this.life >> 2) % 2) return;
    const sx = this.x - camX, sy = this.y - this.z;
    const bob = this.z === 0 ? Math.round(Math.sin(Game.frame * 0.1 + this.id) * 1) : 0;
    Sprite.begin(48, 40, 24, 34);
    drawItemIcon(this.kind, 0, 0, this.t);
    Sprite.end(ctx, sx, sy + bob, 1, {});
    if (ITEM_DEFS[this.kind].weapon && this.t % 40 < 3) { Px.use(ctx); Px.rect(sx + 4, sy - 6 + bob, 3, 1, '#fff'); Px.rect(sx + 5, sy - 7 + bob, 1, 3, '#fff'); }
  }
}
function drawItemIcon(kind, x, y, t = 0) {

      break;
    case 'dogtag':
      for (let i = 0; i < 5; i++) Px.dot(x - 4 + i, y - 12 + Math.abs(2 - i), '#9aa0a8');
      Px.rect(x - 4, y - 9, 4, 6, '#c8ccd0'); Px.rect(x + 1, y - 8, 4, 6, '#c8ccd0');

      Px.rect(x - 10, y - 3, 5, 3, '#3a2a1a');

      Px.disc(x, y - 14, 1.5, (t >> 2) % 2 ? '#ffb030' : '#ffe066');
      break;
  }
}

// Projectiles. friendly: hits enemies (thrown by the player); otherwise hits the player.
// opts: { kind, vx, vz, dmg, tier, owner, gravity, knock, life, friendly, pierce, burn, venom, target }
class Proj extends Ent {
  constructor(x, y, z, o) {
    super(x, y);
    Object.assign(this, { kind: 'rock', dmg: 8, tier: 1, gravity: 0.2, knock: false, life: 180, friendly: false, pierce: 0 }, o);
    this.z = z;
    this.team = 'proj';
    this.shadowR = 4;
    this.w = 5; this.h = 8;
    this.hitIds = new Set();
  }
  update(bounds) {
    this.t++;
    this.x += this.vx; this.y += this.vy || 0; this.z += this.vz; this.vz -= this.gravity;
    if (this.kind === 'molotov' && this.t % 3 === 0) FX.fire(this.x, this.y, this.z + 4, 1);
    if (this.kind === 'glob' && this.t % 2 === 0) FX.add({ kind: 'drop', x: this.x, y: this.y, z: this.z, life: 10, color: this.color || '#7cff4f', g: 0 });
    const a = { dmg: this.dmg, tier: this.tier, knock: this.knock, kx: 2.4, kz: 3, kb: 1.4, stun: 18, burn: this.burn, venom: this.venom, sfx: this.hitSfx, zr: [0, 60] };
    if (this.friendly) {
      for (const e of Game.ents) {
        if ((e.team !== 'enemy' && e.team !== 'prop') || !e.vulnerable || this.hitIds.has(e.id)) continue;
        if (Math.abs(e.y - this.y) < 9 && Math.abs(e.x - this.x) < e.w + this.w && this.z < e.z + e.h + 4 && this.z + this.h > e.z) {
          this.hitIds.add(e.id);
          e.takeHit(this.owner || Game.player, a, sign(this.vx) || 1);
          if (this.kind === 'molotov') { this.burst(); return; }
          if (this.pierce-- <= 0) { this.onImpact(); this.remove = true; return; }
        }
      }
    } else {
      const p = Game.player;
      if (p && p.vulnerable && Math.abs(p.y - this.y) < (this.depth || 8) && Math.abs(p.x - this.x) < p.w + this.w && this.z < p.z + p.h && this.z + this.h > p.z) {
        p.takeHit(this, a, sign(this.vx) || (p.x > this.x ? 1 : -1));
        if (this.kind === 'molotov') { this.burst(); return; }
        this.onImpact();
        this.remove = true;
        return;
      }
    }
    if (this.z <= 0) { this.z = 0; if (this.kind === 'molotov') { this.burst(); return; } this.onImpact(); this.remove = true; return; }
    if (--this.life <= 0 || this.x < Game.cam.x - 60 || this.x > Game.cam.x + W + 60) {
      if (this.kind.startsWith('thrown_')) this.onImpact();
      this.remove = true;
    }
  }
  burst() {
    this.remove = true;
    Sound.sfx('glass', this.x);
    Sound.sfx('fire', this.x);
    Game.add(new FirePatch(this.x, this.y, 90, 'both', 6, this.owner));
  }
  onImpact() {
    if (this.kind === 'glob') {
      FX.splat(this.x, this.y, Math.max(2, this.z), this.color || '#7cff4f', 6, sign(this.vx));
      if (this.puddle) Game.add(new AcidPool(this.x, this.y, this.puddle, this.color));
    } else if (this.kind.startsWith('thrown_')) {
      FX.shards(this.x, this.y, Math.max(4, this.z), 4, ['#8a8f96', '#5e6168']);
    } else if (this.kind === 'lid') {
      FX.dust(this.x, this.y, 2, 0.5);
    } else {
      FX.debris(this.x, this.y, Math.max(1, this.z), ['#6b5a48', '#8a7660'], 4);
    }
  }
  draw(ctx, camX) {
    Px.use(ctx);
    const sx = Math.round(this.x - camX), sy = Math.round(this.y - this.z);
    const a = this.t * 0.45;
    switch (this.kind) {
      case 'molotov':
        Px.line(sx - Math.cos(a) * 3, sy - 4 - Math.sin(a) * 3, sx + Math.cos(a) * 3, sy - 4 + Math.sin(a) * 3, 2, '#4a7a3a');
        Px.disc(sx + Math.cos(a) * 3, sy - 4 + Math.sin(a) * 3, 1.5, '#ffb030');
        break;
      case 'glob':
        Px.disc(sx, sy - 3, 3, this.color || '#7cff4f'); Px.dot(sx - 1, sy - 4, '#e2ffb0');
        break;
      case 'lid':
        Px.oval(sx, sy - 3, 6, 2 + Math.abs(Math.sin(a)) * 3, '#9aa0a8');
        break;
      case 'thrown_pipe':
        Px.line(sx - Math.cos(a) * 9, sy - 6 - Math.sin(a) * 9, sx + Math.cos(a) * 9, sy - 6 + Math.sin(a) * 9, 2, '#8a8f96');
        break;
      case 'thrown_axe':
        Px.line(sx - Math.cos(a) * 9, sy - 6 - Math.sin(a) * 9, sx + Math.cos(a) * 9, sy - 6 + Math.sin(a) * 9, 2, '#8a8f96');
        Px.disc(sx + Math.cos(a) * 10, sy - 6 + Math.sin(a) * 10, 5, '#c8282e');
        break;
      case 'thrown_machete':
        Px.line(sx - Math.cos(a) * 3, sy - 6 - Math.sin(a) * 3, sx + Math.cos(a) * 3, sy - 6 + Math.sin(a) * 3, 3, '#3a2a1a');
        Px.line(sx + Math.cos(a) * 3, sy - 6 + Math.sin(a) * 3, sx + Math.cos(a) * 11, sy - 6 + Math.sin(a) * 11, 3, '#d8dce0');
        break;
      case 'knife':
        Px.line(sx - Math.cos(a) * 4, sy - 4 - Math.sin(a) * 4, sx + Math.cos(a) * 4, sy - 4 + Math.sin(a) * 4, 1, '#e8ecef');
        break;
      default:
        Px.disc(sx, sy - 3, 3, '#6b5a48'); Px.dot(sx - 1, sy - 4, '#8a7660');
    }
  }
}

// Burning ground. hurts: 'player' | 'enemy' | 'both'. Damage ticks every 15f per victim.
class FirePatch extends Ent {
  constructor(x, y, life = 90, hurts = 'both', dmg = 6, owner = null, w = 20) {
    super(x, y);
    this.team = 'hazard';
    this.life = life; this.w = w; this.hurts = hurts; this.dmg = dmg; this.owner = owner;
    this.shadowR = 0;
    this.ticks = new Map();
  }
  update() {
    this.t++;
    if (this.t % 2 === 0) FX.fire(this.x + rr(-this.w, this.w), this.y + rr(-2, 2), 0, 1);
    if (this.t % 20 === 0) Sound.sfx('fire', this.x);
    const victims = [];
    if (this.hurts !== 'enemy' && Game.player) victims.push(Game.player);
    if (this.hurts !== 'player') victims.push(...Game.foes());
    for (const v of victims) {
      if (!v.vulnerable || v.z > 6 || Math.abs(v.y - this.y) > 6 || Math.abs(v.x - this.x) > this.w + v.w) continue;
      const last = this.ticks.get(v.id) || -99;
      if (this.t - last < 30) continue;
      this.ticks.set(v.id, this.t);
      v.takeHit(v.team === 'player' ? this : (this.owner || Game.player), { dmg: this.dmg, tier: 2, stun: 16, kb: 0.8, burn: 40, zr: [0, 20], sfx: 'fire' }, v.x < this.x ? -1 : 1);
      if (v.team === 'enemy' && v.family === 'gang' && v.setPanic) v.setPanic(60);
    }
    if (this.t > this.life) this.remove = true;
  }
  sortY() { return this.y - 12; }
  draw(ctx, camX) {
    Px.use(ctx);
    const sx = this.x - camX;
    const fade = Math.min(1, (this.life - this.t) / 20);
    ctx.globalAlpha = 0.45 * fade;
    Px.oval(sx, this.y, this.w + 2, 3, '#e2541b');
    ctx.globalAlpha = fade;
    const n = Math.max(2, Math.round(this.w / 6));
    for (let i = -n; i <= n; i++) {
      const fx = sx + i * (this.w / n);
      const h = 5 + Math.sin(Game.frame * 0.3 + i * 1.7) * 3;
      Px.poly([fx - 3, this.y, fx, this.y - h - 3, fx + 3, this.y], i % 2 ? '#ff8a1e' : '#e83b1e');
      Px.poly([fx - 1, this.y, fx, this.y - h * 0.5 - 1, fx + 1, this.y], '#ffe066');
    }
    ctx.globalAlpha = 1;
  }
}

// Acid puddle from spit globs.
class AcidPool extends Ent {
  constructor(x, y, life, color = '#7cff4f', hurts = 'player', dmg = 4) {
    super(x, y);
    this.team = 'hazard'; this.life = life; this.color = color; this.w = 12; this.hurts = hurts; this.dmg = dmg;
    this.shadowR = 0; this.ticks = new Map();
  }
  update() {
    this.t++;
    const victims = [];
    if (this.hurts !== 'enemy' && Game.player) victims.push(Game.player);
    if (this.hurts === 'both') victims.push(...Game.foes());
    for (const v of victims) {
      if (!v.vulnerable || v.z > 3 || Math.abs(v.y - this.y) > 4 || Math.abs(v.x - this.x) > this.w + v.w * 0.5) continue;
      const last = this.ticks.get(v.id) || -99;
      if (this.t - last < 20) continue;
      this.ticks.set(v.id, this.t);
      v.hp = Math.max(v.team === 'player' ? 0 : 0, v.hp - this.dmg);
      v.flash = 2;
      FX.add({ kind: 'bubble', x: v.x, y: v.y, z: 4, vz: 0.6, g: 0, life: 20, color: this.color });
      Sound.sfx('hiss', v.x);
      if (v.hp <= 0) { if (v.team === 'player') v.knockDown(1, 1, 2); else if (!v.dying) { v.onDeath(Game.player, {}, 1); v.knockDown(1, 1, 2); } }
    }
    if (this.t % 12 === 0) FX.add({ kind: 'bubble', x: this.x + rr(-this.w, this.w), y: this.y, z: 0, vz: 0.3, g: 0, life: 16, color: this.color });
    if (this.t > this.life) this.remove = true;
  }
  sortY() { return this.y - 30; }
  draw(ctx, camX) {
    Px.use(ctx);
    const a = Math.min(1, (this.life - this.t) / 30) * 0.6;
    ctx.globalAlpha = a;
    Px.oval(this.x - camX, this.y, this.w, 4, this.color);
    ctx.globalAlpha = 1;
  }
}

// ---- 80_game.js ----
// Game: state machine, world simulation, camera and waves, screens.

const STAGES = [];          // filled by the stage modules
const STORY = { intro: [], between: [], ending: [] };

const DIFFS = {
  easy:   { name: 'EASY',   tokens: 1, dmg: 0.7, hp: 1.0, tele: 4,  credits: 99 },
  normal: { name: 'NORMAL', tokens: 2, dmg: 1.0, hp: 1.0, tele: 0,  credits: 3 },
  hard:   { name: 'HARD',   tokens: 3, dmg: 1.3, hp: 1.2, tele: -2, credits: 3 },
};

const Game = {
  state: 'boot', t: 0, frame: 0,
  hitstop: 0, superFreeze: 0, superText: '',
  slow: 0, slowScale: 1, slowAcc: 0,
  cam: { x: 0, lock: null },
  ents: [], player: null,
  stage: null, stageIndex: 0,
  bounds: { xMin: 0, xMax: 0, yMin: 124, yMax: 196, walls: false },
  score: 0, shownScore: 0, hiscore: Store.get('hiscore', 30000), lives: 3, credits: 3,
  rage: 0, rageReadyShown: false,
  solids: [], silhouetteDist: 0, bossCardInfo: null, warning: null,
  waveIdx: 0, wave: null, waveSpawned: 0, waveT: 0,
  goT: 0, foe: null, foeT: 0, bossRef: null,
  fade: 0, fadeDir: 0, fadeCb: null,
  card: null,
  menuSel: 0, diffKey: Store.get('diff', 'normal'),
  playerGone: false,
  portraitHit: 0,
  stats: { kills: 0, time: 0 },
  letterbox: 0, letterboxTarget: 0,

  init() { this.setState('title'); },
  get diff() { return DIFFS[this.diffKey] || DIFFS.normal; },
  setState(s) { this.state = s; this.t = 0; },
  add(e) { this.ents.push(e); return e; },
  foes() { return this.ents.filter(e => e.team === 'enemy' && !e.remove); },
  livingFoes() { return this.ents.filter(e => e.team === 'enemy' && !e.remove && !e.dying && !e.ignoreForWave); },
  maxAttackers() { return this.diff.tokens + (this.stageIndex === 2 && this.diffKey !== 'easy' ? 1 : 0); },
  stageMult() { return [1, 0.85, 0.75][this.stageIndex] || 1; },
  // Boss intro card: darkens the screen, slides letterbox bars in, shows the name for 90f.
  bossCard(name, epithet) { this.bossCardInfo = { name, epithet, t: 0 }; this.letterboxTarget = 20; Sound.sfx('bossSting'); Sound.duck(0.3, 0.3); },
  // Red warning band that flashes 3 times (e.g. SANDSTORM!).
  warn(text, frames = 180) { this.warning = { text, t: 0, life: frames }; Sound.sfx('alarm'); },
  addScore(n) {
    const before = this.score;
    this.score += Math.round(n);
    for (const mark of [50000, 150000, 300000]) {
      if (before < mark && this.score >= mark) {
        this.lives++;
        Sound.sfx('oneUp');
        if (this.player) FX.text(this.player.x, this.player.y, 56, '1UP!', '#7fe07a', 70);
      }
    }
    if (this.score > this.hiscore) this.hiscore = this.score;
  },
  addRage(n) {
    const was = this.rage;
    this.rage = Math.min(100, this.rage + n);
    if (was < 100 && this.rage >= 100 && this.player) {
      FX.text(this.player.x, this.player.y, 58, 'OVERDRIVE READY', '#ffe066', 70);
      Sound.sfx('chime');
    }
  },
  slowmo(frames, scale) { if (frames > this.slow || scale < this.slowScale) { this.slow = frames; this.slowScale = scale; } },
  comboPitch() { const c = this.player ? this.player.comboHits : 0; return Math.pow(2, Math.min(c, 14) / 24); },
  isWaveFinalKill(e) {
    if (!this.wave || this.waveSpawned < this.wave.spawns.length) return false;
    return this.livingFoes().filter(f => f !== e).length === 0;
  },
  showFoe(e) { if (!e.boss) { this.foe = e; this.foeT = 120; } },
  itemUnder(pl) {
    return this.ents.find(e => e.team === 'item' && !e.remove && e.z < 2 && Math.abs(e.x - pl.x) < 12 && Math.abs(e.y - pl.y) < 7);
  },
  // Explosion that hurts everyone in range. opts: { r, depth, dmg, pdmg, palette }
  explode(x, y, src, opts = {}) {
    const r = opts.r || 36, depth = opts.depth || 16;
    FX.explosion(x, y, 8, r / 36, opts.palette);
    Sound.sfx('explode', x);
    let kos = 0;
    for (const v of this.ents.filter(e => (e.team === 'enemy' || e.team === 'player') && e.vulnerable)) {
      if (Math.abs(v.x - x) < r + v.w && Math.abs(v.y - y) < depth) {
        const before = v.dying;
        const dmg = v.team === 'player' ? (opts.pdmg != null ? opts.pdmg : 20) : (opts.dmg || 20);
        v.takeHit(v.team === 'player' ? { x, team: 'hazard' } : (src && src.team === 'player' ? src : this.player), { dmg, tier: 4, knock: true, kx: 3.2, kz: 4.0, zr: [0, 80], sfx: 'hitHeavy', burn: opts.burn != null ? opts.burn : 30 }, v.x < x ? -1 : 1);
        if (!before && v.dying && v.team === 'enemy') kos++;
      }
    }
    for (const b of this.ents.filter(e => e.team === 'prop' && !e.remove)) {
      if (Math.abs(b.x - x) < r && Math.abs(b.y - y) < depth) {
        if (b.kind === 'fuel') { if (!b.fuse) { b.fuse = 22; b.igniter = src; } }
        else b.smash(src);
      }
    }
    if (this.stage && this.stage.onExplosion) this.stage.onExplosion(this, x, y);
    return kos;
  },

  // ---------- run lifecycle ----------
  newGame() {
    seedRng(0xC0FFEE);
    this.score = 0; this.shownScore = 0; this.lives = 3; this.credits = this.diff.credits; this.rage = 0;
    this.stats = { kills: 0, time: 0 };
    this.player = null;
    this.startStage(0);
  },
  startStage(i) {
    this.stageIndex = i;
    const st = this.stage = STAGES[i];
    this.ents = [];
    FX.reset();
    timers.length = 0;
    this.cam = { x: st.camStart || 0, lock: null };
    this.bounds = { xMin: 8, xMax: st.len - 8, yMin: st.yMin, yMax: st.yMax, walls: false };
    const prev = this.player;
    this.player = this.add(new Player((st.camStart || 0) + 50, (st.yMin + st.yMax) / 2 + 6));
    if (prev) { this.player.hp = Math.max(prev.hp, 60); this.player.bestCombo = prev.bestCombo; this.player.damageTaken = prev.damageTaken; }
    this.waveIdx = 0; this.wave = null; this.goT = 0; this.foe = null; this.bossRef = null;
    this.playerGone = false;
    this.hitstop = 0; this.slow = 0; this.superFreeze = 0;
    this.solids = []; this.silhouetteDist = 0; this.bossCardInfo = null; this.warning = null; this.letterboxTarget = 0;
    Sound.musicFilter(20000, 0.1);
    for (const pr of st.props || []) this.add(new Breakable(pr.kind, pr.x, pr.y, pr.drop));
    for (const it of st.items || []) this.add(new Item(it.kind, it.x, it.y));
    if (st.setup) st.setup(this);
    this.card = { title: 'STAGE ' + (i + 1) + ' - ' + st.title, sub: st.sub };
    this.setState('stageintro');
    this.player.vx = 0;
    Sound.playSong(st.music);
  },
  playerDied() {
    if (this.playerGone) return;
    this.playerGone = true;
    this.lives--;
    if (this.lives > 0) setTimeoutFrames(30, () => this.respawn());
    else { this.setState('continue'); Sound.fadeOut(1.2); }
  },
  respawn() {
    const p = this.player;
    p.hp = p.maxHp; p.grey = 0; p.venom = 0; p.burn = 0;
    p.setState('jump');
    p.x = clamp(p.x, this.cam.x + 40, this.cam.x + W - 40);
    p.z = 110; p.vz = 0; p.vx = 0; p.jumpDir = 0; p.airUsed = true;
    p.inv = 120; p.blink = true;
    p.weapon = null;
    this.playerGone = false;
    this.respawnDrop = true;
    FX.flash('#ffffff', 4, 0.4);
  },
  respawnLanded() {
    this.respawnDrop = false;
    const p = this.player;
    FX.dustRing(p.x, p.y, 16);
    FX.shake(3, 12);
    Sound.sfx('thud', p.x);
    for (const e of this.livingFoes()) {
      if (Math.abs(e.x - p.x) < 80 && e.vulnerable) e.knockDown(e.x < p.x ? -1 : 1, 2.4 * e.weight, 3.0);
    }
  },
  doContinue() {
    if (this.credits < 99) this.credits--;
    this.lives = 3;
    this.rage = 50;
    this.playerGone = false;
    const p = this.player;
    p.dying = false;
    this.setState('play');
    this.respawn();
    Sound.playSong(this.stage.music, true);
  },

  // ---------- waves ----------
  updateWaves() {
    const st = this.stage, p = this.player;
    if (!this.wave) {
      const next = st.waves[this.waveIdx];
      if (next && this.cam.x >= next.at - 1) {
        this.wave = next; this.waveSpawned = 0; this.waveT = 0;
        this.cam.lock = next.at;
        this.goT = 0;
        if (next.onStart) next.onStart(this);
        if (next.music) Sound.playSong(next.music);
      }
    }
    if (this.wave) {
      const wv = this.wave;
      this.waveT++;
      while (this.waveSpawned < wv.spawns.length) {
        const s = wv.spawns[this.waveSpawned];
        if (this.waveT < (s.delay || 0)) break;
        if (s.whenBelow != null && this.livingFoes().length > s.whenBelow) break;
        if (s.cap != null && this.livingFoes().length >= s.cap) break;
        this.spawn(s);
        this.waveSpawned++;
      }
      if (wv.update) wv.update(this);
      const done = this.waveSpawned >= wv.spawns.length && this.livingFoes().length === 0 && (!wv.until || wv.until(this));
      if (done) {
        if (wv.onClear) wv.onClear(this);
        this.wave = null;
        this.waveIdx++;
        this.cam.lock = null;
        if (wv.boss) { setTimeoutFrames(wv.clearDelay || 120, () => this.stageClear()); this.bossDone = true; return; }
        if (wv.endsStage) { this.stageClear(); return; }
        if (!wv.noGo) { this.goT = 150; Sound.sfx('go'); }
      }
    }
    if (!this.wave && this.waveIdx >= st.waves.length && this.cam.x >= st.len - W - 1 && p.x > st.len - 50 && this.state === 'play' && !this.bossDone) {
      this.stageClear();
    }
  },
  // Spawn spec: { type, side: 'R'|'L'|'top'|'in'|<custom>, x (screen-relative), y, delay, variant, opts }
  spawn(s) {
    const cx = this.cam.x;
    const side = s.side || (chance(0.5) ? 'R' : 'L');
    const y = s.y != null ? s.y : rr(this.bounds.yMin + 4, this.bounds.yMax - 4);
    let x;
    if (side === 'R') x = cx + W + 18 + rr(0, 16);
    else if (side === 'L') x = cx - 18 - rr(0, 16);
    else x = cx + (s.x != null ? s.x : rr(60, W - 60));
    const e = new Enemy(s.type, x, y, Object.assign({ variant: s.variant || 0, enter: side }, s.opts || {}));
    e.facing = side === 'L' ? 1 : side === 'R' ? -1 : (this.player.x > x ? 1 : -1);
    if (side === 'L' || side === 'R') e.setState('enter');
    else if (side === 'top') { e.z = 60; e.vz = 0; e.y = s.y != null ? s.y : this.bounds.yMin + 4; e.setState('drop'); }
    else if (side === 'door') { e.y = this.bounds.yMin; e.setState('door'); }
    else if (e.def.enterStyles && e.def.enterStyles[side]) e.def.enterStyles[side].call(e, s);
    if (e.boss) this.bossRef = e;
    this.add(e);
    if (s.onSpawn) s.onSpawn(e, this);
    return e;
  },
  stageClear() {
    if (this.state !== 'play') return;
    this.bossDone = false;
    this.setState('clear');
    Sound.playSong('fanfare');
    this.clearBonus = { hp: Math.round(this.player.hp) * 30, stage: (this.stageIndex + 1) * 5000 };
  },

  // ---------- simulation ----------
  update() {
    this.frame++;
    this.t++;
    Input.update();
    if (this.portraitHit > 0) this.portraitHit--;
    if (this.shownScore < this.score) this.shownScore = Math.min(this.score, this.shownScore + Math.max(1, Math.ceil((this.score - this.shownScore) / 8)));
    else this.shownScore = this.score;
    const fn = this['upd_' + this.state];
    if (fn) fn.call(this);
    this.letterbox = approach(this.letterbox, this.letterboxTarget, 1.2);
    if (this.fadeDir) {
      this.fade = clamp(this.fade + this.fadeDir * 0.06, 0, 1);
      if (this.fade >= 1 && this.fadeDir > 0) { this.fadeDir = 0; const cb = this.fadeCb; this.fadeCb = null; cb && cb(); }
      else if (this.fade <= 0 && this.fadeDir < 0) this.fadeDir = 0;
    }
  },
  transition(cb) { if (this.fadeDir) return; this.fadeDir = 1; this.fadeCb = () => { cb(); this.fadeDir = -1; }; },

  upd_boot() {},
  upd_title() {
    FX.update();
    if (this.t === 60) { FX.shake(4, 12); Sound.sfx('hitFinisher'); for (let i = 0; i < 12; i++) FX.add({ kind: 'spark', x: W / 2, y: 80, z: 0, vx: rr(-4, 4), vz: rr(-1, 4), life: 14, g: 0.1, drag: 0.9 }); }
    if (this.fadeDir) return;
    if (this.t < 20) return;
    if (this.t < 60 && (Input.pressed('start') || Input.pressed('attack'))) { this.t = 59; return; }
    const items = 4;
    if (Input.pressed('up')) { this.menuSel = (this.menuSel + items - 1) % items; Sound.sfx('menu'); }
    if (Input.pressed('down')) { this.menuSel = (this.menuSel + 1) % items; Sound.sfx('menu'); }
    const lr = Input.pressed('left') ? -1 : Input.pressed('right') ? 1 : 0;
    const go = Input.pressed('start') || Input.pressed('attack') || Input.pressed('jump');
    if (this.menuSel === 1 && (lr || go)) {
      const keys = Object.keys(DIFFS);
      const i = (keys.indexOf(this.diffKey) + (lr || 1) + keys.length) % keys.length;
      this.diffKey = keys[i]; Store.set('diff', this.diffKey); Sound.sfx('menu');
      return;
    }
    if (this.menuSel === 2 && (lr || go)) { Sound.unlock(); Sound.toggleMute(); syncSoundButton(); Sound.sfx('menu'); return; }
    if (this.menuSel === 3 && (lr || go)) { FX.reducedShake = !FX.reducedShake; Store.set('reducedShake', FX.reducedShake); Sound.sfx('menu'); return; }
    if (go) {
      Sound.unlock();
      Sound.sfx('select');
      this.transition(() => { this.storyPages = STORY.intro; this.storyIdx = 0; this.storyChar = 0; this.storyNext = () => this.newGame(); this.setState('story'); Sound.playSong('story'); });
    }
  },
  upd_story() {
    if (this.fadeDir) return;
    const pages = this.storyPages;
    const page = pages[this.storyIdx];
    const full = page ? page.text.length : 0;
    const before = Math.floor(this.storyChar);
    this.storyChar = Math.min(full, this.storyChar + 0.5);
    if (Math.floor(this.storyChar) !== before && before % 2 === 0 && this.storyChar < full) Sound.sfx('tick');
    const adv = Input.pressed('attack') || Input.pressed('jump');
    if (Input.pressed('start')) { this.transition(this.storyNext); return; }
    if (adv) {
      if (this.storyChar < full) { this.storyChar = full; return; }
      this.storyIdx++; this.storyChar = 0; this.t = 0;
      if (this.storyIdx >= pages.length) this.transition(this.storyNext);
      else Sound.sfx('menu');
    }
  },
  upd_stageintro() {
    this.simulate(false);
    const p = this.player;
    if (this.t < 40) { p.setState('walk'); p.vx = p.walkX; p.vy = 0; p.facing = 1; p.x += 0; }
    else if (p.state === 'walk') { p.setState('idle'); p.vx = 0; }
    if (this.t > 130 || (this.t > 50 && Input.anyPressed)) { this.setState('play'); p.setState('idle'); p.vx = 0; }
  },
  upd_play() {
    if (Input.pressed('start')) { this.setState('pause'); Sound.sfx('pause'); this.menuSel = 0; return; }
    // slow motion: run the simulation on a fraction of frames
    if (this.slow > 0) {
      this.slow--;
      const ease = this.slow < 12 ? lerp(1, this.slowScale, this.slow / 12) : this.slowScale;
      this.slowAcc += ease;
      if (this.slowAcc < 1) { FX.update(); return; }
      this.slowAcc -= 1;
    }
    this.simulate(true);
  },
  upd_pause() {
    if (Input.pressed('start')) { this.setState('play'); Sound.sfx('pause'); return; }
    const n = 4;
    if (Input.pressed('up')) { this.menuSel = (this.menuSel + n - 1) % n; Sound.sfx('menu'); }
    if (Input.pressed('down')) { this.menuSel = (this.menuSel + 1) % n; Sound.sfx('menu'); }
    if (Input.pressed('attack') || Input.pressed('jump')) {
      if (this.menuSel === 0) { this.setState('play'); Sound.sfx('pause'); }
      else if (this.menuSel === 1) { Sound.unlock(); Sound.toggleMute(); syncSoundButton(); }
      else if (this.menuSel === 2) { FX.reducedShake = !FX.reducedShake; Store.set('reducedShake', FX.reducedShake); Sound.sfx('menu'); }
      else { Sound.sfx('select'); Sound.fadeOut(0.6); this.transition(() => this.toTitle()); }
    }
  },
  toTitle() { this.player = null; this.ents = []; this.letterboxTarget = 0; this.letterbox = 0; this.menuSel = 0; this.setState('title'); Sound.playSong('title'); },
  upd_continue() {
    FX.update();
    if (this.credits <= 0) { if (this.t > 40) this.gameOver(); return; }
    const count = 9 - Math.floor(this.t / 60);
    if (this.t % 60 === 0 && count >= 0) Sound.sfx('thud');
    if ((Input.pressed('start') || Input.pressed('attack') || Input.pressed('jump')) && this.t > 20) { Sound.sfx('select'); this.doContinue(); return; }
    if (count < 0) this.gameOver();
  },
  gameOver() {
    this.setState('gameover');
    this.saveHi();
    Sound.playSong('gameover');
  },
  saveHi() { if (this.score >= Store.get('hiscore', 0)) Store.set('hiscore', this.hiscore); },
  upd_gameover() {
    if (this.t > 120 && (Input.pressed('start') || Input.pressed('attack') || Input.pressed('jump'))) this.transition(() => this.toTitle());
  },
  upd_clear() {
    this.simulate(false);
    const b = this.clearBonus;
    if (this.t === 100) { this.addScore(b.hp); Sound.sfx('pickup'); }
    if (this.t === 140) { this.addScore(b.stage); Sound.sfx('pickup'); }
    if (this.t > 250 && !this.fadeDir) {
      this.transition(() => {
        const next = this.stageIndex + 1;
        if (next < STAGES.length) {
          const pages = STORY.between[this.stageIndex];
          if (pages && pages.length) { this.storyPages = pages; this.storyIdx = 0; this.storyChar = 0; this.storyNext = () => this.startStage(next); this.setState('story'); Sound.playSong('story'); }
          else this.startStage(next);
        } else {
          this.saveHi();
          this.storyPages = STORY.ending; this.storyIdx = 0; this.storyChar = 0;
          this.storyNext = () => { this.setState('results'); Sound.playSong('title'); };
          this.setState('story');
          Sound.playSong('ending');
        }
      });
    }
  },
  upd_results() {
    FX.update();
    if (this.t < 120 && this.t >= 20 && (this.t - 20) % 20 === 0) Sound.sfx('tick');
    if (this.t === 130) { FX.shake(3, 10); Sound.sfx('hitFinisher'); }
    if (this.t > 200 && (Input.pressed('start') || Input.pressed('attack') || Input.pressed('jump'))) this.transition(() => this.toTitle());
  },

  // One world tick. `live` = player input and waves are active.
  simulate(live) {
    if (this.superFreeze > 0) {
      this.superFreeze--;
      FX.update();
      if (this.frame % 2 === 0) {
        const a = rr(0, TAU), r = rr(60, 140);
        FX.add({ kind: 'line', x: this.player.x + Math.cos(a) * r, y: this.player.y - 20, z: Math.sin(a) * r * 0.5, dx: -Math.cos(a) * 40, dy: -Math.sin(a) * 20, life: 6, g: 0, color: '#ffffff' });
      }
      return;
    }
    if (this.hitstop > 0) { this.hitstop--; FX.update(); for (const e of this.ents) if (e.hs > 0) e.hs--; return; }
    if (timers.length) runTimers();
    const p = this.player;
    const hittable = this.ents.filter(e => (e.team === 'enemy' || e.team === 'prop') && !e.remove);
    const lockWalls = this.cam.lock != null;
    this.bounds.walls = lockWalls;
    if (p) {
      if (p.hs > 0) p.hs--;
      else if (live) p.update(this.bounds, hittable);
      else this.autoPilot(p);
      if (this.respawnDrop && p.z <= 0 && p.state !== 'jump') this.respawnLanded();
      p.x = clamp(p.x, this.cam.x + 10, this.cam.x + W - 10);
    }
    if (live) { this.stats.time++; this.updateWaves(); }
    for (const e of this.ents) {
      if (e === p) continue;
      if (e.hs > 0) { e.hs--; continue; }
      if (e.team === 'enemy') {
        const inside = !(e.state === 'enter' || e.def.offscreenOk);
        const b = inside
          ? { xMin: this.cam.x + 6, xMax: this.cam.x + W - 6, yMin: this.bounds.yMin, yMax: this.bounds.yMax, walls: lockWalls }
          : { xMin: this.cam.x - 120, xMax: this.cam.x + W + 120, yMin: this.bounds.yMin, yMax: this.bounds.yMax, walls: false };
        e.update(b);
      } else e.update(this.bounds);
    }
    this.separate();
    for (const e of this.ents) if (e.remove && e.team === 'enemy' && !e.counted) { e.counted = true; this.stats.kills++; }
    this.ents = this.ents.filter(e => !e.remove);
    if (this.foe && (--this.foeT <= 0 || this.foe.remove)) this.foe = null;
    if (this.goT > 0) this.goT--;
    this.updateCamera(live);
    if (this.stage.update) this.stage.update(this);
    if (this.bossCardInfo && ++this.bossCardInfo.t > 110) { this.bossCardInfo = null; this.letterboxTarget = 0; }
    if (this.warning && ++this.warning.t > this.warning.life) this.warning = null;
    FX.update();
  },
  // Keep grounded, free-moving enemies from stacking on one another.
  separate() {
    const free = this.ents.filter(e => e.team === 'enemy' && !e.dying && e.z < 1 && (e.state === 'idle' || e.state === 'walk') && !e.def.noSeparate);
    for (let i = 0; i < free.length; i++) {
      for (let j = i + 1; j < free.length; j++) {
        const a = free[i], b = free[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const minX = (a.w + b.w) * 0.9;
        if (Math.abs(dx) < minX && Math.abs(dy) < 6) {
          const push = (minX - Math.abs(dx)) * 0.08 + 0.1;
          const sx = dx === 0 ? (a.id < b.id ? 1 : -1) : sign(dx);
          a.x -= sx * push; b.x += sx * push;
          const sy = dy === 0 ? (a.id < b.id ? 1 : -1) : sign(dy);
          a.y = clamp(a.y - sy * 0.25, this.bounds.yMin, this.bounds.yMax);
          b.y = clamp(b.y + sy * 0.25, this.bounds.yMin, this.bounds.yMax);
        }
      }
    }
  },
  // Player behaviour while the game drives (intros, clears).
  autoPilot(p) {
    p.physics(this.bounds);
    if (['hurt', 'fall', 'down', 'getup'].includes(p.state)) { p.reactionStates(); if (p.state === 'getup' && p.t > 18) p.setState('idle'); return; }
    if (p.state === 'attack' && p.atkPhase() === 'done') { p.atk = null; p.setState('idle'); }
    if (p.state === 'jump' || p.state === 'land' || p.state === 'jumpsquat') { if (p.z <= 0 && p.state !== 'jumpsquat') p.setState('idle'); }
    if (p.state === 'run' || p.state === 'grab') { p.releaseHold && p.releaseHold(); p.setState('idle'); }
    if (p.state !== 'walk') { p.vx *= 0.7; p.vy = 0; }
  },
  updateCamera(live) {
    const p = this.player, st = this.stage;
    if (!p) return;
    const look = p.facing * 24;
    let target = p.x - W / 2 + look;
    const maxX = this.cam.lock != null ? this.cam.lock : st.len - W;
    target = clamp(target, this.cam.x, maxX);
    this.cam.x = Math.min(maxX, this.cam.x + Math.min(3, (target - this.cam.x) * 0.08 + (target > this.cam.x ? 0.2 : 0)));
    if (this.cam.x > target) this.cam.x = Math.max(this.cam.x, Math.min(target, this.cam.x));
    this.bounds.xMin = this.cam.x + 8;
    this.bounds.xMax = this.cam.x + W - 8;
  },

  // ---------- drawing ----------
  draw() {
    const ctx = Screen.ctx;
    Px.use(ctx);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    const fn = this['draw_' + this.state];
    if (fn) fn.call(this, ctx);
    if (this.fade > 0) {
      ctx.globalAlpha = this.fade;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  },
  drawWorld(ctx) {
    const st = this.stage, camX = Math.round(this.cam.x);
    ctx.save();
    ctx.translate(FX.offX(), FX.shakeY);
    st.drawBg(ctx, camX, this.frame, this);
    FX.drawDecals(ctx, camX);
    Px.use(ctx);
    for (const e of this.ents) {
      if (!e.shadowR || e.remove || e.noShadow) continue;
      const r = e.shadowR * clamp(1 - e.z / 80, 0.45, 1);
      groundShadow(ctx, e.x - camX, e.y, r, 0.35);
    }
    if (st.drawMarkers) st.drawMarkers(ctx, camX, this);
    for (const e of this.ents) if (e.drawMarker) e.drawMarker(ctx, camX);
    const order = this.ents.slice().sort((a, b) => a.sortY() - b.sortY() || (a.team === 'player' ? 1 : b.team === 'player' ? -1 : 0));
    for (const e of order) e.draw(ctx, camX);
    FX.draw(ctx, camX);
    if (st.drawFg) st.drawFg(ctx, camX, this.frame, this);
    ctx.restore();
    if (this.superFreeze > 0) {
      ctx.globalAlpha = 0.55; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
      ctx.save(); ctx.translate(FX.offX(), FX.shakeY);
      FX.draw(ctx, camX);
      this.player.draw(ctx, camX);
      ctx.restore();
      const k = clamp((24 - this.superFreeze) / 6, 0, 1);
      drawText(ctx, this.superText, W / 2, 70, '#ffe066', Math.round(lerp(4, 2, k)), 'center');
    }
    FX.drawOverlay(ctx);
    if (this.warning) {
      const w = this.warning, on = Math.floor(w.t / 20) % 2 === 0 && w.t < 120;
      if (on || w.t >= 120) {
        ctx.globalAlpha = w.t >= 120 ? Math.max(0, 1 - (w.t - 120) / 30) * 0.9 : 0.9;
        ctx.fillStyle = '#b8322a'; ctx.fillRect(0, 100, W, 16);
        ctx.globalAlpha = 1;
        if (on) drawText(ctx, w.text, W / 2, 104, '#ffffff', 1, 'center');
      }
    }
    if (this.bossCardInfo) {
      const b = this.bossCardInfo, k = Math.min(1, b.t / 12) * (b.t > 96 ? Math.max(0, 1 - (b.t - 96) / 14) : 1);
      ctx.globalAlpha = 0.3 * k; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
      if (k > 0.05) {
        drawText(ctx, b.name, lerp(-120, W / 2, easeOut(k)), 86, '#ffe08a', 2, 'center');
        drawText(ctx, b.epithet, lerp(W + 120, W / 2, easeOut(k)), 106, '#e8e0d0', 1, 'center');
      }
    }
    if (this.letterbox > 0) {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, Math.round(this.letterbox));
      ctx.fillRect(0, H - Math.round(this.letterbox), W, Math.round(this.letterbox));
    }
  },
  draw_boot(ctx) {
    ctx.fillStyle = '#0e0a08'; ctx.fillRect(0, 0, W, H);
    drawText(ctx, (Input.lastDevice === 'touch' ? 'TAP' : 'CLICK OR PRESS ANY KEY'), W / 2, H / 2 - 3, '#e9d9bf', 1, 'center');
  },
  draw_title(ctx) { drawTitleScreen(ctx, this); },
  draw_story(ctx) { drawStoryScreen(ctx, this.storyPages[this.storyIdx], this.storyChar, this); },
  draw_results(ctx) { drawResults(ctx, this); },
  draw_stageintro(ctx) { this.drawWorld(ctx); drawHUD(ctx, this); drawStageCard(ctx, this.card, this.t); },
  draw_play(ctx) { this.drawWorld(ctx); drawHUD(ctx, this); },
  draw_pause(ctx) {
    this.drawWorld(ctx); drawHUD(ctx, this);
    ctx.globalAlpha = 0.6; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    drawText(ctx, 'PAUSED', W / 2, 56, '#ffe066', 3, 'center');
    const opts = ['RESUME', 'SOUND: ' + (Sound.muted ? 'OFF' : 'ON'), 'SCREEN SHAKE: ' + (FX.reducedShake ? 'LOW' : 'FULL'), 'QUIT TO TITLE'];
    opts.forEach((o, i) => drawText(ctx, (this.menuSel === i ? '> ' : '  ') + o, W / 2 - 64, 100 + i * 14, this.menuSel === i ? '#ffffff' : '#9c8670'));
  },
  draw_continue(ctx) {
    this.drawWorld(ctx); drawHUD(ctx, this);
    ctx.globalAlpha = 0.6; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    if (this.credits > 0) {
      const count = Math.max(0, 9 - Math.floor(this.t / 60));
      const k = (this.t % 60) / 8;
      drawText(ctx, 'CONTINUE?', W / 2, 52, '#ffe066', 3, 'center');
      drawText(ctx, String(count), W / 2, 92 - (k < 1 ? (1 - k) * 6 : 0), '#ffffff', k < 1 ? 7 : 6, 'center');
      drawText(ctx, Input.lastDevice === 'touch' ? 'TAP HIT' : 'PRESS ATTACK', W / 2, 150, (this.t >> 4) % 2 ? '#e9d9bf' : '#9c8670', 1, 'center');
      drawText(ctx, this.credits >= 99 ? 'FREE PLAY' : 'CREDITS ' + this.credits, W / 2, 164, '#9c8670', 1, 'center');
    }
  },
  draw_gameover(ctx) { drawGameOver(ctx, this); },
  draw_clear(ctx) { this.drawWorld(ctx); drawHUD(ctx, this); drawClearTally(ctx, this); },
};

// Frame-based timers so delays respect pause.
const timers = [];
function setTimeoutFrames(n, fn) { timers.push({ n, fn }); }
function runTimers() {
  for (let i = timers.length - 1; i >= 0; i--) {
    if (--timers[i].n <= 0) { const fn = timers[i].fn; timers.splice(i, 1); fn(); }
  }
}
function syncSoundButton() { const b = document.getElementById('btn-sound'); if (b) { b.textContent = Sound.muted ? 'Sound off' : 'Sound on'; b.setAttribute('aria-pressed', String(!Sound.muted)); } }

// ---- 85_ui.js ----
// UI: HUD, title, story cards, stage cards, tallies, results.

const UI = { ink: '#e9d9bf', dim: '#9c8670', gold: '#ffe066', orange: '#ff9a2e', red: '#e83b3b', green: '#59e04a' };
const FAMILY_BAR = { gang: '#e8c547', mutant: '#7cff4f', scorpion: '#ff8a3d', hero: '#e83b3b' };
const GAME_TITLE = { name: 'SCRAPFIST', sub: 'ROAD TO THE LAST WELL' };

const _ghost = new WeakMap();
function ghostOf(e, frac) {
  let g = _ghost.get(e);
  if (!g) g = { v: frac, hold: 0 };
  if (frac >= g.v) { g.v = frac; g.hold = 18; }
  else if (g.hold > 0) g.hold--;
  else g.v = Math.max(frac, g.v - 0.012);
  _ghost.set(e, g);
  return g.v;
}
function hpBar(ctx, x, y, w, h, frac, col, opts = {}) {
  Px.use(ctx);
  Px.rect(x - 1, y - 1, w + 2, h + 2, '#1a1a1a');
  Px.rect(x, y, w, h, opts.back || '#3a1a1a');
  if (opts.ghost != null) Px.rect(x, y, Math.round(w * clamp(opts.ghost, 0, 1)), h, '#ffe066');
  const fw = Math.round(w * clamp(frac, 0, 1));
  Px.rect(x, y, fw, h, col);
  if (h >= 3) Px.rect(x, y, fw, 1, shade(col, 0.35));
  if (opts.grey) Px.rect(x + fw, y, Math.round(w * clamp(opts.grey, 0, 1)), h, '#9a9a9a');
}

function drawHUD(ctx, g) {
  const p = g.player;
  if (!p) return;
  Px.use(ctx);
  ctx.globalAlpha = 0.35; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 28); ctx.globalAlpha = 1;
  // portrait
  const ph = g.portraitHit > 0;
  const px = 4 + (ph ? (g.frame % 2 ? 1 : -1) : 0);
  const lowHp = p.hp / p.maxHp < 0.25;
  Px.rect(px - 1, 3, 22, 22, lowHp && (g.frame >> 3) % 2 ? '#e83b3b' : '#000');
  Px.rect(px, 4, 20, 20, '#3a2b20');
  drawPortrait(ctx, px + 10, 20);
  if (ph) { ctx.globalAlpha = 0.7; Px.rect(px, 4, 20, 20, '#ffffff'); ctx.globalAlpha = 1; }
  if (lowHp) Px.rect(px + 15, 7 + (g.frame >> 3) % 3, 2, 3, '#bde6ff');
  drawText(ctx, HERO.name, 28, 3, UI.ink);
  // HP
  const frac = p.hp / p.maxHp;
  const fill = p.venom > 0 ? '#7cff4f' : UI.red;
  hpBar(ctx, 28, 12, 104, 6, frac, fill, { ghost: ghostOf(p, frac), grey: p.grey / p.maxHp });
  // rage
  const full = g.rage >= 100;
  const rc = full ? ((g.frame >> 3) % 2 ? UI.gold : UI.orange) : UI.orange;
  hpBar(ctx, 28, 22, 64, 2, g.rage / 100, rc, { back: '#2a1d15' });
  if (full) { Px.poly([94, 25, 96, 19, 98, 25], (g.frame >> 2) % 2 ? '#ffe066' : '#ff5a1e'); }
  // weapon icon + durability pips
  if (p.weapon) {
    Px.use(ctx);
    ctx.save(); ctx.translate(112, 26); ctx.scale(0.6, 0.6);
    drawItemIcon(p.weapon.kind, 0, 0, g.frame);
    ctx.restore();
    for (let i = 0; i < p.weapon.uses; i++) Px.rect(102 + i * 2, 25, 1, 2, '#c9ced6');
  }
  // lives
  drawText(ctx, 'x' + g.lives, 138, 12, UI.ink);
  // score
  drawText(ctx, String(g.shownScore).padStart(7, '0'), W / 2 + 12, 3, UI.gold, 1, 'center');
  drawText(ctx, 'HI ' + String(g.hiscore).padStart(7, '0'), W / 2 + 12, 13, UI.dim, 1, 'center');
  // enemy panel (non-boss)
  const f = g.foe;
  const b = g.bossRef && !g.bossRef.remove ? g.bossRef : null;
  if (f && !f.remove && !b) {
    const ff = Math.max(0, f.hp / f.maxHp);
    drawText(ctx, f.name, 252, 3, UI.ink);
    hpBar(ctx, 252, 13, 124, 5, ff, FAMILY_BAR[f.family] || UI.gold, { ghost: ghostOf(f, ff) });
  }
  // boss bar: stacked 200-HP layers
  if (b && g.state !== 'stageintro') {
    const layer = b.def.barLayer || 200;
    const n = Math.ceil(b.maxHp / layer);
    const cols = ['#e83b3b', '#e8c547', '#59e04a', '#3fa9f5'];
    const hp = Math.max(0, b.hp);
    const idx = Math.max(0, Math.ceil(hp / layer) - 1);
    const within = hp - idx * layer;
    drawText(ctx, b.name, 32, H - 21, UI.gold);
    Px.rect(31, H - 13, 322, 8, '#1a1a1a');

  }
  // combo
  if (p.comboHits >= 2 && p.comboT > 0) {

}

function drawStageCard(ctx, card, t) {
  if (!card) return;

  if (k <= 0) return;
  const y = 82;
  ctx.globalAlpha = 0.7 * k;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, y - 10, W, 44);
  ctx.globalAlpha = 1;
  drawText(ctx, card.title, lerp(-200, W / 2, k), y, UI.gold, 2, 'center');
  drawText(ctx, card.sub, lerp(W + 200, W / 2, k), y + 22, UI.ink, 1, 'center');
}

function drawClearTally(ctx, g) {

// ---------- title ----------
function drawTitleScreen(ctx, g) {
  const t = g.t, f = g.frame;
  drawDuskSky(ctx, f * 0.1);
  // ash drift
  Px.use(ctx);
  for (let i = 0; i < 40; i++) {
    const x = ((i * 97 + f * (0.3 + (i % 3) * 0.1)) % (W + 20)) - 10;
    const y = ((i * 53 + f * (0.5 + (i % 4) * 0.12)) % (H + 10)) - 5;
    Px.rect(W - x, y, 1, 1, '#8a7a6a');
  }
  // logo: letters drop in one every 4f with a bounce
  const name = GAME_TITLE.name;
  const scale = 4, lw = 6 * scale;
  const x0 = W / 2 - (name.length * lw - scale) / 2;
  const punch = t >= 60;
  const sh = t >= 60 && t < 72 ? (t % 2 ? 2 : -2) : 0;
  for (let i = 0; i < name.length; i++) {
    const lt = t - i * 4;
    if (lt < 0) continue;
    let y = 40;
    if (lt < 14) y = 40 - (1 - lt / 14) * (1 - lt / 14) * 70;
    else if (lt < 20) y = 40 - Math.sin((lt - 14) / 6 * Math.PI) * 4;
    const x = x0 + i * lw + sh;
    drawTextRaw(ctx, name[i], x + 2, y + 2, '#1a0f0a', scale);
    drawTextRaw(ctx, name[i], x + 1, y + 1, '#c2553a', scale);
    drawTextRaw(ctx, name[i], x, y, '#ffd27a', scale);
    // rust drips
    Px.use(ctx);
    if ((i * 7) % 3 === 0) Px.rect(x + 6 + (i % 3) * 4, y + 28, 1, 3 + ((f >> 4) + i) % 4, '#8a4b2a');
  }
  // the gauntlet punches up into the logo
  if (t >= 48) {
    const k = clamp((t - 48) / 12, 0, 1);
    const gy = lerp(H + 10, 76, easeOut(k));
    drawBigFist(ctx, W / 2 + sh, gy);
  }
  // subtitle types in
  if (t > 64) {
    const n = Math.min(GAME_TITLE.sub.length, Math.floor((t - 64) / 2));
    drawText(ctx, GAME_TITLE.sub.slice(0, n), W / 2, 76, UI.ink, 1, 'center');
  }
  if (punch) {
    // menu
    const items = ['START', 'DIFFICULTY  < ' + g.diff.name + ' >', 'SOUND  ' + (Sound.muted ? 'OFF' : 'ON'), 'SCREEN SHAKE  ' + (FX.reducedShake ? 'LOW' : 'FULL')];
    items.forEach((s, i) => {
      const sel = g.menuSel === i;
      const blink = i === 0 && sel && (f % 32) >= 20;
      if (!blink) drawText(ctx, s, W / 2, 132 + i * 12, sel ? '#ffffff' : UI.dim, 1, 'center');
      if (sel) { Px.use(ctx); drawMiniFist(ctx, W / 2 - textWidth(s) / 2 - 12, 135 + i * 12); }
    });
    drawText(ctx, 'HI-SCORE ' + String(g.hiscore).padStart(7, '0'), W / 2, 6, UI.gold, 1, 'center');
    drawText(ctx, Input.lastDevice === 'touch' ? 'D-PAD MOVE  HIT  JUMP  SPEC' : 'J ATTACK  K JUMP  L SPECIAL  ENTER PAUSE', W / 2, H - 12, UI.dim, 1, 'center');
  }
  ctx.save(); ctx.translate(FX.shakeX, FX.shakeY);
  FX.draw(ctx, 0);
  ctx.restore();
}
function drawBigFist(ctx, x, y) {
  Px.use(ctx);

  Px.rect(x - 12, y + 18, 24, 60, P.steel);
  Px.rect(x - 12, y + 18, 4, 60, P.steelHi);

  for (let i = 0; i < 3; i++) Px.rect(x - 2 + (i - 1) * 6, y + 30, 2, 8, Game.rage >= 0 ? '#ff9a2e' : '#1a1a1a');
  Px.rect(x - 4, y + 44, 6, 5, P.rust);
  Px.rect(x - 16, y - 4, 32, 24, P.fist);
  Px.rect(x - 16, y - 4, 32, 3, P.steelHi);
  for (let i = 0; i < 4; i++) Px.rect(x - 14 + i * 8, y + 2, 6, 1, P.steelDk);
  for (let i = 0; i < 3; i++) Px.disc(x - 10 + i * 10, y + 12, 1.5, P.steelHi);
}
function drawMiniFist(ctx, x, y) {

// Shared dusk sky (title + stage 1): gradient, banded sun, skyline.
function drawDuskSky(ctx, scroll) {
  Px.use(ctx);
  const stops = ['#2b1b3d', '#5a2a48', '#8a3a4a', '#c45a4e', '#f2a65a'];
  const bands = 18;
  for (let i = 0; i < bands; i++) {
    const k = i / (bands - 1) * (stops.length - 1);
    Px.rect(0, Math.floor(i * 120 / bands), W, Math.ceil(120 / bands) + 1, stops[Math.min(stops.length - 1, Math.round(k))]);
  }
  Px.rect(0, 120, W, H - 120, '#2a1a22');
  // sun with retro cut bands
  const sx = 280 - scroll * 0.02 % 40, sy = 96;
  Px.disc(sx, sy, 28, '#ffd27a');
  Px.disc(sx, sy, 24, '#ffe3a0');
  [6, 13, 19].forEach((d, i) => Px.rect(sx - 30, sy + d, 60, 2 + i, '#c45a4e'));
  // far skyline
  for (let i = 0; i < 16; i++) {
    const bw = 18 + (i * 37) % 30, bh = 26 + (i * 53) % 50;
    const bx = ((i * 41 - scroll * 0.12) % (W + 60) + W + 60) % (W + 60) - 30;
    Px.rect(bx, 122 - bh, bw, bh, '#3a2440');
    Px.poly([bx, 122 - bh, bx + bw * 0.3, 122 - bh - 6, bx + bw * 0.6, 122 - bh - 2, bx + bw, 122 - bh - 8, bx + bw, 122 - bh], '#3a2440');
    for (let wy = 122 - bh + 6; wy < 118; wy += 7) for (let wx = bx + 3; wx < bx + bw - 3; wx += 6) if (((wx * 7 + wy * 13 + i) % 11) === 0) Px.rect(wx, wy, 1, 2, '#ffb347');
  }
}

// ---------- story ----------
function drawStoryScreen(ctx, page, chars, g) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (!page) return;
  // illustration panel
  ctx.save();
  ctx.beginPath(); ctx.rect(92, 16, 200, 96); ctx.clip();
  if (page.art) page.art(ctx, 92, 16, g.t, g.frame);
  ctx.restore();
  Px.use(ctx);
  Px.rect(91, 15, 202, 1, '#ffb030'); Px.rect(91, 112, 202, 1, '#ffb030'); Px.rect(91, 15, 1, 98, '#ffb030'); Px.rect(292, 15, 1, 98, '#ffb030');
  // text box
  Px.rect(20, 126, 344, 1, '#ffb030'); Px.rect(20, 192, 344, 1, '#ffb030'); Px.rect(20, 126, 1, 67, '#ffb030'); Px.rect(363, 126, 1, 67, '#ffb030');
  const text = page.text.slice(0, Math.floor(chars));
  const lines = wrapText(text, 54);
  lines.forEach((ln, i) => drawText(ctx, ln, 28, 133 + i * 11, UI.ink));
  if (chars >= page.text.length && (g.frame >> 4) % 2) Px.poly([350, 182, 358, 182, 354, 187], UI.gold);
  drawText(ctx, 'ENTER: SKIP', W - 6, H - 10, '#5a4a3a', 1, 'right');
}
function wrapText(str, n) {
  const out = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const w of para.split(' ')) {
      if ((line + ' ' + w).trim().length > n) { out.push(line.trim()); line = w; }
      else line += ' ' + w;
    }
    out.push(line.trim());
  }
  return out;
}

// ---------- game over ----------
function drawGameOver(ctx, g) {
  ctx.fillStyle = '#0e0a08'; ctx.fillRect(0, 0, W, H);
  const word = 'GAME OVER';
  const t = g.t;
  for (let i = 0; i < word.length; i++) {
    const lt = t - i * 5;
    if (lt < 0) continue;
    const y = lt < 16 ? lerp(-30, 70, easeOut(lt / 16)) : 70;
    const crack = t > 80 ? Math.min(3, (t - 80) / 8) * ((i % 2) ? 1 : -1) : 0;
    drawText(ctx, word[i], W / 2 - (word.length * 24) / 2 + i * 24 + 2, y + crack, '#e83b3b', 4);
  }
  if (t > 60) {
    drawText(ctx, 'SCORE ' + String(g.score).padStart(7, '0'), W / 2, 130, UI.ink, 1, 'center');
    drawText(ctx, 'HI ' + String(g.hiscore).padStart(7, '0'), W / 2, 144, UI.gold, 1, 'center');
    drawText(ctx, 'THE WASTES KEEP ANOTHER.', W / 2, 170, UI.dim, 1, 'center');
  }
}

// ---------- results ----------
function drawResults(ctx, g) {
  ctx.fillStyle = '#0e0a08'; ctx.fillRect(0, 0, W, H);

  const rows = [
    ['TIME', mins + ':' + String(secs).padStart(2, '0')],
    ['MAX COMBO', String(p.bestCombo)],
    ['KOS', String(g.stats.kills)],
    ['DAMAGE TAKEN', String(Math.round(p.damageTaken))],
    ['SCORE', String(g.score).padStart(7, '0')],
  ];
  rows.forEach((r, i) => {
    if (g.t < 20 + i * 20) return;
    drawText(ctx, r[0], 80, 56 + i * 16, UI.dim);
    drawText(ctx, r[1], 300, 56 + i * 16, UI.ink, 1, 'right');
  });
  if (g.t >= 130) {
    const rank = g.score >= 120000 ? 'S' : g.score >= 90000 ? 'A' : g.score >= 60000 ? 'B' : 'C';
    const k = clamp((g.t - 130) / 8, 0, 1);
    drawText(ctx, 'RANK', 330, 60, UI.dim, 1, 'center');
    drawText(ctx, rank, 330, 76, rank === 'S' ? UI.gold : UI.ink, Math.round(lerp(9, 5, k)), 'center');
  }
  if (g.t > 200) drawText(ctx, 'THANKS FOR PLAYING', W / 2, 172, UI.ink, 1, 'center');
  if (g.t > 200 && (g.frame >> 4) % 2) drawText(ctx, 'PRESS ATTACK', W / 2, 188, UI.dim, 1, 'center');
}

// ---- 99_main.js ----
// Boot: wire the page, run the fixed-step loop.

// Plain arena used by the test tools when a stage module is missing.
const TEST_ARENA = {
  title: 'TEST ARENA', sub: 'SANDBOX', len: 1200, yMin: 134, yMax: 200, music: null,
  drawBg(ctx, camX) {
    Px.use(ctx);
    Px.rect(0, 0, W, 134, '#3a2a30'); Px.rect(0, 70, W, 64, '#4a3a36');
    for (let x = -(camX % 48); x < W; x += 48) Px.rect(x, 70, 1, 64, '#2a1e20');
    Px.rect(0, 134, W, 82, '#3e3530');
    for (let x = -(camX % 48); x < W; x += 48) Px.rect(x, 168, 16, 2, '#8a7a5a');
  },
  waves: [],
};

(function boot() {
  const view = document.getElementById('screen');
  Screen.init(view);
  Input.init(view);
  const pad = document.getElementById('pad');
  if (pad) Input.bindTouch(pad);

  const markTouch = () => {
    if (!document.body.classList.contains('touch')) { document.body.classList.add('touch'); Screen.fit(); }
  };
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) markTouch();
  window.addEventListener('touchstart', markTouch, { passive: true, once: true });

  // first interaction unlocks audio
  const unlock = () => { Sound.unlock(); if (Game.state === 'boot') Game.setState('title'); if (Sound.ok() && !Sound.timer && Sound.songName) Sound.playSong(Sound.songName, true); };
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, unlock, { passive: true }));
  view.addEventListener('pointerdown', () => view.focus({ preventScroll: true }));

  const soundBtn = document.getElementById('btn-sound');
  const syncSound = () => { if (soundBtn) { soundBtn.textContent = Sound.muted ? 'Sound off' : 'Sound on'; soundBtn.setAttribute('aria-pressed', String(!Sound.muted)); } };
  syncSound();
  if (soundBtn) soundBtn.addEventListener('click', () => { Sound.unlock(); Sound.toggleMute(); syncSound(); view.focus({ preventScroll: true }); });
  window.addEventListener('keydown', e => { if (e.code === 'KeyM') { Sound.unlock(); Sound.toggleMute(); syncSound(); } });

  const fullBtn = document.getElementById('btn-full');
  if (fullBtn) {
    const canFull = document.fullscreenEnabled || document.webkitFullscreenEnabled;
    if (!canFull) fullBtn.hidden = true;
    fullBtn.addEventListener('click', () => {
      const el = document.querySelector('.app');
      try {
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } catch (err) { /* fullscreen not allowed here */ }
      view.focus({ preventScroll: true });
    });
  }

  Game.setState('boot');
  Sound.songName = 'title';

  let acc = 0, last = performance.now();
  function frame(now) {
    if (window.__wb && window.__wb.manual) { last = now; requestAnimationFrame(frame); return; }
    const dt = Math.min(0.25, (now - last) / 1000);
    last = now;
    acc += dt;
    let steps = 0;
    while (acc >= STEP && steps < 5) {
      Game.update();
      acc -= STEP;
      steps++;
    }
    if (steps === 5) acc = 0;
    Game.draw();
    Screen.present();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Test hook: lets automated playtests drive the simulation deterministically.
  window.__wb = {
    Game, Input, FX, Sound, STAGES, ENEMY_TYPES,
    manual: false,
    step(n = 1) { for (let i = 0; i < n; i++) Game.update(); Game.draw(); Screen.present(); },
    // Hold the given actions for n frames (then release), stepping the simulation.
    input(actions, n = 1, release = true) {
      const list = Array.isArray(actions) ? actions : [actions];
      for (const a of list) Input.key[a] = true;
      this.step(n);
      if (release) { for (const a of list) Input.key[a] = false; }
    },
    tap(a, gap = 1) { this.input(a, 1); this.step(gap); },
    snapshot() {
      const G = Game, p = G.player;
      return { state: G.state, stage: G.stageIndex, wave: G.waveIdx, camX: Math.round(G.cam.x), lock: G.cam.lock,
        hp: p && Math.round(p.hp), grey: p && Math.round(p.grey), pstate: p && p.state, px: p && Math.round(p.x), py: p && Math.round(p.y), pz: p && Math.round(p.z),
        rage: Math.round(G.rage), score: G.score, combo: p && p.comboHits, lives: G.lives,
        foes: G.foes().map(e => ({ type: e.type, hp: Math.round(e.hp), state: e.state, x: Math.round(e.x), y: Math.round(e.y), z: Math.round(e.z) })),
        ents: G.ents.length };
    },
    // Jump straight into a stage (optionally at a wave index) for testing.
    play(stage = 0, wave = 0) {
      Sound.unlock();
      Game.newGame();
      if (stage) Game.startStage(stage);
      Game.setState('play');
      if (wave) {
        const w = Game.stage.waves[wave];
        Game.waveIdx = wave; Game.cam.x = w.at; Game.player.x = w.at + 80;
      }
      return Game.state;
    },
    // Arena with the given enemy types in the given stage (or a plain test arena if it doesn't exist yet).
    sandbox(types, stage = 0) {
      if (!STAGES[stage]) STAGES[stage] = TEST_ARENA;
      this.play(stage);
      Game.stage = Object.assign({}, Game.stage, { waves: [] });
      Game.ents = Game.ents.filter(e => e.team === 'player');
      Game.cam.lock = Game.cam.x;
      return types.map((t, i) => Game.spawn({ type: t, side: 'in', x: 220 + (i % 3) * 40, y: Game.bounds.yMin + 10 + (i * 23) % 60 }).id);
    },
  };
})();
