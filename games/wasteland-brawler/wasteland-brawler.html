// ---- 20_gfx.js ----
// Pixel drawing toolkit. Every primitive snaps to whole pixels so the 384x216 buffer stays crisp
// when upscaled. Characters are drawn into a scratch sprite canvas, then composited with an
// outline, hit-flash and drop shadow.

const Px = {
  g: null, // current target context
  use(g) { this.g = g; },
  rect(x, y, w, h, c) {
    if (w <= 0 || h <= 0) return;
    const g = this.g;
    g.fillStyle = c;
    g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  },
  // Thick line from (x0,y0) to (x1,y1) stamped with a square brush of size t.
  line(x0, y0, x1, y1, t, c) {
    const g = this.g;
    g.fillStyle = c;
    const dx = x1 - x0, dy = y1 - y0;
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))));
    const h = t / 2;
    for (let i = 0; i <= n; i++) {
      const x = x0 + dx * i / n, y = y0 + dy * i / n;
      g.fillRect(Math.round(x - h), Math.round(y - h), t, t);
    }
  },
  // Tapered limb: thickness goes from t0 to t1.
  limb(x0, y0, x1, y1, t0, t1, c) {
    const g = this.g;
    g.fillStyle = c;
    const dx = x1 - x0, dy = y1 - y0;
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))));
    for (let i = 0; i <= n; i++) {
      const k = i / n, t = Math.round(t0 + (t1 - t0) * k), h = t / 2;
      g.fillRect(Math.round(x0 + dx * k - h), Math.round(y0 + dy * k - h), t, t);
    }
  },
  disc(cx, cy, r, c) {
    const g = this.g;
    g.fillStyle = c;
    const R = Math.max(0.5, r);
    for (let y = -Math.ceil(R); y <= Math.ceil(R); y++) {
      const w = Math.sqrt(Math.max(0, R * R - y * y));
      if (w < 0.35) continue;
      g.fillRect(Math.round(cx - w), Math.round(cy + y), Math.max(1, Math.round(w * 2)), 1);
    }
  },
  oval(cx, cy, rx, ry, c) {
    const g = this.g;
    g.fillStyle = c;
    for (let y = -Math.ceil(ry); y <= Math.ceil(ry); y++) {
      const k = 1 - (y * y) / (ry * ry);
      if (k <= 0) continue;
      const w = rx * Math.sqrt(k);
      g.fillRect(Math.round(cx - w), Math.round(cy + y), Math.max(1, Math.round(w * 2)), 1);
    }
  },
  // Filled polygon via scanlines. pts = [x0,y0,x1,y1,...]
  poly(pts, c) {
    const g = this.g;
    g.fillStyle = c;
    let minY = Infinity, maxY = -Infinity;
    for (let i = 1; i < pts.length; i += 2) { minY = Math.min(minY, pts[i]); maxY = Math.max(maxY, pts[i]); }
    const n = pts.length / 2;
    for (let y = Math.floor(minY); y <= Math.ceil(maxY); y++) {
      const sy = y + 0.5, xs = [];
      for (let i = 0; i < n; i++) {
        const ax = pts[i * 2], ay = pts[i * 2 + 1];
        const bx = pts[((i + 1) % n) * 2], by = pts[((i + 1) % n) * 2 + 1];
        if ((ay <= sy && by > sy) || (by <= sy && ay > sy)) xs.push(ax + (sy - ay) / (by - ay) * (bx - ax));
      }
      xs.sort((a, b) => a - b);
      for (let k = 0; k + 1 < xs.length; k += 2) {
        const x0 = Math.round(xs[k]), x1 = Math.round(xs[k + 1]);
        if (x1 > x0) g.fillRect(x0, y, x1 - x0, 1);
      }
    }
  },
  // Quad between two points with widths (for torsos, tails, blades).
  quad(x0, y0, x1, y1, w0, w1, c) {
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L;
    this.poly([x0 + nx * w0 / 2, y0 + ny * w0 / 2, x1 + nx * w1 / 2, y1 + ny * w1 / 2,
      x1 - nx * w1 / 2, y1 - ny * w1 / 2, x0 - nx * w0 / 2, y0 - ny * w0 / 2], c);
  },
  dot(x, y, c) { this.rect(x, y, 1, 1, c); },
};

// Colour helpers
function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return h.length === 4
    ? [((n >> 8) & 15) * 17, ((n >> 4) & 15) * 17, (n & 15) * 17]
    : [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const _shadeCache = new Map();
// k < 0 darkens, k > 0 lightens.
function shade(hex, k) {
  const key = hex + k;
  let v = _shadeCache.get(key);
  if (v) return v;
  const [r, g, b] = hexToRgb(hex);
  const f = c => Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k);
  v = '#' + [f(r), f(g), f(b)].map(c => clamp(c, 0, 255).toString(16).padStart(2, '0')).join('');
  _shadeCache.set(key, v);
  return v;
}
function rgba(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }

// Sprite compositor. Draw a character in local coordinates (origin = feet, facing right) into a
// scratch canvas, then stamp it to the screen with outline/flash.
const Sprite = {
  pool: {},
  get(w, h) {
    const k = w + 'x' + h;
    let s = this.pool[k];
    if (!s) {
      const a = document.createElement('canvas'); a.width = w; a.height = h;
      const b = document.createElement('canvas'); b.width = w; b.height = h;
      s = this.pool[k] = { a, ga: a.getContext('2d'), b, gb: b.getContext('2d'), w, h };
    }
    return s;
  },
  cur: null,
  // Begin drawing a sprite. ox, oy = where local (0,0) sits inside the scratch canvas.
  begin(w = 112, h = 96, ox = 56, oy = 88) {
    const s = this.get(w, h);
    s.ga.setTransform(1, 0, 0, 1, 0, 0);
    s.ga.clearRect(0, 0, w, h);
    s.ga.translate(ox, oy);
    s.ox = ox; s.oy = oy;
    this.cur = s;
    Px.use(s.ga);
    return s.ga;
  },
  // Composite onto ctx at screen position (sx, sy) of the feet. facing: 1 right, -1 left.
  // opts: { outline: colour|null, flash: colour|null, alpha }
  end(ctx, sx, sy, facing, opts = {}) {
    const s = this.cur;
    const outline = opts.outline === undefined ? '#140c0a' : opts.outline;
    const dx = Math.round(sx), dy = Math.round(sy);
    ctx.save();
    if (opts.alpha != null) ctx.globalAlpha = opts.alpha;
    ctx.translate(dx, dy);
    if (facing < 0) ctx.scale(-1, 1);
    if (outline || opts.flash) {
      s.gb.globalCompositeOperation = 'copy';
      s.gb.drawImage(s.a, 0, 0);
      s.gb.globalCompositeOperation = 'source-in';
      s.gb.fillStyle = opts.flash || outline;
      s.gb.fillRect(0, 0, s.w, s.h);
      s.gb.globalCompositeOperation = 'source-over';
    }
    if (outline && !opts.flash) {
      ctx.drawImage(s.b, -s.ox - 1, -s.oy);
      ctx.drawImage(s.b, -s.ox + 1, -s.oy);
      ctx.drawImage(s.b, -s.ox, -s.oy - 1);
      ctx.drawImage(s.b, -s.ox, -s.oy + 1);
    }
    if (opts.flash) {
      ctx.drawImage(s.b, -s.ox, -s.oy);
    } else {
      ctx.drawImage(s.a, -s.ox, -s.oy);
      if (opts.tint && opts.tint[1] > 0) {
        // colour wash over the sprite (venom, family hit tint, telegraph pulse)
        s.gb.globalCompositeOperation = 'copy';
        s.gb.drawImage(s.a, 0, 0);
        s.gb.globalCompositeOperation = 'source-in';
        s.gb.fillStyle = opts.tint[0];
        s.gb.fillRect(0, 0, s.w, s.h);
        s.gb.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = (opts.alpha != null ? opts.alpha : 1) * clamp(opts.tint[1], 0, 1);
        ctx.drawImage(s.b, -s.ox, -s.oy);
      }
    }
    ctx.restore();
    Px.use(Screen.ctx);
  },
};

// Soft ellipse shadow on the ground (drawn directly on the screen buffer).
function groundShadow(ctx, x, y, rx, alpha = 0.35) {
  Px.use(ctx);
  ctx.globalAlpha = alpha;
  Px.oval(x, y, rx, Math.max(2, rx * 0.32), '#000');
  ctx.globalAlpha = 1;
}

// ---- 30_fx.js ----
// Effects: particles, decals, hit sparks, floating text, banners, screen shake, kick and flashes.

const FX = {
  parts: [],
  decals: [],
  texts: [],
  banner: null,
  shakeAmt: 0, shakeDur: 0, shakeX: 0, shakeY: 0,
  kickX: 0, kickT: 0,
  flashColor: null, flashT: 0, flashMax: 1, flashAlpha: 0.6,
  vignetteT: 0,
  reducedShake: Store.get('reducedShake', false),
  reset() { this.parts.length = 0; this.decals.length = 0; this.texts.length = 0; this.banner = null; this.shakeAmt = 0; this.flashT = 0; this.kickT = 0; },

  shake(px, dur) {
    if (!px) return;
    const k = this.reducedShake ? 0.3 : 1;
    this.shakeAmt = Math.min(7, Math.max(this.shakeAmt, px * k));
    this.shakeDur = Math.max(this.shakeDur, dur || 6 + px * 3);
    this.shakeLeft = this.shakeDur;
  },
  kick(dx) { if (dx) { this.kickX = clamp(Math.round(dx), -2, 2); this.kickT = 2; } },
  flash(color, frames, alpha = 0.6) {
    if (this.reducedShake && alpha > 0.15) alpha = 0.15;
    this.flashColor = color; this.flashT = frames; this.flashMax = frames; this.flashAlpha = alpha;
  },
  hurtVignette() { this.vignetteT = 10; },

  add(p) {
    if (this.parts.length > 320) this.parts.shift();
    p.t = 0;
    p.life = p.life || 20;
    p.vx = p.vx || 0; p.vy = p.vy || 0; p.vz = p.vz || 0;
    p.z = p.z || 0;
    p.g = p.g == null ? 0.25 : p.g;
    this.parts.push(p);
    return p;
  },
  decal(d) {
    if (this.decals.length > 40) this.decals.shift();
    d.t = 0;
    this.decals.push(d);
  },

  // Hit spark: a flash star, a cone of streaks along the hit direction, optional ring.
  hit(x, y, z, tier = 1, dir = 1, tint = '#fff6c8') {
    const T = TIERS[tier] || TIERS[1];
    this.add({ kind: 'star', x, y, z, life: 5 + tier, size: T.star / 2, color: tint, g: 0 });
    for (let i = 0; i < T.sparks; i++) {
      const a = (dir > 0 ? 0 : Math.PI) + rr(-0.6, 0.6), s = rr(2, 5);
      this.add({ kind: 'spark', x, y, z, vx: Math.cos(a) * s, vz: Math.sin(a) * s * 0.8 + rr(-0.5, 1), life: ri(8, 14), g: 0.08, drag: 0.85 });
    }
    if (T.ring) for (let r = 0; r < T.ring; r++) this.add({ kind: 'ring', x, y, z, life: 8 + r * 3, size: 18 + r * 8, color: '#ffffff', g: 0 });
    if (T.dust) this.dust(x, y, T.dust);
  },
  splat(x, y, z, color, n = 6, dir = 1, decal = true) {
    for (let i = 0; i < n; i++) {
      this.add({ kind: 'drop', x, y: y + rr(-2, 2), z, vx: dir * rr(0.5, 2.5) + rr(-0.6, 0.6), vz: rr(1, 3.4), life: 70, color, g: 0.25, ground: decal ? y : null });
    }
  },
  pool(x, y, color, w = 14) { this.decal({ kind: 'pool', x, y, w, h: 3, color, life: 400 }); },
  scorch(x, y, w = 30) { this.decal({ kind: 'pool', x, y, w, h: 5, color: '#1a1410', life: 600 }); },
  wallCrack(x, y) { this.decal({ kind: 'crack', x, y, life: 60, seed: ri(0, 999) }); },
  dust(x, y, n = 5, spread = 1.2, color = '#a08a6a') {
    for (let i = 0; i < n; i++) {
      this.add({ kind: 'dust', x: x + rr(-4, 4), y: y + rr(-1, 1), z: rr(0, 3), vx: rr(-spread, spread), vz: rr(0.1, 0.5), life: ri(16, 26), size: rr(2, 3), color, g: -0.01, grow: 0.15 });
    }
  },
  dustRing(x, y, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      this.add({ kind: 'dust', x, y, z: 1, vx: Math.cos(a) * 2.2, vy: Math.sin(a) * 0.6, vz: 0.2, life: 22, size: 2.5, color: '#a08a6a', g: 0, grow: 0.15 });
    }
  },
  steam(x, y, z, n = 3) {
    for (let i = 0; i < n; i++) this.add({ kind: 'dust', x: x + rr(-2, 2), y, z: z + rr(0, 3), vx: rr(-0.3, 0.3), vz: rr(0.4, 0.8), life: 24, size: 2, color: '#e8e8e8', g: -0.005, grow: 0.2, alpha: 0.5 });
  },
  debris(x, y, z, colors, n = 10, size = [1, 3]) {
    for (let i = 0; i < n; i++) {
      this.add({ kind: 'chunk', x, y: y + rr(-3, 3), z: z + rr(0, 10), vx: rr(-2.6, 2.6), vz: rr(1.5, 4.5), life: 60, color: pick(colors), size: ri(size[0], size[1]), g: 0.24, ground: y });
    }
  },
  shards(x, y, z, n = 6, colors = ['#c9772e', '#7a3e14']) {
    for (let i = 0; i < n; i++) {
      this.add({ kind: 'shard', x, y: y + rr(-2, 2), z, vx: rr(-2.4, 2.4), vz: rr(1.5, 3.5), life: 40, color: pick(colors), size: ri(3, 5), rot: rr(0, TAU), spin: rr(-0.3, 0.3), g: 0.24, ground: y });
    }
  },
  sweat(x, y, z, n = 2) {
    for (let i = 0; i < n; i++) this.add({ kind: 'drop', x, y, z, vx: rr(-1.5, 1.5), vz: rr(1.5, 3), life: 22, color: '#ddeeff', g: 0.25 });
  },
  smoke(x, y, z, n = 4, color = '#3a3030') {
    for (let i = 0; i < n; i++) {
      this.add({ kind: 'dust', x: x + rr(-3, 3), y, z: z + rr(0, 4), vx: rr(-0.3, 0.3), vz: rr(0.3, 0.8), life: ri(30, 50), size: rr(3, 6), color, g: -0.005, grow: 0.08, alpha: 0.6 });
    }
  },
  fire(x, y, z, n = 2) {
    for (let i = 0; i < n; i++) {
      this.add({ kind: 'fire', x: x + rr(-4, 4), y, z: z + rr(0, 3), vx: rr(-0.25, 0.25), vz: rr(0.4, 1.1), life: ri(14, 24), size: rr(2, 4), g: -0.02 });
    }
  },
  embers(x, y, z, n = 2) {
    for (let i = 0; i < n; i++) this.add({ kind: 'ember', x: x + rr(-6, 6), y, z: z + rr(0, 6), vx: rr(-0.3, 0.3), vz: rr(0.5, 1), life: ri(20, 40), g: -0.005 });
  },
  explosion(x, y, z = 6, scale = 1, palette) {
    const pal = palette || ['#fff2b0', '#ff8a1e', '#3a3030'];
    this.add({ kind: 'ball', x, y, z, life: 6, size: 30 * scale, color: pal[0], g: 0 });
    this.add({ kind: 'ring', x, y, z, life: 14, size: 34 * scale, color: pal[1], g: 0 });
    for (let i = 0; i < 12 * scale; i++) {
      const a = rand() * TAU, s = rr(0.6, 3) * scale;
      this.add({ kind: 'fire', x, y: y + rr(-4, 4), z: z + rr(0, 8), vx: Math.cos(a) * s, vz: Math.abs(Math.sin(a)) * s + 0.5, life: ri(18, 34), size: rr(3, 6) * scale, g: 0.02, pal });
    }
    this.debris(x, y, z, ['#2a2020', '#4a3a30'], 12, [2, 2]);
    this.smoke(x, y, z + 10, 6 * scale, pal[2]);
    this.scorch(x, y, 30 * scale);
    this.shake(4 * scale, 20);
    this.flash(pal[0], 3, 0.35);
  },
  text(x, y, z, str, color = '#fff', life = 45, scale = 1) {
    this.texts.push({ x, y, z, str, color, t: 0, life, scale });
  },
  showBanner(str, color = '#ffe066', life = 56) { this.banner = { str, color, t: 0, life }; },

  update() {
    for (const p of this.parts) {
      p.t++;
      if (p.drag) { p.vx *= p.drag; p.vz *= p.drag; }
      p.x += p.vx;
      p.y += p.vy;
      p.z += p.vz;
      p.vz -= p.g;
      if (p.spin) p.rot += p.spin;
      if (p.grow) p.size += p.grow;
      if (p.ground != null && p.z <= 0) {
        p.z = 0;
        if (p.kind === 'drop') { p.dead = true; this.decal({ kind: 'pool', x: p.x, y: p.y, w: 4, h: 1, color: shade(p.color, -0.25), life: 240 }); }
        else if (p.kind === 'shard' || p.kind === 'chunk') { p.vz = -p.vz * 0.4; p.vx *= 0.6; p.spin = (p.spin || 0) * 0.6; if (Math.abs(p.vz) < 0.6) { p.vz = 0; p.g = 0; p.vx *= 0.5; } }
      }
    }
    this.parts = this.parts.filter(p => p.t < p.life && !p.dead);
    for (const d of this.decals) d.t++;
    this.decals = this.decals.filter(d => d.t < d.life);
    for (const t of this.texts) t.t++;
    this.texts = this.texts.filter(t => t.t < t.life);
    if (this.banner && ++this.banner.t > this.banner.life) this.banner = null;
    if (this.shakeLeft > 0) {
      const k = this.shakeAmt * this.shakeLeft / this.shakeDur;
      this.shakeX = Math.round(rr(-1, 1) * k);
      this.shakeY = Math.round(rr(-1, 1) * k * 0.6);
      this.shakeLeft--;
      if (this.shakeLeft <= 0) { this.shakeAmt = 0; this.shakeX = this.shakeY = 0; }
    }
    if (this.kickT > 0 && --this.kickT === 0) this.kickX = 0;
    if (this.flashT > 0) this.flashT--;
    if (this.vignetteT > 0) this.vignetteT--;
  },
  offX() { return this.shakeX + this.kickX; },

  drawDecals(ctx, camX) {
    Px.use(ctx);
    for (const d of this.decals) {
      const sx = d.x - camX;
      if (sx < -40 || sx > W + 40) continue;
      const a = d.life - d.t < 60 ? (d.life - d.t) / 60 : 1;
      if (d.kind === 'pool') {
        ctx.globalAlpha = 0.8 * a;
        Px.oval(sx, d.y, d.w / 2, Math.max(1, d.h / 2), d.color);
      } else if (d.kind === 'crack') {
        ctx.globalAlpha = a;
        let s = d.seed;
        for (let i = 0; i < 3; i++) {
          s = (s * 97 + 13) % 251;
          const ang = (s / 251) * TAU;
          Px.line(sx, d.y, sx + Math.cos(ang) * 8, d.y + Math.sin(ang) * 10, 1, '#1a1410');
        }
      }
    }
    ctx.globalAlpha = 1;
  },
  draw(ctx, camX) {
    Px.use(ctx);
    for (const p of this.parts) {
      const sx = p.x - camX, sy = p.y - p.z;
      if (sx < -40 || sx > W + 40) continue;
      const k = p.t / p.life;
      switch (p.kind) {
        case 'star': {
          const s = p.size * (p.t < 2 ? 1 : 1 - k * 0.5);
          const c = p.t < 1 ? '#ffffff' : p.color;
          Px.poly([sx - s, sy, sx, sy - s * 0.25, sx + s, sy, sx, sy + s * 0.25], c);
          Px.poly([sx, sy - s, sx + s * 0.25, sy, sx, sy + s, sx - s * 0.25, sy], c);
          Px.disc(sx, sy, Math.max(1, s * 0.25), '#ffffff');
          break;
        }
        case 'spark': {
          const c = k < 0.3 ? '#fff6c0' : k < 0.65 ? '#ffb030' : '#ff5a1e';
          Px.line(sx, sy, sx - p.vx * 1.5, sy + p.vz * 1.5, 1, c);
          break;
        }
        case 'drop': Px.rect(sx, sy, 2, 2, p.color); break;
        case 'bubble': ctx.globalAlpha = 1 - k; Px.disc(sx, sy, 1.5, p.color); ctx.globalAlpha = 1; break;
        case 'chunk': Px.rect(sx, sy, p.size + 1, p.size, p.color); break;
        case 'shard': {
          const r = p.size / 2, a = p.rot;
          Px.poly([sx + Math.cos(a) * r, sy + Math.sin(a) * r, sx + Math.cos(a + 2.2) * r, sy + Math.sin(a + 2.2) * r, sx + Math.cos(a + 4.2) * r, sy + Math.sin(a + 4.2) * r], p.color);
          break;
        }
        case 'dust':
          ctx.globalAlpha = (1 - k) * (p.alpha || 0.7);
          Px.disc(sx, sy, p.size, p.color);
          ctx.globalAlpha = 1;
          break;
        case 'fire': {
          const pal = p.pal;
          const c = k < 0.25 ? (pal ? pal[0] : '#fff3b0') : k < 0.5 ? (pal ? pal[1] : '#ffb02e') : k < 0.75 ? '#e2541b' : '#5a2a1a';
          Px.disc(sx, sy, Math.max(1, p.size * (1 - k * 0.5)), c);
          break;
        }
        case 'ember': Px.rect(sx, sy, 1, 1, k < 0.5 ? '#ffd27a' : '#e2541b'); break;
        case 'ball': Px.disc(sx, sy, p.size * easeOut(Math.min(1, k * 1.5)), p.color); break;
        case 'ring': {
          const r = 4 + (p.size - 4) * easeOut(k);
          ctx.globalAlpha = 1 - k;
          ctx.strokeStyle = p.color; ctx.lineWidth = Math.max(1, 2 * (1 - k));
          ctx.beginPath(); ctx.ellipse(Math.round(sx), Math.round(sy), r, r * 0.5, 0, 0, TAU); ctx.stroke();
          ctx.globalAlpha = 1;
          break;
        }
        case 'line': // speed line
          ctx.globalAlpha = 1 - k;
          Px.line(sx, sy, sx + p.dx, sy + p.dy, 1, p.color);
          ctx.globalAlpha = 1;
          break;
      }
    }
    for (const t of this.texts) {
      const k = t.t / t.life;
      const sx = t.x - camX, sy = t.y - t.z - easeOut(Math.min(1, k * 2)) * 14;
      if (k > 0.75 && (t.t >> 1) % 2) continue;
      drawText(ctx, t.str, sx, sy, t.color, t.scale, 'center');
    }
  },
  drawOverlay(ctx) {
    if (this.banner) {
      const b = this.banner, k = Math.min(1, b.t / 6);
      const x = lerp(-120, W / 2, easeOut(k));
      drawText(ctx, b.str, x, 58, b.color, 2, 'center');
    }
    if (this.vignetteT > 0) {
      ctx.globalAlpha = 0.3 * this.vignetteT / 10;
      ctx.fillStyle = '#c81e1e';
      ctx.fillRect(0, 0, W, 6); ctx.fillRect(0, H - 6, W, 6); ctx.fillRect(0, 0, 6, H); ctx.fillRect(W - 6, 0, 6, H);
      ctx.globalAlpha = 1;
    }
    if (this.flashT > 0 && this.flashColor) {
      ctx.globalAlpha = this.flashAlpha * this.flashT / this.flashMax;
      ctx.fillStyle = this.flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  },
};

// ---- 40_entity.js ----
// Entities: base class, fighters, combat resolution and the hit-feel tier system.
// World coordinates: x along the street, y = depth (the screen row of the feet), z = height.

const GRAV = 0.30;

// Hit tiers drive hitstop, shake, particles and sound. T1 light .. T5 kill/crit.
const TIERS = [null,
  { hs: 3,  shake: 0, kick: 1, sparks: 4,  star: 8,  sfx: 'hitLight' },
  { hs: 5,  shake: 1, kick: 1, sparks: 6,  star: 12, sfx: 'hitMid', dust: 1 },
  { hs: 8,  shake: 2, kick: 2, sparks: 8,  star: 16, sfx: 'hitHeavy', ring: 1 },
  { hs: 10, shake: 3, kick: 2, sparks: 12, star: 20, sfx: 'hitFinisher', ring: 1, flash: 0.2 },
  { hs: 14, shake: 5, kick: 2, sparks: 16, star: 22, sfx: 'hitCrit', ring: 2, flash: 0.4, slow: [36, 0.35] },
];
const FAMILY = {
  gang:     { tint: '#ffe066', mat: 'matGang', bleed: '#ddeeff' },
  mutant:   { tint: '#b6ff4a', mat: 'matMutant', bleed: '#7cff4f' },
  scorpion: { tint: '#ff8a3d', mat: 'matChitin', bleed: '#e8e070' },
  hero:     { tint: '#ff5a3a', mat: null, bleed: '#ddeeff' },
  metal:    { tint: '#ffffff', mat: 'matMetal', bleed: '#c9ced6' },
};

class Ent {
  constructor(x, y) {
    this.x = x; this.y = y; this.z = 0;
    this.vx = 0; this.vy = 0; this.vz = 0;
    this.facing = 1;
    this.state = 'idle'; this.t = 0;
    this.w = 8; this.h = 40;           // half-width and height of the hurtbox
    this.team = 'none';
    this.remove = false;
    this.flash = 0; this.tintT = 0;
    this.hs = 0;                       // personal hitstop frames
    this.shadowR = 10;
    this.id = Ent.nextId++;
  }
  setState(s) { this.state = s; this.t = 0; }
  get airborne() { return this.z > 0.01 || this.vz > 0; }
  update() {}
  draw() {}
  sortY() { return this.y; }
  // Pixel jitter while frozen in hitstop, so hits read even when everything stops.
  get jitter() { return this.hs > 0 && this.hitJitter ? (this.hs % 2 ? 1 : -1) : 0; }
}
Ent.nextId = 1;

// A fighter is anything that hits and gets hit: the player and every enemy.
class Fighter extends Ent {
  constructor(x, y) {
    super(x, y);
    this.hp = this.maxHp = 30;
    this.family = 'gang';
    this.atk = null;          // current attack data
    this.atkHit = null;       // ids already hit by this attack instance
    this.inv = 0;             // invulnerability frames
    this.poise = 0; this.poiseMax = 0;   // boss-style poise (0 = none)
    this.armorTier = 0;       // hits below this tier do not flinch (super armor)
    this.weight = 1;          // knockback multiplier
    this.launchable = true;
    this.grabbedBy = null;
    this.downTime = 36;
    this.dying = false;
    this.juggle = 0;
    this.burn = 0; this.venom = 0;
    this.grace = 0;           // frames after wake-up during which it won't attack
    this.hitJitter = false;
    this.lastHitBy = null;
  }
  get alive() { return !this.dying && this.hp > 0; }
  get canAct() { return ['idle', 'walk', 'run'].includes(this.state); }
  get vulnerable() {
    if (this.inv > 0 || this.dying || this.remove) return false;
    if (['down', 'getup', 'dead', 'burrowed', 'enter', 'offstage'].includes(this.state)) return false;
    if (this.juggle >= 4 && this.airborne) return false;  // untouchable until it lands
    return true;
  }
  face(target) { if (target) this.facing = target.x >= this.x ? 1 : -1; }

  startAttack(a) {
    this.atk = a;
    this.atkHit = new Set();
    this.setState('attack');
    if (a.selfVx != null) this.vx = a.selfVx * this.facing;
    if (a.selfVz) this.vz = a.selfVz;
    if (a.sfxStart) Sound.sfx(a.sfxStart, this.x);
  }
  atkPhase() {
    const a = this.atk;
    if (!a) return 'done';
    if (this.t < a.start) return 'start';
    if (this.t < a.start + a.active) return 'active';
    if (this.t < a.start + a.active + a.rec) return 'rec';
    return 'done';
  }
  // Does attack `a` (from this fighter's position) overlap target t?
  overlaps(a, t) {
    const x0 = this.x + this.facing * a.reach[0], x1 = this.x + this.facing * a.reach[1];
    const lo = Math.min(x0, x1), hi = Math.max(x0, x1);
    if (Math.abs(t.y - this.y) > (a.depth || 8)) return false;
    if (t.x + t.w < lo || t.x - t.w > hi) return false;
    const z0 = this.z + a.zr[0], z1 = this.z + a.zr[1];
    if (t.z + t.h < z0 || t.z > z1) return false;
    return true;
  }
  // Check the current attack against targets. Returns number hit.
  resolveAttack(targets) {
    const a = this.atk;
    if (!a || this.atkPhase() !== 'active') return 0;
    if (this.t === a.start && a.whiff) Sound.sfx(a.whiff, this.x);
    let hits = 0;
    for (const t of targets) {
      if (t === this || this.atkHit.has(t.id) || !t.vulnerable) continue;
      if (!this.overlaps(a, t)) continue;
      this.atkHit.add(t.id);
      hits++;
      t.takeHit(this, a, this.facing, hits);
      if (a.single) break;
    }
    return hits;
  }

  // Apply a hit. a = attack data, dir = knockback direction (+1 = right), nth = victim index for multi-hits.
  takeHit(src, a, dir, nth = 1) {
    let dmg = a.dmg;
    if (this.airborne && this.juggle > 0) dmg = Math.round(dmg * Math.max(0.5, 1 - 0.1 * this.juggle));
    if (this.dmgMul) dmg = Math.round(dmg * this.dmgMul);
    if (this.team === 'player') dmg = Math.max(1, Math.round(dmg * Game.diff.dmg));
    if (a.dmgMul) dmg = Math.round(dmg * a.dmgMul);
    if (a.hammer && this.family === 'scorpion') dmg = Math.max(dmg, 13);
    const wasAir = this.airborne && this.state === 'fall';
    this.hp = Math.max(0, this.hp - dmg);
    this.lastHitBy = src;
    this.flash = 2; this.tintT = 6;
    if (this.grabbedBy && this.grabbedBy !== src) this.releaseGrab();
    if (a.burn) this.burn = Math.max(this.burn, a.burn);
    if (a.venom) this.venom = Math.max(this.venom, a.venom);
    const dead = this.hp <= 0;
    let tier = a.tier || 1;
    if (dead && this.team !== 'player') tier = Math.min(4, tier + 1);
    if (dead && this.team === 'enemy' && Game.isWaveFinalKill(this)) tier = 5;
    if (this.boss && dead) tier = 5;

    // feel: hitstop, shake, sparks, sound
    const T = TIERS[tier];
    const hs = (a.hitstop != null ? a.hitstop : T.hs) + Math.min(3, nth - 1);
    this.hs = Math.max(this.hs, hs); this.hitJitter = true;
    if (src && src.hs != null && src.team !== 'proj') src.hs = Math.max(src.hs, hs);
    if (tier >= 4) Game.hitstop = Math.max(Game.hitstop, hs);
    FX.shake(T.shake + (a.shakeAdd || 0));
    FX.kick(dir * T.kick);
    if (T.flash) FX.flash('#ffffff', 2, T.flash);
    if (T.slow) Game.slowmo(T.slow[0], T.slow[1]);
    const hz = this.z + clamp(this.h * 0.62, a.zr ? Math.max(0, a.zr[0]) : 10, a.zr ? Math.max(4, a.zr[1]) : 30);
    const hx = this.x - dir * this.w * 0.4;
    this.onHitFx(hx, hz, tier, dir, a);
    Sound.sfx(a.sfx || T.sfx, this.x, Game.comboPitch());
    const fam = FAMILY[this.family];
    if (fam && fam.mat) Sound.sfx(fam.mat, this.x);
    if (src && src.onLanded) src.onLanded(this, a, dmg, tier);

    if (dead) { this.onDeath(src, a, dir); }
    // reaction
    let flinch = true, launch = a.knock || dead || wasAir;
    if (this.poiseMax > 0 && !dead) {
      this.poise -= a.poise != null ? a.poise : [0, 4, 8, 14, 24, 30][tier];
      if (this.poise <= 0) { this.poise = this.poiseMax; this.onPoiseBreak && this.onPoiseBreak(); }
      flinch = false; launch = false;
    } else if (this.armorTier && tier < this.armorTier && !dead) {
      flinch = false; launch = false;
      this.onArmorHit && this.onArmorHit(src, a, tier);
    }
    if (!this.launchable && !dead) launch = false;
    if (this.launchCap && this.hp / this.maxHp > this.launchCap && !dead) launch = false;
    if (this.onHurt) this.onHurt(src, a, tier, flinch, launch);
    if (!flinch) return;
    if (launch) {
      if (this.airborne && this.state === 'fall') this.juggle++;
      const jv = this.juggle > 0 && wasAir ? 3.0 * Math.pow(0.8, this.juggle) : null;
      let kx = a.kx != null ? a.kx : 2.2, kz = a.kz != null ? a.kz : 3.0;
      if (dead && !a.knock) { kx = 3.5; kz = 3.5; }
      this.knockDown(dir, kx * this.weight, (jv != null ? Math.max(jv, kz * 0.5) : kz) * Math.min(1.3, this.weight));
      if (a.blast) { this.blasted = src; this.bowled = new Set(); }
    } else {
      this.atk = null;
      this.setState('hurt');
      this.hurtTime = a.stun || (tier >= 2 ? 22 : 16);
      this.hurtAlt = (this.hurtAlt || 0) + 1;
      this.vx = dir * (a.kb != null ? a.kb : 1.2) * this.weight;
      this.vy = 0;
    }
  }
  onHitFx(x, z, tier, dir, a) {
    const fam = FAMILY[this.family] || FAMILY.gang;
    FX.hit(x, this.y, z, tier, dir, fam.tint);
  }
  onDeath() { this.dying = true; }

  knockDown(dir, kx, kz) {
    this.atk = null;
    if (this.grabbedBy) this.releaseGrab();
    this.setState('fall');
    this.vx = dir * kx;
    this.vy = 0;
    this.vz = kz;
    this.z = Math.max(this.z, 1);
    this.facing = -dir;
    this.bounced = false;
  }
  releaseGrab() {
    const g = this.grabbedBy;
    if (g && g.grabbing === this) { g.grabbing = null; if (g.state === 'grab') g.setState('idle'); }
    this.grabbedBy = null;
    if (this.state === 'grabbed') this.setState('idle');
  }

  // Shared physics + status effects.
  physics(bounds) {
    this.t++;
    if (this.flash > 0) this.flash--;
    if (this.tintT > 0) this.tintT--;
    if (this.inv > 0) this.inv--;
    if (this.grace > 0) this.grace--;
    if (this.burn > 0) {
      this.burn--;
      if (this.burn % 4 === 0) FX.fire(this.x + rr(-4, 4), this.y, this.z + this.h * 0.5, 1);
    }
    if (this.venom > 0) {
      this.venom--;
      if (this.venom % 20 === 0 && this.hp > 1 && this.state !== 'down') { this.hp -= 1; FX.add({ kind: 'bubble', x: this.x + rr(-4, 4), y: this.y, z: this.z + this.h, vz: 0.5, g: 0, life: 24, color: '#7cff4f' }); }
    }
    if (this.z > 0 || this.vz !== 0) {
      this.z += this.vz;
      this.vz -= GRAV;
      if (this.state === 'fall' || this.state === 'thrown') this.vx *= 0.985;
      if (this.z <= 0) { this.z = 0; this.onLand(); }
    }
    this.x += this.vx;
    this.y += this.vy;
    if (bounds) {
      this.y = clamp(this.y, bounds.yMin, bounds.yMax);
      // wall splat against camera-lock walls
      if ((this.x < bounds.xMin || this.x > bounds.xMax) && bounds.walls && (this.state === 'fall' || this.state === 'thrown') && Math.abs(this.vx) > 3 && !this.splatted) {
        this.wallSplat(this.x < bounds.xMin ? bounds.xMin : bounds.xMax);
      }
      this.x = clamp(this.x, bounds.xMin, bounds.xMax);
    }
    if (Game.solids.length) resolveSolids(this);
  }
  wallSplat(wx) {
    this.splatted = true;
    this.vx = -0.5 * this.vx;
    this.vz = Math.max(this.vz, 2.0);
    const src = this.blasted || this.thrownBy || Game.player;
    this.hp = Math.max(0, this.hp - 5);
    this.hs = Math.max(this.hs, TIERS[4].hs);
    Game.hitstop = Math.max(Game.hitstop, 6);
    FX.shake(3);
    FX.dust(wx, this.y, 8, 1.4);
    FX.wallCrack(wx, this.y - this.z - this.h * 0.5);
    FX.text(this.x, this.y, this.z + this.h + 4, 'WALL SPLAT!', '#ffe066', 50);
    Sound.sfx('hitFinisher', this.x);
    if (src && src.onLanded && src.team === 'player') src.onLanded(this, { dmg: 5, meter: 3 }, 5, 4);
    if (this.hp <= 0 && !this.dying) this.onDeath(src, {}, sign(this.vx));
  }
  onLand() {
    const prevVz = this.vz;
    this.vz = 0;
    if (this.state === 'fall' || this.state === 'thrown') {
      if (prevVz < -3.0 && !this.bounced) {
        this.bounced = true;
        this.vz = 1.6;
        this.z = 0.01;
        this.vx *= 0.6;
        FX.dust(this.x, this.y, 6);
        Sound.sfx('thud', this.x);
        FX.shake(1);
        if (this.state === 'thrown' && this.tossDmg) this.applyTossDamage();
        return;
      }
      if (this.state === 'thrown' && this.tossDmg) this.applyTossDamage();
      this.setState('down');
      this.juggle = 0; this.splatted = false; this.blasted = null; this.thrownBy = null;
      this.vx *= 0.5;
      FX.dust(this.x, this.y, 8, 1.6);
      Sound.sfx('thud', this.x);
      if (this.onDowned) this.onDowned();
    } else {
      this.onLandNormal && this.onLandNormal(prevVz);
    }
  }
  applyTossDamage() {
    const d = this.tossDmg; this.tossDmg = 0;
    this.hp = Math.max(0, this.hp - d);
    FX.hit(this.x, this.y, 6, 3, 1, (FAMILY[this.family] || FAMILY.gang).tint);
    Sound.sfx('hitHeavy', this.x);
    FX.shake(2);
    if (this.hp <= 0 && !this.dying) this.onDeath(this.thrownBy, {}, 1);
  }
  // Returns true while the fighter is busy with a reaction state.
  reactionStates() {
    switch (this.state) {
      case 'hurt':
        this.vx *= 0.80; this.vy = 0;
        if (this.t >= this.hurtTime) this.setState('idle');
        return true;
      case 'fall':
      case 'thrown':
        return true;
      case 'down':
        this.vx *= 0.85; this.vy = 0;
        if (Math.abs(this.vx) > 1 && this.t % 4 === 0) FX.dust(this.x, this.y, 1, 0.5);
        if (this.dying || this.hp <= 0) {
          if (!this.dying) this.onDeath(this.lastHitBy, {}, 1);
          if (this.t > 72) { this.remove = true; this.onRemoved && this.onRemoved(); }
          return true;
        }
        if (this.t >= this.downTime) this.setState('getup');
        return true;
      case 'getup':
        if (this.t >= 12) { this.setState('idle'); this.grace = 10; this.inv = Math.max(this.inv, 2); }
        return true;
      case 'grabbed':
        this.vx = 0;
        return true;
    }
    return false;
  }
}

// Thrown or blasted bodies bowl over other enemies once each.
function bowlingCollisions(body, others) {
  const src = body.thrownBy || body.blasted;
  if (!src || Math.abs(body.vx) < 3) return;
  body.bowled = body.bowled || new Set();
  for (const t of others) {
    if (t === body || !t.vulnerable || body.bowled.has(t.id) || t.team !== 'enemy') continue;
    if (Math.abs(t.y - body.y) > 8 || Math.abs(t.x - body.x) > 12 + t.w) continue;
    if (body.z > t.h) continue;
    body.bowled.add(t.id);
    t.takeHit(src, { dmg: body.state === 'thrown' ? 12 : 10, tier: 3, knock: true, kx: 2.6, kz: 3.2, zr: [0, 40], bowling: true }, sign(body.vx) || 1);
    body.vx *= 0.7;
    if (body.bowled.size === 2) FX.text(t.x, t.y, 50, 'STRIKE!', '#ffe066', 50);
  }
  // thrown bodies also smash props (and set red fuel drums off instantly)
  for (const pr of Game.ents) {
    if (pr.team !== 'prop' || pr.remove || body.bowled.has(pr.id)) continue;
    if (Math.abs(pr.y - body.y) > 8 || Math.abs(pr.x - body.x) > pr.w + body.w * 0.5 || body.z > pr.h) continue;
    body.bowled.add(pr.id);
    pr.takeHit(src, { dmg: 10, tier: 3, thrownBody: true, zr: [0, 40] }, sign(body.vx) || 1);
  }
}

// Solid rectangles on the floor (wrecks, the burning bus, crates): { x0, x1, y0, y1, h, splat }.
// Bodies are pushed out along the shallower axis; launched bodies hitting one fast get wall-splatted.
function resolveSolids(e) {
  for (const r of Game.solids) {
    if (r.off) continue;
    if (e.z > (r.h || 999)) continue;
    const x0 = r.x0 - e.w * 0.6, x1 = r.x1 + e.w * 0.6;
    if (e.x <= x0 || e.x >= x1 || e.y <= r.y0 || e.y >= r.y1) continue;
    const pl = e.x - x0, pr = x1 - e.x, pu = e.y - r.y0, pd = r.y1 - e.y;
    const m = Math.min(pl, pr, pu, pd);
    if ((e.state === 'fall' || e.state === 'thrown') && Math.abs(e.vx) > 3 && r.splat !== false && !e.splatted && (m === pl || m === pr)) {
      e.wallSplat && e.wallSplat(m === pl ? x0 : x1);
    }
    if (m === pl) e.x = x0; else if (m === pr) e.x = x1; else if (m === pu) e.y = r.y0; else e.y = r.y1;
    if (e.onSolid) e.onSolid(r);
  }
}

// ---- 45_rig.js ----
// Humanoid rig: forward kinematics for posed pixel characters.
// Angle convention: dir(θ) = (sin θ, cos θ) in screen space, so θ=0 points down, θ=π/2 points
// forward (+x, the facing side), θ=π points up. Limb angles are relative to the body's down axis.

const dirX = th => Math.sin(th), dirY = th => Math.cos(th);

// Base pose: standing upright.
const POSE0 = {
  hx: 0, hy: -20, rot: 0, head: 0,
  fThigh: 0, fKnee: 0, bThigh: 0, bKnee: 0,       // front / back leg
  fUpper: 0.25, fElbow: 1.2, bUpper: -0.1, bElbow: 1.0, // front / back arm
};
function pose(over) { return Object.assign({}, POSE0, over); }
function lerpPose(a, b, k) {
  const o = {};
  for (const key in POSE0) o[key] = lerp(a[key] != null ? a[key] : POSE0[key], b[key] != null ? b[key] : POSE0[key], k);
  return o;
}

// Common animation poses (functions of frame time where useful).
const Poses = {
  idle(t, guard = 1) {
    const b = Math.sin(t * 0.08) * 0.6;
    return pose({ hy: -20 + b * 0.5, rot: 0.06, fThigh: 0.18, fKnee: -0.25, bThigh: -0.2, bKnee: -0.15,
      fUpper: 0.5 * guard, fElbow: 2.0 * guard + 0.3, bUpper: 0.25 * guard, bElbow: 2.2 * guard + 0.2, head: 0.05 });
  },
  walk(t, speed = 1) {
    const s = Math.sin(t * 0.2 * speed), c = Math.cos(t * 0.2 * speed);
    return pose({ hy: -20 + Math.abs(c) * -1, rot: 0.08, fThigh: s * 0.55, fKnee: -0.2 - Math.max(0, -s) * 0.7,
      bThigh: -s * 0.55, bKnee: -0.2 - Math.max(0, s) * 0.7,
      fUpper: 0.45 - s * 0.35, fElbow: 1.7, bUpper: 0.2 + s * 0.35, bElbow: 1.8 });
  },
  run(t) {
    const s = Math.sin(t * 0.32), c = Math.cos(t * 0.32);
    return pose({ hy: -19 - Math.abs(c) * 1.5, rot: 0.32, fThigh: s * 0.95 + 0.2, fKnee: -0.3 - Math.max(0, -s) * 1.3,
      bThigh: -s * 0.95 + 0.2, bKnee: -0.3 - Math.max(0, s) * 1.3,
      fUpper: -s * 0.9 + 0.3, fElbow: 1.6, bUpper: s * 0.9 + 0.3, bElbow: 1.6, head: -0.2 });
  },
  hurt(t) {
    const k = Math.min(1, t / 4);
    return pose({ hx: -1.5 * k, hy: -19, rot: -0.35 * k, head: -0.4 * k, fThigh: 0.25, fKnee: -0.3, bThigh: -0.3, bKnee: -0.2,
      fUpper: -0.6, fElbow: 0.6, bUpper: -1.0, bElbow: 0.5 });
  },
  // Airborne knockdown: tumble backwards.
  fall(t, vz) {
    const r = -0.6 - clamp(-vz * 0.18, -0.4, 0.9);
    return pose({ hy: -16, rot: r, head: -0.4, fThigh: 0.7, fKnee: -0.9, bThigh: 0.4, bKnee: -0.4,
      fUpper: -1.6, fElbow: 0.4, bUpper: -2.2, bElbow: 0.3 });
  },
  // Lying on the back, head behind.
  down() {
    return pose({ hx: 2, hy: -3, rot: -1.5, head: 0.2, fThigh: 0.15, fKnee: -0.2, bThigh: 0.05, bKnee: -0.1,
      fUpper: -0.4, fElbow: 0.2, bUpper: 0.3, bElbow: 0.3 });
  },
  getup(t) {
    const k = clamp(t / 16, 0, 1);
    return lerpPose(Poses.down(), pose({ hy: -14, rot: 0.5, fThigh: 1.2, fKnee: -1.9, bThigh: -0.3, bKnee: -1.4, fUpper: 0.6, fElbow: 0.4, bUpper: 0.1, bElbow: 0.3 }), easeOut(k));
  },
  jump(vz) {
    const up = vz > 0;
    return pose({ hy: -21, rot: 0.1, fThigh: up ? 0.9 : 0.5, fKnee: up ? -1.6 : -0.9, bThigh: up ? 0.2 : -0.1, bKnee: up ? -1.4 : -0.6,
      fUpper: up ? 2.4 : 1.2, fElbow: 0.4, bUpper: up ? -0.8 : -0.3, bElbow: 0.6 });
  },
  crouch() { // landing / jump squat
    return pose({ hy: -15, rot: 0.25, fThigh: 0.9, fKnee: -1.5, bThigh: -0.2, bKnee: -1.2, fUpper: 0.6, fElbow: 1.6, bUpper: 0.2, bElbow: 1.6 });
  },
  grabbed(t) {
    const s = Math.sin(t * 0.5) * 0.1;
    return pose({ hy: -19, rot: -0.25 + s, head: -0.3, fThigh: 0.2, fKnee: -0.4, bThigh: -0.2, bKnee: -0.3, fUpper: -0.9 + s, fElbow: 1.4, bUpper: -1.3, bElbow: 1.0 });
  },
  dead() { return Poses.down(); },
};

// Solve joint positions for a pose at scale s.
function solveRig(p, s, dims) {
  const L = dims;
  const H = { x: p.hx * s, y: p.hy * s };
  const tTh = Math.PI - p.rot;
  const S = { x: H.x + dirX(tTh) * L.torso * s, y: H.y + dirY(tTh) * L.torso * s };
  const hd = tTh + p.head;
  const Hd = { x: S.x + dirX(hd) * L.neck * s, y: S.y + dirY(hd) * L.neck * s };
  const down = -p.rot;
  const leg = (th, kn) => {
    const a = down + th, b = a + kn;
    const K = { x: H.x + dirX(a) * L.thigh * s, y: H.y + dirY(a) * L.thigh * s };
    const F = { x: K.x + dirX(b) * L.shin * s, y: K.y + dirY(b) * L.shin * s };
    return { K, F, a, b };
  };
  const arm = (up, el) => {
    const a = down + up, b = a + el;
    const E = { x: S.x + dirX(a) * L.upper * s, y: S.y + dirY(a) * L.upper * s };
    const Hn = { x: E.x + dirX(b) * L.fore * s, y: E.y + dirY(b) * L.fore * s };
    return { E, H: Hn, a, b };
  };
  return { H, S, Hd, tTh, fl: leg(p.fThigh, p.fKnee), bl: leg(p.bThigh, p.bKnee), fa: arm(p.fUpper, p.fElbow), ba: arm(p.bUpper, p.bElbow) };
}

const DIMS_HUMAN = { thigh: 10, shin: 10, torso: 15, neck: 7, upper: 8, fore: 8 };

// Draw a humanoid from a style:
// style = { s, dims, skin, hair, top, top2, pants, boots, belt, hipW, shW, limbW, head(fn), torso(fn), hand(fn) }
function drawHumanoid(p, st) {
  const s = st.s || 1;
  const R = solveRig(p, s, st.dims || DIMS_HUMAN);
  const lw = (st.limbW || 5) * s;
  const back = c => shade(c, -0.32);
  // back arm
  Px.limb(R.S.x, R.S.y, R.ba.E.x, R.ba.E.y, lw * 0.9, lw * 0.8, back(st.sleeve || st.top));
  Px.limb(R.ba.E.x, R.ba.E.y, R.ba.H.x, R.ba.H.y, lw * 0.8, lw * 0.7, back(st.arm || st.skin));
  if (st.backHand) st.backHand(R.ba.H, R.ba.b, s, R); else Px.disc(R.ba.H.x, R.ba.H.y, 1.8 * s, back(st.glove || st.skin));
  // back leg
  Px.limb(R.H.x, R.H.y, R.bl.K.x, R.bl.K.y, lw * 1.2, lw, back(st.pants));
  Px.limb(R.bl.K.x, R.bl.K.y, R.bl.F.x, R.bl.F.y, lw, lw * 0.9, back(st.shin || st.pants));
  drawBoot(R.bl.F, R.bl.b, s, back(st.boots));
  // torso
  Px.quad(R.H.x, R.H.y, R.S.x, R.S.y, (st.hipW || 9) * s, (st.shW || 12) * s, st.top);
  if (st.torso) st.torso(R, s);
  if (st.belt) {
    const bx = lerp(R.H.x, R.S.x, 0.1), by = lerp(R.H.y, R.S.y, 0.1);
    Px.quad(bx - dirX(R.tTh) * s, by - dirY(R.tTh) * s, bx + dirX(R.tTh) * s * 1.5, by + dirY(R.tTh) * s * 1.5, (st.hipW || 9) * s + 1, (st.hipW || 9) * s + 1, st.belt);
  }
  // front leg
  Px.limb(R.H.x, R.H.y, R.fl.K.x, R.fl.K.y, lw * 1.2, lw, st.pants);
  Px.limb(R.fl.K.x, R.fl.K.y, R.fl.F.x, R.fl.F.y, lw, lw * 0.9, st.shin || st.pants);
  drawBoot(R.fl.F, R.fl.b, s, st.boots);
  // head
  if (st.head) st.head(R.Hd, R.tTh + p.head, s, R); else Px.disc(R.Hd.x, R.Hd.y, 5 * s, st.skin);
  // front arm
  Px.limb(R.S.x, R.S.y, R.fa.E.x, R.fa.E.y, lw * 0.9, lw * 0.8, st.sleeve || st.top);
  Px.limb(R.fa.E.x, R.fa.E.y, R.fa.H.x, R.fa.H.y, lw * 0.8, lw * 0.7, st.arm || st.skin);
  if (st.hand) st.hand(R.fa.H, R.fa.b, s, R); else Px.disc(R.fa.H.x, R.fa.H.y, 2 * s, st.glove || st.skin);
  if (st.after) st.after(R, s);
  return R;
}
function drawBoot(F, ang, s, c) {
  // boot points forward relative to the shin
  const fx = F.x + dirX(ang + Math.PI / 2) * 3 * s, fy = F.y + dirY(ang + Math.PI / 2) * 3 * s;
  Px.limb(F.x - dirX(ang + Math.PI / 2) * 1 * s, F.y - dirY(ang + Math.PI / 2) * 1 * s, fx, fy, 3.5 * s, 3 * s, c);
}

// ---- 46_scorpion.js ----
// Scorpion rig: segmented carapace, 8 legs, two pincers and a curling tail with a stinger.
// Local coordinates: origin on the ground under the body centre, facing right (+x = head).
//
// drawScorpion(o) options (all optional except colours):
//   s          scale (1 = ~40px long)            shell, plate, hi, belly, leg, sting, eye  colours
//   legPhase   leg cycle (radians)               clawOpen 0..1      clawRaise 0..1 (lifts the claws)
//   tailCurl   0..1 (1 = coiled tight)           tailThrust 0..1 (straightens the tail forward over the head)
//   tailSegs   number of tail segments (5)       tailDrop 0..1 (tail lying on the ground, stuck)
//   bodyDip    px the body sinks                 onBack (flipped, legs wiggling)
//   stingGlow  0..1 glow at the tip              eggs [{x, r}] egg sacs on the back
//   tailLen    segment length multiplier         noTail (tail torn off)
// Returns { tip: {x, y}, head: {x, y}, claw: {x, y} } in local coordinates.

function drawScorpion(o) {
  const s = o.s || 1;
  const g = Sprite.cur.ga;
  const shell = o.shell, plate = o.plate || shade(o.shell, -0.25), hi = o.hi || shade(o.shell, 0.3);
  const leg = o.leg || shade(o.shell, -0.4), legDk = shade(leg, -0.3);
  const belly = o.belly || shade(o.shell, 0.4);
  const ph = o.legPhase || 0;
  const by = -(8 + (o.bodyDip ? -o.bodyDip : 0)) * s;    // body centre height
  const out = {};
  if (o.onBack) { g.save(); g.translate(0, by); g.scale(1, -1); g.translate(0, -by + 4 * s); }

  // ---- far legs and claw (darker, behind body) ----
  const legsX = [7, 2, -3, -8];
  const drawLeg = (i, far) => {
    const hx = legsX[i] * s, hy = by + 2 * s;
    const sw = Math.sin(ph + i * Math.PI / 2 + (far ? Math.PI : 0));
    const lift = Math.max(0, Math.cos(ph + i * Math.PI / 2 + (far ? Math.PI : 0))) * 2 * s;
    const spread = (1.5 - i) * 4 * s;
    const kx = hx + spread * 0.5 + sw * 1.5 * s + (far ? -1 : 1) * s, ky = by - 5 * s - lift;
    const fx = hx + spread * 1.6 + sw * 3 * s + (far ? -2 : 2) * s, fy = o.onBack ? by - 10 * s - Math.abs(sw) * 4 * s : -lift * 0.5;
    const c = far ? legDk : leg;
    Px.line(hx, hy, kx, ky, Math.max(1, Math.round(2 * s)), c);
    Px.line(kx, ky, fx, fy, Math.max(1, Math.round(1.5 * s)), c);
  };
  for (let i = 0; i < 4; i++) drawLeg(i, true);
  const drawClaw = (far) => {
    const open = o.clawOpen || 0, raise = (o.clawRaise || 0) * 6 * s;
    const sx = 12 * s, sy = by + (far ? -1 : 1) * s;
    const ex = 17 * s, ey = by - 3 * s - raise * 0.5 + (far ? -2 * s : 0);
    const hx = 23 * s, hy = by - 2 * s - raise + (far ? -2 * s : 0);
    const c = far ? plate : shell;
    Px.line(sx, sy, ex, ey, Math.max(2, Math.round(3 * s)), c);
    Px.line(ex, ey, hx, hy, Math.max(2, Math.round(3 * s)), c);
    // pincer: two fingers opening around the hand point
    const a = open * 0.7;
    const L = 7 * s;
    Px.poly([hx, hy - 2 * s, hx + Math.cos(-0.3 - a) * L, hy + Math.sin(-0.3 - a) * L, hx + 2 * s, hy], far ? plate : hi);
    Px.poly([hx, hy + 1 * s, hx + Math.cos(0.4 + a) * L * 0.8, hy + Math.sin(0.4 + a) * L * 0.8, hx + 2 * s, hy - 1 * s], c);
    Px.disc(hx, hy, 2.6 * s, c);
    if (!far) out.claw = { x: hx + 5 * s, y: hy };
  };
  drawClaw(true);

  // ---- body: cephalothorax + abdomen segments ----
  const segs = [[-16, 3.6, 3.4], [-11, 4.6, 4.2], [-5, 5.6, 4.8], [2, 6.2, 5.2]];
  for (const [x, rx, ry] of segs) {
    Px.oval(x * s, by, rx * s, ry * s, shell);
    Px.oval(x * s, by - ry * s * 0.45, rx * s * 0.75, ry * s * 0.35, hi);
    Px.rect(x * s - rx * s * 0.2, by - ry * s, 1, ry * s * 2, plate);
  }
  Px.oval(9 * s, by + 0.5 * s, 6.5 * s, 5 * s, shell);          // head
  Px.oval(9 * s, by - 1.5 * s, 4.5 * s, 1.6 * s, hi);
  Px.oval(4 * s, by + 3 * s, 10 * s, 1.4 * s, belly);           // underbelly
  // eyes: cluster of dots
  const eye = o.eye || '#ff3030';
  Px.dot(12 * s, by - 2 * s, eye); Px.dot(13 * s, by - 1 * s, eye);
  if (s > 1.2) { Px.dot(11 * s, by - 3 * s, eye); Px.dot(14 * s, by - 2 * s, eye); }
  out.head = { x: 12 * s, y: by - 2 * s };
  // egg sacs
  if (o.eggs) for (const e of o.eggs) { Px.disc(e.x * s, by - 4 * s - e.r * s * 0.6, e.r * s, '#f2e0c0'); Px.disc(e.x * s - e.r * s * 0.3, by - 4 * s - e.r * s * 0.9, e.r * s * 0.35, '#ffffff'); }

  // ---- tail ----
  if (!o.noTail) {
    const n = o.tailSegs || 5;
    const curl = o.tailCurl != null ? o.tailCurl : 0.5;
    const thrust = o.tailThrust || 0;
    const drop = o.tailDrop || 0;
    let x = -18 * s, y = by - 1 * s;
    let ang = -2.0;                                   // radians in screen space (0 = +x); -pi/2 = up
    const segLen = 6 * s * (o.tailLen || 1);
    const pts = [];
    for (let i = 0; i < n; i++) {
      // coiled: rotate forward each segment; thrust: aim forward; drop: lie along the ground forward
      let target = ang + 0.25 + curl * 0.25;
      if (thrust) target = lerp(target, -0.15 + i * 0.03, thrust);
      if (drop) target = lerp(target, i === 0 ? -0.6 : 0.1, drop);
      ang = target;
      const r = lerp(4.2, 2.6, i / (n - 1)) * s;
      x += Math.cos(ang) * segLen; y += Math.sin(ang) * segLen;
      if (drop) y = Math.min(y, -r * 0.6);
      pts.push({ x, y, r });
    }
    let px = -18 * s, py = by - 1 * s;
    pts.forEach((p, i) => {
      Px.line(px, py, p.x, p.y, Math.max(2, Math.round(p.r * 1.4)), i % 2 ? plate : shell);
      Px.disc(p.x, p.y, p.r, i % 2 ? shell : plate);
      Px.dot(p.x - p.r * 0.3, p.y - p.r * 0.5, hi);
      px = p.x; py = p.y;
    });
    // stinger: hooked polygon continuing the last direction, curling down
    const tip = pts[pts.length - 1];
    const a2 = ang + 0.9;
    const L = 7 * s;
    const sx2 = tip.x + Math.cos(ang) * 2 * s, sy2 = tip.y + Math.sin(ang) * 2 * s;
    const ex2 = sx2 + Math.cos(a2) * L, ey2 = sy2 + Math.sin(a2) * L;
    Px.poly([sx2 - Math.sin(ang) * 2 * s, sy2 + Math.cos(ang) * 2 * s, ex2, ey2, sx2 + Math.sin(ang) * 2 * s, sy2 - Math.cos(ang) * 2 * s], o.sting || '#f2e9c9');
    if (o.stingGlow) {
      g.globalAlpha = 0.4 * o.stingGlow;
      Px.disc(ex2, ey2, (2 + 4 * o.stingGlow) * s * 0.7, '#ff3030');
      g.globalAlpha = 1;
      Px.disc(ex2, ey2, 1.2 * s, '#ff3030');
    }
    out.tip = { x: ex2, y: ey2 };
    out.tail = pts;
  }

  // ---- near legs and claw ----
  for (let i = 0; i < 4; i++) drawLeg(i, false);
  drawClaw(false);
  if (o.onBack) g.restore();
  return out;
}

        for (const e of Game.foes()) {
          if (e === f || !e.vulnerable || Math.abs(e.y - this.y) > 12 || Math.abs(e.x - sx) > 22 + e.w) continue;
          e.takeHit(this, { dmg: 10, tier: 3, knock: true, kx: 2.4, kz: 3.0, zr: [0, 50] }, e.x >= sx ? 1 : -1);
        }
        FX.dustRing(sx, this.y, 12);
        FX.shake(3, 12);
      }
    }
    if (this.t >= 36) this.setState('idle');
    return true;
  }
  addCombo() { this.comboHits++; this.comboT = 60; this.comboPop = 6; this.bestCombo = Math.max(this.bestCombo, this.comboHits); }
  releaseHold() {
    const f = this.grabbing;
    if (f) { f.grabbedBy = null; if (f.state === 'grabbed' || f.state === 'held') f.setState('idle'); }
    this.grabbing = null;
  }

  // ---------- being held by an enemy (Ghoul bite, boss grabs) ----------
  // Holder protocol: call hero.holdBy(enemy) and set enemy.holding = true; each frame position the hero
  // yourself and deal damage with hero.holdDamage(n). Every button press the hero makes adds
  // enemy.mashK (default 8) to enemy.clutchT, so count your hold timer with clutchT. Scrap Burst (L)
  // breaks the hold unless enemy.burstEscapes === false; then enemy.releaseClutch() is called.
  // Release with hero.freeFromHold(dir) and set enemy.holding = false.
  holdBy(e) {
    if (this.grabbing) this.releaseHold();
    this.heldBy = e; this.atk = null;
    this.setState('grabbed');
    this.vx = this.vy = 0;
    e.clutchT = 0;
  }
  holdDamage(n) {
    n = Math.max(1, Math.round(n * Game.diff.dmg));
    this.hp = Math.max(0, this.hp - n);
    this.grey = 0; this.flash = 2; this.tintT = 6;
    this.damageTaken += n;
    Game.addRage(n);
    Game.portraitHit = 8;
    FX.hurtVignette(); FX.shake(1, 4);
    Sound.sfx('hurt', this.x);
    if (this.hp <= 0) { const h = this.heldBy; this.heldBy = null; if (h) { h.holding = false; h.releaseClutch && h.releaseClutch(); } this.knockDown(h && h.x > this.x ? -1 : 1, 2.0, 3.0); }
  }
  freeFromHold(dir = 0) {
    this.heldBy = null;
    if (this.state === 'grabbed') { this.setState('idle'); this.vx = dir * 2; this.inv = Math.max(this.inv, 20); }
  }
  heldUpdate() {
    const h = this.heldBy;
    if (!h || h.remove || h.dying || !h.holding) { this.heldBy = null; this.setState('idle'); return; }
    if (Input.anyPressed) h.clutchT = (h.clutchT || 0) + (h.mashK || 8);
    if (this.buffered('special') && h.burstEscapes !== false && this.canPay(8)) {
      this.consume('special');
      this.heldBy = null; h.holding = false;
      h.releaseClutch && h.releaseClutch();
      this.setState('idle');
      this.doBurst();
    }
  }

  // ---------- weapons ----------
  giveWeapon(kind) {
    if (this.weapon) this.dropWeapon();
    this.weapon = { kind, uses: WEAPONS[kind].uses };
    this.pipeStreak = 0;
  }
  dropWeapon() {
    if (!this.weapon) return;
    const it = Game.add(new Item(this.weapon.kind, this.x - this.facing * 8, this.y, 2.5));
    it.uses = this.weapon.uses;
    it.life = 300;
    this.weapon = null;
  }
  breakWeapon() {
    FX.shards(this.x + this.facing * 20, this.y, 24, 5, ['#8a8f96', '#5e6168']);
    Sound.sfx('weaponBreak', this.x);
    FX.text(this.x, this.y, 52, WEAPONS[this.weapon.kind].name + ' BROKE', '#c0c6cc', 50);
    this.weapon = null;
  }
  throwWeapon() {
    const k = this.weapon.kind;
    this.weapon = null;
    Game.add(new Proj(this.x + this.facing * 10, this.y, 22, { kind: 'thrown_' + k, vx: this.facing * 5, vz: 0, gravity: 0, dmg: 12, tier: 3, knock: true, owner: this, life: 60, friendly: true, pierce: 1 }));
    this.setState('throwing');
    Sound.sfx('throwObj', this.x);
  }
  throwBottle() {
    this.weapon = null;
    Game.add(new Proj(this.x + this.facing * 8, this.y, 30, { kind: 'molotov', vx: this.facing * 3.0, vz: 2.6, gravity: 0.28, dmg: 10, tier: 3, knock: true, owner: this, friendly: true, burn: 60 }));
    if (this.state !== 'jump') this.setState('throwing');
    Sound.sfx('throwObj', this.x);
  }

  // ---------- getting hit ----------
  takeHit(src, a, dir, nth) {
    if (this.grabbing) this.releaseHold();
    if (this.heldBy) { const h = this.heldBy; this.heldBy = null; h.holding = false; h.releaseClutch && h.releaseClutch(); }
    if (this.state === 'jumpsquat') this.setState('idle');
    this.grey = 0;
    const heavy = a.knock;
    // anti-stunlock: the 3rd light hit within 90f knocks down
    this.recentHits = this.recentHits.filter(t => Game.frame - t < 90);
    this.recentHits.push(Game.frame);
    const forceKD = !heavy && this.recentHits.length >= 3;
    const aa = forceKD ? Object.assign({}, a, { knock: true, kx: 2.2, kz: 3.0 }) : a;
    const before = this.hp;
    super.takeHit(src, aa, dir, nth);
    const taken = before - this.hp;
    this.damageTaken += taken;
    Game.addRage(taken);
    this.comboHits = 0; this.comboT = 0;
    this.hs = Math.max(this.hs, heavy ? 7 : 4);
    FX.shake(2, 8);
    FX.hurtVignette();
    Game.portraitHit = 8;
    Sound.sfx('hurt', this.x);
    if (this.state === 'hurt') this.hurtTime = (a.tier || 1) >= 2 ? 18 : 14;
    if (this.state === 'fall') { this.recentHits = []; if (this.weapon) this.dropWeapon(); }
  }
  onDeath() { /* handled by Game.playerDied after the knockdown */ }

  // ---------- drawing ----------
  currentPose() {
    const t = this.t;
    switch (this.state) {
      case 'idle': return Poses.idle(Game.frame);
      case 'walk': return Poses.walk(Game.frame, 1.1);
      case 'run': return Poses.run(Game.frame);
      case 'skid': return pose({ hy: -18, rot: -0.3, fThigh: 0.9, fKnee: -0.2, bThigh: -0.4, bKnee: -0.6, fUpper: 0.8, fElbow: 1.2, bUpper: -0.6, bElbow: 1.0 });
      case 'jumpsquat': case 'land': case 'pickup': return Poses.crouch();
      case 'jump': return Poses.jump(this.vz);
      case 'hurt': return (this.hurtAlt || 0) % 2 ? Poses.hurt(t) : PlayerPoses.gutfold(t);
      case 'fall': return Poses.fall(t, this.vz);
      case 'down': return Poses.down();
      case 'getup': return Poses.getup(t * 16 / 18);
      case 'grabbed': return Poses.grabbed(t);
      case 'grab':
        if (this.sub === 'knee') return PlayerPoses.kneeHit(t);
        if (this.sub === 'toss') return PlayerPoses.toss(t);
        if (this.sub === 'suplex') return PlayerPoses.suplex(t);
        return PlayerPoses.hold(t);
      case 'throwing': return PlayerPoses.toss(t + 6);
      case 'meteor': return this.sub === 'impact' ? PlayerPoses.slam() : PlayerPoses.meteor(this.sub);
      case 'victory': return pose({ rot: 0, fThigh: 0.1, fKnee: 0, bThigh: -0.1, bKnee: 0, fUpper: 3.05, fElbow: 0.1, bUpper: 0.3, bElbow: 1.6, head: -0.15 });
      case 'overdrive': return PlayerPoses.ram('active');
      case 'barrage': return t < 30 ? PlayerPoses.barrage(t) : PlayerPoses.upper('active');
      case 'attack': {
        const a = this.atk;
        return (PlayerPoses[a.pose] || PlayerPoses.jab)(this.atkPhase(), this.t, a, this);
      }
    }
    return Poses.idle(Game.frame);
  }
  draw(ctx, camX) {
    // afterimages
    for (const g of this.ghosts) {
      Sprite.begin(112, 96, 56, 88);
      drawHumanoid(g.pose, HERO_STYLE(this, true));
      Sprite.end(ctx, g.x - camX, g.y - g.z, g.f, { flash: '#ff9a2e', alpha: 0.4 * (1 - g.t / 12), outline: null });
    }
    if (this.blink && this.inv > 0 && (this.inv >> 2) % 2) return;
    const p = this.currentPose();
    Sprite.begin(112, 96, 56, 88);
    drawHumanoid(p, HERO_STYLE(this, false));
    Sprite.end(ctx, this.x - camX + this.jitter, this.y - this.z, this.facing, {
      flash: this.flash > 0 ? '#ffffff' : null,
      tint: this.venom > 0 ? ['#7cff4f', 0.3] : this.tintT > 0 ? ['#ff5a3a', this.tintT / 12] : null,
    });
  }
}

    return pose({ rot: 0.35, fThigh: 0.6, fKnee: -0.5, bThigh: -0.45, bKnee: -0.1, fUpper: 0.5, fElbow: 0.2, bUpper: 0.5, bElbow: 0.3 });

  thrust(ph) {
    if (ph === 'start') return pose({ hx: -1, rot: -0.1, fThigh: 0.3, fKnee: -0.4, bThigh: -0.4, bKnee: -0.3, fUpper: 1.0, fElbow: 1.8, bUpper: 0.8, bElbow: 1.9 });
    if (ph === 'active') return pose({ hx: 3, rot: 0.35, fThigh: 0.6, fKnee: -0.4, bThigh: -0.5, bKnee: 0, fUpper: 1.55, fElbow: 0, bUpper: 1.4, bElbow: 0.3 });
    return pose({ rot: 0.2, fThigh: 0.45, fKnee: -0.35, bThigh: -0.4, bKnee: -0.15, fUpper: 1.3, fElbow: 0.6, bUpper: 1.1, bElbow: 0.8 });
  },
};

// ---------- hero art ----------
const HERO_PAL = {
  skin: '#c68a5a', jaw: '#9a6440', hair: '#d9452b', hairDk: '#a02f1c',
  top: '#5b6b3a', topDk: '#3e4a27', pants: '#4a3424', boots: '#2a2020', belt: '#2a1a10', buckle: '#e0b04a',
  scarf: '#e0b04a', scarfDk: '#b88a2a', bandage: '#d9cbb0',
  steel: '#8c8f96', steelDk: '#5e6168', steelHi: '#c9ced6', rust: '#a0522d', fist: '#6e7178',
  goggle: '#3fd0e0', strap: '#3a2a1a', kneepad: '#8c8f96',
};

function updateChain(pts, ax, ay, n, seg, facing, droop, wind) {
  if (!pts || pts.length !== n) { pts = []; for (let i = 0; i < n; i++) pts.push({ x: ax - facing * seg * (i + 1), y: ay + i }); }
  let px = ax, py = ay;
  for (let i = 0; i < n; i++) {
    const p = pts[i];
    const tx = px - facing * seg + wind, ty = py + droop;
    p.x = lerp(p.x, tx, 0.35);
    p.y = lerp(p.y, ty, 0.35);
    // keep segment length bounded
    const dx = p.x - px, dy = p.y - py, d = Math.hypot(dx, dy) || 1;
    if (d > seg * 1.6) { p.x = px + dx / d * seg * 1.6; p.y = py + dy / d * seg * 1.6; }
    px = p.x; py = p.y;
  }
  return pts;
}

function HERO_STYLE(pl, ghost) {
  const P = HERO_PAL;
  const rage = Game.rage / 100;
  return {
    skin: P.skin, top: P.top, sleeve: P.skin, arm: P.skin, pants: P.pants, boots: P.boots, belt: P.belt,
    hipW: 9, shW: 12, limbW: 5,
    torso(R, s) {
      // tank top seam + shoulders in skin
      Px.line(lerp(R.H.x, R.S.x, 0.2), lerp(R.H.y, R.S.y, 0.2), lerp(R.H.x, R.S.x, 0.85), lerp(R.H.y, R.S.y, 0.85), 1, P.topDk);
      Px.disc(R.S.x, R.S.y + 1, 3, P.skin);
      const b = { x: lerp(R.H.x, R.S.x, 0.06), y: lerp(R.H.y, R.S.y, 0.06) };
      Px.rect(b.x - 1, b.y - 1, 2, 2, P.buckle);
    },
    backHand(Hn, ang) {
      Px.disc(Hn.x, Hn.y, 2, P.skin);
      Px.dot(Hn.x - 1, Hn.y - 2, P.bandage);
    },
    head(Hd, th, s, R) {
      const fx = dirX(th - Math.PI / 2) , fy = dirY(th - Math.PI / 2); // forward-facing unit (perp to neck)
      void fx; void fy;
      // ponytail (behind head) — secondary motion chain in world space
      if (!ghost) {
        const wx = pl.x + pl.facing * (Hd.x - 4), wy = pl.y - pl.z + Hd.y - 3;
        pl.tail = updateChain(pl.tail, wx, wy, 3, 3, pl.facing, 1.2, -0.3 * pl.facing * 0);
      }
      if (pl.tail) pl.tail.forEach((p, i) => {
        const lx = (p.x - pl.x) * pl.facing, ly = p.y - (pl.y - pl.z);
        Px.disc(lx, ly, 2.5 - i * 0.5, i ? P.hairDk : P.hair);
      });
      Px.disc(Hd.x, Hd.y, 5, P.skin);
      Px.rect(Hd.x - 1, Hd.y + 2, 5, 2, P.jaw);
      // undercut swept back: three triangles
      Px.poly([Hd.x - 5, Hd.y - 1, Hd.x - 4, Hd.y - 6, Hd.x + 3, Hd.y - 6, Hd.x + 5, Hd.y - 3, Hd.x - 1, Hd.y - 3], P.hair);
      Px.poly([Hd.x - 6, Hd.y - 4, Hd.x - 1, Hd.y - 7, Hd.x - 2, Hd.y - 3], P.hairDk);
      Px.rect(Hd.x - 5, Hd.y - 2, 2, 4, P.hairDk);
      // goggles strap + lens
      Px.rect(Hd.x - 4, Hd.y - 3, 9, 1, P.strap);
      Px.disc(Hd.x + 2.5, Hd.y - 3.5, 1.5, P.goggle);
      Px.dot(Hd.x + 2, Hd.y - 4, '#e0ffff');
      Px.rect(Hd.x + 3, Hd.y - 1, 1, 2, '#1a1a1a');
    },
    hand(Hn, ang, s, R) {
      // the Scrapfist: draw forearm block + fist over the plain arm
      const E = R.fa.E;
      Px.line(R.S.x, R.S.y, E.x, E.y, 3, P.steelDk);
      Px.line(R.S.x, R.S.y - 1, E.x, E.y - 1, 1, P.steel);
      Px.quad(E.x, E.y, Hn.x, Hn.y, 7, 8, P.steel);
      const mx = lerp(E.x, Hn.x, 0.5), my = lerp(E.y, Hn.y, 0.5);
      Px.rect(mx - 1, my - 1, 2, 2, P.rust);
      const vc = rage >= 1 && (Game.frame >> 2) % 2 ? '#ffe066' : rage > 0.05 ? '#ff9a2e' : '#1a1a1a';
      for (let i = 0; i < 3; i++) {
        const k = 0.25 + i * 0.2;
        const vx = lerp(E.x, Hn.x, k), vy = lerp(E.y, Hn.y, k);
        Sprite.cur.ga.globalAlpha = rage > 0.05 ? 0.2 + 0.8 * rage : 1;
        Px.rect(vx, vy - 2, 1, 2, vc);
        Sprite.cur.ga.globalAlpha = 1;
      }
      // fist block, oriented along the forearm
      const ux = dirX(ang), uy = dirY(ang), vx = -uy, vy = ux;
      const fx = Hn.x + ux * 2, fy = Hn.y + uy * 2;
      Px.poly([fx - ux * 3 - vx * 4, fy - uy * 3 - vy * 4, fx + ux * 4 - vx * 4, fy + uy * 4 - vy * 4,
        fx + ux * 4 + vx * 4, fy + uy * 4 + vy * 4, fx - ux * 3 + vx * 4, fy - uy * 3 + vy * 4], P.fist);
      Px.dot(fx + ux * 2 - vx * 2, fy + uy * 2 - vy * 2, P.steelHi);
      Px.dot(fx + ux * 2 + vx * 2, fy + uy * 2 + vy * 2, P.steelHi);
      // held weapon
      if (pl.weapon && !ghost) drawHeldWeapon(pl.weapon.kind, fx, fy, ang);
    },
    after(R, s) {
      // knee pad on front leg
      Px.rect(R.fl.K.x - 2, R.fl.K.y - 1, 4, 3, P.kneepad);
      // scarf: two rects at the neck plus a trailing tail
      const nx = lerp(R.S.x, R.Hd.x, 0.35), ny = lerp(R.S.y, R.Hd.y, 0.35);
      Px.rect(nx - 3, ny - 1, 6, 3, P.scarf);
      if (!ghost) {
        const wx = pl.x + pl.facing * (nx - 2), wy = pl.y - pl.z + ny;
        const wind = pl.state === 'run' || pl.state === 'overdrive' ? 0 : -0.3 * pl.facing;
        pl.scarf = updateChain(pl.scarf, wx, wy, 3, 4, pl.facing, pl.airborne ? -0.6 : 1.0, wind);
      }
      if (pl.scarf) {
        let px = nx - 2, py = ny;
        pl.scarf.forEach((p, i) => {
          const lx = (p.x - pl.x) * pl.facing, ly = p.y - (pl.y - pl.z);
          Px.limb(px, py, lx, ly, 3 - i * 0.7, 2.5 - i * 0.7, i % 2 ? P.scarfDk : P.scarf);
          px = lx; py = ly;
        });
      }
    },
  };
}

function drawHeldWeapon(kind, x, y, ang) {
  const ux = dirX(ang), uy = dirY(ang);
  // weapons extend along the forearm direction, past the fist
  switch (kind) {
    case 'pipe':
      Px.line(x - ux * 6, y - uy * 6, x + ux * 18, y + uy * 18, 3, '#8a929c');
      Px.rect(x + ux * 6 - 1, y + uy * 6 - 1, 3, 3, '#5e666e');
      break;
    case 'machete':
      Px.line(x - ux * 2, y - uy * 2, x + ux * 4, y + uy * 4, 3, '#3a2a1a');
      Px.quad(x + ux * 4, y + uy * 4, x + ux * 18, y + uy * 18, 3, 4, '#d8dce0');
      break;
    case 'axe':
      Px.line(x - ux * 4, y - uy * 4, x + ux * 22, y + uy * 22, 2, '#8a8a8a');
      Px.disc(x + ux * 24, y + uy * 24, 7, '#f2eee0');
      Px.disc(x + ux * 24, y + uy * 24, 6, '#c8322a');
      break;
    case 'molotov':
      Px.rect(x - 2, y - 7, 4, 7, '#6a8a3a');
      Px.disc(x, y - 9, 1.5 + (Game.frame >> 2) % 2 * 0.5, '#ffb030');
      break;
  }
}

function drawPortrait(ctx, x, y) {
  Px.use(ctx);
  const P = HERO_PAL;
  Px.disc(x, y - 6, 6, P.skin);
  Px.poly([x - 7, y - 6, x - 5, y - 13, x + 4, y - 13, x + 7, y - 9, x - 1, y - 9], P.hair);
  Px.rect(x - 6, y - 9, 13, 1, P.strap);
  Px.disc(x + 3, y - 9, 2, P.goggle);
  Px.rect(x + 2, y - 6, 1, 2, '#1a1a1a');
  Px.rect(x - 1, y - 2, 5, 2, P.jaw);
  Px.rect(x - 5, y, 11, 3, P.scarf);
}

// ---- 60_enemy.js ----
// Enemy base: shared AI (approach, circle, attack tokens, retreat), the telegraph language and
// hit handling. Concrete enemy types register in ENEMY_TYPES and supply drawBody() plus data.
//
// ENEMY_TYPES[key] = {
//   name, family: 'gang'|'mutant'|'scorpion', hp, speed, w, h, weight, score, shadowR,
//   armorTier (hits below this tier don't flinch), poise (boss poise), launchable, launchCap,
//   heavy (pushes the hero back on hit), noGrab, tossOnly, noSuplex, downTime, boss,
//   sprite: [w, h, ox, oy] scratch canvas, range (attack distance), hover (circling distance),
//   attacks: { key: { start, active, rec, dmg, tier, knock, kx, kz, kb, stun, reach:[near,far], zr:[lo,hi], depth,
//                     tell: 'glint'|'heavy'|'grab', danger: 'line'|'circle', dangerLen, glint:[x,y], whiff, sfxStart,
//                     selfVx, keepVx, projectile } },
//   pattern(dist, dy) -> attack key | null   (this = enemy)
//   think(), stateUpdate() -> bool, attackTick(a, phase), drawBody(g), init(opts), onHurt(), onDeath(),
//   onRemoved(), onDowned(), enterStyles: { side(spec) }, drawExtra(ctx, camX)
// }

const ENEMY_TYPES = {};

class Enemy extends Fighter {
  constructor(type, x, y, opts = {}) {
    super(x, y);
    const d = ENEMY_TYPES[type];
    if (!d) throw new Error('unknown enemy type ' + type);
    this.type = type;
    this.def = d;
    this.team = 'enemy';
    this.family = d.family || 'gang';
    this.hp = this.maxHp = Math.round(d.hp * (d.boss ? 1 : Game.diff.hp));
    this.w = d.w || 8; this.h = d.h || 40;
    this.speed = d.speed || 1;
    this.weight = d.weight != null ? d.weight : 1;
    this.shadowR = d.shadowR || 10;
    this.armorTier = d.armorTier || 0;
    this.poiseMax = this.poise = d.poise || 0;
    this.launchable = d.launchable !== false;
    this.launchCap = d.launchCap || 0;
    this.heavy = !!d.heavy;
    this.downTime = d.downTime || 36;
    this.name = d.name;
    this.score = d.score || 100;
    this.boss = !!d.boss;
    this.tossOnly = !!d.tossOnly; this.noSuplex = !!d.noSuplex;
    this.ai = 'approach'; this.aiT = 0;
    this.token = false;
    this.cool = ri(20, 50);
    this.slot = { side: chance(0.5) ? 1 : -1, dy: rr(-14, 14), dist: rr(60, 100) };
    this.variant = opts.variant || 0;
    this.opts = opts;
    this.anim = rr(0, 100);
    if (d.init) d.init.call(this, opts);
  }
  get grabbable() { return !this.def.noGrab && !this.boss; }
  canBeGrabbed() {
    if (!this.alive || this.def.noGrab || this.boss) return false;
    if (this.state === 'attack') return this.atkPhase() === 'start' && !(this.atk.tell === 'heavy');
    return ['idle', 'walk', 'hurt'].includes(this.state);
  }

  // Attack tokens: 2 melee + 1 ranged at once (3 melee in stage 3). Bosses and def.noToken ignore the pool.
  // Pass ranged=true (or set def.ranged) to draw from the ranged pool.
  takeToken(ranged = !!this.def.ranged) {
    if (this.token) return true;
    if (this.boss || this.def.noToken) { this.token = true; return true; }
    const holders = Game.foes().filter(e => e.token && !e.boss && !e.def.noToken && !!e.tokenRanged === ranged).length;
    const max = ranged ? 1 : Game.maxAttackers();
    if (holders < max) { this.token = true; this.tokenRanged = ranged; return true; }
    return false;
  }
  dropToken() { this.token = false; }
  setState(s) {
    super.setState(s);
    if (['hurt', 'fall', 'grabbed', 'thrown', 'held', 'down', 'pinned'].includes(s)) this.dropToken();
  }
  onScreen() { return this.x > Game.cam.x + 4 && this.x < Game.cam.x + W - 4; }

  update(bounds) {
    this.anim++;
    this.physics(bounds);
    if ((this.state === 'thrown' || this.state === 'fall') && (this.thrownBy || this.blasted)) bowlingCollisions(this, Game.foes());
    if (this.state === 'pinned' || this.state === 'held') { this.vx = 0; this.vy = 0; if (this.state === 'held') this.z = Math.max(0, this.z); return; }
    if (this.def.stateUpdate && this.def.stateUpdate.call(this)) return;
    if (this.reactionStates()) return;
    this.aiT++;
    if (this.state === 'drop') { if (this.z <= 0) { this.setState('idle'); this.grace = 10; FX.dust(this.x, this.y, 8, 1.4); FX.shake(2, 8); Sound.sfx('thud', this.x); } return; }
    if (this.state === 'door') { this.vx = 0; this.vy = this.speed * 0.8; if (this.t > 20) { this.setState('idle'); this.vy = 0; } return; }
    if (this.state === 'attack') { this.attackUpdate(); return; }
    if (this.state === 'enter') { this.enterUpdate(); return; }
    if (this.state === 'taunt') { this.vx = this.vy = 0; if (this.t > (this.tauntT || 40)) this.setState('idle'); return; }
    if (this.state === 'panic') { this.panicUpdate(); return; }
    if (this.state === 'dizzy') { this.vx *= 0.8; if (this.t % 10 === 0) FX.add({ kind: 'star', x: this.x + rr(-6, 6), y: this.y, z: this.h + 4, life: 8, size: 3, color: '#ffe066', g: 0 }); if (this.t > (this.dizzyT || 60)) this.setState('idle'); return; }
    if (this.cool > 0) this.cool--;
    if (this.grace > 0) { this.vx *= 0.8; this.vy *= 0.8; return; }
    (this.def.think || Enemy.prototype.meleeThink).call(this);
  }
  attackUpdate() {
    const a = this.atk;
    const ph = this.atkPhase();
    if (this.def.attackTick) this.def.attackTick.call(this, a, ph);
    if (this.state !== 'attack' || this.atk !== a) return;
    if (a.selfVx != null && ph === 'active') this.vx = a.selfVx * this.facing;
    else if (!a.keepVx) this.vx *= 0.75;
    this.vy *= 0.6;
    if (!a.projectile && !a.custom) this.resolveAttack([Game.player]);
    if (this.atkPhase() === 'done') {
      const nx = a.next;
      this.atk = null;
      if (nx && (!a.nextOnHit || (this.atkHit && this.atkHit.size))) { this.startAttack(this.def.attacks[nx]); return; }
      this.finishAttack();
    }
  }
  finishAttack() {
    this.setState('idle');
    this.dropToken();
    this.ai = 'retreat'; this.aiT = 0;
    this.cool = Math.round(ri(this.def.coolMin || 60, this.def.coolMax || 110) * Game.stageMult() * (this.coolMul || 1));
  }
  enterUpdate() {
    const cx = Game.cam.x;
    const inside = this.x > cx + 20 && this.x < cx + W - 20;
    this.vx = this.facing * this.speed * 1.2;
    this.vy = 0;
    if (inside || this.t > 300) { this.setState('idle'); this.vx = 0; }
  }
  setPanic(n) { if (this.alive && !['fall', 'down', 'thrown'].includes(this.state)) { this.atk = null; this.setState('panic'); this.panicT = n; this.dropToken(); } }
  panicUpdate() {
    this.vx = Math.sin(this.t * 0.15) * this.speed * 1.5;
    this.vy = Math.cos(this.t * 0.11) * this.speed;
    if (this.t % 4 === 0) FX.fire(this.x, this.y, this.h * 0.6, 1);
    if (this.t > this.panicT) this.setState('idle');
  }

  // Default melee brain: hover around the hero until it gets an attack token, then line up and strike.
  meleeThink() {
    const p = Game.player;
    const d = this.def;
    if (!p || Game.playerGone || p.hp <= 0 || p.state === 'down') { this.circle(p, 1.3); return; }
    const dx = p.x - this.x, dy = p.y - this.y;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (this.ai === 'retreat') {
      this.face(p);
      this.moveToward(this.x - sign(dx) * 40, this.y + this.slot.dy * 0.2, 0.7);
      if (this.aiT > (d.retreatT || 24)) { this.ai = 'approach'; this.aiT = 0; }
      return;
    }
    if (d.taunts && this.cool > 20 && chance(0.004)) { this.setState('taunt'); this.tauntT = 40; Sound.sfx('taunt', this.x); return; }
    if (this.cool <= 0 && this.onScreen() && this.takeToken()) {
      this.face(p);
      const key = d.pattern ? d.pattern.call(this, adx, ady) : null;
      if (key) { this.attack(key); return; }
      // line up for the default melee attack
      const range = d.range || 22;
      const tx = p.x - sign(dx || 1) * range, ty = p.y;
      if (adx <= range + 4 && adx >= range * 0.4 && ady <= 3) { this.vx = this.vy = 0; this.attack(d.melee || Object.keys(d.attacks)[0]); return; }
      this.moveToward(tx, ty, 1);
      if (this.aiT > 200) { this.dropToken(); this.cool = 30; this.aiT = 0; }
      return;
    }
    this.circle(p, 1);
  }
  // Circle the hero at slot distance, drifting in depth.
  circle(p, k = 1) {
    if (!p) { this.wander(); return; }
    const dx = p.x - this.x;
    const side = dx > 0 ? -1 : 1;
    const dist = this.def.hover || this.slot.dist;
    const hx = clamp(p.x + side * dist, Game.cam.x + 16, Game.cam.x + W - 16);
    const hy = clamp(p.y + this.slot.dy + Math.sin(this.aiT * 0.02 + this.id) * 8, Game.bounds.yMin, Game.bounds.yMax);
    this.face(p);
    if (Math.abs(this.x - hx) > 6 || Math.abs(this.y - hy) > 4) this.moveToward(hx, hy, 0.6 * k);
    else { this.vx = this.vy = 0; if (this.state !== 'idle') this.setState('idle'); }
  }
  attack(key) {
    const base = this.def.attacks[key];
    if (!base) return;
    const a = Object.assign({ key }, base);
    a.start = Math.max(a.tell === 'heavy' ? 10 : 4, a.start + (Game.diff.tele || 0) - (this.teleCut || 0));
    this.startAttack(a);
    if (a.tell === 'heavy' || a.tell === 'grab') Sound.sfx(this.family === 'mutant' ? 'groan' : this.family === 'scorpion' ? 'rattle' : 'shout', this.x);
  }
  wander() {
    this.vx *= 0.8; this.vy *= 0.8;
    if (this.state !== 'idle' && this.state !== 'walk') this.setState('idle');
  }
  moveToward(tx, ty, k = 1) {
    const sx = this.speed * k, sy = this.speed * 0.65 * k;
    const dx = tx - this.x, dy = ty - this.y;
    this.vx = Math.abs(dx) > 2 ? sign(dx) * Math.min(sx, Math.abs(dx)) : 0;
    this.vy = Math.abs(dy) > 1 ? sign(dy) * Math.min(sy, Math.abs(dy)) : 0;
    if (this.vx || this.vy) { if (this.state !== 'walk') this.setState('walk'); }
    else if (this.state !== 'idle') this.setState('idle');
  }
  takeHit(src, a, dir, nth) {
    const wasAttack = this.state === 'attack';
    super.takeHit(src, a, dir, nth);
    if (src && src.team === 'player') {
      Game.showFoe(this);
      if (this.airborne && this.state === 'fall' && wasAttack && this.def.interceptable) { FX.text(this.x, this.y, this.z + 30, 'INTERCEPT!', '#ffe066', 50); Game.addScore(500); }
    }
    if (this.def.onHurt) this.def.onHurt.call(this, src, a);
  }
  onArmorHit(src, a, tier) {
    Sound.sfx('tink', this.x);
    this.armorFlash = 4;
    if (src && src.team === 'player' && this.heavy) src.vx = -src.facing * 0.4;
  }
  onHitFx(x, z, tier, dir, a) {
    const fam = FAMILY[this.family] || FAMILY.gang;
    FX.hit(x, this.y, z, tier, dir, fam.tint);
    if (this.family === 'mutant') FX.splat(x, this.y, z, '#7cff4f', 2 + tier, dir);
    else if (this.family === 'scorpion') { FX.shards(x, this.y, z, 1 + tier, this.def.chitin); FX.splat(x, this.y, z, '#e8e070', 1 + (tier >> 1), dir, false); }
    else if (tier >= 2) FX.sweat(x, this.y, z + 4, 2);
  }
  onDeath(src, a, dir) {
    if (this.dying) return;
    this.dying = true;
    this.dropToken();
    if (this.grabbedBy) this.releaseGrab();
    Game.addScore(this.score);
    FX.text(this.x, this.y, this.h + 6, String(this.score), '#ffe066', 50);
    Sound.sfx(this.def.deathSfx || 'ko', this.x);
    if (this.family === 'mutant') { FX.splat(this.x, this.y, this.h * 0.5, '#7cff4f', 12, dir || 1); FX.pool(this.x, this.y + 1, '#4fb82e', 14); }
    if (this.family === 'scorpion') FX.shards(this.x, this.y, 10, 6, this.def.chitin);
    if (this.family === 'gang' && this.def.gear) FX.add({ kind: 'shard', x: this.x, y: this.y, z: this.h, vx: rr(-1.5, 1.5), vz: 3, life: 60, color: this.def.gear, size: 4, rot: 0, spin: 0.3, g: 0.24, ground: this.y });
    if (this.def.onDeath) this.def.onDeath.call(this, src, a);
    if (this.state !== 'fall' && this.state !== 'thrown' && this.state !== 'down' && this.state !== 'held') this.knockDown(dir || -this.facing, 3.5 * this.weight, 3.5);
  }
  onDowned() { if (this.def.onDowned) this.def.onDowned.call(this); }
  onRemoved() { if (this.def.onRemoved) this.def.onRemoved.call(this); }

  // ---------- telegraph language ----------
  telegraphing() { return this.state === 'attack' && this.atkPhase() === 'start' && this.atk; }
  drawMarker(ctx, camX) {
    const a = this.telegraphing();
    if (!a || !a.danger) return;
    Px.use(ctx);
    const k = this.t / Math.max(1, a.start);
    if (a.danger === 'line') {
      const len = a.dangerLen || 100;
      const x0 = this.x - camX, y = this.y;
      ctx.globalAlpha = 0.6;
      for (let i = 0; i < len; i += 8) Px.rect(x0 + this.facing * i - (this.facing < 0 ? 4 : 0), y, 4, 1, '#ff3030');
      ctx.globalAlpha = 1;
    } else if (a.danger === 'circle' && this.dangerAt) {
      ctx.globalAlpha = 0.35 + 0.3 * k;
      ctx.strokeStyle = '#ff3030'; ctx.lineWidth = 1;
      const r = lerp(6, a.dangerR || 16, k);
      ctx.beginPath(); ctx.ellipse(Math.round(this.dangerAt.x - camX), Math.round(this.dangerAt.y), r, r * 0.4, 0, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  draw(ctx, camX) {
    if (this.dying && this.state === 'down' && this.t > 40 && (this.t >> 2) % 2) return;
    if (this.juggle >= 4 && this.airborne && (this.t >> 1) % 2) return;
    const d = this.def;
    const sp = d.sprite || [112, 96, 56, 88];
    Sprite.begin(sp[0], sp[1], sp[2], sp[3]);
    d.drawBody.call(this, Sprite.cur.ga);
    const tele = this.telegraphing();
    let tint = null;
    if (this.tintT > 0) tint = [(FAMILY[this.family] || FAMILY.gang).tint, this.tintT / 8];
    if (tele && tele.tell === 'heavy') tint = ['#ff6a3d', 0.25 + 0.25 * Math.sin(this.t * 0.5)];
    if (this.venom > 0) tint = ['#7cff4f', 0.3];
    if (this.burn > 0 && (this.t >> 2) % 2) tint = ['#ff8a1e', 0.35];
    const sil = Game.silhouetteDist && Game.player && Math.abs(this.x - Game.player.x) > Game.silhouetteDist;
    Sprite.end(ctx, this.x - camX + this.jitter, this.y - this.z, this.facing, {
      flash: sil ? '#3a2a1a' : this.flash > 0 || this.armorFlash-- > 0 ? '#ffffff' : null,
      tint: sil ? null : tint,
    });
    if (sil && d.eyes) {
      // only the eyes glow through the storm: def.eyes() returns [[localX, localY, colour], ...]
      Px.use(ctx);
      for (const [ex, ey, c] of d.eyes.call(this)) Px.rect(this.x - camX + this.facing * ex - (this.facing < 0 ? 1 : 0), this.y - this.z + ey, 1, 1, c);
      return;
    }
    // glint 6f before the active window
    if (tele && tele.tell && this.t >= tele.start - 6) {
      const g = tele.glint || [tele.reach ? tele.reach[1] * 0.6 : 14, -this.h * 0.6];
      const gx = this.x - camX + this.facing * g[0], gy = this.y - this.z + g[1];
      const s = 2 + (tele.start - this.t) % 3;
      Px.use(ctx);
      Px.rect(gx - s, gy, s * 2 + 1, 1, '#ffffff');
      Px.rect(gx, gy - s, 1, s * 2 + 1, '#ffffff');
    }
    if (tele && (tele.tell === 'heavy' || tele.tell === 'grab')) {
      const bx = this.x - camX, by = this.y - this.z - this.h - 14 - (this.t % 10 < 5 ? 1 : 0);
      Px.use(ctx);
      Px.rect(bx - 2, by - 1, 5, 12, '#000');
      Px.rect(bx - 1, by, 3, 7, '#ff3030');
      Px.rect(bx - 1, by + 8, 3, 2, '#ff3030');
    }
    if (d.drawExtra) d.drawExtra.call(this, ctx, camX);
  }
}

// Shared humanoid pose picker for enemies on the human rig. attackPose(phase, t) supplies attack poses.
function enemyHumanPose(e, attackPose) {
  switch (e.state) {
    case 'walk': case 'enter': return Poses.walk(e.anim, e.speed);
    case 'hurt': return (e.hurtAlt || 0) % 2 ? Poses.hurt(e.t) : PlayerPoses.gutfold(e.t);
    case 'fall': case 'thrown': return Poses.fall(e.t, e.vz);
    case 'down': return Poses.down();
    case 'getup': return Poses.getup(e.t * 16 / 12);
    case 'grabbed': case 'held': case 'pinned': return Poses.grabbed(e.t);
    case 'drop': return Poses.jump(-1);
    case 'taunt': return pose({ rot: -0.15, fThigh: 0.3, fKnee: -0.2, bThigh: -0.3, bKnee: -0.2, fUpper: 2.8 + Math.sin(e.t * 0.4) * 0.3, fElbow: 0.6, bUpper: 2.6 - Math.sin(e.t * 0.4) * 0.3, bElbow: 0.6, head: -0.2 });
    case 'panic': return pose({ rot: -0.2, fThigh: Math.sin(e.t * 0.5) * 0.6, fKnee: -0.6, bThigh: -Math.sin(e.t * 0.5) * 0.6, bKnee: -0.6, fUpper: 2.6 + Math.sin(e.t * 0.7), fElbow: 0.5, bUpper: 2.4 - Math.sin(e.t * 0.7), bElbow: 0.5 });
    case 'dizzy': return pose({ rot: Math.sin(e.t * 0.15) * 0.25, head: Math.sin(e.t * 0.15 + 1) * 0.3, fThigh: 0.2, fKnee: -0.3, bThigh: -0.2, bKnee: -0.3, fUpper: -0.3, fElbow: 0.3, bUpper: 0.3, bElbow: 0.3 });
    case 'attack': return attackPose ? attackPose(e.atkPhase(), e.t, e.atk) : Poses.idle(e.anim);
  }
  return Poses.idle(e.anim);
}
