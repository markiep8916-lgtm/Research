<title>Banana Depths</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wdth,wght@75..125,400..700&display=swap">
<style>/* Banana Depths UI. Single dark "jungle night" look; the 3D scene supplies the colour, the UI stays warm and chunky. */
:root {
  color-scheme: dark;
  --ink: #170f06;
  --bark: #4a2d14;
  --bark-hi: #7a4a26;
  --leaf: #4fae3b;
  --banana: #ffd23a;
  --banana-deep: #e0a010;
  --ember: #ff5a2a;
  --cream: #fff1c9;
  --shade: rgba(14, 8, 2, 0.72);
  --display: 'Luckiest Guy', 'Bangers', Impact, 'Arial Black', sans-serif;
  --body: 'Fredoka', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
}
html, body { height: 100%; margin: 0; padding: 0; background: #0b0f0a; color: var(--cream); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--body); font-size: 16px; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; -webkit-user-select: none; }
#app { position: fixed; inset: 0; background: #0b0f0a; overflow: hidden; }
#stage { position: absolute; inset: 0; }
#stage canvas { width: 100%; height: 100%; display: block; outline: none; }
[hidden] { display: none !important; }

#ui { position: absolute; inset: 0; pointer-events: none; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); box-sizing: border-box; }
#ui * { box-sizing: border-box; }

/* ---------------------------------------------------------------- HUD */
.hud { position: absolute; inset: 0; pointer-events: none; padding: inherit; }
.hud-tl { position: absolute; left: max(16px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 6px; }
.hearts { display: flex; flex-wrap: wrap; gap: 3px; max-width: 46vw; filter: drop-shadow(0 2px 0 rgba(0,0,0,.55)); }
.heart { width: 30px; height: 30px; transition: transform .15s; }
.heart.full path { fill: #ff4a63; stroke: #fff1c9; }
.heart.empty path { fill: rgba(20,10,4,.65); stroke: rgba(255,241,201,.45); }
.heart.bump { animation: bump .45s ease; }
@keyframes bump { 40% { transform: scale(1.35) rotate(-6deg); } }
.heart path { stroke-width: 2.2; stroke-linejoin: round; }
.bananas { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-size: 24px; letter-spacing: .5px; color: var(--banana); text-shadow: 0 2px 0 #3a2208, 0 0 8px rgba(0,0,0,.6); width: fit-content; }
.bananas svg { width: 28px; height: 28px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.55)); }
.bananas.bump { animation: bump .3s ease; }
.hud-tr { position: absolute; right: max(16px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); display: flex; gap: 8px; align-items: flex-start; }
.abil { width: 46px; height: 46px; border-radius: 12px; background: var(--shade); border: 2px solid rgba(255,241,201,.18); display: grid; place-items: center; position: relative; opacity: .38; transition: opacity .3s, border-color .3s, transform .3s; }
.abil svg { width: 28px; height: 28px; }
.abil.have { opacity: 1; border-color: var(--banana); box-shadow: 0 0 12px rgba(255,210,58,.35); }
.abil .key { position: absolute; bottom: -7px; right: -4px; font-size: 11px; font-weight: 700; background: var(--ink); color: var(--cream); border: 1px solid rgba(255,241,201,.5); border-radius: 5px; padding: 0 4px; line-height: 15px; }
.abil.fresh { animation: bump .7s ease 2; }
.hud-btn { pointer-events: auto; width: 46px; height: 46px; border-radius: 12px; background: var(--shade); border: 2px solid rgba(255,241,201,.28); color: var(--cream); font: 700 18px var(--body); display: none; place-items: center; cursor: pointer; }
.touch-on .hud-btn { display: grid; }

.roomname { position: absolute; left: 50%; top: 14%; transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .6s; }
.roomname.show { opacity: 1; }
.roomname .area { font-family: var(--display); font-size: clamp(14px, 2.2vw, 22px); color: var(--leaf); letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 2px 0 #08210a; }
.roomname .room { font-family: var(--display); font-size: clamp(28px, 5vw, 56px); color: var(--cream); text-shadow: 0 4px 0 var(--ink), 0 0 18px rgba(0,0,0,.7); -webkit-text-stroke: 1.5px var(--ink); letter-spacing: 1px; }

.toasts { position: absolute; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(92vw, 640px); pointer-events: none; }
.touch-on .toasts { bottom: 38%; }
.toast { background: var(--shade); border: 2px solid rgba(255,210,58,.65); color: var(--cream); font-weight: 600; font-size: clamp(14px, 2vw, 19px); padding: 7px 16px; border-radius: 999px; animation: toast-in .25s ease; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.toast.out { opacity: 0; transform: translateY(8px); transition: opacity .4s, transform .4s; }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px); } }

.sign-box { position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%); width: min(90vw, 620px); background: linear-gradient(#e8c88a, #d2a860); color: #3a2208; border: 4px solid #5a3a1c; border-radius: 14px; padding: 14px 18px 22px; font-size: clamp(14px, 2vw, 19px); font-weight: 600; line-height: 1.35; box-shadow: 0 8px 0 rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.45); pointer-events: none; white-space: pre-line; }
.sign-box::after { content: '▲ Up to close'; position: absolute; right: 14px; bottom: 3px; font-size: 11px; opacity: .6; letter-spacing: .5px; }
.touch-on .sign-box { bottom: 40%; }

.boss { position: absolute; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(80vw, 560px); text-align: center; pointer-events: none; transition: opacity .4s; }
.touch-on .boss { bottom: auto; top: 70px; }
.boss .name { font-family: var(--display); font-size: clamp(16px, 2.6vw, 26px); letter-spacing: 3px; color: #ff8a5a; text-shadow: 0 2px 0 var(--ink); }
.boss .bar { height: 18px; border-radius: 99px; background: rgba(0,0,0,.65); border: 3px solid var(--ink); overflow: hidden; box-shadow: 0 0 0 2px rgba(255,241,201,.5); }
.boss .fill { height: 100%; width: 100%; background: linear-gradient(#ff7a4a, #d4281a); transition: width .25s; }

.itemget { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(0,0,0,.15), rgba(0,0,0,.7)); pointer-events: none; animation: fade-in .4s ease; }
.itemget .card { text-align: center; max-width: min(88vw, 620px); padding: 18px 22px; margin-top: 30vh; }
.itemget .got { font-family: var(--display); font-size: clamp(16px, 2.4vw, 24px); letter-spacing: 4px; color: var(--leaf); text-shadow: 0 2px 0 #08210a; }
.itemget .title { font-family: var(--display); font-size: clamp(34px, 7vw, 76px); line-height: 1; color: var(--banana); text-shadow: 0 5px 0 #6a3d08, 0 0 24px rgba(255,210,58,.5); -webkit-text-stroke: 2px var(--ink); margin: 4px 0 10px; }
.itemget .desc { font-size: clamp(15px, 2.1vw, 21px); font-weight: 500; line-height: 1.35; text-shadow: 0 2px 6px #000; }
.itemget .how { margin-top: 12px; display: inline-block; background: var(--shade); border: 2px solid var(--banana); border-radius: 999px; padding: 6px 16px; font-weight: 700; font-size: clamp(14px, 2vw, 18px); }
.itemget .cont { margin-top: 14px; opacity: .75; font-size: 14px; animation: pulse 1.4s ease infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@keyframes fade-in { from { opacity: 0; } }

.death { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.death span { font-family: var(--display); font-size: clamp(34px, 8vw, 90px); color: #ff6a4a; text-shadow: 0 6px 0 var(--ink); -webkit-text-stroke: 2px var(--ink); animation: fade-in .6s ease; letter-spacing: 2px; }
.fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
.hurt { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(255,40,40,0) 45%, rgba(255,30,30,.55)); transition: opacity .35s; }
.hurt.on { opacity: 1; transition: none; }

/* ---------------------------------------------------------------- screens */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; padding: inherit; overflow: auto; touch-action: pan-y; }
.screen.dim { background: rgba(8, 5, 2, .72); backdrop-filter: blur(3px); }
.screen.title { background: linear-gradient(rgba(6, 12, 4, .15), rgba(6, 12, 4, .1) 40%, rgba(6, 12, 4, .6)); justify-content: flex-start; padding-top: clamp(16px, 6vh, 70px); }
.logo { text-align: center; line-height: .9; margin-bottom: clamp(8px, 3vh, 28px); }
.logo .l0 { display: block; font-family: var(--body); font-weight: 700; font-size: clamp(10px, min(1.7vw, 2.6vh), 18px); letter-spacing: 0.32em; color: var(--cream); opacity: .9; margin-bottom: clamp(2px, 1vh, 8px); text-shadow: 0 2px 0 var(--ink), 0 0 12px rgba(0,0,0,.6); }
.logo .l1 { display: block; font-family: var(--display); font-size: clamp(40px, min(12vw, 17vh), 140px); color: var(--banana); letter-spacing: 2px; text-shadow: 0 6px 0 #6a3d08, 0 10px 0 var(--ink), 0 0 40px rgba(255,210,58,.45); -webkit-text-stroke: 3px var(--ink); transform: rotate(-2deg); }
.logo .tie { display: block; width: 0; height: 0; }
.logo .l3 { display: block; margin-top: 2px; font-family: var(--display); font-size: clamp(30px, min(9vw, 13vh), 104px); color: #c8ff8a; letter-spacing: 0.12em; text-shadow: 0 5px 0 #1d5a1a, 0 9px 0 var(--ink); -webkit-text-stroke: 3px var(--ink); transform: rotate(1.5deg); }
.logo .l2 { display: inline-block; margin-top: 4px; font-family: var(--display); font-size: clamp(26px, 6vw, 70px); color: #c8ff8a; letter-spacing: 6px; text-shadow: 0 4px 0 #1d5a1a, 0 7px 0 var(--ink); -webkit-text-stroke: 2px var(--ink); transform: rotate(1.5deg); }
.menu { display: flex; flex-direction: column; gap: 10px; width: min(78vw, 360px); }
.btn { min-width: 150px; pointer-events: auto; cursor: pointer; font: 700 clamp(18px, 2.6vw, 26px) var(--display); letter-spacing: 1.5px; color: var(--cream); background: linear-gradient(var(--bark-hi), var(--bark)); border: 3px solid var(--ink); border-radius: 14px; padding: 10px 18px; text-align: center; box-shadow: 0 5px 0 var(--ink), inset 0 2px 0 rgba(255,255,255,.18); transition: transform .08s, background .15s; position: relative; }
.btn:hover, .btn.sel { background: linear-gradient(#ffe35a, var(--banana-deep)); color: var(--ink); transform: translateY(-2px) scale(1.03); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.btn.sel::before { content: '▶'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: .7em; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.foot { margin-top: auto; padding-top: 14px; text-align: center; font-size: 12px; opacity: .65; max-width: 560px; line-height: 1.4; }
.panel { background: linear-gradient(#5a3a1c, #3a2410); border: 4px solid var(--ink); border-radius: 18px; padding: 18px 22px; width: min(92vw, 640px); max-height: 82vh; overflow: auto; box-shadow: 0 8px 0 rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.14); }
.panel h2 { font-family: var(--display); font-size: clamp(26px, 4vw, 40px); margin: 0 0 12px; color: var(--banana); text-shadow: 0 3px 0 var(--ink); letter-spacing: 2px; font-weight: 400; }
.panel table { border-collapse: collapse; width: 100%; font-size: clamp(14px, 1.9vw, 17px); }
.panel td { padding: 5px 6px; border-bottom: 1px solid rgba(255,241,201,.12); vertical-align: top; }
.panel td:first-child { font-weight: 700; color: var(--banana); white-space: nowrap; padding-right: 14px; }
kbd { font-family: var(--body); font-weight: 700; background: var(--ink); border: 1px solid rgba(255,241,201,.5); border-bottom-width: 3px; border-radius: 6px; padding: 0 6px; font-size: .92em; margin: 0 1px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 8px 0; font-weight: 600; }
.row input[type=range] { width: 52%; accent-color: var(--banana); }
.row .toggle { pointer-events: auto; cursor: pointer; min-width: 70px; text-align: center; font-weight: 800; padding: 4px 12px; border-radius: 999px; background: var(--ink); border: 2px solid var(--banana); color: var(--banana); }
.row .toggle.off { color: #aaa; border-color: #666; }
.back { margin-top: 14px; }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 22px; font-size: clamp(16px, 2.4vw, 22px); font-weight: 600; margin: 14px 0 20px; text-align: left; }
.stats b { color: var(--banana); text-align: right; font-family: var(--display); font-weight: 400; letter-spacing: 1px; }
.ending-title { font-family: var(--display); text-align: center; font-size: clamp(32px, 7vw, 80px); color: var(--banana); line-height: 1; text-shadow: 0 5px 0 #6a3d08, 0 9px 0 var(--ink); -webkit-text-stroke: 2px var(--ink); margin-bottom: 8px; }
.ending-sub { text-align: center; font-size: clamp(15px, 2.4vw, 22px); max-width: 640px; line-height: 1.4; text-shadow: 0 2px 8px #000; }
#mapcanvas { width: min(94vw, 920px); height: min(62vh, 560px); background: #0c1a14; border: 4px solid var(--ink); border-radius: 16px; box-shadow: 0 0 0 3px var(--bark-hi), 0 12px 30px rgba(0,0,0,.5); }
.maplegend { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center; margin-top: 10px; font-size: 13px; opacity: .85; }
.maplegend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* ---------------------------------------------------------------- touch controls */
.touch { position: absolute; inset: 0; pointer-events: none; display: none; }
.touch-on .touch { display: block; }
.dpad { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); width: 168px; height: 168px; border-radius: 50%; background: radial-gradient(circle, rgba(255,241,201,.16), rgba(255,241,201,.05)); border: 2px solid rgba(255,241,201,.28); pointer-events: auto; touch-action: none; }
.dpad .nub { position: absolute; left: 50%; top: 50%; width: 68px; height: 68px; margin: -34px 0 0 -34px; border-radius: 50%; background: rgba(255,241,201,.28); border: 2px solid rgba(255,241,201,.5); transition: transform .05s; }
.dpad i { position: absolute; font-style: normal; font-weight: 800; color: rgba(255,241,201,.55); font-size: 18px; }
.dpad .u { left: 50%; top: 8px; transform: translateX(-50%); } .dpad .d { left: 50%; bottom: 8px; transform: translateX(-50%); }
.dpad .l { left: 12px; top: 50%; transform: translateY(-50%); } .dpad .r { right: 12px; top: 50%; transform: translateY(-50%); }
.tbtn { position: absolute; width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; pointer-events: auto; touch-action: none; font: 700 16px var(--display); letter-spacing: .5px; color: var(--cream); background: rgba(74,45,20,.62); border: 3px solid rgba(255,241,201,.5); box-shadow: inset 0 2px 0 rgba(255,255,255,.18); }
.tbtn small { position: absolute; bottom: 7px; font: 700 10px var(--body); opacity: .8; }
.tbtn.down { background: rgba(255,210,58,.72); color: var(--ink); transform: scale(.94); }
.tbtn.jump { right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: 88px; height: 88px; font-size: 19px; }
.tbtn.slap { right: calc(max(18px, env(safe-area-inset-right)) + 98px); bottom: max(30px, env(safe-area-inset-bottom)); }
.tbtn.roll { right: calc(max(18px, env(safe-area-inset-right)) + 12px); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 100px); }
.tbtn.boom { right: calc(max(18px, env(safe-area-inset-right)) + 98px); bottom: calc(max(30px, env(safe-area-inset-bottom)) + 84px); }
.rotate { position: absolute; inset: 0; background: #0b0f0a; display: none; place-items: center; text-align: center; padding: 24px; font-family: var(--display); font-size: 26px; color: var(--banana); z-index: 50; pointer-events: auto; }
@media (orientation: portrait) and (pointer: coarse) { .rotate { display: grid; } }
@media (max-height: 460px) { .heart { width: 24px; height: 24px; } .bananas { font-size: 20px; } .abil { width: 38px; height: 38px; } .dpad { width: 140px; height: 140px; } .tbtn { width: 62px; height: 62px; } .tbtn.jump { width: 74px; height: 74px; } .tbtn.slap { right: calc(max(18px, env(safe-area-inset-right)) + 86px); } .tbtn.boom { right: calc(max(18px, env(safe-area-inset-right)) + 86px); bottom: calc(max(30px, env(safe-area-inset-bottom)) + 70px); } .tbtn.roll { bottom: calc(max(18px, env(safe-area-inset-bottom)) + 84px); } }
/* short landscape screens (phones): compact buttons, title logo and menu side by side */
@media (max-height: 520px) {
  .btn { padding: 5px 14px; font-size: 18px; border-width: 2px; border-radius: 11px; box-shadow: 0 3px 0 var(--ink), inset 0 2px 0 rgba(255,255,255,.18); }
  .menu { gap: 7px; }
  .logo { margin-bottom: 6px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .screen.title { flex-direction: row; justify-content: center; align-items: center; gap: 5vw; padding-top: 10px; padding-bottom: 34px; }
  .screen.title .logo { margin: 0; flex: 0 1 44%; }
  .screen.title .menu { width: min(38vw, 300px); }
  .screen.title .foot { position: absolute; left: 0; right: 0; bottom: 6px; margin: 0; padding: 0 16px; font-size: 10px; max-width: none; }
}
@media (prefers-reduced-motion: reduce) { .heart.bump, .bananas.bump, .abil.fresh, .itemget .cont, .death span { animation: none; } }
</style>
